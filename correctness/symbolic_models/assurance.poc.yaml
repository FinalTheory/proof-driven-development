version: 1
records:
  contract:accepted_evidence_correspondence:
    kind: contract
    subject_id: accepted_evidence_correspondence
    subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
    roundtrip:
      subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
      status: TRANSLATED
      natural_language: 'For every authoritative state s and every idempotency key
        k, if the composite authoritative idempotency identity k = (document_id, client_change_id)
        is within the 30-day normal retry/reconnect eligibility horizon in authoritative
        state s, then the following two implications must hold: if authoritative accepted_idempotency_evidence
        exists in state s for the same composite idempotency key k, then accepted_change_log
        in authoritative state s contains exactly one committed canonical acceptance
        whose authoritative idempotency_key is the same composite identity k; and
        if accepted_change_log in authoritative state s contains exactly one committed
        canonical acceptance whose authoritative idempotency_key is the same composite
        identity k, then authoritative accepted_idempotency_evidence exists in state
        s for the same composite idempotency key k.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The formula preserves the original iff correspondence between accepted_idempotency_evidence
          and exactly one committed canonical acceptance within the 30-day eligibility
          scope, with the same idempotency identity and authoritative-state observation
          boundary.
        differences: []
      strengthening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The formula preserves the source contract's applicability boundary,
          identity coordinates, bidirectional correspondence, cardinality requirement,
          and authoritative-state observation scope. The lifecycle preservation statement
          is represented by the state invariant semantics rather than an additional
          predicate.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the bidirectional correspondence,
          identity coordinates, 30-day eligibility boundary, authoritative state scope,
          and exactly-one committed canonical acceptance cardinality of the source
          invariant.
        differences: []
      strengthening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The rendering preserves the original state invariant, applicability
          horizon, authoritative observation scope, identity coordinates, bidirectional
          correspondence, and exactly-one cardinality requirement without adding guarantees
          outside the contract boundary.
        differences: []
  claim:L92_captured_recovery_head_equals_authoritative_frontier:
    kind: claim
    subject_id: L92_captured_recovery_head_equals_authoritative_frontier
    subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
    roundtrip:
      subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
      status: TRANSLATED
      natural_language: For every recovery attempt r, if r has reached the new-owner
        recovery-head capture event after epoch handoff, then the recovery_head value
        bound to r is equal to the authoritative document_latest_revision value read
        when r captures its recovery frontier.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: 'The formula exactly captures the source proposition: for every recovery
          attempt, after the recovery-head capture event, recovery_head_value equals
          the authoritative document_latest_revision value captured at that event.
          No additional guarantees from the contextual semantic contract are introduced.'
        differences: []
      strengthening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: 'The symbolic formula matches the canonical proposition: after the
          capture event, the recovery_head value equals the authoritative revision
          value captured at that event. No additional guarantees or missing requirements
          are introduced.'
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: The rendering preserves the original contract's applicability boundary
          after epoch handoff, the capture-event condition, the equality relation,
          the authoritative source of document_latest_revision, and the binding of
          recovery_head to that captured value. No quantifier, provenance direction,
          identity component, or guarantee scope is changed.
        differences: []
      strengthening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: The rendering preserves the original applicability boundary, epoch
          handoff precondition, provenance direction, and equality relation between
          recovery_head and the authoritative document_latest_revision value observed
          at the capture event. It does not add guarantees beyond the source proposition.
        differences: []
  claim:L108_acceptance_preserves_request_identity:
    kind: claim
    subject_id: L108_acceptance_preserves_request_identity
    subject_signature: 8a3cb1db1c096fb4251f1fd10395b7f915df3f4eb24b4371847e1878a5d92d75
    roundtrip:
      subject_signature: 8a3cb1db1c096fb4251f1fd10395b7f915df3f4eb24b4371847e1878a5d92d75
      status: TRANSLATED
      natural_language: 'For every acceptance a and request r, if acceptance a was
        produced from submitted request r, then all of the following hold: the document
        identity preserved in acceptance a is equal to the document identity carried
        by request r; the client change identity preserved in acceptance a is equal
        to the client change identity carried by request r; the authoritative idempotency
        identity associated with acceptance a exactly matches the request''s (document_id,
        client_change_id) identity; the identity of acceptance a is preserved end
        to end from request admission through OT dispatch, idempotency arbitration,
        retry handling, and canonical commit, such that neither document_id nor client_change_id
        is dropped, regenerated, substituted, or cross-bound and every identity handoff
        for acceptance a remains the originating request r identity. Additionally,
        for every durable idempotency evidence record e, if e is associated with canonical
        acceptance a, then e identifies exactly the same (document_id, client_change_id)
        identity as originating request r.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 8a3cb1db1c096fb4251f1fd10395b7f915df3f4eb24b4371847e1878a5d92d75
        verdict: EQUIVALENT
        reason: The formula preserves the source claim's universal scope over canonical
          acceptances produced from requests, requires both identity coordinates to
          remain equal, requires end-to-end preservation, and constrains durable idempotency
          evidence exactly when it is associated with the acceptance.
        differences: []
      strengthening:
        subject_signature: 8a3cb1db1c096fb4251f1fd10395b7f915df3f4eb24b4371847e1878a5d92d75
        verdict: EQUIVALENT
        reason: The formula preserves the source claim's applicability boundary, requiring
          the identity conditions only for canonical acceptances produced from submitted
          requests. It captures both identity coordinates, end-to-end preservation,
          and the conditional durable idempotency evidence binding without adding
          extra cardinality, uniqueness, or out-of-scope guarantees.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 8a3cb1db1c096fb4251f1fd10395b7f915df3f4eb24b4371847e1878a5d92d75
        verdict: EQUIVALENT
        reason: 'The round-trip rendering preserves the original contract: it keeps
          the same applicability condition, preserves both identity coordinates (document_id
          and client_change_id), maintains provenance from the originating request
          through acceptance, and requires matching durable idempotency evidence.
          The added path details and identity handoff wording elaborate the acceptance
          path without introducing a stronger or different guarantee.'
        differences: []
      strengthening:
        subject_signature: 8a3cb1db1c096fb4251f1fd10395b7f915df3f4eb24b4371847e1878a5d92d75
        verdict: EQUIVALENT
        reason: The rendering preserves the original acceptance identity binding contract.
          It keeps the same applicability boundary (accepted canonical acceptance
          produced from a submitted request), preserves both identity coordinates
          (document_id and client_change_id), preserves provenance from request admission
          through canonical commit, and retains the same durable idempotency evidence
          requirement without adding a new independent uniqueness or cardinality guarantee.
        differences: []
  claim:L116_live_delivery_is_bound_to_committed_acceptance:
    kind: claim
    subject_id: L116_live_delivery_is_bound_to_committed_acceptance
    subject_signature: 6e56ff8c1d1f13bb6283a2852b55a73997db1c0acad8617507b2716a10553571
    roundtrip:
      subject_signature: 6e56ff8c1d1f13bb6283a2852b55a73997db1c0acad8617507b2716a10553571
      status: TRANSLATED
      natural_language: For every live delivery d, if d is a delivery actually exposed
        through the websocket live stream, then there exists an acceptance record
        a such that a is a committed record in the authoritative accepted_change_log,
        d originates from a as its accepted-history source, and d preserves a's canonical
        payload and revision provenance exactly. The proposition does not assert anything
        about objects that are not live delivery records, and the existence of such
        an a is required for each live delivery record. The committed status of a,
        its origin relationship to d, and the exact preservation of payload and revision
        provenance are all separate required conditions.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 6e56ff8c1d1f13bb6283a2852b55a73997db1c0acad8617507b2716a10553571
        verdict: EQUIVALENT
        reason: The formula requires every exposed live delivery to have a committed
          accepted-history source and requires preservation of canonical payload and
          revision provenance. This matches the canonical proposition's binding, provenance,
          and exclusion requirements without adding guarantees about ordering, duplication,
          timing, or delivery success.
        differences: []
      strengthening:
        subject_signature: 6e56ff8c1d1f13bb6283a2852b55a73997db1c0acad8617507b2716a10553571
        verdict: EQUIVALENT
        reason: The formula preserves the original proposition's universal scope over
          exposed live deliveries and requires each to have a committed accepted-history
          source with preserved canonical payload and revision provenance. The prohibition
          on never-committed changes follows directly from the absence of any committed
          source for such deliveries.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 6e56ff8c1d1f13bb6283a2852b55a73997db1c0acad8617507b2716a10553571
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the universal applicability to
          every exposed live delivery, the existential binding to a committed accepted-history
          record, the provenance direction from committed record to live delivery,
          and the required payload and revision provenance preservation. The exclusion
          of never-committed canonical changes follows from the required committed
          witness for every live delivery.
        differences: []
      strengthening:
        subject_signature: 6e56ff8c1d1f13bb6283a2852b55a73997db1c0acad8617507b2716a10553571
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the universal applicability to
          exposed live deliveries, requires a committed authoritative acceptance record
          as the source, and preserves the original payload and revision provenance
          binding without adding delivery guarantees beyond the source contract.
        differences: []
  claim:C12_live_delivery_contains_only_accepted_changes:
    kind: claim
    subject_id: C12_live_delivery_contains_only_accepted_changes
    subject_signature: 36cbbc98f6d7f719764b3f1a18898601583f045a6525fcb3aeaee52993092f00
    roundtrip:
      subject_signature: 36cbbc98f6d7f719764b3f1a18898601583f045a6525fcb3aeaee52993092f00
      status: TRANSLATED
      natural_language: For every live delivery d, if d is a change actually exposed
        through the websocket live stream, then there exists an acceptance record
        a such that a is a committed record in the authoritative accepted_change_log
        and d originates from a as its accepted-history source. This proposition only
        asserts that every live delivery has some committed acceptance record as its
        source; it does not assert that the delivery preserves every payload or revision
        field exactly, nor does the live_delivery_originates_from relation alone assert
        that the acceptance record is committed or that all accepted history properties
        hold.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 36cbbc98f6d7f719764b3f1a18898601583f045a6525fcb3aeaee52993092f00
        verdict: EQUIVALENT
        reason: The formula requires every exposed live delivery to have an accepted-history
          source record that is committed in accepted_change_log, matching the proposition's
          provenance and non-invention guarantee. The stated allowances for duplicate
          or reordered delivery are not additional obligations and are not contradicted
          by the existential source relation.
        differences: []
      strengthening:
        subject_signature: 36cbbc98f6d7f719764b3f1a18898601583f045a6525fcb3aeaee52993092f00
        verdict: EQUIVALENT
        reason: The formula states that every exposed live delivery originates from
          a committed acceptance record, matching the source claim that live delivery
          is derived from committed accepted history and cannot invent an unaccepted
          change. It does not add ordering, exactly-once, timeliness, or delivery-success
          guarantees that are explicitly excluded by the source contract.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 36cbbc98f6d7f719764b3f1a18898601583f045a6525fcb3aeaee52993092f00
        verdict: EQUIVALENT
        reason: 'The round-trip rendering preserves the core provenance binding: every
          exposed live-stream change must originate from a committed accepted history
          record. It does not add delivery guarantees or omit any required acceptance
          provenance constraint.'
        differences: []
      strengthening:
        subject_signature: 36cbbc98f6d7f719764b3f1a18898601583f045a6525fcb3aeaee52993092f00
        verdict: EQUIVALENT
        reason: 'The rendering preserves the original provenance binding: every exposed
          live delivery must originate from a committed accepted history record, while
          not adding delivery completeness, ordering, uniqueness, or timing guarantees.'
        differences: []
