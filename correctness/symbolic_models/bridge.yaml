version: 1
sorts:
- ClientState
- Document
- Revision
- Overlay
- LogicalEditIdentity
- Request
- CatchupAttempt
- CatchupResponse
- AuthoritativeState
- CanonicalAcceptance
- AcceptedEvidence
- IdempotencyKey
- ClientChangeId
- LiveDelivery
- RecoveryAttempt
- DurableIdempotencyEvidence
- ProtocolTransition
- OTInvocation
- LogicalEdit
- DocumentState
- AcceptedChangeSequence
- TerminalResultRecord
- RejectionDecision
- OTSuccessResult
- ExternalTerminalResult
functions:
  user_visible_client_state:
    args:
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Client state s is a published user-visible state; private or intermediate resynchronization candidates that have not been published are outside this predicate. This predicate does not exclude a user-visible historical-version or rollback mode.
    semantic_anchors:
    - contract:client_canonical_frontier_coherence
    - claim:G10_user_visible_client_state_matches_document
  reachable_authoritative_state:
    args:
    - AuthoritativeState
    returns: Bool
    catalog_symbols: []
    meaning: Authoritative state s is reachable under the canonical server protocol and failure model; impossible or purely hypothetical authoritative states are outside this predicate.
    semantic_anchors:
    - contract:idempotency_terminal_outcome_coherence
    - claim:G5_retry_resolves_idempotently
  reachable_client_state:
    args:
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Client state s is reachable under the normal client protocol, including states reached through restore, view switching, bookkeeping, reconnect/resync, publication, and explicit terminal disposition; impossible client states are outside this predicate.
    semantic_anchors:
    - contract:pending_edit_identity_provenance
    - contract:pending_speculative_lifecycle_coverage
    - contract:pending_retirement_acceptance_binding
    - contract:accepted_terminal_speculative_retirement
    - contract:terminal_speculative_lifecycle_closure
    - contract:rejected_terminal_speculative_retirement
    - claim:G12_client_pending_state_tracks_unresolved_edits
  later_reachable_client_state:
    args:
    - ClientState
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Later state l is reachable after earlier state e by one or more client-protocol transitions for the continuing client lifecycle/history, including restore/reactivation, view switching, bookkeeping, reconnect/resync, or publication transitions.
    semantic_anchors:
    - contract:terminal_speculative_lifecycle_closure
    - claim:G12_client_pending_state_tracks_unresolved_edits
  visible_document:
    args:
    - ClientState
    returns: Document
    catalog_symbols:
    - client_document_id
    meaning: The document identity represented by this user-visible canonical client state.
  visible_frontier:
    args:
    - ClientState
    returns: Revision
    catalog_symbols:
    - last_applied_revision
    meaning: The last canonical revision applied by this client state.
  canonical_content_matches:
    args:
    - ClientState
    - Document
    - Revision
    returns: Bool
    catalog_symbols:
    - client_local_document
    meaning: The client state's canonical content is exactly deterministic replay of document D through revision F.
  visible_overlay:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_visible_speculative_overlays
    meaning: Overlay o is currently exposed as a speculative user-visible overlay in client state s.
  canonical_contains_same_edit:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_local_document
    - last_applied_revision
    meaning: The canonical prefix visible in state s already contains the accepted logical edit represented by overlay o.
  new_logical_edit_speculative_overlay_creation:
    args:
    - ProtocolTransition
    - Overlay
    returns: Bool
    catalog_symbols:
    - document_id
    - client_change_id
    meaning: Protocol transition t creates speculative overlay o for a genuinely new logical client edit rather than a retry or continued representation of an existing logical edit.
    semantic_anchors:
    - claim:G8_user_visible_state_does_not_double_render_accepted_optimistic_edit
  created_new_overlay_uses_distinct_change_id:
    args:
    - ProtocolTransition
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_change_id
    meaning: The genuinely new logical edit represented by overlay o uses a client_change_id distinct from every other distinct logical client edit in the same document.
    semantic_anchors:
    - claim:G8_user_visible_state_does_not_double_render_accepted_optimistic_edit
  authored_from:
    args:
    - Request
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Request r was constructed from client state s as its authoring state.
    semantic_anchors:
    - contract:request_authoring_frontier_binding
  request_document:
    args:
    - Request
    returns: Document
    catalog_symbols:
    - document_id
    meaning: The document identity carried by request r.
  request_base_revision:
    args:
    - Request
    returns: Revision
    catalog_symbols:
    - base_revision
    meaning: The base revision carried by request r.
  request_raw_edit_bound_to_source_content:
    args:
    - Request
    - ClientState
    returns: Bool
    catalog_symbols:
    - raw_edit
    - client_local_document
    meaning: The raw edit carried by request r is the edit authored against the canonical client content in source state s.
  eligible_catchup_response:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: Response r belongs to a normal catch-up/reconnect attempt within the protocol guarantee being modeled.
    semantic_anchors:
    - contract:catchup_head_binding
  captured_authoritative_head:
    args:
    - CatchupResponse
    returns: Revision
    catalog_symbols:
    - document_latest_revision
    meaning: The authoritative document latest revision captured for the catch-up response's attempt.
  catchup_response_head_value:
    args:
    - CatchupResponse
    returns: Revision
    catalog_symbols:
    - catchup_response_head
    meaning: The response head revision carried by catch-up response r.
  catchup_head_preserved:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols:
    - catchup_response_head
    meaning: The captured response head remains the same bound value through construction, return, and candidate publication for this response.
  within_retry_reconnect_eligibility:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols: []
    meaning: Composite authoritative idempotency identity k = (document_id, client_change_id) is within the 30-day normal retry/reconnect eligibility horizon in authoritative state s.
    semantic_anchors:
    - contract:accepted_evidence_correspondence
  accepted_evidence_for_key:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    - idempotency_key
    meaning: Authoritative durable accepted_idempotency_evidence exists in state s for the same composite idempotency_key k = (document_id, client_change_id).
  accepted_evidence_mechanism_valid:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    - accepted_change_log
    - idempotency_key
    - document_id
    - client_change_id
    meaning: >-
      Any authoritative accepted evidence counted for composite key k in state s is established only by a valid committed-acceptance mechanism: the committed accepted row or unique identity itself; a separate hot-path accepted-key success record that commits and aborts atomically with the same canonical acceptance in the same acceptance transaction; or lifecycle/compaction replacement evidence that is equivalent accepted evidence derived from a previously committed canonical acceptance. Reservation, in-progress arbitration, timeout, cancellation, or another non-committed attempt is not classified as accepted evidence.
    semantic_anchors:
    - claim:G9_accepted_idempotency_evidence_matches_committed_acceptance
  exactly_one_committed_acceptance_for_key:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols:
    - accepted_change_log
    meaning: accepted_change_log in authoritative state s contains exactly one committed canonical acceptance whose authoritative idempotency_key is the same composite identity k = (document_id, client_change_id).
  authoritative_evidence:
    args:
    - AcceptedEvidence
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    meaning: Evidence e is an authoritative accepted-idempotency evidence record.
  evidence_key:
    args:
    - AcceptedEvidence
    returns: IdempotencyKey
    catalog_symbols:
    - idempotency_key
    meaning: The authoritative idempotency identity carried by evidence e.
  committed_canonical_acceptance:
    args:
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - canonical_accepted_change
    - accepted_change_log
    meaning: Canonical acceptance a is a committed canonical accepted-change record in authoritative accepted history.
  acceptance_key:
    args:
    - CanonicalAcceptance
    returns: IdempotencyKey
    catalog_symbols:
    - canonical_accepted_change
    meaning: The authoritative idempotency identity carried by canonical acceptance a.
  evidence_derived_from_acceptance:
    args:
    - AcceptedEvidence
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    - canonical_accepted_change
    meaning: Evidence e is derived from and corresponds to committed canonical acceptance a.
  request_change_id:
    args:
    - Request
    returns: ClientChangeId
    catalog_symbols:
    - client_change_id
    meaning: The client-supplied logical edit identity carried by request r.
  acceptance_produced_from_request:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols: []
    meaning: Canonical acceptance a was produced from submitted request r.
    semantic_anchors:
    - contract:acceptance_request_identity_binding
    - claim:G6_accepted_change_preserves_ot_semantics
  acceptance_document:
    args:
    - CanonicalAcceptance
    returns: Document
    catalog_symbols:
    - canonical_accepted_change
    meaning: The document identity preserved on canonical acceptance a.
  acceptance_change_id:
    args:
    - CanonicalAcceptance
    returns: ClientChangeId
    catalog_symbols:
    - canonical_accepted_change
    meaning: The client_change_id preserved on canonical acceptance a.
  acceptance_idempotency_identity_matches_request:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols:
    - idempotency_key
    meaning: The authoritative idempotency identity associated with acceptance a is exactly the request's (document_id, client_change_id).
  acceptance_identity_preserved_end_to_end:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols:
    - canonical_accepted_change
    - document_id
    - client_change_id
    meaning: From request admission through OT dispatch, idempotency arbitration, retry handling, and canonical commit, neither document_id nor client_change_id is dropped, regenerated, substituted, or cross-bound; every identity handoff for acceptance a remains the originating request r identity.
  durable_idempotency_evidence_for_acceptance:
    args:
    - DurableIdempotencyEvidence
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - idempotency_key
    meaning: Durable idempotency evidence e is associated with canonical acceptance a.
  durable_evidence_identity_matches_request:
    args:
    - DurableIdempotencyEvidence
    - Request
    returns: Bool
    catalog_symbols:
    - idempotency_key
    - document_id
    - client_change_id
    meaning: Durable idempotency evidence e identifies exactly the same (document_id, client_change_id) carried by originating request r.
  live_delivery_record:
    args:
    - LiveDelivery
    returns: Bool
    catalog_symbols:
    - websocket_live_stream
    meaning: 'Delivery d is any change actually exposed through the websocket live stream. This predicate does not pre-classify the delivery as canonical or committed: if a provisional, speculative, rejected, aborted, or never-committed change were exposed, it would still satisfy live_delivery_record(d) and would have to satisfy the formula''s separate committed-source obligations.'
  committed_history_record:
    args:
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - accepted_change_log
    meaning: Canonical acceptance a is a committed record in authoritative accepted_change_log.
  live_delivery_originates_from:
    args:
    - LiveDelivery
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: Live delivery d originates from acceptance record a as its accepted-history source; this relation alone does not assert that a is committed or that every payload/revision field is preserved exactly.
    semantic_anchors:
    - contract:live_delivery_acceptance_binding
    - source:authoritative_truth
  live_delivery_preserves_payload_revision:
    args:
    - LiveDelivery
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: Live delivery d preserves acceptance record a's canonical payload and revision provenance exactly; whether a is committed is expressed separately by committed_history_record(a).
    semantic_anchors:
    - contract:live_delivery_acceptance_binding
    - source:authoritative_truth
  live_delivery_preserves_document_scope:
    args:
    - LiveDelivery
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: Live delivery d is consumed on the same document-scoped stream as the committed canonical acceptance a from which it originates; an equally-valued acceptance from another document cannot satisfy this relation.
    semantic_anchors:
    - contract:live_delivery_acceptance_binding
    - source:authoritative_truth
    - source:reconnect_revision_boundary

  new_owner_recovery_attempt:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: >-
      Recovery attempt r is within the canonical new-owner recovery boundary for its target document.
      This classification is established by entering that recovery boundary and does not depend on
      successful progress: r remains a new-owner recovery attempt if it stalls, crashes, or aborts
      before owner-generation installation, recovery-head capture, or completion. Recovery or
      reconstruction activity outside the canonical new-owner recovery boundary is excluded.
    semantic_anchors:
    - contract:recovery_document_scope_binding
    - source:owner_failover

  recovery_head_capture_event:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Recovery attempt r has reached the new-owner recovery-head capture event after epoch handoff, at which it reads the authoritative frontier and binds recovery_head.
    semantic_anchors:
    - contract:recovery_head_binding
    - source:owner_failover
  captured_recovery_authoritative_head:
    args:
    - RecoveryAttempt
    returns: Revision
    catalog_symbols:
    - document_latest_revision
    meaning: The authoritative document_latest_revision value read when recovery attempt r captures its recovery frontier.
  recovery_head_value:
    args:
    - RecoveryAttempt
    returns: Revision
    catalog_symbols:
    - recovery_head
    meaning: The recovery_head value bound to recovery attempt r.
  recovery_head_preserved:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols:
    - recovery_head
    meaning: The same captured recovery_head governs checkpoint selection, exact tail replay, recovered metadata reconstruction, and acceptance resumption for recovery attempt r.
  recovery_target_document:
    args:
    - RecoveryAttempt
    returns: Document
    catalog_symbols: []
    meaning: The target document identity bound to recovery attempt r.
    semantic_anchors:
    - contract:recovery_document_scope_binding
    - source:owner_failover
  recovery_sources_preserve_document_scope:
    args:
    - Document
    - RecoveryAttempt
    returns: Bool
    catalog_symbols:
    - document_current_epoch
    - document_owner_generation_id
    - recovery_head
    - snapshot_content_with_snapshot_revision
    - accepted_change_log
    - recovered_owner_runtime_state
    dimensions:
    - document
    - observation
    meaning: For recovery attempt r targeting document d, every authoritative owner context and every recovery head, authoritative checkpoint, canonical tail entry, rebuilt logical or OT runtime state, installed recovered state, and resumed owner context that is actually established, selected, captured, consumed, constructed, installed, or used by r preserves d as the same document identity. This relation imposes no progress or existence requirement on later recovery stages, but an extensionally equal owner context, checkpoint, tail, or state from another document cannot satisfy it whenever that stage exists.
    semantic_anchors:
    - contract:recovery_document_scope_binding
    - source:snapshot_frontier
    - source:owner_failover

  acceptance_capable_transition:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: Transition t is any normal submission, retry, delayed execution, owner-recovery, resumed-owner, or other protocol transition capable of creating a canonical accepted change.
    semantic_anchors:
    - claim:L20_acceptance_paths_are_authoritatively_mediated
    - claim:C14_all_acceptance_paths_honor_idempotency_identity
  transition_is_authoritatively_gate_mediated:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: Transition t routes its acceptance decision through the authoritative accepted-key identity gate before any acceptance sink and cannot bypass that gate.
    semantic_anchors:
    - claim:L20_acceptance_paths_are_authoritatively_mediated
    - claim:L21_accepted_key_gate_rejects_new_acceptance
  gate_observes_key_already_accepted:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: At transition t's authoritative accepted-key gate decision, authoritative state records t's idempotency key as already accepted.
    semantic_anchors:
    - claim:L21_accepted_key_gate_rejects_new_acceptance
    - claim:C14_all_acceptance_paths_honor_idempotency_identity
  transition_creates_acceptance:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: Transition t creates a new acceptance event for its idempotency key.
    semantic_anchors:
    - claim:L21_accepted_key_gate_rejects_new_acceptance
    - claim:C14_all_acceptance_paths_honor_idempotency_identity
  pending_edit:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_pending_edits
    meaning: Logical edit identity represented by overlay token o remains active in client_pending_edits in client state s.
  retained_overlay:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_speculative_overlays
    meaning: Logical edit/overlay token o remains in retained client_speculative_overlays in client state s.
  matching_retained_representation_for_visible_overlay:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_speculative_overlays
    - client_visible_speculative_overlays
    meaning: In user-visible client state s, visible overlay o has at least one retained speculative representation of the same logical edit and the same full (document_id, client_change_id); the retained representation need not be the same physical overlay object as o.
    semantic_anchors:
    - contract:visible_speculative_retention_coherence
    - claim:G11_visible_speculative_overlays_match_document
  terminalized_speculative_edit:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_terminalized_speculative_lifecycles
    meaning: The normal speculative lifecycle represented by o is terminalized in client state s.
  unresolved_eligible_retained_edit:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_speculative_overlays
    meaning: In state s, o represents an unresolved acceptance-eligible logical edit within the normal retry/reconnect horizon that remains retained.
    semantic_anchors:
    - contract:pending_speculative_lifecycle_coverage
  acceptance_based_pending_retirement:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_pending_edits
    meaning: State s reflects retirement of pending edit o with authoritative accepted/reconciled semantics.
    semantic_anchors:
    - contract:pending_retirement_acceptance_binding
  pending_retirement_has_matching_acceptance_source:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - canonical_accepted_change
    - accepted_idempotency_evidence
    - document_id
    - client_change_id
    meaning: The acceptance-based retirement of pending edit o in state s is derived from canonical acceptance or equivalent authoritative accepted evidence for the exact same full identity; mere co-presence of matching evidence is insufficient if some unrelated source actually caused the retirement.
    semantic_anchors:
    - contract:pending_retirement_acceptance_binding
  speculative_identity_provenance_ok:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - logical_client_edit
    - document_id
    - client_change_id
    - client_speculative_overlays
    - client_visible_speculative_overlays
    meaning: Retained/exposed representation o in state s preserves the same logical edit's complete creation identity.
    semantic_anchors:
    - contract:speculative_overlay_identity_provenance
  speculative_operation_provenance_ok:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - logical_client_edit
    - logical_edit_operation
    - client_speculative_overlays
    - client_visible_speculative_overlays
    meaning: Retained/exposed representation o in state s remains semantically derived from the same logical edit operation rather than another edit's operation.
    semantic_anchors:
    - contract:speculative_overlay_operation_provenance
  single_effective_speculative_contribution:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_visible_speculative_overlays
    meaning: The logical identity represented by o contributes at most one effective speculative operation to the rendered state s.
    semantic_anchors:
    - contract:visible_speculative_effect_uniqueness
  visible_overlay_matches_visible_document:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_document_id
    - client_visible_speculative_overlays
    meaning: Exposed overlay o belongs to the same document represented by user-visible client state s.
    semantic_anchors:
    - contract:visible_speculative_overlay_document_binding
  accepted_reconciliation_published:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Client state s is exactly the user-visible state atomically exposed by a normal foreground reconnect/reconciliation publication through response head H after the authoritative reconciliation result classified exact logical edit identity e as ACCEPTED at canonical revision r with r <= H, and the reconciled canonical state published through H contains that acceptance; predicates over s therefore hold at that publication boundary, not only after a later cleanup transition.
    semantic_anchors:
    - source:reconnect_revision_boundary
    - contract:accepted_terminal_speculative_retirement
  authoritative_accepted_reconciliation_published:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Reachable client state s is exactly the user-visible state published by a qualifying authoritative reconnect/reconciliation through response head H after exact logical edit identity e=(D,k) was classified ACCEPTED at canonical revision r with r <= H, and the reconciled canonical state published through H contains that acceptance; this predicate does not require the publication to be foreground.
    semantic_anchors:
    - claim:G12_client_pending_state_tracks_unresolved_edits
  new_user_edit_after_terminalized_lifecycle:
    args:
    - ClientState
    - LogicalEditIdentity
    - LogicalEdit
    returns: Bool
    catalog_symbols:
    - logical_client_edit
    - document_id
    - client_change_id
    meaning: In reachable client state s, old identity e denotes a terminalized logical edit for document D and n is a genuinely new user logical edit for that same document D rather than a continuation, retry, restore, or reactivation of e.
    semantic_anchors:
    - claim:G12_client_pending_state_tracks_unresolved_edits
  logical_identity_change_id:
    args:
    - LogicalEditIdentity
    returns: ClientChangeId
    catalog_symbols:
    - client_change_id
    meaning: The client_change_id coordinate carried by exact full logical edit identity e=(document_id, client_change_id).
    semantic_anchors:
    - claim:G12_client_pending_state_tracks_unresolved_edits
  logical_edit_in_reachable_client_history:
    args:
    - ClientState
    - LogicalEdit
    returns: Bool
    catalog_symbols:
    - logical_client_edit
    meaning: In reachable client state s, logical edit e has been created as a genuine logical client edit in the continuing normal client protocol history represented by s; e remains part of that history whether currently active, terminalized, or retained only in non-reactivatable archival/history state.
    semantic_anchors:
    - claim:G12_client_pending_state_tracks_unresolved_edits
  pending_identity_active:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - client_pending_edits
    meaning: Exact logical edit identity e remains active in client_pending_edits in client state s.
  retained_speculative_identity_active:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - client_speculative_overlays
    meaning: Client state s retains a normal-lifecycle speculative representation for exact logical edit identity e.
  visible_speculative_identity_active:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - client_visible_speculative_overlays
    meaning: Client state s exposes a normal-lifecycle speculative representation for exact logical edit identity e.
  terminalized_speculative_identity:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - client_terminalized_speculative_lifecycles
    meaning: Exact logical edit identity e is classified as terminalized normal speculative lifecycle in client state s.
  overlay_compatible_with_visible_canonical_base:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols: []
    meaning: Composing exposed speculative representation o over the canonical base visible in state s still realizes the original logical edit operation represented by o.
    semantic_anchors:
    - source:reconnect_revision_boundary
  unresolved_eligible_normal_lifecycle_active:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - logical_client_edit
    - client_pending_edits
    - client_speculative_overlays
