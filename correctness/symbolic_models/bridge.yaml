    - claim:L210_new_owner_recovery_boundary_is_attempt_scoped
    - claim:C9_recovery_reconstructs_committed_state
  authoritative_history_lifecycle_transition_completes:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: 'Authoritative history lifecycle transition t completes: t''s snapshotting, checkpoint-replacement, cleanup, or compaction procedure runs to completion rather than stalling or aborting, so t has a completed post-state.'
