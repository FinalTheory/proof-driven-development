    - claim:L97_client_adopts_snapshot_before_tail
  client_catchup_attempt_completed:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: The client catch-up attempt associated with response r is considered complete. This predicate records the completion status only; what full consumption of r's canonical representation requires is asserted by the companion clauses of the same claim.
