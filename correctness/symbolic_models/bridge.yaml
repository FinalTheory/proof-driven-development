    catalog_symbols:
    - document_current_epoch
    dimensions:
    - document
    - observation
    meaning: 'For recovery attempt r targeting document d, before r captures its recovery head, the authoritative document_current_epoch for d has already advanced to r''s recovering owner''s epoch, which is strictly greater than the superseded owner''s epoch: r''s recovery starts after the epoch handoff for d. This predicate asserts the epoch ordering only; it asserts no additional lifecycle-lock or checkpoint-selection ordering.'
  recovery_attempt_establishes_owner_generation:
