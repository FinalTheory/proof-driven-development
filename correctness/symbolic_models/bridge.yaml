    semantic_anchors:
    - claim:L172_snapshot_compaction_preserves_concurrent_append_suffix
  lifecycle_preserves_concurrent_append_suffix:
    args:
    - ProtocolTransition
    - Document
    returns: Bool
    catalog_symbols: []
    meaning: For authoritative history lifecycle procedure t targeting document d, no canonical accepted suffix of d that committed during t's overlap is deleted, omitted, rewritten, or double-applied by t's snapshot publication, checkpoint replacement, cleanup, or compaction.
    semantic_anchors:
    - claim:L172_snapshot_compaction_preserves_concurrent_append_suffix
  authoritative_snapshot_publication_or_compaction:
    args:
    - ProtocolTransition
    returns: Bool
