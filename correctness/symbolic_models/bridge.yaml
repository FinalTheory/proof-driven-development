    - claim:L210_new_owner_recovery_boundary_is_attempt_scoped
    - claim:C9_recovery_reconstructs_committed_state
  recovery_attempt_publication_is_fresh_generation:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Recovery attempt r's authoritative or acceptance-eligible publication is for a distinct fresh owner generation rather than a continuation of the superseded tenure, and is therefore subject to the fresh epoch and owner-generation installation requirements for that new generation.
