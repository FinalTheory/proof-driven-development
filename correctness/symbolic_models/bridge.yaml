    - claim:C9_recovery_reconstructs_committed_state
  recovery_used_to_resume_owner_service:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: 'The recovered owner established by recovery attempt r is used to resume owner service: that owner serves its document on the basis of r''s recovered state.'
