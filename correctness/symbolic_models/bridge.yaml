    - claim:L182_logical_edit_request_payload_binding_is_preserved
  ot_success_computed_against_frontier:
    args:
    - OTSuccessResult
    - Revision
    returns: Bool
    catalog_symbols:
    - accepted_change_log
    - ot_computation_frontier
    - ot_success_result
    meaning: 'n is the ot_computation_frontier of the canonical committed document prefix against which the OT computation that produced r was computed: that computation consumed the canonical committed accepted_change_log prefix through revision n. This predicate names only that computation-time fact about r and the prefix it consumed. It asserts nothing about any representation or handoff of r after its computation, requires no retention of r, and by itself imposes no condition on when r may become a canonical_accepted_change.'
    semantic_anchors:
    - claim:L99_ot_result_is_bound_to_acceptance_frontier
  recovery_completed_at_authoritative_head:
    args:
    - RecoveryAttempt
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Recovery attempt r completed at authoritative head h: h is the recovery head captured by r, and h is the authoritative frontier H -- the document_latest_revision of r''s target document -- at which r''s completed recovery stands. This atom states the authoritative-head scope coordinate of the completed recovery only; it does not assert the contents of the recovered state, and it does not itself assert how the captured value was bound at capture time.'
    semantic_anchors:
    - claim:L131_post_recovery_acceptance_state_is_exhaustive
    - claim:C9_recovery_reconstructs_committed_state
  recovered_ot_metadata_carried_within_recovered_components:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols:
    - ot_owner_memory
    meaning: 'For recovery attempt r, the recovered OT metadata for r''s owner is carried within the union of r''s recovered logical document state through its recovery head, r''s recovered local head and next-candidate revision, and r''s ot_owner_memory: every recovered OT metadata value that can influence server-side OT transformation or canonical acceptance for r''s owner is contained in at least one of those three components, and no separate recovered OT metadata bucket exists outside that union.'
    semantic_anchors:
    - claim:L131_post_recovery_acceptance_state_is_exhaustive
  authoritative_history_lifecycle_completes_without_accepting_new_edit:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: 'Authoritative history lifecycle transition t completes without accepting a new edit: t''s snapshotting, checkpoint-replacement, cleanup, or compaction execution itself accepts no new canonical edit -- no canonical accepted change is created by t. Appends performed by other, concurrent transitions are not t accepting an edit.'
    semantic_anchors:
    - claim:L180_non_append_lifecycle_preserves_logical_state_at_frontier
    - claim:C16_non_append_lifecycle_preserves_logical_revision_prefix
  authoritative_history_lifecycle_transition_completes_at_frontier:
    args:
    - ProtocolTransition
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Authoritative history lifecycle transition t completes at frontier h: h is the authoritative frontier -- the document_latest_revision of t''s target document -- at the completion of t. The frontier is read at the transition level, at t''s completion, whether or not t''s resulting representation correctly records that frontier as its own latest_revision.'
    semantic_anchors:
    - claim:L180_non_append_lifecycle_preserves_logical_state_at_frontier
    - claim:C16_non_append_lifecycle_preserves_logical_revision_prefix
  authoritative_history_lifecycle_overlaps_appends:
    args:
    - ProtocolTransition
    - Document
    returns: Bool
    catalog_symbols: []
    meaning: 'Authoritative history lifecycle procedure t targeting document d overlaps one or more canonical accepted-change appends for d: at least one canonical append for d is concurrent with t, in that the append''s execution overlaps t''s execution. Such an append may commit while t is in progress, or it may commit only after t completes; an append that commits only after t completes is outside t''s post-state and is not counted in t''s completion head.'
    semantic_anchors:
    - claim:L172_snapshot_compaction_preserves_concurrent_append_suffix
  representation_initializes_owner_service:
    args:
    - AuthoritativeState
    returns: Bool
    catalog_symbols: []
    meaning: 'The authoritative representation s is used to initialize an owner: an owner begins service on the basis of s.'
    semantic_anchors:
    - claim:L173_optimized_lifecycle_representation_resumes_only_through_recovery
  owner_transform_and_acceptance_entrypoints_closed_until_recovery_completes:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'All transform and acceptance entrypoints of the owner that authoritative representation s is used to initialize or resume remain closed until that owner completes authoritative recovery/reconstruction through frontier h: no transform or acceptance entrypoint of that owner is open before or during that recovery.'
    semantic_anchors:
    - claim:L173_optimized_lifecycle_representation_resumes_only_through_recovery
  owner_completes_recovery_through_frontier:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: The owner that authoritative representation s is used to initialize or resume completes authoritative recovery/reconstruction through frontier h.
    semantic_anchors:
    - claim:L173_optimized_lifecycle_representation_resumes_only_through_recovery
  owner_installs_recovered_logical_state_through_frontier:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: The owner that authoritative representation s is used to initialize or resume installs the recovered logical document state recovered through frontier h as its acceptance-relevant logical state.
    semantic_anchors:
    - claim:L173_optimized_lifecycle_representation_resumes_only_through_recovery
  owner_installs_recovered_head_through_frontier:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'The owner that authoritative representation s is used to initialize or resume installs the recovered head recovered through frontier h: its recovered local head and next-candidate revision state at h.'
    semantic_anchors:
    - claim:L173_optimized_lifecycle_representation_resumes_only_through_recovery
  owner_installs_recovered_ot_metadata_through_frontier:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: The owner that authoritative representation s is used to initialize or resume installs the recovered OT metadata recovered through frontier h as its acceptance-relevant OT metadata.
    semantic_anchors:
    - claim:L173_optimized_lifecycle_representation_resumes_only_through_recovery
  recovery_captured_head_is_authoritative_frontier:
    args:
    - RecoveryAttempt
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Revision h is the recovery head captured by recovery attempt r and h is the authoritative frontier -- the document_latest_revision of r''s target document -- at r''s capture: the authoritative head through which the replay coverage is stated. This atom states the scope coordinate only; it does not itself assert how the captured value was bound at capture time.'
    semantic_anchors:
    - claim:L10_replay_covers_exact_tail_in_order_once
    - claim:C9_recovery_reconstructs_committed_state
  document_epoch_advanced_before_recovery_head_capture:
    args:
    - RecoveryAttempt
    - Document
    returns: Bool
    catalog_symbols:
    - document_current_epoch
    dimensions:
    - document
    - observation
    meaning: 'For recovery attempt r targeting document d, at the point r captures its recovery head, the authoritative document_current_epoch for d has already advanced to r''s recovering owner''s epoch, which is strictly greater than the superseded owner''s epoch. The ordering is relative to the head-capture point only: the advancement may occur before or after r''s initiation, and this predicate asserts no ordering relative to r''s start and no additional lifecycle-lock or checkpoint-selection ordering.'
    semantic_anchors:
    - claim:L94_recovery_starts_after_epoch_handoff
    - claim:C9_recovery_reconstructs_committed_state
  client_local_document_is_exact_canonical_accepted_application:
    args:
    - ClientState
    - Document
    - Revision
    returns: Bool
    catalog_symbols:
    - client_local_document
    meaning: 'Client state s''s client_local_document is exactly the deterministic application of all and only document D''s canonical accepted revisions through F: every canonical accepted revision of D at or below F is applied exactly once, in canonical order, and no other revision, accepted change, or content is part of client_local_document. F is s''s last_applied_revision, the highest contiguous canonical revision applied by s, so the revisions applied for s are exactly D''s contiguous canonical accepted sequence through F, with no gap, no omission, and no extra element.'
    semantic_anchors:
    - claim:L128_client_canonical_frontier_is_established_on_publication
  client_local_document_excludes_speculative_raw_edits:
    args:
    - ClientState
    returns: Bool
    catalog_symbols:
    - client_local_document
    meaning: 'Speculative raw edits are not part of client state s''s client_local_document: no unaccepted, locally speculative raw edit contributes any content to client_local_document in s, and client_local_document in s consists solely of canonical accepted content.'
    semantic_anchors:
    - claim:L128_client_canonical_frontier_is_established_on_publication
  request_processes_do_not_substitute_logical_operation:
    args:
    - Request
    - LogicalEdit
    returns: Bool
    catalog_symbols:
    - submitted_request
    - logical_client_edit
    - document_id
    - client_change_id
    - raw_edit
    - base_revision
    meaning: 'For submitted request r whose semantic source is logical edit e: no step of the request construction, serialization, dispatch, or normal retry that produced r preserves e''s identity and authoring frontier (document_id = D, client_change_id = k, base_revision = F, from e''s canonical authoring state D@F) while substituting a semantically different logical operation for e''s own operation into the raw_edit being carried. Those processes may change the request''s physical representation only in semantics-preserving ways. A substitution of a different logical operation under e''s (D, k, F) falsifies this predicate even if a later step of those processes restores e''s operation before submission. This predicate constrains the behavior of the four named processes themselves: it asserts nothing about any intermediate representation as an object -- in particular it does not assert that any intermediate representation is a submitted request, remains bound to e''s complete tuple, or
      carries (D, k, F) at all -- and it requires no byte-identical serialization and no dispatch, retry, OT invocation, acceptance, or terminal-decision progress beyond the processes that produced r. It does not by itself assert that r represents no other logical edit.'
    semantic_anchors:
    - claim:L182_logical_edit_request_payload_binding_is_preserved
  acceptance_linearization_prestate_latest_revision:
    args:
    - CanonicalAcceptance
    returns: Revision
    catalog_symbols:
    - document_latest_revision
    - latest_revision
    meaning: For committed acceptance a, the latest_revision of the authoritative acceptance pre-state of a's document immediately before a's acceptance linearization point (that pre-state's document_latest_revision). This is the actual acceptance pre-state value the claim's commit condition names, not an earlier read, an owner-memory estimate, a submitted frontier field, or the post-acceptance value, and not a pre-state read at any distinct candidate-commit step. Values on noncommitted objects are immaterial to this contract.
    semantic_anchors:
    - claim:L99_ot_result_is_bound_to_acceptance_frontier
  recovery_preparation_cannot_cause_canonical_acceptance:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Internal transformation preparation performed for recovery attempt r before r's reconstruction barrier completes cannot commit or otherwise cause canonical acceptance of any edit under the owner established by r. The reconstruction barrier completes when r's selected checkpoint is installed, the exact canonical tail through r's captured recovery head H has been replayed, r's required OT metadata has been rebuilt, and r's local head/next-revision state has been initialized through H. This atom constrains the preparation activity itself; it does not require preparation to occur.
    semantic_anchors:
    - claim:L79_new_owner_accepts_only_after_reconstruction
  recovery_selected_loaded_checkpoint_frontier_is:
    args:
    - RecoveryAttempt
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: Revision s is the frontier of the checkpoint that recovery attempt r selected and loaded for its new-owner recovery. This relation names the selected and loaded checkpoint's frontier only; it does not assert that the checkpoint's state is correct or that s bears any relation to r's recovery head.
    semantic_anchors:
    - claim:L41_recovery_checkpoint_does_not_exceed_recovery_head
    - claim:C9_recovery_reconstructs_committed_state
  client_state_precedes_within_catchup:
    args:
    - ClientState
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: 'Client state s1 occurs strictly before client state s2 within one and the same catch-up attempt: s2 is reachable from s1 by one or more client-protocol transitions of that attempt, and s1 is a different, earlier state than s2. This relation orders states of a single attempt only; it does not relate states of different attempts or of different clients.'
    semantic_anchors:
    - claim:L97_client_adopts_snapshot_before_tail
  resync_attempt_captured_response_head:
    args:
    - CatchupResponse
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Revision h is the captured response head H of the reconnect/resync attempt associated with response r: the authoritative response head captured and fixed for that attempt, against which the attempt''s canonical catch-up proceeds.'
    semantic_anchors:
    - claim:L126_pending_reconciliation_preserves_resync_canonical_candidate
  resync_candidate_pair_initialized_by_any_means:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: 'Response r''s private resync candidate canonical document/frontier pair has been initialized: the candidate exists as a private candidate whose canonical document and canonical frontier are set. Initialization is by whatever path the attempt used; this predicate records only that the pair is set, not how it came to be set.'
    semantic_anchors:
    - claim:L126_pending_reconciliation_preserves_resync_canonical_candidate
  transition_within_candidate_window_spanning_captured_head:
    args:
    - ProtocolTransition
    - CatchupResponse
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Protocol transition t occurs within response r''s resync candidate window, taken relative to the attempt''s captured response head h: at or after the initialization of r''s private resync candidate canonical document/frontier pair and before that candidate is published or discarded. The window is not interrupted when canonical catch-up for r reaches h: t is within the window whether it occurs before canonical catch-up reaches h, at the moment it reaches h, or after it has reached h.'
    semantic_anchors:
    - claim:L126_pending_reconciliation_preserves_resync_canonical_candidate
  owner_transform_and_acceptance_entrypoints_closed_until_recovery_and_installation_complete:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'All transform and acceptance entrypoints of the owner that authoritative representation s is used to initialize or resume remain closed until that owner completes authoritative recovery/reconstruction through frontier h and installs the recovered logical document state, the recovered head, and the recovered OT metadata through frontier h: no transform or acceptance entrypoint of that owner is open before recovery through h is complete and all three installations have occurred. This predicate asserts the closure gate only; it does not require that the recovery or any installation ever occurs.'
    semantic_anchors:
    - claim:L173_optimized_lifecycle_representation_resumes_only_through_recovery
  recovery_attempt_authoritative_recovery_head_is:
    args:
    - RecoveryAttempt
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Revision h is the authoritative recovery head H of recovery attempt r: the head against which the frontier of the checkpoint r selected and loaded for its new-owner recovery is bounded. This relation names the authoritative head coordinate only; how the recovery_head bound for r was established from that authoritative head is the recovery-head binding asserted elsewhere (L92), not here.'
    semantic_anchors:
    - claim:L41_recovery_checkpoint_does_not_exceed_recovery_head
    - claim:C9_recovery_reconstructs_committed_state
  l173_optimized_snapshot_or_compacted_representation:
    args:
    - AuthoritativeState
    returns: Bool
    catalog_symbols: []
    meaning: Authoritative state representation s is an optimized snapshot or compacted authoritative representation.
    semantic_anchors:
    - claim:L173_optimized_lifecycle_representation_resumes_only_through_recovery
  l173_optimized_representation_at_frontier:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: Authoritative state representation s is an optimized snapshot or compacted authoritative representation at frontier h.
    semantic_anchors:
    - claim:L173_optimized_lifecycle_representation_resumes_only_through_recovery
assumptions:
  A2_ot_engine_is_correct:
    capability: relational
    formula:
      forall:
        vars:
          i: OTInvocation
        body:
          implies:
          - call:
              fn: ot_engine_invocation
              args:
              - var: i
          - and:
            - or:
              - call:
                  fn: ot_success_satisfies_algorithmic_contract
                  args:
                  - var: i
              - call:
                  fn: ot_rejects_invalid_or_rebase_required
                  args:
                  - var: i
            - not:
                and:
                - call:
                    fn: ot_success_satisfies_algorithmic_contract
                    args:
                    - var: i
                - call:
                    fn: ot_rejects_invalid_or_rebase_required
                    args:
                    - var: i
  A3_client_change_id_identifies_logical_edit:
    capability: relational
    formula:
      and:
      - forall:
          vars:
            r: Request
            e: LogicalEdit
          body:
            implies:
            - call:
                fn: retry_request_of_logical_edit
                args:
                - var: r
                - var: e
            - eq:
              - call:
                  fn: request_change_id
                  args:
                  - var: r
              - call:
                  fn: logical_edit_change_id
                  args:
                  - var: e
      - forall:
          vars:
            e1: LogicalEdit
            e2: LogicalEdit
          body:
            implies:
            - and:
              - neq:
                - var: e1
                - var: e2
              - call:
                  fn: same_document_logical_edits
                  args:
                  - var: e1
                  - var: e2
            - call:
                fn: distinct_logical_edits_use_distinct_change_ids
                args:
                - var: e1
                - var: e2
  A5_apply_accepted_change_is_deterministic:
    capability: relational
    formula:
      forall:
        vars:
          s: DocumentState
          q: AcceptedChangeSequence
        body:
          forall:
            vars:
              r1: DocumentState
              r2: DocumentState
            body:
              implies:
              - and:
                - call:
                    fn: accepted_sequence_application_result
                    args:
                    - var: s
                    - var: q
                    - var: r1
                - call:
                    fn: accepted_sequence_application_result
                    args:
                    - var: s
                    - var: q
                    - var: r2
              - eq:
                - var: r1
                - var: r2
  A6_normal_retry_reconnect_identity_is_eligible_for_30_days:
    capability: relational
    formula:
      forall:
        vars:
          s: AuthoritativeState
          e: LogicalEditIdentity
        body:
          implies:
          - call:
              fn: normal_retry_reconnect_identity_in_scope
              args:
              - var: s
              - var: e
          - and:
            - implies:
              - call:
                  fn: normal_retry_or_reconnect_submission
                  args:
                  - var: s
                  - var: e
              - call:
                  fn: identity_pending_retry_age_at_most_30_days
                  args:
                  - var: s
                  - var: e
            - implies:
              - call:
                  fn: identity_pending_retry_age_exceeds_30_days
                  args:
                  - var: s
                  - var: e
              - and:
                - not:
                    call:
                      fn: normal_retry_or_reconnect_submission
                      args:
                      - var: s
                      - var: e
                - call:
                    fn: identity_handled_outside_normal_retry_protocol
                    args:
                    - var: s
                    - var: e
claims:
  L20_acceptance_paths_are_authoritatively_mediated:
    contracts: []
    formula:
      forall:
        vars:
          t: ProtocolTransition
        body:
          implies:
          - call:
              fn: acceptance_capable_transition
              args:
              - var: t
          - call:
              fn: transition_is_authoritatively_gate_mediated
              args:
              - var: t
  L21_accepted_key_gate_rejects_new_acceptance:
    contracts: []
    formula:
      forall:
        vars:
          t: ProtocolTransition
        body:
          implies:
          - and:
            - call:
                fn: transition_is_authoritatively_gate_mediated
                args:
                - var: t
            - call:
                fn: gate_observes_key_already_accepted
                args:
                - var: t
          - not:
              call:
                fn: transition_creates_acceptance
                args:
                - var: t
  C14_all_acceptance_paths_honor_idempotency_identity:
    contracts: []
    formula:
      forall:
        vars:
          t: ProtocolTransition
        body:
          implies:
          - and:
            - call:
                fn: acceptance_capable_transition
                args:
                - var: t
            - call:
                fn: gate_observes_key_already_accepted
                args:
                - var: t
          - not:
              call:
                fn: transition_creates_acceptance
                args:
                - var: t
  L108_acceptance_preserves_request_identity:
    contracts:
    - acceptance_request_identity_binding
    formula:
      forall:
        vars:
          a: CanonicalAcceptance
          r: Request
        body:
          implies:
          - call:
              fn: acceptance_produced_from_request
              args:
              - var: a
              - var: r
          - and:
            - eq:
              - call:
                  fn: acceptance_document
                  args:
                  - var: a
              - call:
                  fn: request_document
                  args:
                  - var: r
            - eq:
              - call:
                  fn: acceptance_change_id
                  args:
                  - var: a
              - call:
                  fn: request_change_id
                  args:
                  - var: r
            - call:
                fn: acceptance_idempotency_identity_matches_request
                args:
                - var: a
                - var: r
            - call:
                fn: acceptance_identity_preserved_end_to_end
                args:
                - var: a
                - var: r
            - forall:
                vars:
                  e: DurableIdempotencyEvidence
                body:
                  implies:
                  - call:
                      fn: durable_idempotency_evidence_for_acceptance
                      args:
                      - var: e
                      - var: a
                  - call:
                      fn: durable_evidence_identity_matches_request
                      args:
                      - var: e
                      - var: r
  C12_live_delivery_contains_only_accepted_changes:
    contracts:
    - live_delivery_acceptance_binding
    formula_from_contracts: true
  L116_live_delivery_is_bound_to_committed_acceptance:
    contracts:
    - live_delivery_acceptance_binding
    formula_from_contracts: true
  L92_captured_recovery_head_equals_authoritative_frontier:
    contracts:
    - recovery_head_binding
    formula_from_contracts: true
  G0_acked_edit_survives_failover:
    contracts:
    - acked_edit_failover_survival
    capability: relational
    formula_from_contracts: true
  G10_user_visible_client_state_matches_document:
    contracts:
    - client_canonical_frontier_coherence
    - visible_canonical_frontier_non_regression
    capability: relational
    formula_from_contracts: true
  G11_visible_speculative_overlays_match_document:
    contracts:
    - visible_speculative_overlay_document_binding
    - speculative_overlay_identity_provenance
    - speculative_overlay_operation_provenance
    - visible_speculative_effect_uniqueness
    - visible_speculative_retention_coherence
    capability: relational
    formula_from_contracts: true
  G12_client_pending_state_tracks_unresolved_edits:
    contracts:
    - pending_edit_identity_provenance
    - pending_speculative_lifecycle_coverage
    - pending_retirement_acceptance_binding
    - accepted_terminal_speculative_retirement
    - non_acceptance_terminal_disposition_binding
    - terminal_speculative_lifecycle_closure
    - rejected_terminal_speculative_retirement
    capability: relational
    formula:
      and:
      - forall:
          vars:
            s: ClientState
            e: LogicalEditIdentity
          body:
            implies:
            - and:
              - call:
                  fn: reachable_client_state
                  args:
                  - var: s
              - call:
                  fn: pending_identity_active
                  args:
                  - var: s
                  - var: e
              - call:
                  fn: pending_identity_normal_speculative_lifecycle_active
                  args:
                  - var: s
                  - var: e
            - call:
                fn: pending_representation_bound_to_creation_identity
                args:
                - var: s
                - var: e
      - forall:
          vars:
            s: ClientState
            o: Overlay
          body:
            implies:
            - and:
              - call:
                  fn: reachable_client_state
                  args:
                  - var: s
              - call:
                  fn: unresolved_eligible_retained_edit
                  args:
                  - var: s
                  - var: o
            - call:
                fn: pending_edit
                args:
                - var: s
                - var: o
      - forall:
          vars:
            s: ClientState
            o: Overlay
          body:
            implies:
            - and:
              - call:
                  fn: reachable_client_state
                  args:
                  - var: s
              - call:
                  fn: acceptance_based_pending_retirement
                  args:
                  - var: s
                  - var: o
            - call:
                fn: pending_retirement_has_matching_acceptance_source
                args:
                - var: s
                - var: o
      - forall:
          vars:
            s: ClientState
            e: LogicalEditIdentity
          body:
            implies:
            - and:
              - call:
                  fn: reachable_client_state
                  args:
                  - var: s
              - call:
                  fn: acceptance_semantic_lifecycle_retirement
                  args:
                  - var: s
                  - var: e
            - call:
                fn: accepted_retirement_has_matching_acceptance_source
                args:
                - var: s
                - var: e
      - forall:
