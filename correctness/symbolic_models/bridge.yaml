    args:
    - AuthoritativeState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Because exact identity e is outside the normal 30-day horizon in state s, the client discards it or routes it through an explicit expired, conflict, or manual-resolution path rather than normal retry/reconnect.
    semantic_anchors:
    - assumption:A6_normal_retry_reconnect_identity_is_eligible_for_30_days
