    - claim:L131_post_recovery_acceptance_state_is_exhaustive
    - claim:C9_recovery_reconstructs_committed_state
  post_recovery_history_dependent_state_is_exhaustive:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Every document-history-dependent runtime state value present on recovery attempt r's recovered owner that can influence server-side OT transformation or canonical acceptance is contained in r's recovered logical document state through its recovery head, r's recovered local head and next-candidate revision, or r's ot_owner_memory. No stale, retained, cached, otherwise pre-existing, or newly produced per-document runtime state outside those components can influence post-recovery canonical semantics for r's owner.
