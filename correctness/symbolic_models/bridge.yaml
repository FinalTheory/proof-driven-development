    - claim:L101_client_completes_catchup_through_response_head
  client_consumed_entire_delta_response:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: 'The client has consumed the entire canonical representation of delta-mode response r: it has applied every returned revision L+1..H of r, from r''s client frontier L through r''s captured head H.'
    semantic_anchors:
    - claim:L101_client_completes_catchup_through_response_head
  client_consumed_entire_snapshot_response:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: 'The client has consumed the entire canonical representation of snapshot-mode response r: it has installed r''s selected checkpoint (content, S) and applied every returned tail revision S+1..H, through r''s captured head H.'
    semantic_anchors:
    - claim:L101_client_completes_catchup_through_response_head
  client_visible_frontier_at_catchup_completion:
    args:
    - CatchupResponse
    - Revision
    returns: Bool
    catalog_symbols:
    - last_applied_revision
    meaning: Revision f is the client's user-visible last_applied_revision at the moment the catch-up attempt for response r completes.
    semantic_anchors:
    - claim:L101_client_completes_catchup_through_response_head
  resync_candidate_completed_through_head:
    args:
    - CatchupResponse
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Response r''s reconnect/resync attempt has completed its canonical catch-up and its pending reconciliation through captured response head h: r''s private reconciled candidate is complete at h and awaits atomic publication or discard.'
    semantic_anchors:
    - claim:L119_completed_resync_candidate_stays_at_response_head_until_publication
  resync_candidate_frontier_at_readiness_is:
    args:
    - CatchupResponse
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'At candidate readiness for response r -- the completed private reconciled candidate awaiting publication or discard -- the candidate''s canonical frontier is exactly h: its canonical document state is canonical replay through h, and no canonical acceptance after h has been applied into it.'
    semantic_anchors:
    - claim:L119_completed_resync_candidate_stays_at_response_head_until_publication
  resync_candidate_publication_exposes_frontier:
    args:
    - CatchupResponse
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'A successful publication of response r''s private reconciled candidate exposes user-visible canonical state through exactly h: canonical replay of r''s document through h, with no omitted and no extra canonical acceptance.'
    semantic_anchors:
    - claim:L119_completed_resync_candidate_stays_at_response_head_until_publication
  post_head_acceptances_deferred_for_candidate:
    args:
    - CatchupResponse
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'With respect to response r''s private candidate, canonical acceptances after r''s captured head h are only buffered or deferred for later processing: they are not applied into the candidate and do not advance the candidate''s canonical frontier before the candidate''s publication.'
    semantic_anchors:
    - claim:L119_completed_resync_candidate_stays_at_response_head_until_publication
  resync_candidate_pair_initialized:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: 'Response r''s private resync candidate canonical document/frontier pair has been initialized: the candidate exists as a private candidate whose canonical document and canonical frontier are set (by client-base initialization in delta mode or by checkpoint installation in snapshot mode).'
    semantic_anchors:
    - claim:L121_delta_resync_candidate_starts_from_canonical_client_base
    - claim:L126_pending_reconciliation_preserves_resync_canonical_candidate
  resync_candidate_initialized_from_client_base:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: 'Response r''s private resync candidate canonical document/frontier pair was initialized from the same reconnect-start client document/frontier pair at L, either by exact copy or by a deterministic reconstruction equal to that pair, before any returned canonical revision greater than L is applied: no stale or private scratch content is substituted, no document is cross-bound from another client state to frontier L, and neither member of the reconnect-start pair is changed before the first delta is applied.'
