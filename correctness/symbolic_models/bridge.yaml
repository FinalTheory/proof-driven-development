    semantic_anchors:
    - claim:L10_replay_covers_exact_tail_in_order_once
    - claim:C9_recovery_reconstructs_committed_state
  recovery_attempt_captured_head_is:
    args:
    - RecoveryAttempt
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Revision h is the recovery head H captured by recovery attempt r at its recovery-head capture event: the authoritative frontier value r read and bound as its recovery_head. This relation names the captured value only; that the captured value equals the authoritative frontier at capture is the recovery-head binding asserted elsewhere (L92), not here.'
    semantic_anchors:
    - claim:L10_replay_covers_exact_tail_in_order_once
    - claim:L39_recovered_owner_resumes_at_head_plus_one
    - claim:C9_recovery_reconstructs_committed_state
    - claim:L131_post_recovery_acceptance_state_is_exhaustive
  recovery_replay_applies_accepted_change:
    args:
    - RecoveryAttempt
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: During recovery attempt r's replay stage, canonical accepted change a is applied to r's installed replay base as one replay application. This relation records replay application only; whether a belongs to the replayed range and how many times it is applied are asserted separately.
    semantic_anchors:
    - claim:L10_replay_covers_exact_tail_in_order_once
    - claim:C9_recovery_reconstructs_committed_state
  recovery_replay_applies_tail_exactly_once_in_order:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Recovery attempt r's replay applies no canonical accepted change more than once, and its replay applications occur in increasing canonical revision order. This predicate asserts the multiplicity and ordering of the replay only; which changes belong to the replayed range is asserted separately.
    semantic_anchors:
    - claim:L10_replay_covers_exact_tail_in_order_once
    - claim:C9_recovery_reconstructs_committed_state
  recovered_local_head_initialized_to:
    args:
    - RecoveryAttempt
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Recovery attempt r''s recovered local head is initialized to revision h as part of r''s reconstruction completion: the recovered owner''s local head value is h before the recovery is considered complete.'
    semantic_anchors:
    - claim:L39_recovered_owner_resumes_at_head_plus_one
    - claim:C9_recovery_reconstructs_committed_state
  recovered_next_candidate_revision_is:
    args:
    - RecoveryAttempt
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Revision v is recovery attempt r''s next candidate revision established by its reconstruction initialization: the first revision the recovered owner may next assign to a candidate canonical change.'
    semantic_anchors:
    - claim:L39_recovered_owner_resumes_at_head_plus_one
    - claim:C9_recovery_reconstructs_committed_state
  recovery_owner_resumes_acceptance:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: 'The recovered owner established by recovery attempt r resumes canonical acceptance service after r''s reconstruction: that owner performs or is enabled to perform canonical acceptance on the basis of r''s recovered state.'
    semantic_anchors:
    - claim:L39_recovered_owner_resumes_at_head_plus_one
    - claim:C9_recovery_reconstructs_committed_state
  recovery_owner_performs_canonical_acceptance:
    args:
    - RecoveryAttempt
    returns: Bool
