    meaning: 'The snapshot_state at frontier r -- the document state represented by a snapshot checkpoint at its declared frontier r -- equals deterministic canonical replay of all and only the canonical accepted changes in accepted_change_log with revisions 1..r: snapshot_state(r) == replay(accepted[1..r]). This predicate is conditional over snapshot checkpoints declaring frontier r.'
    semantic_anchors:
    - claim:L8_snapshot_is_exact_committed_prefix
  client_state_applies_revision:
    args:
    - ClientState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'In client state s, the client applies canonical revision r: r is taken as an applied canonical revision of the client''s document, rather than being ignored as a duplicate or buffered for gap recovery.'
