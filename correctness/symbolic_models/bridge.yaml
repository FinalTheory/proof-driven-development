version: 1
sorts:
- ClientState
- Document
- Revision
- Overlay
- LogicalEditIdentity
- Request
- CatchupResponse
- AuthoritativeState
- CanonicalAcceptance
- AcceptedEvidence
- IdempotencyKey
- ClientChangeId
- LiveDelivery
- RecoveryAttempt
- DurableIdempotencyEvidence
- ProtocolTransition
- OTInvocation
- LogicalEdit
- DocumentState
- AcceptedChangeSequence
- TerminalResultRecord
- RejectionDecision
- OTSuccessResult
- ExternalTerminalResult
functions:
  visible_document:
    args:
    - ClientState
    returns: Document
    catalog_symbols:
    - client_document_id
    meaning: The document identity represented by this user-visible canonical client state.
  visible_frontier:
    args:
    - ClientState
    returns: Revision
    catalog_symbols:
    - last_applied_revision
    meaning: The last canonical revision applied by this client state.
  canonical_content_matches:
    args:
    - ClientState
    - Document
    - Revision
    returns: Bool
    catalog_symbols:
    - client_local_document
    meaning: The client state's canonical content is exactly deterministic replay of document D through revision F.
  visible_overlay:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_visible_speculative_overlays
    meaning: Overlay o is currently exposed as a speculative user-visible overlay in client state s.
  canonical_contains_same_edit:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_local_document
    - last_applied_revision
    meaning: The canonical prefix visible in state s already contains the accepted logical edit represented by overlay o.
  authored_from:
    args:
    - Request
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Request r was constructed from client state s as its authoring state.
    semantic_anchors:
    - contract:request_authoring_frontier_binding
  request_document:
    args:
    - Request
    returns: Document
    catalog_symbols:
    - document_id
    meaning: The document identity carried by request r.
  request_base_revision:
    args:
    - Request
    returns: Revision
    catalog_symbols:
    - base_revision
    meaning: The base revision carried by request r.
  request_raw_edit_bound_to_source_content:
    args:
    - Request
    - ClientState
    returns: Bool
    catalog_symbols:
    - raw_edit
    - client_local_document
    meaning: The raw edit carried by request r is the edit authored against the canonical client content in source state s.
  eligible_catchup_response:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: Response r belongs to a normal catch-up/reconnect attempt within the protocol guarantee being modeled.
    semantic_anchors:
    - contract:catchup_head_binding
  captured_authoritative_head:
    args:
    - CatchupResponse
    returns: Revision
    catalog_symbols:
    - document_latest_revision
    meaning: The authoritative document latest revision captured for the catch-up response's attempt.
  catchup_response_head_value:
    args:
    - CatchupResponse
    returns: Revision
    catalog_symbols:
    - catchup_response_head
    meaning: The response head revision carried by catch-up response r.
  catchup_head_preserved:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols:
    - catchup_response_head
    meaning: The captured response head remains the same bound value through construction, return, and candidate publication for this response.
  within_retry_reconnect_eligibility:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols: []
    meaning: Composite authoritative idempotency identity k = (document_id, client_change_id) is within the 30-day normal retry/reconnect eligibility horizon in authoritative state s.
    semantic_anchors:
    - contract:accepted_evidence_correspondence
  accepted_evidence_for_key:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    - idempotency_key
    meaning: authoritative accepted_idempotency_evidence exists in state s for the same composite idempotency_key k = (document_id, client_change_id).
  exactly_one_committed_acceptance_for_key:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols:
    - accepted_change_log
    meaning: accepted_change_log in authoritative state s contains exactly one committed canonical acceptance whose authoritative idempotency_key is the same composite identity k = (document_id, client_change_id).
  authoritative_evidence:
    args:
    - AcceptedEvidence
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    meaning: Evidence e is an authoritative accepted-idempotency evidence record.
  evidence_key:
    args:
    - AcceptedEvidence
    returns: IdempotencyKey
    catalog_symbols:
    - idempotency_key
    meaning: The authoritative idempotency identity carried by evidence e.
  committed_canonical_acceptance:
    args:
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - canonical_accepted_change
    - accepted_change_log
    meaning: Canonical acceptance a is a committed canonical accepted-change record in authoritative accepted history.
  acceptance_key:
    args:
    - CanonicalAcceptance
    returns: IdempotencyKey
    catalog_symbols:
    - canonical_accepted_change
    meaning: The authoritative idempotency identity carried by canonical acceptance a.
  evidence_derived_from_acceptance:
    args:
    - AcceptedEvidence
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    - canonical_accepted_change
    meaning: Evidence e is derived from and corresponds to committed canonical acceptance a.
  request_change_id:
    args:
    - Request
    returns: ClientChangeId
    catalog_symbols:
    - client_change_id
    meaning: The client-supplied logical edit identity carried by request r.
  acceptance_produced_from_request:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols: []
    meaning: Canonical acceptance a was produced from submitted request r.
    semantic_anchors:
    - contract:acceptance_request_identity_binding
    - claim:G6_accepted_change_preserves_ot_semantics
  acceptance_document:
    args:
    - CanonicalAcceptance
    returns: Document
    catalog_symbols:
    - canonical_accepted_change
    meaning: The document identity preserved on canonical acceptance a.
  acceptance_change_id:
    args:
    - CanonicalAcceptance
    returns: ClientChangeId
    catalog_symbols:
    - canonical_accepted_change
    meaning: The client_change_id preserved on canonical acceptance a.
  acceptance_idempotency_identity_matches_request:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols:
    - idempotency_key
    meaning: The authoritative idempotency identity associated with acceptance a is exactly the request's (document_id, client_change_id).
  acceptance_identity_preserved_end_to_end:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols:
    - canonical_accepted_change
    - document_id
    - client_change_id
    meaning: From request admission through OT dispatch, idempotency arbitration, retry handling, and canonical commit, neither document_id nor client_change_id is dropped, regenerated, substituted, or cross-bound; every identity handoff for acceptance a remains the originating request r identity.
  durable_idempotency_evidence_for_acceptance:
    args:
    - DurableIdempotencyEvidence
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - idempotency_key
    meaning: Durable idempotency evidence e is associated with canonical acceptance a.
  durable_evidence_identity_matches_request:
    args:
    - DurableIdempotencyEvidence
    - Request
    returns: Bool
    catalog_symbols:
    - idempotency_key
    - document_id
    - client_change_id
    meaning: Durable idempotency evidence e identifies exactly the same (document_id, client_change_id) carried by originating request r.
  live_delivery_record:
    args:
    - LiveDelivery
    returns: Bool
    catalog_symbols:
    - websocket_live_stream
    meaning: 'Delivery d is any change actually exposed through the websocket live stream. This predicate does not pre-classify the delivery as canonical or committed: if a provisional, speculative, rejected, aborted, or never-committed change were exposed, it would still satisfy live_delivery_record(d) and would have to satisfy the formula''s separate committed-source obligations.'
  committed_history_record:
    args:
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - accepted_change_log
    meaning: Canonical acceptance a is a committed record in authoritative accepted_change_log.
  live_delivery_originates_from:
    args:
    - LiveDelivery
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: Live delivery d originates from acceptance record a as its accepted-history source; this relation alone does not assert that a is committed or that every payload/revision field is preserved exactly.
    semantic_anchors:
    - contract:live_delivery_acceptance_binding
  live_delivery_preserves_payload_revision:
    args:
    - LiveDelivery
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: Live delivery d preserves acceptance record a's canonical payload and revision provenance exactly; whether a is committed is expressed separately by committed_history_record(a).
    semantic_anchors:
    - contract:live_delivery_acceptance_binding
  recovery_head_capture_event:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Recovery attempt r has reached the new-owner recovery-head capture event after epoch handoff, at which it reads the authoritative frontier and binds recovery_head.
    semantic_anchors:
    - contract:recovery_head_binding
  captured_recovery_authoritative_head:
    args:
    - RecoveryAttempt
    returns: Revision
    catalog_symbols:
    - document_latest_revision
    meaning: The authoritative document_latest_revision value read when recovery attempt r captures its recovery frontier.
  recovery_head_value:
    args:
    - RecoveryAttempt
    returns: Revision
    catalog_symbols:
    - recovery_head
    meaning: The recovery_head value bound to recovery attempt r.
  recovery_head_preserved:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols:
    - recovery_head
    meaning: The same captured recovery_head governs checkpoint selection, exact tail replay, recovered metadata reconstruction, and acceptance resumption for recovery attempt r.
  acceptance_capable_transition:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: Transition t is any normal submission, retry, delayed execution, owner-recovery, resumed-owner, or other protocol transition capable of creating a canonical accepted change.
    semantic_anchors:
    - claim:L20_acceptance_paths_are_authoritatively_mediated
    - claim:C14_all_acceptance_paths_honor_idempotency_identity
  transition_is_authoritatively_gate_mediated:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: Transition t routes its acceptance decision through the authoritative accepted-key identity gate before any acceptance sink and cannot bypass that gate.
    semantic_anchors:
    - claim:L20_acceptance_paths_are_authoritatively_mediated
    - claim:L21_accepted_key_gate_rejects_new_acceptance
  gate_observes_key_already_accepted:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: At transition t's authoritative accepted-key gate decision, authoritative state records t's idempotency key as already accepted.
    semantic_anchors:
    - claim:L21_accepted_key_gate_rejects_new_acceptance
    - claim:C14_all_acceptance_paths_honor_idempotency_identity
  transition_creates_acceptance:
    args:
    - ProtocolTransition
    returns: Bool
    catalog_symbols: []
    meaning: Transition t creates a new acceptance event for its idempotency key.
    semantic_anchors:
    - claim:L21_accepted_key_gate_rejects_new_acceptance
    - claim:C14_all_acceptance_paths_honor_idempotency_identity
  pending_edit:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_pending_edits
    meaning: Logical edit identity represented by overlay token o remains active in client_pending_edits in client state s.
  retained_overlay:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_speculative_overlays
    meaning: Logical edit/overlay token o remains in retained client_speculative_overlays in client state s.
  terminalized_speculative_edit:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_terminalized_speculative_lifecycles
    meaning: The normal speculative lifecycle represented by o is terminalized in client state s.
  unresolved_eligible_retained_edit:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_speculative_overlays
    meaning: In state s, o represents an unresolved acceptance-eligible logical edit within the normal retry/reconnect horizon that remains retained.
    semantic_anchors:
    - contract:pending_speculative_lifecycle_coverage
  acceptance_based_pending_retirement:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_pending_edits
    meaning: State s reflects retirement of pending edit o with authoritative accepted/reconciled semantics.
    semantic_anchors:
    - contract:pending_retirement_acceptance_binding
  pending_retirement_has_matching_acceptance_source:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - canonical_accepted_change
    - accepted_idempotency_evidence
    - document_id
    - client_change_id
    meaning: The acceptance-based retirement of pending edit o in state s is sourced from canonical acceptance or equivalent authoritative accepted evidence for the exact same full identity.
    semantic_anchors:
    - contract:pending_retirement_acceptance_binding
  speculative_identity_provenance_ok:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - logical_client_edit
    - document_id
    - client_change_id
    - client_speculative_overlays
    - client_visible_speculative_overlays
    meaning: Retained/exposed representation o in state s preserves the same logical edit's complete creation identity.
    semantic_anchors:
    - contract:speculative_overlay_identity_provenance
  speculative_operation_provenance_ok:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - logical_client_edit
    - logical_edit_operation
    - client_speculative_overlays
    - client_visible_speculative_overlays
    meaning: Retained/exposed representation o in state s remains semantically derived from the same logical edit operation rather than another edit's operation.
    semantic_anchors:
    - contract:speculative_overlay_operation_provenance
  single_effective_speculative_contribution:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_visible_speculative_overlays
    meaning: The logical identity represented by o contributes at most one effective speculative operation to the rendered state s.
    semantic_anchors:
    - contract:visible_speculative_effect_uniqueness
  visible_overlay_matches_visible_document:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_document_id
    - client_visible_speculative_overlays
    meaning: Exposed overlay o belongs to the same document represented by user-visible client state s.
    semantic_anchors:
    - contract:visible_speculative_overlay_document_binding
  accepted_reconciliation_published:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Client state s is exactly the user-visible state atomically exposed by a normal foreground reconnect/reconciliation publication through response head H after the authoritative reconciliation result classified exact logical edit identity e as ACCEPTED at some canonical revision r with r <= H; predicates over s therefore hold at that publication boundary, not only after a later cleanup transition.
    semantic_anchors:
    - source:reconnect_revision_boundary
    - contract:accepted_terminal_speculative_retirement
  pending_identity_active:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - client_pending_edits
    meaning: Exact logical edit identity e remains active in client_pending_edits in client state s.
  retained_speculative_identity_active:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - client_speculative_overlays
    meaning: Client state s retains a normal-lifecycle speculative representation for exact logical edit identity e.
  visible_speculative_identity_active:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - client_visible_speculative_overlays
    meaning: Client state s exposes a normal-lifecycle speculative representation for exact logical edit identity e.
  terminalized_speculative_identity:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - client_terminalized_speculative_lifecycles
    meaning: Exact logical edit identity e is classified as terminalized normal speculative lifecycle in client state s.
  overlay_compatible_with_visible_canonical_base:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols: []
    meaning: Composing exposed speculative representation o over the canonical base visible in state s still realizes the original logical edit operation represented by o.
    semantic_anchors:
    - source:reconnect_revision_boundary
  definitive_rejection_observed:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - externally_terminal_result
    meaning: The normally participating client has observed an authoritative externally terminal definitive REJECTED result for exact logical edit identity e before or atomically with visible state s.
    semantic_anchors:
    - contract:rejected_terminal_speculative_retirement
    - source:reconnect_revision_boundary
  same_session_later_visible_continuous_same_document:
    args:
    - ClientState
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Both states are ordinary user-visible states in the same normal client/session; the second is later than the first, and the session continuously represents the same document from the first state through the second state.
    semantic_anchors:
    - source:reconnect_revision_boundary
  same_session_later_visible_same_document:
    args:
    - ClientState
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Both states are ordinary user-visible states in the same normal client/session; the second is later than the first and both represent the same document.
    semantic_anchors:
    - contract:visible_canonical_frontier_non_regression
    - source:reconnect_revision_boundary
  visible_frontier_regresses:
    args:
    - ClientState
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: The later state's last_applied_revision for the same document is strictly lower than the earlier state's visible frontier.
    semantic_anchors:
    - contract:visible_canonical_frontier_non_regression
    - source:reconnect_revision_boundary
  pending_representation_bound_to_creation_identity:
    args:
    - ClientState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - logical_client_edit
    - document_id
    - client_change_id
    meaning: The pending representation active for exact logical edit identity e in client state s remains bound to that logical edit creation identity, preserving both document_id and client_change_id rather than being relabeled or cross-bound.
    semantic_anchors:
    - contract:pending_edit_identity_provenance
  non_acceptance_retirement_transition:
    args:
    - ProtocolTransition
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - non_acceptance_terminal_disposition
    meaning: Protocol transition t uses a non_acceptance_terminal_disposition to terminally retire the normal speculative lifecycle of exact logical edit identity e.
    semantic_anchors:
    - contract:non_acceptance_terminal_disposition_binding
  non_acceptance_disposition_preserves_edit_identity:
    args:
    - ProtocolTransition
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - logical_client_edit
    - document_id
    - client_change_id
    meaning: The non-acceptance terminal disposition consumed by transition t was produced for the same logical edit e and preserves e full document_id plus client_change_id identity through routing and the destructive retirement sink.
    semantic_anchors:
    - contract:non_acceptance_terminal_disposition_binding
  success_ack_for_acceptance:
    args:
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: A success ACK was exposed to the client for the logical edit whose canonical acceptance is a.
    semantic_anchors:
    - contract:acked_edit_failover_survival
  completed_recovery_covers_acceptance:
    args:
    - RecoveryAttempt
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: Recovery attempt r completed, resumed service from authoritative frontier H, and the canonical revision of acceptance a is at or before H.
    semantic_anchors:
    - contract:acked_edit_failover_survival
  recovery_matches_replay_including_acceptance:
    args:
    - RecoveryAttempt
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: The recovered logical document state equals canonical replay through the recovery frontier, so canonical acceptance a is not omitted relative to that replay even if later accepted edits alter its visible effect.
    semantic_anchors:
    - contract:acked_edit_failover_survival
  optimized_authoritative_representation_at_frontier:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: Authoritative state representation s is an optimized authoritative lifecycle representation (snapshot/checkpoint/cleanup/compaction result) at frontier H.
    semantic_anchors:
    - contract:logical_state_equivalence_at_frontier
  completed_owner_recovery_at_frontier:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: Authoritative state representation s is the result of a completed owner recovery at frontier H.
    semantic_anchors:
    - contract:logical_state_equivalence_at_frontier
  logical_state_matches_canonical_replay:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: The logical document state denoted by authoritative representation s equals deterministic canonical replay of accepted revisions through frontier H.
    semantic_anchors:
    - contract:logical_state_equivalence_at_frontier
  authoritative_latest_revision_equals_frontier:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: The authoritative representation s preserves latest_revision exactly equal to frontier H.
    semantic_anchors:
    - contract:logical_state_equivalence_at_frontier
  representation_resumes_owner_service:
    args:
    - AuthoritativeState
    returns: Bool
    catalog_symbols: []
    meaning: The authoritative representation s is used to resume owner service.
    semantic_anchors:
    - contract:logical_state_equivalence_at_frontier
  acceptance_state_reconstructed_at_frontier:
    args:
    - AuthoritativeState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: The representation s reconstructs the acceptance-relevant state required to continue accepting from frontier H without changing canonical semantics.
    semantic_anchors:
    - contract:logical_state_equivalence_at_frontier
  ot_engine_invocation:
    args:
    - OTInvocation
    returns: Bool
    catalog_symbols:
    - raw_edit
    meaning: Invocation i supplies one raw_edit together with a canonical committed prefix and submitted client base revision to the OT engine.
    semantic_anchors:
    - assumption:A2_ot_engine_is_correct
  ot_success_satisfies_algorithmic_contract:
    args:
    - OTInvocation
    returns: Bool
    catalog_symbols: []
    meaning: The OT engine returns a canonical transformed change for invocation i and that success satisfies the declared algorithmic convergence contract for the invocation raw edit, submitted base, and canonical prefix.
    semantic_anchors:
    - assumption:A2_ot_engine_is_correct
  ot_rejects_invalid_or_rebase_required:
    args:
    - OTInvocation
    returns: Bool
    catalog_symbols: []
    meaning: The OT engine rejects invocation i as invalid or rebase-required rather than returning a successful transformed change.
    semantic_anchors:
    - assumption:A2_ot_engine_is_correct
  logical_edit_change_id:
    args:
    - LogicalEdit
    returns: ClientChangeId
    catalog_symbols:
    - client_change_id
    meaning: The client_change_id assigned to logical edit e.
  retry_request_of_logical_edit:
    args:
    - Request
    - LogicalEdit
    returns: Bool
    catalog_symbols: []
    meaning: Request r is a retry/retransmission of the same logical client edit e rather than a new logical edit.
    semantic_anchors:
    - assumption:A3_client_change_id_identifies_logical_edit
  same_document_logical_edits:
    args:
    - LogicalEdit
    - LogicalEdit
    returns: Bool
    catalog_symbols: []
    meaning: Logical edits e1 and e2 belong to the same document namespace in which client_change_id uniqueness is required.
    semantic_anchors:
    - assumption:A3_client_change_id_identifies_logical_edit
  distinct_logical_edits_use_distinct_change_ids:
    args:
    - LogicalEdit
    - LogicalEdit
    returns: Bool
    catalog_symbols:
    - client_change_ids
    meaning: The two distinct logical edits carry different client_change_id values.
    semantic_anchors:
    - assumption:A3_client_change_id_identifies_logical_edit
  apply_accepted_sequence:
    args:
    - DocumentState
    - AcceptedChangeSequence
    returns: DocumentState
    catalog_symbols: []
    meaning: The deterministic document state obtained by applying one canonical accepted-change sequence to one starting document state.
    semantic_anchors:
    - assumption:A5_apply_accepted_change_is_deterministic
  normal_retry_or_reconnect_submission:
    args:
    - AuthoritativeState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols:
    - document_id
    - client_change_id
    meaning: In protocol state s, a normally participating client submits exact logical edit identity e through a normal retry or authoritative reconnect-reconciliation path.
    semantic_anchors:
    - assumption:A6_normal_retry_reconnect_identity_is_eligible_for_30_days
  identity_within_30_day_normal_horizon:
    args:
    - AuthoritativeState
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Exact logical edit identity e has pending/retry age no more than 30 days in state s and remains eligible for the normal retry/reconnect protocol.
