    - canonical_accepted_change
    - ot_success_result
    meaning: Canonical acceptance a is bound to the exact successful OT result r that produced its accepted payload; no synthesized or substituted result qualifies.
    semantic_anchors:
    - contract:ot_success_acceptance_binding
  ot_success_matches_submitted_input:
    args:
    - CanonicalAcceptance
    - OTSuccessResult
    returns: Bool
    catalog_symbols:
    - raw_edit
    - base_revision
    meaning: OT success result r bound to acceptance a was produced for the corresponding submitted raw_edit and base_revision.
    semantic_anchors:
    - contract:ot_success_acceptance_binding
  state_dependent_rejected_terminal_result:
    args:
    - TerminalResultRecord
    returns: Bool
    catalog_symbols:
    - terminal_result
    meaning: Rejected terminal result t has a definitive rejection reason whose truth depends on document/history state.
    semantic_anchors:
    - contract:state_dependent_rejection_context_binding
  rejection_decision_has_authoritative_context:
    args:
    - RejectionDecision
    returns: Bool
    catalog_symbols:
    - authoritative_rejection_context
    meaning: Rejection decision d is bound to authoritative same-document rejection context rather than unvalidated stale owner-local state.
    semantic_anchors:
    - contract:state_dependent_rejection_context_binding
  rejection_context_sufficient_at_terminalization:
    args:
    - TerminalResultRecord
    - RejectionDecision
    returns: Bool
    catalog_symbols: []
    meaning: The authoritative context/evidence for decision d remains sufficient when terminal result t linearizes, either because it is current or because a reason-specific guard, monotonicity argument, or revalidation preserves the rejection truth.
    semantic_anchors:
    - contract:state_dependent_rejection_context_binding
    - source:accepted_change_log
    - source:owner_failover
  externally_terminal_result_record:
    args:
    - ExternalTerminalResult
    returns: Bool
    catalog_symbols:
    - externally_terminal_result
    meaning: x is a definitive externally_terminal_result exposed to a client.
    semantic_anchors:
    - contract:terminal_response_outcome_binding
  external_terminal_result_within_retry_horizon:
    args:
    - ExternalTerminalResult
    returns: Bool
    catalog_symbols: []
    meaning: Externally terminal result x belongs to the 30-day normal retry eligibility horizon for its logical edit, whether x is returned by the initial normal submission or by an in-horizon retry/reprocessing attempt; a post-expiry re-submission is outside this predicate and outside terminal_response_outcome_binding.
    semantic_anchors:
    - contract:terminal_response_outcome_binding
  external_terminal_result_key:
    args:
    - ExternalTerminalResult
    returns: IdempotencyKey
    catalog_symbols:
    - idempotency_key
    meaning: The full idempotency_key associated with externally terminal result x.
  external_result_reproduces_authoritative_outcome:
    args:
    - ExternalTerminalResult
    - IdempotencyKey
    returns: Bool
    catalog_symbols:
    - idempotency_terminal_outcomes
    meaning: External terminal result x exactly reproduces the already-linearized authoritative terminal outcome for the same full key k; attempt-local transient computations cannot substitute a conflicting result.
    semantic_anchors:
    - contract:terminal_response_outcome_binding
  normal_retry_submitted_request:
    args:
    - Request
    returns: Bool
    catalog_symbols:
    - submitted_request
    meaning: Request r is a normal submitted_request representing one logical edit within the 30-day normal retry eligibility horizon.
    semantic_anchors:
    - claim:G5_retry_resolves_idempotently
  retry_request_identity_payload_frontier_coherent:
    args:
    - Request
    returns: Bool
    catalog_symbols:
    - document_id
    - client_change_id
    - raw_edit
    - base_revision
    meaning: Normal retry request r preserves the same full request identity, raw_edit semantics, and canonical authoring frontier for its logical operation; those coordinates are not cross-bound from another operation.
    semantic_anchors:
    - claim:G5_retry_resolves_idempotently
  request_represents_logical_edit:
    args:
    - Request
    - LogicalEdit
    returns: Bool
    catalog_symbols:
    - submitted_request
    - logical_client_edit
    - document_id
    - client_change_id
    - raw_edit
    - base_revision
    meaning: Submitted request r represents logical client edit e rather than a different logical operation, and r's submitted document_id, client_change_id, server-visible raw_edit, and base_revision=F remain bound to that same logical operation and its canonical authoring state D@F.
    semantic_anchors:
    - claim:G6_accepted_change_preserves_ot_semantics
  accepted_ot_context_is_preceding_canonical_prefix:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols: []
    meaning: The successful OT result committed as canonical acceptance a was computed for request r against the canonical committed prefix immediately preceding a accepted revision.
    semantic_anchors:
    - claim:G6_accepted_change_preserves_ot_semantics
  accepted_ot_success_satisfies_algorithmic_contract:
    args:
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: The successful OT result bound to canonical acceptance a satisfies the OT engine algorithmic convergence contract for the submitted raw edit, base revision, and preceding canonical prefix.
    semantic_anchors:
    - claim:G6_accepted_change_preserves_ot_semantics
    - assumption:A2_ot_engine_is_correct
  foreground_catchup_attempt:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols:
    - last_applied_revision
    meaning: c is one normal foreground visible-document-bound reconnect/catch-up attempt for the current document starting from the client's last_applied_revision L, the highest contiguous canonical revision already applied by that client.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_eligible_for_completion_or_publication:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Catch-up attempt c is eligible for completion or foreground publication under the reconnect/catch-up protocol.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_head_captured_from_authoritative_latest:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols:
    - document_latest_revision
    meaning: Catch-up attempt c binds one response-specific head H captured from the same document authoritative document_latest_revision at one authoritative-store read/linearization point.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_head_preserved_to_publication:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols: []
    meaning: The response-specific head captured for c is preserved unchanged through response selection, reconciliation, completion, and any publication.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_visible_document_binding_uninterrupted:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols: []
    meaning: The visible-document binding for catch-up attempt c remains uninterrupted from start through publication eligibility.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_foreground_publication_eligible:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Catch-up attempt c remains eligible to publish to the foreground user-visible canonical state under the current visible-document binding; this predicate is specifically publication eligibility and does not assert completion eligibility.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_attempt_publishes:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Catch-up attempt c completes and publishes its reconciled result to the user-visible canonical state.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_published_state_is_exact_replay_through_head:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols: []
    meaning: If c publishes, the user-visible canonical state equals canonical replay of that same document through c captured response head with no omitted or double-applied accepted revision through H.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_publication_is_atomic_and_non_regressing:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Any user-visible publication effect of catch-up attempt c is one atomic publication transition with no intermediate candidate prefix exposed; additionally, any response of c whose head H is below the already-visible canonical frontier cannot regress or otherwise mutate that visible canonical/frontier state.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_excludes_acceptances_after_captured_head:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols: []
    meaning: Acceptances that occur after c response head was captured are outside c response rather than being partially mixed into that response.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  catchup_binding_break_permanently_blocks_publication:
    args:
    - CatchupAttempt
    returns: Bool
    catalog_symbols: []
    meaning: If the user-visible document switches away before publication, c permanently loses foreground publication eligibility and cannot later publish merely because the user switches back.
    semantic_anchors:
    - claim:G4_reconnect_converges_without_gap_or_duplicate
  normal_client_resync_attempt:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: c is one reconnect/resync attempt for document D by a normally participating client; this predicate does not require the attempt to be foreground or D to be currently visible.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  resync_freezes_new_speculative_edits:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: While resync c is in progress, the client creates or applies no new speculative local edit for document D, regardless of whether that new edit would currently be acceptance-eligible.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  pending_identity_at_resync_start:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Exact logical edit identity e=(D,k) is pending at the start of resync c for that same resync document D; a pending identity for another document does not satisfy this predicate.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  resync_identity_matches_document:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Exact logical edit identity e=(D,k) has the same document coordinate D as the document being reconnected/resynchronized by c.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  resync_identity_within_normal_horizon:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Pending identity e is within the normal 30-day reconnect eligibility horizon for resync c.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  resync_identity_age_exceeds_normal_horizon:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Pending identity e at the start of resync c has a defined pending/retry age greater than the 30-day normal reconnect eligibility horizon.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  resync_request_reconciles_identity_through_head:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: The catch-up request for c includes e for authoritative same-full-identity reconciliation through the response head.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  response_contains_same_identity_acceptance:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Canonical acceptance for the exact same full logical identity e is included through c response head.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  resync_publication_excludes_canonical_speculative_duplicate:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: Once canonical acceptance for e is included through c's response head H_D, any user-visible publication through H_D removes or suppresses the matching speculative overlay before or atomically with that publication, so no published user-visible state exposes both representations.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  resync_intermediate_candidate_excludes_canonical_speculative_duplicate:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: No intermediate resync candidate for c may expose a candidate state whose canonical prefix already contains acceptance for exact identity e together with a speculative overlay for e; purely internal unexposed candidate representation is not constrained by this predicate, and the rule is independent of whether c's response head itself is classified as containing that acceptance.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  stale_resync_cannot_restore_retired_overlay:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: A stale response for c cannot restore a speculative overlay for e that a newer published reconciliation already removed.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  expired_identity_uses_non_normal_resolution_path:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: If e is outside the normal reconnect horizon, c does not submit it through normal authoritative reconciliation and the client discards it or uses an explicit expired/conflict/manual-resolution path.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  identity_unresolved_after_reconciled_publication:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: After reconciled publication or conflict entry for c, exact identity e for the same resync document D remains protocol-eligible and unresolved.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
  unresolved_identity_blocks_normal_editing:
    args:
    - CatchupResponse
    - LogicalEditIdentity
    returns: Bool
    catalog_symbols: []
    meaning: While e remains unresolved after c publication/conflict entry, the client stays read-only or in explicit conflict/reconciliation state and creates no new acceptance-eligible speculative edit.
    semantic_anchors:
    - claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit
assumptions:
  A2_ot_engine_is_correct:
    capability: relational
    formula:
      forall:
        vars:
          i: OTInvocation
        body:
          implies:
          - call:
              fn: ot_engine_invocation
              args:
              - var: i
          - and:
            - or:
              - call:
                  fn: ot_success_satisfies_algorithmic_contract
                  args:
                  - var: i
              - call:
                  fn: ot_rejects_invalid_or_rebase_required
                  args:
                  - var: i
            - not:
                and:
                - call:
                    fn: ot_success_satisfies_algorithmic_contract
                    args:
                    - var: i
                - call:
                    fn: ot_rejects_invalid_or_rebase_required
                    args:
                    - var: i
  A3_client_change_id_identifies_logical_edit:
    capability: relational
    formula:
      and:
      - forall:
          vars:
            r: Request
            e: LogicalEdit
          body:
            implies:
            - call:
                fn: retry_request_of_logical_edit
                args:
                - var: r
                - var: e
            - eq:
              - call:
                  fn: request_change_id
                  args:
                  - var: r
              - call:
                  fn: logical_edit_change_id
                  args:
                  - var: e
      - forall:
          vars:
            e1: LogicalEdit
            e2: LogicalEdit
          body:
            implies:
            - and:
              - neq:
                - var: e1
                - var: e2
              - call:
                  fn: same_document_logical_edits
                  args:
                  - var: e1
                  - var: e2
            - call:
                fn: distinct_logical_edits_use_distinct_change_ids
                args:
                - var: e1
                - var: e2
  A5_apply_accepted_change_is_deterministic:
    capability: relational
    formula:
      forall:
        vars:
          s: DocumentState
          q: AcceptedChangeSequence
        body:
          forall:
            vars:
              r1: DocumentState
              r2: DocumentState
            body:
              implies:
              - and:
                - call:
                    fn: accepted_sequence_application_result
                    args:
                    - var: s
                    - var: q
                    - var: r1
                - call:
                    fn: accepted_sequence_application_result
                    args:
                    - var: s
                    - var: q
                    - var: r2
              - eq:
                - var: r1
                - var: r2
  A6_normal_retry_reconnect_identity_is_eligible_for_30_days:
    capability: relational
    formula:
      forall:
        vars:
          s: AuthoritativeState
          e: LogicalEditIdentity
        body:
          implies:
          - call:
              fn: normal_retry_reconnect_identity_in_scope
              args:
              - var: s
              - var: e
          - and:
            - implies:
              - call:
                  fn: normal_retry_or_reconnect_submission
                  args:
                  - var: s
                  - var: e
              - call:
                  fn: identity_pending_retry_age_at_most_30_days
                  args:
                  - var: s
                  - var: e
            - implies:
              - call:
                  fn: identity_pending_retry_age_exceeds_30_days
                  args:
                  - var: s
                  - var: e
              - and:
                - not:
                    call:
                      fn: normal_retry_or_reconnect_submission
                      args:
                      - var: s
                      - var: e
                - call:
                    fn: identity_handled_outside_normal_retry_protocol
                    args:
                    - var: s
                    - var: e
claims:
  L20_acceptance_paths_are_authoritatively_mediated:
    contracts: []
    formula:
      forall:
        vars:
          t: ProtocolTransition
        body:
          implies:
          - call:
              fn: acceptance_capable_transition
              args:
              - var: t
          - call:
              fn: transition_is_authoritatively_gate_mediated
              args:
              - var: t
  L21_accepted_key_gate_rejects_new_acceptance:
    contracts: []
    formula:
      forall:
        vars:
          t: ProtocolTransition
        body:
          implies:
          - and:
            - call:
                fn: transition_is_authoritatively_gate_mediated
                args:
                - var: t
            - call:
                fn: gate_observes_key_already_accepted
                args:
                - var: t
          - not:
              call:
                fn: transition_creates_acceptance
                args:
                - var: t
  C14_all_acceptance_paths_honor_idempotency_identity:
    contracts: []
    formula:
      forall:
        vars:
          t: ProtocolTransition
        body:
          implies:
          - and:
            - call:
                fn: acceptance_capable_transition
                args:
                - var: t
            - call:
                fn: gate_observes_key_already_accepted
                args:
                - var: t
          - not:
              call:
                fn: transition_creates_acceptance
                args:
                - var: t
  L108_acceptance_preserves_request_identity:
    contracts:
    - acceptance_request_identity_binding
    formula:
      forall:
        vars:
          a: CanonicalAcceptance
          r: Request
        body:
          implies:
          - call:
              fn: acceptance_produced_from_request
              args:
              - var: a
              - var: r
          - and:
            - eq:
              - call:
                  fn: acceptance_document
                  args:
                  - var: a
              - call:
                  fn: request_document
                  args:
                  - var: r
            - eq:
              - call:
                  fn: acceptance_change_id
                  args:
                  - var: a
              - call:
                  fn: request_change_id
                  args:
                  - var: r
            - call:
                fn: acceptance_idempotency_identity_matches_request
                args:
                - var: a
                - var: r
            - call:
                fn: acceptance_identity_preserved_end_to_end
                args:
                - var: a
                - var: r
            - forall:
                vars:
                  e: DurableIdempotencyEvidence
                body:
                  implies:
                  - call:
                      fn: durable_idempotency_evidence_for_acceptance
                      args:
                      - var: e
                      - var: a
                  - call:
                      fn: durable_evidence_identity_matches_request
                      args:
                      - var: e
                      - var: r
  C12_live_delivery_contains_only_accepted_changes:
    contracts:
    - live_delivery_acceptance_binding
    formula_from_contracts: true
  L116_live_delivery_is_bound_to_committed_acceptance:
    contracts:
    - live_delivery_acceptance_binding
    formula_from_contracts: true
  L92_captured_recovery_head_equals_authoritative_frontier:
    contracts:
    - recovery_head_binding
    formula_from_contracts: true
  G0_acked_edit_survives_failover:
    contracts:
    - acked_edit_failover_survival
    capability: relational
    formula_from_contracts: true
  G10_user_visible_client_state_matches_document:
    contracts:
    - client_canonical_frontier_coherence
    - visible_canonical_frontier_non_regression
    capability: relational
    formula_from_contracts: true
  G11_visible_speculative_overlays_match_document:
    contracts:
    - visible_speculative_overlay_document_binding
    - speculative_overlay_identity_provenance
    - speculative_overlay_operation_provenance
    - visible_speculative_effect_uniqueness
    - visible_speculative_retention_coherence
    capability: relational
    formula_from_contracts: true
  G12_client_pending_state_tracks_unresolved_edits:
    contracts:
    - pending_edit_identity_provenance
    - pending_speculative_lifecycle_coverage
    - pending_retirement_acceptance_binding
    - accepted_terminal_speculative_retirement
    - non_acceptance_terminal_disposition_binding
    - terminal_speculative_lifecycle_closure
    - rejected_terminal_speculative_retirement
    capability: relational
    formula_from_contracts: true
    residual_formula:
      and:
      - forall:
          vars:
            s: ClientState
            e: LogicalEditIdentity
          body:
            implies:
            - call:
                fn: authoritative_accepted_reconciliation_published
                args:
                - var: s
                - var: e
            - and:
              - not:
                  call:
                    fn: pending_identity_active
                    args:
                    - var: s
                    - var: e
              - not:
                  call:
                    fn: retained_speculative_identity_active
                    args:
                    - var: s
                    - var: e
              - not:
                  call:
                    fn: visible_speculative_identity_active
                    args:
                    - var: s
                    - var: e
              - call:
                  fn: terminalized_speculative_identity
                  args:
                  - var: s
                  - var: e
      - forall:
          vars:
            t: ProtocolTransition
            e: LogicalEditIdentity
          body:
            implies:
            - and:
              - call:
                  fn: reachable_client_protocol_transition
                  args:
                  - var: t
              - call:
                  fn: bookkeeping_only_speculative_removal_transition
                  args:
                  - var: t
                  - var: e
            - call:
                fn: bookkeeping_removal_does_not_resolve_lifecycle
                args:
                - var: t
                - var: e
      - forall:
          vars:
            t: ProtocolTransition
            e: LogicalEditIdentity
          body:
            implies:
            - and:
              - call:
                  fn: reachable_client_protocol_transition
                  args:
                  - var: t
              - call:
                  fn: non_acceptance_retirement_transition
                  args:
                  - var: t
                  - var: e
            - call:
                fn: non_acceptance_retirement_establishes_terminalized_lifecycle
                args:
                - var: t
                - var: e
      - forall:
          vars:
            s: ClientState
            old: LogicalEditIdentity
            new: LogicalEdit
          body:
            implies:
            - and:
              - call:
                  fn: reachable_client_state
                  args:
                  - var: s
              - call:
                  fn: new_user_edit_after_terminalized_lifecycle
                  args:
                  - var: s
                  - var: old
                  - var: new
            - neq:
              - call:
                  fn: logical_edit_change_id
                  args:
                  - var: new
              - call:
                  fn: logical_identity_change_id
                  args:
                  - var: old
  G1_retry_is_logically_exactly_once:
    contracts: []
    capability: relational
    formula:
      forall:
        vars:
          t: ProtocolTransition
          e: LogicalEdit
        body:
          implies:
          - call:
              fn: ack_loss_reconnect_retry_acceptance_transition
              args:
