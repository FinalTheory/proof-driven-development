    - claim:L210_new_owner_recovery_boundary_is_attempt_scoped
    - claim:C9_recovery_reconstructs_committed_state
    - claim:L79_new_owner_accepts_only_after_reconstruction
  recovery_attempt_reaches_authoritative_publication:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: 'Recovery attempt r reaches authoritative or acceptance-eligible publication: the point at which the owner generation r establishes becomes authoritative or acceptance-eligible.'
