    - claim:L97_client_adopts_snapshot_before_tail
  client_state_ignores_presented_revision:
    args:
    - ClientState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'In client state s, the client ignores presented canonical revision r as a duplicate at or below its frontier: r is not applied, and the presentation of r does not change the client''s applied history or frontier.'
    semantic_anchors:
    - claim:L19_client_applies_only_contiguous_revisions
  client_state_buffers_or_recovers_gap:
    args:
    - ClientState
    - Revision
    returns: Bool
    catalog_symbols:
    - buffer_or_gap_recovery
    meaning: 'In client state s, presented canonical revision r lies above the next contiguous revision the client can apply, so the client performs buffer_or_gap_recovery for r: it buffers r or triggers recovery for the gap, rather than applying r out of order.'
