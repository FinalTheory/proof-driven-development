    semantic_anchors:
    - claim:L79_new_owner_accepts_only_after_reconstruction
    - claim:C9_recovery_reconstructs_committed_state
  recovery_ot_metadata_rebuilt:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: 'Recovery attempt r''s required OT metadata has been rebuilt: the document-history-dependent OT metadata the recovered owner needs for server-side OT transformation and canonical acceptance has been reconstructed for r.'
    semantic_anchors:
    - claim:L79_new_owner_accepts_only_after_reconstruction
    - claim:C9_recovery_reconstructs_committed_state
  recovery_local_state_initialized_through_head:
