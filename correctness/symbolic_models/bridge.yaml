    semantic_anchors:
    - claim:L179_speculative_overlay_identity_provenance_is_preserved
  recovery_selected_checkpoint_frontier_is:
    args:
    - RecoveryAttempt
    - Revision
    returns: Bool
    catalog_symbols: []
