    catalog_symbols:
    - last_applied_revision
    meaning: 'Revision l is the user-visible last_applied_revision of the client that requested response r, at the start of r''s catch-up attempt: the given client frontier L from which r''s missing range is computed. This is the same quantity that catchup_response_delta_base_frontier_is names for r''s delta range, stated on the last_applied_revision catalog surface.'
    semantic_anchors:
    - claim:C10_catchup_represents_exact_missing_suffix
    - claim:L121_delta_resync_candidate_starts_from_canonical_client_base
  catchup_response_delta_contains_change:
    args:
    - CatchupResponse
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: Canonical accepted change a is one of the changes returned in the delta portion of catch-up response r. This relation records delta membership only; it does not assert that a's revision lies in any particular range or how many times a appears.
    semantic_anchors:
    - claim:L12_delta_catchup_reads_canonical_revision_range
    - claim:C10_catchup_represents_exact_missing_suffix
    - claim:L177_catchup_canonical_sources_preserve_document_provenance
  revision_in_delta_range:
    args:
    - Revision
    - Revision
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Revision v lies in the delta range (l, h]: l < v and v <= h, so v is one of the revisions l+1..h. This predicate is the range relation only.'
    semantic_anchors:
    - claim:L12_delta_catchup_reads_canonical_revision_range
    - claim:C10_catchup_represents_exact_missing_suffix
  catchup_response_delta_exactly_once_in_order:
    args:
    - CatchupResponse
    - Revision
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: Within the delta returned by response r for the range (l, h], no canonical accepted change appears more than once and the returned changes are arranged in increasing revision order. This predicate asserts the delta's multiplicity and ordering only; which changes belong to the range is asserted separately.
    semantic_anchors:
    - claim:L12_delta_catchup_reads_canonical_revision_range
    - claim:C10_catchup_represents_exact_missing_suffix
  catchup_response_delta_free_of_speculative_data:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: 'No speculative data appears anywhere in response r''s returned delta portion: every returned payload item is canonical accepted data, not an unaccepted, uncommitted, or locally speculative change.'
    semantic_anchors:
    - claim:L12_delta_catchup_reads_canonical_revision_range
    - claim:C10_catchup_represents_exact_missing_suffix
  checkpoint_state_equals_canonical_replay_through_frontier:
    args:
    - Revision
    returns: Bool
    catalog_symbols:
    - accepted_change_log
    meaning: 'The document state denoted by a snapshot checkpoint at frontier r equals deterministic canonical replay of all and only the canonical accepted changes in accepted_change_log with revisions 1..r. This predicate is conditional over checkpoints: it constrains every snapshot checkpoint whose frontier is r and is vacuous at a revision with no checkpoint.'
