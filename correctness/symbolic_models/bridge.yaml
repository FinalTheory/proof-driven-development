    - claim:L181_non_append_lifecycle_preserves_authoritative_frontier
    - claim:C16_non_append_lifecycle_preserves_logical_revision_prefix
    - claim:L172_snapshot_compaction_preserves_concurrent_append_suffix
  authoritative_history_lifecycle_source_state:
    args:
    - ProtocolTransition
    - AuthoritativeState
    returns: Bool
    catalog_symbols: []
    meaning: 'Authoritative state s is the pre-state of authoritative history lifecycle transition t: the authoritative representation immediately before t executes.'
    semantic_anchors:
    - claim:L181_non_append_lifecycle_preserves_authoritative_frontier
    - claim:C16_non_append_lifecycle_preserves_logical_revision_prefix
  authoritative_history_lifecycle_result_state:
    args:
    - ProtocolTransition
    - AuthoritativeState
    returns: Bool
    catalog_symbols: []
    meaning: 'Authoritative state s is the resulting post-state of authoritative history lifecycle transition t: the authoritative representation t installs or publishes on completion.'
    semantic_anchors:
    - claim:L180_non_append_lifecycle_preserves_logical_state_at_frontier
    - claim:L181_non_append_lifecycle_preserves_authoritative_frontier
    - claim:C16_non_append_lifecycle_preserves_logical_revision_prefix
    - claim:L172_snapshot_compaction_preserves_concurrent_append_suffix
  authoritative_history_lifecycle_overlaps_committed_appends:
    args:
    - ProtocolTransition
    - Document
    returns: Bool
    catalog_symbols: []
    meaning: 'Authoritative history lifecycle procedure t targeting document d overlaps one or more canonical accepted-change appends for d: at least one canonical append for d commits while t is in progress, before t completes.'
    semantic_anchors:
    - claim:L172_snapshot_compaction_preserves_concurrent_append_suffix
  lifecycle_completion_head_after_overlapping_appends:
    args:
    - ProtocolTransition
    - Revision
    returns: Bool
    catalog_symbols:
    - document_latest_revision
