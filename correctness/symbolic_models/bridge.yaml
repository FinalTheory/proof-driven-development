    - claim:L79_new_owner_accepts_only_after_reconstruction
    - claim:C9_recovery_reconstructs_committed_state
  recovery_checkpoint_installed:
    args:
    - RecoveryAttempt
    returns: Bool
    catalog_symbols: []
    meaning: 'Recovery attempt r''s selected checkpoint is installed as r''s replay base: the checkpoint''s content and frontier are the installed base from which r''s replay proceeds.'
    semantic_anchors:
    - claim:L79_new_owner_accepts_only_after_reconstruction
    - claim:C9_recovery_reconstructs_committed_state
  recovery_tail_replayed_through_captured_head:
    args:
    - RecoveryAttempt
