  client_state_is_checkpoint_installation:
    args:
    - ClientState
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Client state s is the state produced by installing the catch-up-selected checkpoint (content, S) with replacement semantics: s exposes exactly that checkpoint''s content as the client''s canonical document state, the installation is one atomic installation step (no returned or interleaved tail revision is applied inside it), and S is the checkpoint''s frontier. A torn or interrupted exposure of checkpoint content does not satisfy this predicate.'
