version: 1
sorts:
- ClientState
- Document
- Revision
- Overlay
- LogicalEditIdentity
- Request
- CatchupAttempt
- CatchupResponse
- AuthoritativeState
- CanonicalAcceptance
- AcceptedEvidence
- IdempotencyKey
- ClientChangeId
- LiveDelivery
- RecoveryAttempt
- DurableIdempotencyEvidence
- ProtocolTransition
- OTInvocation
- LogicalEdit
- DocumentState
- AcceptedChangeSequence
- TerminalResultRecord
- RejectionDecision
- OTSuccessResult
- ExternalTerminalResult
- SuccessAck
functions:
  user_visible_client_state:
    args:
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Client state s is a published user-visible state; private or intermediate resynchronization candidates that have not been published are outside this predicate. This predicate does not exclude a user-visible historical-version or rollback mode.
    semantic_anchors:
    - contract:client_canonical_frontier_coherence
    - claim:G10_user_visible_client_state_matches_document
    - contract:request_authoring_frontier_binding
  user_visible_canonical_state:
    args:
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Client state s is currently user-visible at the canonical client observation boundary and represents one document through its visible canonical tuple, regardless of whether it became visible by explicit publication, initialization, restoration, view activation, or an in-place visible tuple replacement. User-visible states that represent no document, and private or intermediate resynchronization candidates that have not become user-visible, are outside this predicate. This predicate does not exclude a user-visible historical-version or rollback mode.
    semantic_anchors:
    - contract:client_canonical_frontier_coherence
    - claim:G10_user_visible_client_state_matches_document
    - claim:L128_client_canonical_frontier_is_established_on_publication
    - claim:L129_client_canonical_frontier_is_preserved_by_visible_transitions
    - claim:L130_reconnect_start_is_bound_to_visible_client_tuple
    - claim:L136_reconnect_initiation_visible_frontier_is_canonical
    - claim:C38_client_frontier_matches_canonical_base
  reachable_authoritative_state:
    args:
    - AuthoritativeState
    returns: Bool
    catalog_symbols: []
    meaning: Authoritative state s is reachable under the canonical server protocol and failure model; impossible or purely hypothetical authoritative states are outside this predicate.
    semantic_anchors:
    - contract:idempotency_terminal_outcome_coherence
    - claim:G5_retry_resolves_idempotently
    - claim:L163_accepted_terminal_outcome_commits_with_canonical_acceptance
    - claim:L14_accepted_idempotency_identity_survives_lifecycle
    - claim:L162_terminal_state_transition_preserves_single_outcome
    - claim:C40_terminal_outcome_is_single_valued_per_idempotency_key
  reachable_client_state:
    args:
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Client state s is reachable under the normal client protocol, including states reached through restore, view switching, bookkeeping, reconnect/resync, publication, and explicit terminal disposition; impossible client states are outside this predicate.
    semantic_anchors:
    - contract:pending_edit_identity_provenance
    - contract:pending_speculative_lifecycle_coverage
    - contract:pending_retirement_acceptance_binding
    - contract:accepted_terminal_speculative_retirement
    - contract:terminal_speculative_lifecycle_closure
    - contract:rejected_terminal_speculative_retirement
    - claim:G12_client_pending_state_tracks_unresolved_edits
    - contract:unresolved_pending_blocks_normal_editing
    - claim:L154_pending_edit_identity_provenance_is_preserved
    - claim:L155_unresolved_speculative_edit_has_pending_entry
    - claim:L206_terminal_speculative_lifecycle_is_absorbing
  later_reachable_client_state:
    args:
    - ClientState
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Later state l is reachable after earlier state e by one or more client-protocol transitions for the continuing client lifecycle/history, including restore/reactivation, view switching, bookkeeping, reconnect/resync, or publication transitions.
    semantic_anchors:
    - contract:terminal_speculative_lifecycle_closure
    - claim:G12_client_pending_state_tracks_unresolved_edits
    - claim:L110_client_retires_matching_speculative_overlay_before_canonical_publication
    - claim:L206_terminal_speculative_lifecycle_is_absorbing
  visible_document:
    args:
    - ClientState
    returns: Document
    catalog_symbols:
    - client_document_id
    meaning: The document identity represented by this user-visible canonical client state.
    semantic_anchors:
    - contract:client_canonical_frontier_coherence
    - contract:request_authoring_frontier_binding
  visible_frontier:
    args:
    - ClientState
    returns: Revision
    catalog_symbols:
    - last_applied_revision
    meaning: The last canonical revision applied by this client state.
    semantic_anchors:
    - contract:client_canonical_frontier_coherence
    - contract:request_authoring_frontier_binding
    - claim:L128_client_canonical_frontier_is_established_on_publication
    - claim:L129_client_canonical_frontier_is_preserved_by_visible_transitions
    - claim:L130_reconnect_start_is_bound_to_visible_client_tuple
    - claim:L136_reconnect_initiation_visible_frontier_is_canonical
    - claim:L207_visible_canonical_frontier_never_regresses_per_session_document
    - claim:C36_reconnect_starts_from_canonical_client_frontier
    - claim:C38_client_frontier_matches_canonical_base
    - claim:L19_client_applies_only_contiguous_revisions
    - claim:L97_client_adopts_snapshot_before_tail
  canonical_content_matches:
    args:
    - ClientState
    - Document
    - Revision
    returns: Bool
    catalog_symbols:
    - client_local_document
    meaning: The client state's canonical content is exactly deterministic replay of document D through revision F.
  visible_canonical_speculative_observation_state:
    args:
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Client state s is currently exposed at the user-visible client observation boundary for its visible canonical prefix and speculative overlay set. Private, intermediate, or not-yet-published client states are outside this predicate; this classification adds no progress or freshness requirement.
    semantic_anchors:
    - contract:visible_canonical_speculative_exclusion
    - claim:L110_client_retires_matching_speculative_overlay_before_canonical_publication
  visible_overlay:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_visible_speculative_overlays
    meaning: Overlay o is currently exposed as a speculative user-visible overlay in client state s.
    semantic_anchors:
    - contract:speculative_overlay_identity_provenance
    - contract:speculative_overlay_operation_provenance
    - contract:visible_canonical_speculative_exclusion
    - contract:visible_speculative_effect_uniqueness
    - contract:visible_speculative_overlay_document_binding
    - contract:visible_speculative_retention_coherence
    - claim:L110_client_retires_matching_speculative_overlay_before_canonical_publication
    - claim:L132_visible_overlay_document_binding_established_on_publication
    - claim:L133_visible_overlay_document_binding_preserved_by_local_transitions
  canonical_contains_same_edit:
    args:
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_local_document
    - last_applied_revision
    meaning: The canonical prefix visible in state s already contains a canonical acceptance whose full (document_id, client_change_id) identity equals the full identity carried by overlay o. Full-identity equality alone triggers this relation; it does not additionally require proof that the acceptance and overlay denote the same semantic edit, and an identity collision therefore does not bypass the same-identity speculative exclusion.
    semantic_anchors:
    - contract:visible_canonical_speculative_exclusion
    - claim:L110_client_retires_matching_speculative_overlay_before_canonical_publication
  client_transition_recreates_speculative_overlay:
    args:
    - ClientState
    - ClientState
    - Overlay
    returns: Bool
    catalog_symbols:
    - document_id
    - client_change_id
    meaning: Along the client-protocol path from user-visible state e to later user-visible state l, some client transition creates or re-enables speculative overlay o, the speculative representation of the logical client edit identified by (document_id, client_change_id), as a user-visible speculative overlay, exposing it at the user-visible client observation boundary at some point on that path, although that overlay was absent in e. This predicate classifies user-visible creation or re-enablement only; recreation that remains in private, intermediate, or not-yet-published states and is never exposed at the user-visible boundary is outside this predicate. It does not assert that the overlay is visible in l.
    semantic_anchors:
    - claim:L110_client_retires_matching_speculative_overlay_before_canonical_publication
  new_logical_edit_speculative_overlay_creation:
    args:
    - ProtocolTransition
    - Overlay
    returns: Bool
    catalog_symbols:
    - document_id
    - client_change_id
    meaning: Protocol transition t creates speculative overlay o for a genuinely new logical client edit rather than a retry or continued representation of an existing logical edit.
    semantic_anchors:
    - claim:G8_user_visible_state_does_not_double_render_accepted_optimistic_edit
  created_new_overlay_uses_distinct_change_id:
    args:
    - ProtocolTransition
    - Overlay
    returns: Bool
    catalog_symbols:
    - client_change_id
    meaning: The genuinely new logical edit represented by overlay o uses its own client_change_id rather than reusing the identifier of an existing logical edit whose retry or continued speculative lifecycle transition t would otherwise represent. This predicate does not assert document-wide uniqueness against unrelated logical edits.
    semantic_anchors:
    - claim:G8_user_visible_state_does_not_double_render_accepted_optimistic_edit
  authored_from:
    args:
    - Request
    - ClientState
    returns: Bool
    catalog_symbols: []
    meaning: Request r was constructed from client state s as its authoring state.
    semantic_anchors:
    - contract:request_authoring_frontier_binding
  request_document:
    args:
    - Request
    returns: Document
    catalog_symbols:
    - document_id
    meaning: The document identity carried by request r.
    semantic_anchors:
    - contract:request_authoring_frontier_binding
    - contract:acceptance_request_identity_binding
    - claim:L108_acceptance_preserves_request_identity
    - claim:G6_accepted_change_preserves_ot_semantics
    - claim:L123_acceptance_payload_and_identity_share_submitted_request
  request_base_revision:
    args:
    - Request
    returns: Revision
    catalog_symbols:
    - base_revision
    meaning: The base revision carried by request r.
    semantic_anchors:
    - contract:request_authoring_frontier_binding
  request_raw_edit_bound_to_source_content:
    args:
    - Request
    - ClientState
    returns: Bool
    catalog_symbols:
    - raw_edit
    - client_local_document
    meaning: The raw edit carried by request r is the edit authored against the canonical client content in source state s.
    semantic_anchors:
    - contract:request_authoring_frontier_binding
  catchup_response_is_snapshot_mode:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: 'Response r is a snapshot-replacement-mode catch-up response: catch-up selected a checkpoint for r and r is to be constructed by snapshot replacement rather than by delta/range application. This predicate classifies r''s mode only; it does not assert which checkpoint was selected or what r returns.'
    semantic_anchors:
    - claim:L25_snapshot_catchup_uses_selected_checkpoint_replacement
    - claim:L26_snapshot_catchup_returns_exact_canonical_tail
    - claim:C15_snapshot_catchup_returns_checkpoint_and_exact_tail
    - claim:L37_snapshot_mode_selects_authoritative_checkpoint
    - claim:C17_snapshot_mode_selects_checkpoint_not_after_head
    - claim:L32_catchup_selects_complete_mode_for_response_head
    - claim:C10_catchup_represents_exact_missing_suffix
    - claim:L101_client_completes_catchup_through_response_head
    - claim:L38_selected_checkpoint_does_not_exceed_response_head
    - claim:L177_catchup_canonical_sources_preserve_document_provenance
  catchup_response_selected_checkpoint_frontier:
    args:
    - CatchupResponse
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: Revision s is the frontier coordinate of the checkpoint (content, s) that catch-up selected for response r. This relation names the selected checkpoint's frontier only; it does not assert that r identifies that checkpoint or what r returns.
    semantic_anchors:
    - claim:L26_snapshot_catchup_returns_exact_canonical_tail
    - claim:C15_snapshot_catchup_returns_checkpoint_and_exact_tail
    - claim:L37_snapshot_mode_selects_authoritative_checkpoint
    - claim:L38_selected_checkpoint_does_not_exceed_response_head
    - claim:C17_snapshot_mode_selects_checkpoint_not_after_head
    - claim:C10_catchup_represents_exact_missing_suffix
  catchup_response_head_is:
    args:
    - CatchupResponse
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: Revision h is the authoritative response head captured for response r. This relation names r's head only; it does not assert what r returns for that head.
    semantic_anchors:
    - claim:L26_snapshot_catchup_returns_exact_canonical_tail
    - claim:C15_snapshot_catchup_returns_checkpoint_and_exact_tail
    - claim:L124_pending_identity_classifier_uses_same_identity_and_response_head
    - claim:C37_pending_identity_resolution_is_bound_to_response_head
    - claim:L109_resync_publication_is_atomic_and_monotonic
    - claim:L38_selected_checkpoint_does_not_exceed_response_head
    - claim:C17_snapshot_mode_selects_checkpoint_not_after_head
    - claim:L12_delta_catchup_reads_canonical_revision_range
    - claim:C10_catchup_represents_exact_missing_suffix
    - claim:L101_client_completes_catchup_through_response_head
  catchup_response_identifies_selected_checkpoint:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: 'Response r identifies exactly the checkpoint (content and frontier) that catch-up selected for it: the checkpoint identity carried by r is that one selected checkpoint, not another checkpoint and not a mixture of checkpoints.'
    semantic_anchors:
    - claim:L25_snapshot_catchup_uses_selected_checkpoint_replacement
    - claim:C15_snapshot_catchup_returns_checkpoint_and_exact_tail
    - claim:C10_catchup_represents_exact_missing_suffix
  catchup_response_uses_replacement_semantics:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: Response r specifies that its checkpoint content replaces the client's prior document state rather than being appended or patched onto it.
    semantic_anchors:
    - claim:L25_snapshot_catchup_uses_selected_checkpoint_replacement
    - claim:C15_snapshot_catchup_returns_checkpoint_and_exact_tail
    - claim:C10_catchup_represents_exact_missing_suffix
  catchup_response_tail_contains_change:
    args:
    - CatchupResponse
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
    meaning: Canonical accepted change a is one of the changes returned in the tail portion of catch-up response r. This relation records tail membership only; it does not assert that a's revision lies in any particular range or how many times a appears.
    semantic_anchors:
    - claim:L26_snapshot_catchup_returns_exact_canonical_tail
    - claim:C15_snapshot_catchup_returns_checkpoint_and_exact_tail
    - claim:C10_catchup_represents_exact_missing_suffix
    - claim:L177_catchup_canonical_sources_preserve_document_provenance
  canonical_acceptance_revision_is:
    args:
    - CanonicalAcceptance
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: Revision v is the canonical revision assigned to canonical accepted change a. Each canonical accepted change has exactly one assigned revision; this relation names it and asserts nothing about any response.
    semantic_anchors:
    - claim:L26_snapshot_catchup_returns_exact_canonical_tail
    - claim:C15_snapshot_catchup_returns_checkpoint_and_exact_tail
    - claim:L12_delta_catchup_reads_canonical_revision_range
    - claim:C10_catchup_represents_exact_missing_suffix
    - claim:L10_replay_covers_exact_tail_in_order_once
    - claim:C9_recovery_reconstructs_committed_state
  revision_in_checkpoint_tail_range:
    args:
    - Revision
    - Revision
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: 'Revision v lies in the checkpoint tail range (s, h]: s < v and v <= h, so v is one of the revisions s+1..h. This predicate is the range relation only.'
    semantic_anchors:
    - claim:L26_snapshot_catchup_returns_exact_canonical_tail
    - claim:C15_snapshot_catchup_returns_checkpoint_and_exact_tail
    - claim:C10_catchup_represents_exact_missing_suffix
    - claim:L10_replay_covers_exact_tail_in_order_once
    - claim:C9_recovery_reconstructs_committed_state
  catchup_response_tail_exactly_once_in_order:
    args:
    - CatchupResponse
    - Revision
    - Revision
    returns: Bool
    catalog_symbols: []
    meaning: Within the tail returned by response r for the range (s, h], no canonical accepted change appears more than once and the returned changes are arranged in increasing revision order. This predicate asserts the tail's multiplicity and ordering only; which changes belong to the range is asserted separately.
    semantic_anchors:
    - claim:L26_snapshot_catchup_returns_exact_canonical_tail
    - claim:C15_snapshot_catchup_returns_checkpoint_and_exact_tail
    - claim:C10_catchup_represents_exact_missing_suffix
  eligible_catchup_response:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols: []
    meaning: Response r belongs to a normal catch-up/reconnect attempt within the protocol guarantee being modeled.
    semantic_anchors:
    - contract:catchup_head_binding
    - contract:catchup_canonical_source_provenance
  captured_authoritative_head:
    args:
    - CatchupResponse
    returns: Revision
    catalog_symbols:
    - document_latest_revision
    meaning: 'The revision H is exactly equal to the value returned by reading document_latest_revision for r''s catch-up document at one response-specific authoritative-store read/capture event. That single event fixes H for r: no later authoritative-store read, recapture, canonical acceptance, or response-processing step may replace or rebind r''s captured H. Later canonical acceptances may advance the authoritative document_latest_revision after the capture without changing H for this already captured response.'
  catchup_response_head_value:
    args:
    - CatchupResponse
    returns: Revision
    catalog_symbols:
    - catchup_response_head
    meaning: The response head revision carried by catch-up response r.
  catchup_head_preserved:
    args:
    - CatchupResponse
    returns: Bool
    catalog_symbols:
    - catchup_response_head
    meaning: The already captured authoritative head H for response r remains the same bound response-head value through delta/range-or-snapshot selection, range or snapshot construction as applicable, pending reconciliation, response completion, return, and any actual response or candidate publication. None of those stages, including the publication event itself, may substitute, recapture, or rebind a different head for r.
  within_retry_reconnect_eligibility:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols: []
    meaning: Composite authoritative idempotency identity k = (document_id, client_change_id) is within the 30-day normal retry/reconnect eligibility horizon in authoritative state s.
    semantic_anchors:
    - contract:accepted_evidence_correspondence
    - claim:G5_retry_resolves_idempotently
    - claim:L14_accepted_idempotency_identity_survives_lifecycle
  accepted_evidence_for_key:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    - idempotency_key
    meaning: Authoritative durable accepted_idempotency_evidence exists in state s for the same composite idempotency_key k = (document_id, client_change_id).
  accepted_evidence_mechanism_valid:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    - accepted_change_log
    - idempotency_key
    - document_id
    - client_change_id
    meaning: 'Any authoritative accepted evidence counted for composite key k in state s is established only by a valid committed-acceptance mechanism: the committed accepted row or unique identity itself; a separate hot-path accepted-key success record that commits and aborts atomically with the same canonical acceptance in the same acceptance transaction; or lifecycle/compaction replacement evidence that is equivalent accepted evidence derived from a previously committed canonical acceptance. Reservation, in-progress arbitration, timeout, cancellation, or another non-committed attempt is not classified as accepted evidence.'
    semantic_anchors:
    - claim:G9_accepted_idempotency_evidence_matches_committed_acceptance
  exactly_one_committed_acceptance_for_key:
    args:
    - AuthoritativeState
    - IdempotencyKey
    returns: Bool
    catalog_symbols:
    - accepted_change_log
    meaning: accepted_change_log in authoritative state s contains exactly one committed canonical acceptance whose authoritative idempotency_key is the same composite identity k = (document_id, client_change_id).
  authoritative_evidence:
    args:
    - AcceptedEvidence
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    meaning: Evidence e is an authoritative accepted-idempotency evidence record.
  evidence_key:
    args:
    - AcceptedEvidence
    returns: IdempotencyKey
    catalog_symbols:
    - idempotency_key
    meaning: The authoritative idempotency identity carried by evidence e.
  committed_canonical_acceptance:
    args:
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - canonical_accepted_change
    - accepted_change_log
    meaning: Canonical acceptance a is a committed canonical accepted-change record in authoritative accepted history.
    semantic_anchors:
    - contract:accepted_evidence_provenance
    - contract:accepted_terminal_result_binding
    - contract:acked_edit_failover_survival
    - contract:ot_result_frontier_binding
    - claim:L163_accepted_terminal_outcome_commits_with_canonical_acceptance
    - claim:L99_ot_result_is_bound_to_acceptance_frontier
  acceptance_key:
    args:
    - CanonicalAcceptance
    returns: IdempotencyKey
    catalog_symbols:
    - canonical_accepted_change
    meaning: The authoritative idempotency identity carried by canonical acceptance a.
  evidence_derived_from_acceptance:
    args:
    - AcceptedEvidence
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - accepted_idempotency_evidence
    - canonical_accepted_change
    meaning: Evidence e is derived from and corresponds to committed canonical acceptance a.
  request_change_id:
    args:
    - Request
    returns: ClientChangeId
    catalog_symbols:
    - client_change_id
    meaning: The client-supplied logical edit identity carried by request r.
  acceptance_produced_from_request:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols: []
    meaning: Canonical acceptance a was produced from submitted request r.
    semantic_anchors:
    - contract:acceptance_request_identity_binding
    - claim:G6_accepted_change_preserves_ot_semantics
    - claim:L99_ot_result_is_bound_to_acceptance_frontier
    - claim:L123_acceptance_payload_and_identity_share_submitted_request
    - claim:L182_logical_edit_request_payload_binding_is_preserved
  acceptance_document:
    args:
    - CanonicalAcceptance
    returns: Document
    catalog_symbols:
    - canonical_accepted_change
    meaning: The document identity preserved on canonical acceptance a.
    semantic_anchors:
    - contract:acceptance_request_identity_binding
    - claim:G6_accepted_change_preserves_ot_semantics
    - contract:ot_result_frontier_binding
    - claim:L123_acceptance_payload_and_identity_share_submitted_request
  acceptance_change_id:
    args:
    - CanonicalAcceptance
    returns: ClientChangeId
    catalog_symbols:
    - canonical_accepted_change
    meaning: The client_change_id preserved on canonical acceptance a.
  acceptance_idempotency_identity_matches_request:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols:
    - idempotency_key
    meaning: The authoritative idempotency identity associated with acceptance a is exactly the request's (document_id, client_change_id).
  acceptance_identity_preserved_end_to_end:
    args:
    - CanonicalAcceptance
    - Request
    returns: Bool
    catalog_symbols:
    - canonical_accepted_change
    - document_id
    - client_change_id
    meaning: From request admission through OT dispatch, idempotency arbitration, retry handling, and canonical commit, neither document_id nor client_change_id is dropped, regenerated, substituted, or cross-bound; every identity handoff for acceptance a remains the originating request r identity.
  durable_idempotency_evidence_for_acceptance:
    args:
    - DurableIdempotencyEvidence
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - idempotency_key
    meaning: Durable idempotency evidence e is associated with canonical acceptance a.
  durable_evidence_identity_matches_request:
    args:
    - DurableIdempotencyEvidence
    - Request
    returns: Bool
    catalog_symbols:
    - idempotency_key
    - document_id
    - client_change_id
    meaning: Durable idempotency evidence e identifies exactly the same (document_id, client_change_id) carried by originating request r.
  live_delivery_record:
    args:
    - LiveDelivery
    returns: Bool
    catalog_symbols:
    - websocket_live_stream
    meaning: 'Delivery d is any change actually exposed through the websocket live stream. This predicate does not pre-classify the delivery as canonical or committed: if a provisional, speculative, rejected, aborted, or never-committed change were exposed, it would still satisfy live_delivery_record(d) and would have to satisfy the formula''s separate committed-source obligations.'
  committed_history_record:
    args:
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols:
    - accepted_change_log
    meaning: Canonical acceptance a is a committed record in authoritative accepted_change_log.
  live_delivery_originates_from:
    args:
    - LiveDelivery
    - CanonicalAcceptance
    returns: Bool
    catalog_symbols: []
