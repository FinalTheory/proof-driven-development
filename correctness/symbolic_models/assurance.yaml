          and acceptance coordinates without adding temporal or cross-claim bridges.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: f0958426822769f618719a1b97a2d340c7cf3fa6e99dc48501345118a6e6a060
        verdict: EQUIVALENT
        reason: Both require every exposed live change to originate from committed accepted history for the same document,
          preserving canonical payload and revision provenance. The single-record witness prevents mixing provenance coordinates
