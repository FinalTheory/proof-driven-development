    roundtrip:
      subject_signature: 3e55d99c3cd840a2cb9acbb8be47a57adc6eb203d5f4b383f12021936a7b4a52
      status: TRANSLATED
      natural_language: 'The conjunction of the following three conditions holds. (1) For every catch-up response r, every
        revision s, every revision h, every canonical acceptance a, and every revision v: if r is a snapshot-replacement-mode
        catch-up response, s is the frontier coordinate of the checkpoint selected for r, h is the authoritative response
        head captured for r, v is the canonical revision assigned to a, and v lies in the checkpoint tail range (s, h] (i.e.,
        s < v and v <= h), then a is one of the changes returned in the tail portion of r. (2) For every catch-up response
        r, every revision s, every revision h, every canonical acceptance a, and every revision v: if r is a snapshot-replacement-mode
        catch-up response, s is the frontier coordinate of the checkpoint selected for r, h is the authoritative response
        head captured for r, a is one of the changes returned in the tail portion of r, and v is the canonical revision assigned
        to a, then v lies in the checkpoint tail range (s, h] (i.e., s < v and v <= h). (3) For every catch-up response r,
        every revision s, and every revision h: if r is a snapshot-replacement-mode catch-up response, s is the frontier coordinate
        of the checkpoint selected for r, and h is the authoritative response head captured for r, then within the tail returned
        by r for the range (s, h], no canonical accepted change appears more than once and the returned changes are arranged
        in increasing revision order.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 3e55d99c3cd840a2cb9acbb8be47a57adc6eb203d5f4b383f12021936a7b4a52
