          client_resync_candidate through reached construction/publication stages; it also expressly rejects cross-document
          authoritative substitution under extensional value collisions while allowing shared immutable bytes when the semantic
          authoritative reference remains D-bound. The post-H exclusion is preserved as an upper boundary across selected/consumed
