      status: TRANSLATED
      natural_language: 'For every recovery attempt r, both of the following hold. First, if r is a recovery or reconstruction
        attempt whose role from its initiation is to establish or re-establish an authoritative owner generation for its target
        document, including owner-identity change, cold takeover, warm-standby promotion, and same-owner restart or reacquisition,
        then r is a new-owner recovery attempt, meaning r is within the canonical new-owner recovery boundary for its target
        document. This classification for r is established by entering that recovery boundary and does not depend on successful
        progress: r remains a new-owner recovery attempt if it stalls, crashes, or aborts before owner-generation installation,
        recovery-head capture, or completion, and recovery or reconstruction activity outside the canonical new-owner recovery
        boundary is excluded. The establishing-owner-generation classification likewise rests on r''s role from its initiation
        and does not depend on r later reaching owner-generation installation, recovery-head capture, or completion, and reconstruction
        activity that does not establish or re-establish authoritative ownership does not satisfy it. Second, if r both establishes
        owner generation in that sense and reaches authoritative publication, meaning the point at which the owner generation
        r establishes becomes authoritative or acceptance-eligible, then r''s authoritative or acceptance-eligible publication
        is for a distinct fresh owner generation rather than a continuation of the superseded tenure, and is therefore subject
        to the fresh epoch and owner-generation installation requirements for that new generation.'
      ambiguities: []
