        and failure model and k is within the configured normal retry eligibility horizon in s (with no fixed duration assumed),
        then both: it is not the case that the terminal outcome contained in s for k is both ACCEPTED (canonical result) and
        REJECTED (definitive rejection reason); and the terminal outcome for k in s is immutable, meaning that once a terminal
        outcome for k has linearized, every later acceptance or definitive-rejection transition for that same identity whose
        resulting authoritative state remains within the configured normal retry eligibility horizon for k preserves the same
        single-valued outcome, while post-horizon transitions or re-submissions are outside this immutability predicate and
        no progress requirement is added. (2) For every authoritative state s and every idempotency key k, if s is reachable,
        k is within the normal retry eligibility horizon in s, and s contains a terminal_result for k in its idempotency_terminal_outcomes
        store (presence only, irrespective of the outcome''s value and provenance), then s contains at most one durable terminal
        result for k. (3) For every protocol transition x, authoritative state s, and idempotency key k, if x is an authoritative
        terminal-state transition applied at s — that is, a transition that linearizes, attempts to linearize, or is arbitrated
        against the per-key terminal outcome state in s, namely the acceptance and definitive-rejection transitions of the
        terminal state machine, and not a non-terminal lifecycle, recovery, or representation-migration transition — and s
        is reachable, k is within the normal retry eligibility horizon in s, and the terminal outcome contained in s for k
        is REJECTED (definitive rejection reason), then x does not create a canonical acceptance for k. (4) For every protocol
        transition x, authoritative state s, and idempotency key k, if x is an authoritative terminal-state transition applied
        at s (with the same meaning as in (3)), s is reachable, k is within the normal retry eligibility horizon in s, and
        s contains a terminal_result for k, then x preserves the exact logical terminal outcome for k: the terminal_result
        for k after x is identical in value and identity to the one in s; this preservation assertion concerns an existing
        outcome and does not itself govern whether x may create an outcome for a key that has none.'
