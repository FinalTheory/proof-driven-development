  claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit:
    kind: claim
    subject_id: G7_reconnect_does_not_double_render_accepted_optimistic_edit
    subject_signature: 2247702a7b4b45509274c07bed76bd31b9aad733775d23e081cc1a96d5679642
    roundtrip:
      subject_signature: 2247702a7b4b45509274c07bed76bd31b9aad733775d23e081cc1a96d5679642
      status: TRANSLATED
      natural_language: 'For every resync attempt c (of type CatchupResponse) and every logical edit identity e (of type LogicalEditIdentity),
        if c is a normal client resync attempt — i.e., c is one reconnect/resync attempt for document D by a normally participating
        client, without requiring that the attempt be foreground or that D be currently visible — then all of the following
        hold conjunctively: (1) while resync c is in progress, the client creates or applies no new speculative local edit
        for document D, regardless of whether that new edit would currently be acceptance-eligible; (2) if the exact logical
        edit identity e=(D,k) is pending at the start of resync c for that same resync document D (a pending identity for
        another document does not satisfy this) and pending identity e is within the normal 30-day reconnect eligibility horizon
        for resync c, then the catch-up request for c includes e for authoritative same-full-identity reconciliation through
        the response head; (3) if e is pending at the start of c for the same document D and e is within the normal 30-day
        horizon and canonical acceptance for the exact same full logical identity e is included through c''s response head,
        then once canonical acceptance for e is included through c''s response head H_D, any user-visible publication through
        H_D removes or suppresses the matching speculative overlay before or atomically with that publication, so no published
        user-visible state exposes both representations; (4) if e is pending at the start of c for the same document D and
        e is within the normal 30-day horizon, then no intermediate resync candidate for c may expose a candidate state whose
        canonical prefix already contains acceptance for exact identity e together with a speculative overlay for e, purely
        internal unexposed candidate representation is not constrained by this, and this rule is independent of whether c''s
        response head itself is classified as containing that acceptance; (5) if e is pending at the start of c for the same
        document D, e is within the normal 30-day horizon, and exact logical edit identity e=(D,k) has the same document coordinate
        D as the document being reconnected/resynchronized by c, then a stale response for c cannot restore a speculative
        overlay for e that a newer published reconciliation already removed; (6) if e is pending at the start of c for the
        same document D and pending identity e at the start of resync c has a defined pending/retry age greater than the 30-day
        normal reconnect eligibility horizon, then, e being outside the normal reconnect horizon, c does not submit it through
        normal authoritative reconciliation and the client discards it or uses an explicit expired/conflict/manual-resolution
        path; and (7) if, after reconciled publication or conflict entry for c, exact identity e for the same resync document
        D remains protocol-eligible and unresolved and remains contained in client_pending_edits, then while e remains unresolved
        after c publication/conflict entry, client_editing_mode is not normal-editable for the document of e and no normal
        editing transition creates or applies a new acceptance-eligible speculative edit for that document.'
