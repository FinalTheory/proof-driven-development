      subject_signature: 299cff8beca61a66905012acfdbad2b6005563c3cf51901c436de681e54d1887
      status: TRANSLATED
      natural_language: 'For every catch-up response r, if r is a catch-up or reconnect response targeting some document D
        and a response-specific head H has already been captured and fixed, then every canonical payload source that is actually
        selected or consumed for r must preserve its semantic authoritative binding to D throughout response construction,
        construction of any private client-resynchronization candidate, and any publication that is actually reached. In delta
        mode, every returned canonical accepted change must originate from the accepted_change_log for D. In snapshot mode,
