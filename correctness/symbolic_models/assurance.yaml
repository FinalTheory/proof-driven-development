  obligation:externally_rejected_edit_closes_active_speculative_lifecycle:
    kind: obligation
    subject_id: externally_rejected_edit_closes_active_speculative_lifecycle
    subject_signature: ef8b001b3cc0812554c55117d8b3899270a33effce59fbab44a712165821697c
    roundtrip:
      subject_signature: ef8b001b3cc0812554c55117d8b3899270a33effce59fbab44a712165821697c
      status: TRANSLATED
      natural_language: 'For every client state s and every logical edit identity e, if the normally participating client
        has observed an authoritative, externally terminal, definitive REJECTED result for that exact logical edit identity
        e before or atomically with visible state s, after the corresponding authoritative terminal_result has linearized,
        then all of the following hold in that same state s: e is not active in client_pending_edits; no normal-lifecycle
        speculative representation for that exact identity e remains retained in client_speculative_overlays, including representations
        not currently exposed to the user; no normal-lifecycle speculative representation for that exact identity e is exposed
        in client_visible_speculative_overlays; and e is classified as having a terminalized normal speculative lifecycle
        in client_terminalized_speculative_lifecycles. The retained and visible representations and the terminalized classification
        preserve their document scope and refer to the same full logical edit identity e. Terminalized classification may
        be realized through deletion or non-reactivatable archival state and does not require a separately materialized tombstone
        set.'
