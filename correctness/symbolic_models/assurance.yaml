        reason: 'The symbolic state invariant matches the canonical authoritative-state scope: its scope predicate is expressly
          non-validating, includes initialized empty history, and therefore does not strengthen the contract by excluding
          malformed, missing, or inconsistent authoritative coordinates. The two state conjuncts express exactly a gap-free
          logical canonical accepted prefix whose endpoint equals document_latest_revision, with missing or undefined coordinates
          failing rather than being silently scoped out. The transition clause is likewise scoped to representation/lifecycle
          transitions that actually occur on reachable canonical executions, change an existing document''s authoritative
