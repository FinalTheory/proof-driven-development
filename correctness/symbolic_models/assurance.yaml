  obligation:visible_canonical_frontier_never_regresses:
    kind: obligation
    subject_id: visible_canonical_frontier_never_regresses
    subject_signature: 6df3d4d1f64cfb0ae7264dd825dbf6bab786571cf81dee35fb9fe0609b4bd5c5
