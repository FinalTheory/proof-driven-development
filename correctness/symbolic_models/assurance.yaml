          transformation outside normal acceptance, requires a previously committed canonical acceptance with equal document_id
          and client_change_id from which it derives, and the only-provenance predicate captures the same exclusivity, including
          transitive intermediates terminating at such an acceptance and excluding never-committed or provisional sources
          and different-identity acceptances. No requirement is added or omitted.
