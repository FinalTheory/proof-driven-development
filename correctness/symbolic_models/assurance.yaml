  claim:G4_reconnect_converges_without_gap_or_duplicate:
    kind: claim
    subject_id: G4_reconnect_converges_without_gap_or_duplicate
    subject_signature: 010cdf3c9a40a6df7932c3a06836bf2a7d7aa35c08376401c4a7f3b6c9fb2a1e
    roundtrip:
      subject_signature: 010cdf3c9a40a6df7932c3a06836bf2a7d7aa35c08376401c4a7f3b6c9fb2a1e
      status: TRANSLATED
      natural_language: 'Every change delivery d that is actually exposed through the document-scoped websocket live stream
        must have at least one canonical acceptance record a such that a is a committed record in that document''s authoritative
        accepted_change_log, d originates from a as its accepted-history source, d preserves exactly a''s canonical payload
        and revision provenance, and d is consumed on the same document-scoped stream as a, so an equally valued acceptance
        from another document cannot satisfy that document-scope condition. In addition, for every normal foreground, visible-document-bound
        reconnect/catch-up attempt c for the current document, starting from the client''s last_applied_revision L (the highest
        contiguous canonical revision already applied by that client), all of the following hold: if the visible document
        switches away before c publishes, c permanently loses foreground publication eligibility and cannot later publish
        merely because the user switches back; any user-visible publication effect of c is a single atomic publication transition
        that exposes no intermediate candidate prefix, and any response of c whose captured response head H is below the already-visible
        canonical frontier cannot regress or otherwise mutate that visible canonical/frontier state; if c is currently eligible
        to publish to the foreground user-visible canonical state, then c''s visible-document binding has remained uninterrupted
        from the start through that publication eligibility; and if c is eligible for completion or foreground publication
        under the reconnect/catch-up protocol, then c captures one response-specific head H from the same document''s authoritative
        document_latest_revision at one authoritative-store read/linearization point, preserves that same captured head unchanged
        through response selection, reconciliation, completion, and any publication, and excludes from that response every
        acceptance occurring after H rather than partially mixing any such later acceptance into the response. Furthermore,
        under that same eligibility-for-completion-or-publication condition, if c actually completes and publishes its reconciled
        result to the user-visible canonical state, then c''s visible-document binding is uninterrupted and the published
        user-visible canonical state is exactly the canonical replay of that same document through c''s captured response
        head H, with no accepted revision through H omitted or double-applied.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 010cdf3c9a40a6df7932c3a06836bf2a7d7aa35c08376401c4a7f3b6c9fb2a1e
        verdict: EQUIVALENT
        reason: The formula preserves the source claim's scope and guards for normal foreground catch-up attempts, including
          fixed single-head capture from the same document's authoritative latest revision, preservation of that head through
          the response lifecycle, uninterrupted visible-document binding as a publication-eligibility condition, permanent
          blocking after a pre-publication binding break, exact replay through the captured head on eligible completion/publication,
          atomic non-regressing publication, and exclusion of post-capture acceptances. Its live-stream clause also requires
          every exposed delivery to have a committed same-document acceptance source with payload and revision provenance
