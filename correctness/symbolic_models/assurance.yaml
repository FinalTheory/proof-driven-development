      natural_language: Both of the following hold. For every client state s and every
        overlay o, if the canonical prefix visible in s already contains the accepted
        logical edit represented by o, then o is not currently exposed as a speculative
        user-visible overlay in that same state s. For every protocol transition t and
        every overlay o, if t creates speculative overlay o for a genuinely new logical
        client edit, rather than a retry or continued representation of an existing
        logical edit, then the new logical edit represented by o uses a client_change_id
        distinct from the client_change_id of every other distinct logical client edit
        in the same document.
