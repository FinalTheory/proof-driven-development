        \ or deletion, and missing or undefined coordinates make the endpoint predicate false. In addition, for every protocol\
        \ transition t and every document d, if t occurs on a reachable canonical server execution and changes the authoritative\
        \ representation or lifecycle state of an existing d without accepting a new edit for d\u2014including any applicable\
        \ snapshot, compaction, cleanup, recovery-publication, or storage-replacement transition, classified independently\
        \ of whether it is correct\u2014then, between the authoritative states immediately before and immediately after t's\
        \ effect for that same d, accepted_change_log must denote exactly the same logical canonical accepted prefix and document_latest_revision\
        \ must have exactly the same value. The physical encoding, checkpoints, compaction state, or deleted storage may differ\
        \ across such a transition, but equality of final document content alone is insufficient. These requirements are a\
        \ state invariant over authoritative states: the first guarded conjunction must hold at every authoritative state\
        \ in its observation scope, and the second guarded preservation condition must hold for every qualifying transition."
