  contract:logical_edit_request_payload_binding:
    kind: contract
    subject_id: logical_edit_request_payload_binding
    subject_signature: c4c3a9ca6f5fe870008e22d71306b1a60d4d2c95f6e1b5e8e7c1bbc371163c8b
    roundtrip:
      subject_signature: c4c3a9ca6f5fe870008e22d71306b1a60d4d2c95f6e1b5e8e7c1bbc371163c8b
      status: TRANSLATED
      natural_language: 'For every request r, if r is a submitted request that is eligible for server-side OT or for an authoritative
        terminal decision, including an initial submission or a normal retry, then there exists a logical client edit e such
        that all of the following hold. First, r represents e rather than a different logical operation: r''s submitted document_id,
        client_change_id, server-visible raw_edit, and base_revision are bound to that same logical operation and to its canonical
        authoring state D@F. Second, the complete submitted tuple remains provenance-bound to that same e throughout every
        request-lineage representation that is actually reached during request construction, serialization, dispatch, and
        normal retry. Concretely, if e was created with document identity document_id=D and client_change_id=k against canonical
        authoring state D@F with logical operation X, then every such reached representation remains bound to e and carries
        document_id=D, client_change_id=k, base_revision=F, and a server-visible raw_edit whose semantics are X against the
        captured D@F authoring state. Physical encoding may change so long as the semantic operation and provenance binding
        are preserved; any temporary substitution or cross-binding to another logical edit or operation violates this condition
        even if a later stage restores the original endpoint tuple. Third, for every logical client edit e2, if r also represents
        e2, then e2 equals e. Thus the eligible request has an existing represented logical edit and no distinct logical edit
        can also satisfy the representation predicate for that same request. These requirements constrain only stages actually
        reached and provenance/identity binding: they do not require dispatch, retry, OT invocation, successful acceptance,
        completion of an authoritative terminal decision, client-side rebase behavior, byte-identical serialization, or uniqueness
        of client_change_id across distinct logical edits, and they imply no additional liveness, delivery, ordering, or temporal
        behavior beyond what the stated predicates encode.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: c4c3a9ca6f5fe870008e22d71306b1a60d4d2c95f6e1b5e8e7c1bbc371163c8b
        verdict: EQUIVALENT
        reason: 'The formula covers every eligible submitted request, requires one unique logical-edit source through existence
          plus uniqueness, and the supplied predicate meanings preserve the complete document_id, client_change_id, raw_edit
          semantics, and base_revision binding to that edit''s captured D@F authoring state across every actually reached
          construction, serialization, dispatch, and normal-retry representation. The helper meanings also preserve the source
          exclusions: they add no progress, byte-identical serialization, client-side rebase, or cross-edit client_change_id
          uniqueness requirement.'
        differences: []
      strengthening:
        subject_signature: c4c3a9ca6f5fe870008e22d71306b1a60d4d2c95f6e1b5e8e7c1bbc371163c8b
        verdict: EQUIVALENT
        reason: 'The formula preserves the canonical scope over every eligible submitted request, requires exactly one logical
          edit to source the complete submitted tuple, binds document_id, client_change_id, raw_edit semantics, and base_revision
          to that edit''s captured D@F authoring state, and enforces semantics-preserving binding through every lifecycle
