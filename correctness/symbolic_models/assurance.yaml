  claim:L28_authoritative_epoch_never_regresses_or_reuses:
    kind: claim
    subject_id: L28_authoritative_epoch_never_regresses_or_reuses
    subject_signature: 3b7c9b58cbf5768b23885cb1ee3473fc677fea30326adcc2fb7fc27d7a0b380a
    roundtrip:
      subject_signature: 3b7c9b58cbf5768b23885cb1ee3473fc677fea30326adcc2fb7fc27d7a0b380a
      status: TRANSLATED
      natural_language: 'All of the following hold. First, for every protocol transition t and every document d, if t is an
        authoritative lifecycle transition for d — that is, an authoritative recovery, restart, delayed metadata publication,
        ownership handoff, or other authoritative transition in d''s lifecycle, as opposed to a client-side or speculative
        action — and t executes after an authoritative epoch value for d has been superseded by a strictly greater epoch,
        so that d''s epoch history already contains a supersession event when t occurs, then across t, d''s document_current_epoch,
        the authoritative persisted epoch identifying the current fenced document owner generation for d, never decreases
        and no superseded epoch value for d is restored as current: t leaves the current epoch at or above its prior value
        and never makes a previously superseded value authoritative again. Second, for every authoritative state before, every
        authoritative state after, and every document d, if after is the immediate successor of before under one committed
        authoritative protocol transition, with that transition''s full authoritative effect separating the two states and
        no intermediate authoritative state between them (aborted, rolled-back, or never-committed work creating no step and
        no successor authoritative state), and the step from before to after is the state-level effect of an authoritative
        lifecycle transition for d, and by the time of that step an authoritative epoch value for d has already been superseded
        by a strictly greater epoch, so the step occurs in the post-supersession regime, then both of the following hold:
        (a) if in after, d''s current document_current_epoch is an epoch value that was superseded by a strictly greater epoch,
        regardless of which owner generation is paired with it in after, then in before, d''s current document_current_epoch
        was also an epoch value that was superseded by a strictly greater epoch; and (b) it is not the case that across the
        step from before to after, d''s document_current_epoch decreases, that is, it is not the case that the authoritative
        current epoch of d in after is strictly less than the authoritative current epoch of d in before.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 3b7c9b58cbf5768b23885cb1ee3473fc677fea30326adcc2fb7fc27d7a0b380a
        verdict: EQUIVALENT
        reason: The transition-level conjunct directly encodes the source guarantee under the same post-supersession guard,
          and the state-step conjuncts faithfully decompose it into no epoch decrease and no newly restored superseded value,
          with no dropped guard or added requirement.
        differences: []
      strengthening:
        subject_signature: 3b7c9b58cbf5768b23885cb1ee3473fc677fea30326adcc2fb7fc27d7a0b380a
        verdict: EQUIVALENT
        reason: The transition-level clause directly encodes the post-supersession guarantee for authoritative lifecycle transitions,
          and the step-level clauses restate the same never-decrease and never-restore bounds over immediate authoritative
          successors under the same lifecycle and post-supersession guards, without expanding scope or adding a distinct requirement.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 3b7c9b58cbf5768b23885cb1ee3473fc677fea30326adcc2fb7fc27d7a0b380a
        verdict: EQUIVALENT
        reason: 'The rendering preserves the same post-supersession precondition, the same per-document authoritative epoch
          coordinate, and both prohibitions over authoritative lifecycle transitions: the epoch never decreases and no superseded
          value is restored as current. The state-step clause restates those same guarantees without adding or removing requirements.'
        differences: []
