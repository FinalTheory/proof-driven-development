  claim:G3_snapshot_and_recovery_preserve_state:
    kind: claim
    subject_id: G3_snapshot_and_recovery_preserve_state
    subject_signature: df5101b86f1a2db4e5ef2bf70528a2a1ff4ed340749efa863cffaedeb35d8493
    roundtrip:
      subject_signature: df5101b86f1a2db4e5ef2bf70528a2a1ff4ed340749efa863cffaedeb35d8493
      status: TRANSLATED
      natural_language: Both of the following conditions hold. First, for every authoritative state representation s and every
        revision frontier H, if s is an optimized authoritative lifecycle representation (a snapshot, checkpoint, cleanup, or
        compaction result) at H, or s is the result of a completed owner recovery at H, then the logical document state denoted
        by s equals deterministic canonical replay of accepted revisions through H, and s preserves authoritative latest_revision
        exactly equal to H. Under that same disjunctive guard, if s is used to resume owner service, then s also reconstructs
        the acceptance-relevant state required to continue accepting from H without changing canonical semantics. Second, for
        every recovery attempt r, if r is within the canonical new-owner recovery boundary for its target document, then every
        authoritative owner context and every recovery head, authoritative checkpoint, canonical tail entry, rebuilt logical
        or OT runtime state, installed recovered state, and resumed owner context actually established, selected, captured,
        consumed, constructed, installed, or used by r preserves the identity of recovery_target_document(r) as the same document.
        This document identity requirement applies to each such context, source, or state as it occurs in that attempt, including
        the document-scoped current epoch, owner-generation identity, recovery head, checkpoint content paired with its exact
        snapshot revision, accepted change log, and recovered owner runtime state wherever those are actually involved. Entering
        the canonical new-owner recovery boundary establishes the classification of r as a new-owner recovery attempt, even
        if r stalls, crashes, or aborts before owner-generation installation, recovery-head capture, or completion. Recovery
        or reconstruction activity outside that boundary is excluded from this classification. The document identity requirement
        imposes no progress or existence requirement on later recovery stages; whenever a stage exists, however, an extensionally
        equal owner context, checkpoint, tail, or state from a different document cannot satisfy that requirement. These universal
        conditions do not assert that qualifying representations or recovery attempts exist. Referenced semantic contracts supply
        vocabulary and relations without adding their entire formulas to these conditions.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: df5101b86f1a2db4e5ef2bf70528a2a1ff4ed340749efa863cffaedeb35d8493
        verdict: EQUIVALENT
        reason: The formula requires every optimized authoritative representation and completed recovery at frontier H to preserve
          canonical logical state and latest_revision, with acceptance-relevant reconstruction required when resuming service.
          It independently requires document provenance throughout every new-owner recovery attempt, including owner context
          before head capture and every subsequent stage that occurs. The supplied predicate meanings preserve target-document
          identity, forbid extensionally equal cross-document substitutions, and cover stalled, crashed, or aborted attempts
