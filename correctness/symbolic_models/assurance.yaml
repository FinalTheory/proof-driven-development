          client has observed an authoritative definitive REJECTED result for the exact logical edit identity,
          the resulting visible state has no active pending, retained speculative, or visible speculative
          representation for that identity and classifies its normal speculative lifecycle as terminalized.
          The helper meanings preserve the authoritative-observation, exact-identity, and resulting-state
          boundaries without adding a delivery or UI requirement.'
        differences: []
      strengthening:
        subject_signature: da60294fbeea4d46cca8d63203e4ae7668fe24e21dd626467f0d1dfc40d46b28
