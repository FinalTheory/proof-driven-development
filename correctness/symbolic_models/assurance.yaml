    subject_id: client_canonical_frontier_coherence
    subject_signature: 690da1004a30a0f2741b45e9d1b53e5df5d2cb25dfa408b6372ac1e46d5adef0
    roundtrip:
      subject_signature: 690da1004a30a0f2741b45e9d1b53e5df5d2cb25dfa408b6372ac1e46d5adef0
