  claim:G3_snapshot_and_recovery_preserve_state:
    kind: claim
    subject_id: G3_snapshot_and_recovery_preserve_state
    subject_signature: 686689c758e48bd95d4f539ac7ba73a99778d4adfef81eb94d710539276b21cf
    roundtrip:
      subject_signature: 686689c758e48bd95d4f539ac7ba73a99778d4adfef81eb94d710539276b21cf
      status: TRANSLATED
      natural_language: 'For every authoritative state representation s and every revision H, if s is an optimized authoritative
        lifecycle representation at the common authoritative frontier H (including a snapshot, checkpoint, cleanup, or compaction
        result covered by G3), or s is the result of a completed owner recovery at that same frontier H, then all of the following
        hold for the pair (s, H): within the applicability domain of logical_state_equivalence_at_frontier, s stands in that
        contract''s semantic-equivalence relation to deterministic canonical replay through H; the logical document state
        denoted by s equals deterministic canonical replay of the accepted revisions through H; the authoritative latest_revision
        preserved by s is exactly H; and, if s is used to resume owner service, s reconstructs at H the acceptance-relevant
        state required to continue accepting from H without changing canonical semantics.

        For every recovery attempt r, if r is a recovery_document_scope_attempt, let d be recovery_target_document(r), the
        target document identity bound to r. This classification covers the entire source-covered new-owner recovery lifecycle
        for d, beginning before the first authoritative owner context, recovery head, checkpoint, tail, metadata-reconstruction
        input, runtime-installation input, or resumed-service input is selected, captured, consumed, constructed, installed,
        or used; it also includes stalled, crashed, and aborted prefixes, so no source-covered stage of r falls outside the
        applicability boundary merely because a later recovery phase has not been reached. Under that guard, the recovery
        sources used by r must preserve d as the same document identity with respect to their actual recovery observations
        and uses: the authoritative ownership-generation/current-epoch context actually used for r, the recovery_head actually
        captured for r, the authoritative checkpoint actually selected for r, every accepted_change_log entry actually replayed
        by r, and the recovered_owner_runtime_state actually installed by r must all remain bound to d. The same document
        binding must continue when those authoritative objects are consumed during metadata reconstruction, runtime installation,
        or service resumption, and an extensionally equal authoritative object belonging to another document cannot substitute
        for d in any of those canonical roles. Candidate heads, checkpoints, or log entries that are merely examined but are
        not captured, selected, or replayed acquire no independent provenance obligation from this relation. This source-preservation
        obligation imposes no progress or existence requirement on later recovery stages and adds no separate provenance obligation
        for intermediate derived reconstruction states before installation.

        For every recovery attempt r under the same recovery_document_scope_attempt guard, again with d = recovery_target_document(r),
        every rebuilt logical/OT runtime state that is actually constructed as the recovery reconstruction result before installation,
        and every resumed owner context that is actually established when service resumes, must preserve d as the same document
        identity. An extensionally equal rebuilt runtime state or resumed owner context belonging to another document cannot
        substitute for d. This rebuilt-runtime/resumed-context obligation does not require either stage ever to occur and
        does not constrain unrelated intermediate computation artifacts.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 686689c758e48bd95d4f539ac7ba73a99778d4adfef81eb94d710539276b21cf
        verdict: EQUIVALENT
        reason: 'The formula preserves both source guarantees: every covered optimized representation or completed recovery
          is required to satisfy the frontier logical-state equivalence contract, with its canonical-replay, latest-revision,
          and service-resumption acceptance-state obligations; and every new-owner recovery attempt is document-bound from
          the pre-head authoritative owner context through each actually occurring captured head, selected checkpoint, replayed
          tail, rebuilt runtime state, installed state, and resumed owner context. The helper predicates retain document provenance
          rather than extensional-value equality and explicitly preserve the source''s no-progress/no-completion requirement,
          with no material extra or omitted obligation.'
        differences: []
      strengthening:
        subject_signature: 686689c758e48bd95d4f539ac7ba73a99778d4adfef81eb94d710539276b21cf
        verdict: EQUIVALENT
        reason: 'The formula preserves both source guarantees: every covered optimized authoritative lifecycle representation
          or completed recovery at frontier H is required to satisfy the logical-state equivalence relation, with only the
          relation''s defining frontier, logical-state, and resume-state obligations made explicit; and every new-owner recovery
          attempt is document-bound from its authoritative owner context through each actually occurring head, checkpoint,
          replay, rebuilt-runtime, installation, and resumption stage without imposing progress. The helper meanings preserve
          the source applicability boundary, document identity/provenance coordinate, and exclusion of merely unperformed
