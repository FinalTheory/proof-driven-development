records:
  contract:accepted_evidence_correspondence:
    kind: contract
    subject_id: accepted_evidence_correspondence
    subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
    roundtrip:
      subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
      status: TRANSLATED
      natural_language: 'For every authoritative state s and every idempotency key k, if the composite
        authoritative idempotency identity k = (document_id, client_change_id) is within the 30-day normal
        retry/reconnect eligibility horizon in authoritative state s, then the following two implications
        must hold: if authoritative accepted_idempotency_evidence exists in state s for the same composite
        idempotency key k, then accepted_change_log in authoritative state s contains exactly one committed
        canonical acceptance whose authoritative idempotency_key is the same composite identity k; and
        if accepted_change_log in authoritative state s contains exactly one committed canonical acceptance
        whose authoritative idempotency_key is the same composite identity k, then authoritative accepted_idempotency_evidence
        exists in state s for the same composite idempotency key k.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The formula preserves the original iff correspondence between accepted_idempotency_evidence
          and exactly one committed canonical acceptance within the 30-day eligibility scope, with the
          same idempotency identity and authoritative-state observation boundary.
        differences: []
      strengthening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The formula preserves the source contract's applicability boundary, identity coordinates,
          bidirectional correspondence, cardinality requirement, and authoritative-state observation scope.
          The lifecycle preservation statement is represented by the state invariant semantics rather
          than an additional predicate.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the bidirectional correspondence, identity coordinates,
          30-day eligibility boundary, authoritative state scope, and exactly-one committed canonical
          acceptance cardinality of the source invariant.
        differences: []
      strengthening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The rendering preserves the original state invariant, applicability horizon, authoritative
          observation scope, identity coordinates, bidirectional correspondence, and exactly-one cardinality
          requirement without adding guarantees outside the contract boundary.
        differences: []
  claim:L92_captured_recovery_head_equals_authoritative_frontier:
