  claim:L101_client_completes_catchup_through_response_head:
    kind: claim
    subject_id: L101_client_completes_catchup_through_response_head
    subject_signature: 2c42c00f1012889e4c8ec30ae573877dc38d7b89659a933e3345cc793f9bfe9d
