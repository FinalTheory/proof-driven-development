        reason: The formula preserves the durable-lifecycle antecedent, both document_id and client_change_id identity components,
          prior commitment, derivation from a committed canonical acceptance, and the only-committed-provenance exclusion
          of never-committed and provisional sources, with no material strengthening or weakening.
