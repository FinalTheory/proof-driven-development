  contract:definitive_rejection_request_binding:
    kind: contract
    subject_id: definitive_rejection_request_binding
    subject_signature: 97f55044d9271787695420e123c1d453855f83d89ea27d032136dc528b9a39db
    roundtrip:
      subject_signature: 97f55044d9271787695420e123c1d453855f83d89ea27d032136dc528b9a39db
      status: TRANSLATED
      natural_language: For every TerminalResultRecord t, if t is an authoritative REJECTED outcome carrying a definitive
        rejection reason, then let d be the definitive rejection decision from which t derives, and let r be the exact submitted_request
        for which d was produced. The rejected terminal result t must carry exactly the same full (document_id, client_change_id)
        identity as r. When d's definitive rejection reason depends on raw_edit or base_revision, d must use exactly the raw_edit
        or base_revision values from that same bound request r. In addition, throughout the processing path that produces
        d from exactly r and carries that rejection into the authoritative REJECTED terminal result t, every applicable validation
        boundary, OT/rebase evaluation, asynchronous-routing boundary, per-key arbitration boundary, and terminal-commit boundary
        must preserve r as the producer binding. Revalidation, recomputation, or repackaging is allowed only if the rejection
        capable of feeding t remains produced from that same exact request instance r; substituting a different request instance
        or a different logical edit and later repairing the endpoint does not satisfy this provenance relation, even if the
        substitute is extensionally equal. The preserved binding therefore carries r's exact document_id and client_change_id
        and, whenever the definitive reason depends on them, r's raw_edit and base_revision semantics. No listed processing
        stage is required to exist when it is inapplicable. This proposition also does not require single-valued terminal
        arbitration, replay of an already-linearized result, current-owner-generation authorization, liveness, retry behavior,
        delivery, ordering, or any additional temporal behavior beyond what is explicitly encoded. Here terminal_result denotes
        only an authoritative terminal outcome for one idempotency_key within the normal retry horizon, either ACCEPTED with
        a canonical result or definitively REJECTED. A definitive_rejection_decision is a server-side definitive negative
        decision produced for one submitted_request and eligible to become such an authoritative REJECTED result; timeout,
        cancellation, transport loss, and crash-before-decision are not definitive_rejection_decisions, so those uncertainty
        conditions cannot instantiate the authoritative definitive-REJECTED guard of this implication.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 97f55044d9271787695420e123c1d453855f83d89ea27d032136dc528b9a39db
        verdict: EQUIVALENT
        reason: 'The universal implication is guarded exactly to authoritative REJECTED(definitive rejection reason) terminal
          results, and its decision/request chain preserves the canonical provenance: the terminal derives from a definitive
          rejection decision produced for one exact submitted_request, the full (document_id, client_change_id) identity matches
          that request, rejection-relevant raw_edit/base_revision values come from it when applicable, and every applicable
          validation, OT/rebase, routing, arbitration, and commit boundary preserves that producer binding. The helper meanings
          also retain the source exclusions and explicitly avoid adding single-valued arbitration, replay, owner-generation
          authorization, liveness, retry, or delivery requirements.'
        differences: []
      strengthening:
        subject_signature: 97f55044d9271787695420e123c1d453855f83d89ea27d032136dc528b9a39db
        verdict: EQUIVALENT
        reason: The universal implication covers exactly authoritative REJECTED terminal results, binds each such result to
          the definitive rejection decision from which it derives and that decision to its exact submitted request, and then
          enforces the same (document_id, client_change_id), conditional raw_edit/base_revision provenance, and preservation
          of that producer binding across every applicable processing boundary. The helper meanings explicitly exclude substitution
          by another request or logical edit while adding no liveness, replay, single-valued arbitration, owner-generation,
          or other requirement outside the canonical contract.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 97f55044d9271787695420e123c1d453855f83d89ea27d032136dc528b9a39db
        verdict: EQUIVALENT
        reason: The rendering preserves the source contract's universal guard over authoritative definitive-REJECTED terminal
          results, the exact (document_id, client_change_id) identity and exact submitted_request producer binding, the conditional
          raw_edit/base_revision provenance, and preservation of that binding across the listed applicable processing boundaries.
          Its singular d/r phrasing binds the relevant provenance witnesses without asserting uniqueness, and its explicit
