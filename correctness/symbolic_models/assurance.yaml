        differences: []
      strengthening:
        subject_signature: f0958426822769f618719a1b97a2d340c7cf3fa6e99dc48501345118a6e6a060
        verdict: EQUIVALENT
        reason: Every exposed live change must originate from a committed acceptance record, preserving that same record's
          document scope, canonical payload, and revision provenance. The shared existential witness prevents substitution
          of an equally-valued record from another document. No uniqueness, ordering, timeliness, or eventual-delivery obligation
