      status: TRANSLATED
      natural_language: 'The conjunction of the following holds. (1) For every catch-up response r, if r is a catch-up or
        reconnect response for some target document D and the response-specific head value H for that attempt has already
        been captured and fixed, then catch-up canonical sources preserve document scope for r: for r targeting its requested
        document D at its already-captured response head H, every canonical payload source actually selected or consumed for
        that response preserves its semantic authoritative binding to D throughout response construction, private candidate
        construction, and any publication; in delta mode every returned canonical accepted change originates from accepted_change_log
        for D; in snapshot mode the selected checkpoint is D''s authoritative snapshot_content_with_snapshot_revision and
        every canonical tail change originates from accepted_change_log for D; every resulting client_resync_candidate remains
        bound to the same target D throughout construction and any publication; substituting another document''s authoritative
        source fails this relation even if revision, payload, frontier, and replay-result values are identical or its fields
        are relabeled as D, while sharing content-addressed or deduplicated immutable bytes satisfies it when the semantic
        authoritative reference remains D''s; it constrains only stages and sources actually reached or used and does not
        require completion, candidate creation, or publication; and no selected or consumed canonical payload source may contribute
        authoritative state beyond H, namely no selected delta or snapshot-tail acceptance may have canonical revision greater
        than H, no selected snapshot may have snapshot_revision greater than H, and no returned response, client_resync_candidate,
        or publication for r may semantically include a canonical acceptance beyond H, this being only an upper temporal boundary
        and not requiring any particular acceptance at or below H, exact or contiguous range coverage, replay correctness,
        head-capture correctness, publication atomicity, completion, publication, or progress. (2) For every catch-up response
        r, all four implications hold: if the complete canonical revision range L+1..H for r, from r''s client frontier L
        to r''s captured authoritative response head H, is retained and readable in authoritative storage with every canonical
        accepted change in that range available to be returned, then r is in delta mode; if r is in delta mode, then that
        complete range is retained and readable for r; if that complete range is not retained and readable for r, then r is
        in snapshot mode; and if r is in snapshot mode, then that complete range is not retained and readable for r. Here
        delta mode means catch-up selected the retained canonical revision range for r and r is to be constructed by returning
        canonical accepted changes from that range rather than by snapshot replacement, and snapshot mode means catch-up selected
        a checkpoint for r and r is to be constructed by snapshot replacement rather than by delta/range application. (3)
        For every catch-up response r, revision l, revision h, canonical acceptance a, and revision v, if l is the user-visible
        last_applied_revision of the client that requested r at the start of r''s catch-up attempt, r is in delta mode, l
        is the base frontier from which r''s delta range is computed (the same client frontier), h is the authoritative response
        head captured for r, v is the canonical revision assigned to a (each canonical accepted change having exactly one
        assigned revision), v lies in the delta range (l, h] i.e. l < v and v <= h, and a is a member of accepted_change_log(D)
        where D is the target document of r (an extensionally equal accepted change from another document''s log does not
        satisfy this), then a is one of the changes returned in the delta portion of r. (4) For every r, l, h, a, and v as
        above, if l is r''s client frontier as above, r is in delta mode, l is r''s delta base frontier, h is r''s captured
        head, a is returned in the delta portion of r, v is the canonical revision assigned to a, and a is in the target document''s
        log as above, then v lies in the delta range (l, h]. (5) For every r, l, and h, if l is r''s client frontier as above,
        r is in delta mode, l is r''s delta base frontier, and h is r''s captured head, then within the delta returned by
        r for the range (l, h] no canonical accepted change appears more than once and the returned changes are arranged in
        increasing revision order, this asserting multiplicity and ordering only. (6) For every r and l, if l is r''s client
        frontier as above and r is in delta mode, then no speculative data appears anywhere in r''s returned delta portion,
        i.e. every returned payload item is canonical accepted data, not an unaccepted, uncommitted, or locally speculative
        change. (7) The snapshot conjunction holds: (7a) for every r, revision s, and revision h, if r is in snapshot mode,
        s is the frontier coordinate of the checkpoint (content, s) that catch-up selected for r, and h is r''s captured head,
        then r identifies exactly the checkpoint (content and frontier) that catch-up selected for it, not another checkpoint
        and not a mixture of checkpoints, and r specifies that its checkpoint content replaces the client''s prior document
        state rather than being appended or patched onto it; (7b) for every r, s, h, a, and v, if r is in snapshot mode, s
        is r''s selected checkpoint frontier, h is r''s captured head, v is the canonical revision assigned to a, v lies in
        the checkpoint tail range (s, h] i.e. s < v and v <= h, and a is in the target document''s log as above, then a is
        one of the changes returned in the tail portion of r; (7c) for every r, s, h, a, and v, if r is in snapshot mode,
        s is r''s selected checkpoint frontier, h is r''s captured head, a is returned in the tail portion of r, v is the
        canonical revision assigned to a, and a is in the target document''s log as above, then v lies in the checkpoint tail
        range (s, h]; (7d) for every r, s, and h, if r is in snapshot mode, s is r''s selected checkpoint frontier, and h
        is r''s captured head, then within the tail returned by r for the range (s, h] no canonical accepted change appears
        more than once and the returned changes are arranged in increasing revision order, this asserting multiplicity and
        ordering only. (8) For every catch-up response resp and revision h, if resp is in snapshot mode and h is resp''s captured
        head, then there exists a revision s such that s is the frontier coordinate of the checkpoint selected for resp, the
        selected checkpoint (content, s) is an authoritative checkpoint identity, i.e. a genuine authoritative checkpoint
        for resp''s target document and not a stale-cache or non-authoritative candidate, and s is at or before h (s <= h).
        (9) For every r and s, if r is in snapshot mode and s is r''s selected checkpoint frontier, then the document state
        denoted by a snapshot checkpoint at frontier s equals deterministic canonical replay of all and only the canonical
        accepted changes in accepted_change_log with revisions 1..s, this being conditional over checkpoints, constraining
        every snapshot checkpoint whose frontier is s and vacuous at a revision with no checkpoint. (10) For every r, if r
        is in snapshot mode, then no speculative data appears anywhere in r''s returned snapshot tail portion, i.e. every
        returned tail payload item is canonical accepted data, not an unaccepted, uncommitted, or locally speculative change.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: b2fb29308e77d442081f28963c0d4773d71c391265c719ea9c6814c4a1d489ec
        verdict: EQUIVALENT
        reason: 'The formula faithfully decomposes the claim: provenance/document-scope is asserted for targeted responses;
