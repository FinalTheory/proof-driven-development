  obligation:accepted_reconciliation_closes_pending_lifecycle:
    kind: obligation
    subject_id: accepted_reconciliation_closes_pending_lifecycle
    subject_signature: f488e0e181ecf67c9185ecb66256f9755d2196efc359cf0ab329ff9181ad0de9
    roundtrip:
      subject_signature: f488e0e181ecf67c9185ecb66256f9755d2196efc359cf0ab329ff9181ad0de9
      status: TRANSLATED
      natural_language: For every client state s and every exact logical edit identity e, if s is exactly the user-visible
        state atomically exposed by a normal foreground reconnect or reconciliation publication through response head H, after
        the authoritative reconciliation result classified e as ACCEPTED at canonical revision r with r <= H, and the reconciled
        canonical state published through H contains that acceptance, then e is not active in client_pending_edits in that
        same state s at that publication boundary, rather than only after a later cleanup transition. Here client_pending_edits
        is the speculative collection of unresolved logical client edits retained by client_change_id while their canonical
        acceptance outcome or conflict disposition is not yet known.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: f488e0e181ecf67c9185ecb66256f9755d2196efc359cf0ab329ff9181ad0de9
        verdict: EQUIVALENT
        reason: The canonical sections explicitly require same-identity ACCEPTED reconciliation within response head H to
          remove active unresolved pending participation by atomic publication. The formula universally quantifies client
          states and logical edit identities, preserves normal foreground publication scope and exact identity, and requires
          pending inactivity at that publication boundary. It faithfully captures the extracted pending-lifecycle obligation
          without importing the broader retained-overlay or subsequent lifecycle-closure requirements.
        differences: []
      strengthening:
        subject_signature: f488e0e181ecf67c9185ecb66256f9755d2196efc359cf0ab329ff9181ad0de9
        verdict: EQUIVALENT
        reason: The canonical source explicitly requires same-identity ACCEPTED reconciliation within response head H to remove
          active unresolved pending participation before or atomically with publication. The formula preserves universal quantification
          over states and logical edit identities, normal foreground publication scope, authoritative exact-identity acceptance
          within H, and the resulting publication boundary. The catalog defines pending edits as unresolved, so negating active
          pending membership expresses precisely the extracted obligation without adding subsequent-state or broader lifecycle
          guarantees.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: f488e0e181ecf67c9185ecb66256f9755d2196efc359cf0ab329ff9181ad0de9
        verdict: EQUIVALENT
        reason: Both require that authoritative ACCEPTED reconciliation of an exact logical edit identity within the published
          response head leaves that identity absent as an active unresolved pending edit in the resulting normal foreground
          publication. The canonical sections expressly support retirement before or atomically with publication; the rendering
          preserves this boundary and adds no eventual-progress or broader lifecycle guarantee.
        differences: []
  obligation:visible_speculative_representation_valid_on_current_base:
    kind: obligation
    subject_id: visible_speculative_representation_valid_on_current_base
    subject_signature: c56d0eb4638be8c86c9d1e5d2947ee499d3e4c7f6ce8c41d41b84ba9989e3d94
    roundtrip:
      subject_signature: c56d0eb4638be8c86c9d1e5d2947ee499d3e4c7f6ce8c41d41b84ba9989e3d94
      status: TRANSLATED
      natural_language: For every client state s and every overlay o, if o is a retained speculative overlay currently exposed
        in the user-visible client state s, retaining its document identity, then composing o over the canonical base visible
        in that same state s still realizes the original logical edit operation represented by o.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: c56d0eb4638be8c86c9d1e5d2947ee499d3e4c7f6ce8c41d41b84ba9989e3d94
        verdict: STRONGER
        reason: The formula faithfully expresses the extracted statement, but that statement adds a current-base compatibility
          requirement not committed to by the cited canonical sections. Preserving an overlay's original operation provenance
          does not establish that composing it over a changed canonical base preserves the original edit's semantics.
        differences:
        - The formula requires every exposed overlay to remain semantically compatible with the currently visible canonical
          base, thereby requiring suppression or correction of incompatible unresolved overlays. The source requires operation
          provenance and blocks normal editing while pending edits remain unresolved, but does not require such overlays to
          be suppressed or corrected for compatibility with a changed base.
      strengthening:
        subject_signature: c56d0eb4638be8c86c9d1e5d2947ee499d3e4c7f6ce8c41d41b84ba9989e3d94
        verdict: STRONGER
        reason: The formula faithfully expresses the extracted statement, but that statement adds a current-base semantic
          compatibility requirement absent from the cited sections. Those sections require preservation of the original encoded
          logical operation, but do not require its composition over every currently visible canonical base to realize that
          operation.
        differences:
        - The formula forbids exposing any representation incompatible with the current canonical base, effectively requiring
