          accepting no new edit for the same document, and requires exactly the same logical accepted prefix and equal document_latest_revision
          before and after; its second conjunct additionally carries gap-free status and ending exactly at that frontier from
          before to after when those hold before, matching the preserved gap-free prefix ending at H.
        differences: []
