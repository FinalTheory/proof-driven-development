      natural_language: 'This is a provenance_binding, constraining only the identity/provenance relation between its source
        and bound symbols for every modeled occurrence covered by the formula, and implying no liveness, delivery, ordering,
        or other temporal behavior except as explicitly encoded below. All three of the following hold. (1) For every TerminalResultRecord
        t and every CanonicalAcceptance a, if t and a are an accepted_terminal_contract_acceptance_assembly_pair — i.e., t
        and a are exactly a terminal-result / matching canonical-accepted-change pair constructed at the successful acceptance_transaction
        assembly boundary for one logical acceptance, a classification that by itself asserts no producer correctness, durable
        commit, co-commit, producer-binding metadata materialization, or later provenance reachability — and t is an accepted_terminal_result_record,
        i.e., an authoritative ACCEPTED (canonical result) outcome, and t is accepted_terminal_result_within_retry_horizon,
        i.e., the full identity t carries is still a normal_retry_eligible_identity within the normal retry eligibility horizon
        in which producer provenance must be retained, a classification of horizon membership only, then all of the following
        hold: a is an accepted_terminal_contract_source_acceptance, i.e., a is the canonical_accepted_change producer on the
        authoritative accepted_change_log source side of accepted_terminal_result_binding for the producer relation under
        audit, without by itself asserting durable commit, co-commit with the terminal-result write, commit timing, or current
        physical retention of the original accepted row after provenance-preserving compaction or representation change; the
        full idempotency_key carried by t, terminal_result_idempotency_key(t), being document_id plus client_change_id, equals
        acceptance_key(a), the authoritative idempotency identity carried by a; accepted_terminal_contract_binding_established_at_assembly(t,
        a) holds, i.e., at that successful assembly boundary the semantic producer binding is established such that t carries
        the canonical result produced by the same acceptance execution that produced a, rather than a result from another
        request, document, acceptance execution, or a merely extensionally equal substitute, without requiring a separate
        producer-binding metadata object to be materialized at that moment and without by itself asserting durable commit,
        co-commit, or later lifecycle ancestry; and terminal_result_bound_to_acceptance_execution(t, a) holds, i.e., t carries
        a canonical result produced by the same acceptance execution that produced a for the producer binding under audit,
        by the same test applied to any representation of the same logical terminal outcome, without by itself asserting that
        a committed, when binding metadata was materialized, or that t is provenance-reachable from an acceptance origin.
        (2) For every TerminalResultRecord t, if t is an accepted_terminal_result_record and t is accepted_terminal_result_within_retry_horizon,
        then there exists a CanonicalAcceptance a such that all of the following hold: a is an accepted_terminal_contract_source_acceptance
        as defined in (1); terminal_result_idempotency_key(t) equals acceptance_key(a); terminal_result_bound_to_acceptance_execution(t,
        a) holds as defined in (1); there exists a TerminalResultRecord t0 such that accepted_terminal_contract_acceptance_assembly_pair(t0,
        a) holds, accepted_terminal_contract_binding_established_at_assembly(t0, a) holds, terminal_result_idempotency_key(t0)
        equals acceptance_key(a), and either t0 equals t or t is reachable from t0 by the transitive closure of accepted_terminal_lifecycle_edge,
        where each such edge is one authoritative in-horizon ACCEPTED terminal-result representation transition preserving
        the same already-linearized logical terminal outcome and full (document_id, client_change_id) identity, hence non-terminal
        in the lifecycle sense because the outcome is preserved rather than created, replaced, or reclassified — non-terminal
        not being an additional applicability filter — and asserting no producer-binding preservation and no classification
        into a concrete architecture lifecycle category; and there does not exist a CanonicalAcceptance a2 such that a2 is
        not equal to a and terminal_result_bound_to_acceptance_execution(t, a2) holds. (3) For every ProtocolTransition x
        and every TerminalResultRecords before and after, if accepted_terminal_contract_lifecycle_transition(x, before, after)
        holds — i.e., x is an in-horizon authoritative lifecycle transition preserving one already-linearized ACCEPTED logical
        terminal outcome from before to after under the same full idempotency identity, possibly rewriting the durable physical
        representation or preserving it unchanged, and asserting by itself no producer-binding preservation — then there exists
        a CanonicalAcceptance a such that all of the following hold: a is an accepted_terminal_contract_source_acceptance
        as defined in (1); terminal_result_idempotency_key(before) equals acceptance_key(a); terminal_result_idempotency_key(after)
        equals acceptance_key(a); terminal_result_bound_to_acceptance_execution(before, a) holds; terminal_result_bound_to_acceptance_execution(after,
        a) holds; there exists a TerminalResultRecord t0 such that accepted_terminal_contract_acceptance_assembly_pair(t0,
        a) holds, accepted_terminal_contract_binding_established_at_assembly(t0, a) holds, terminal_result_idempotency_key(t0)
        equals acceptance_key(a), and either t0 equals before or before is reachable from t0 by the transitive closure of
        accepted_terminal_lifecycle_edge as defined in (2); and there does not exist a CanonicalAcceptance a2 such that a2
        is not equal to a and terminal_result_bound_to_acceptance_execution(after, a2) holds.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 099c6b0fd9ac83f8a8c9878b47a142c7b9950e169ba21b92c0a6f765d91f4d06
        verdict: EQUIVALENT
        reason: The formula covers every in-horizon ACCEPTED terminal result, requires an assembly-established producer binding
          to a source canonical acceptance with the identical full idempotency key, derives later representations from that
