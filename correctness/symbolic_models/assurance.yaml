      subject_signature: 6a9492197e239a44e9dd94ed5e0c8cf17e43a295f4f47e34aad7ec9c23f84634
      status: TRANSLATED
      natural_language: 'For every protocol execution t, including any execution prefix and any stalled, crashed, or aborted
        execution, and every document d, if t is a non-append authoritative snapshotting, checkpoint-replacement, cleanup,
        or compaction lifecycle execution targeting d, then t preserves d''s authoritative history scope: every authoritative
        accepted-history or checkpoint input that actually semantically supplies the lifecycle transformation remains bound
        to d throughout its participation, and every durable authoritative lifecycle output that t actually installs or publishes
        is bound to d. The document targeted by t is considered independently of whichever documents own the actual inputs
        or outputs, so history or checkpoint state from another document may not be relabeled as belonging to d even when
        revision, payload, frontier, replay, or other relevant values happen to coincide. Physical content-addressed blobs,
        pages, or bytes may be shared across documents provided the authoritative references participating in the lifecycle
        remain bound to d. Merely inspecting or rejecting an unrelated candidate does not make that candidate a semantic input.
        This requirement applies without assuming that any input or output stage is reached, that the execution completes
        or makes eventual progress, or that replay equivalence, frontier behavior, recovery correctness, physical retention,
        or physical object identity has any particular property; ordinary canonical appends and recovery procedures, as such,
        are outside this lifecycle classification.'
