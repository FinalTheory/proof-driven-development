  claim:G5_retry_resolves_idempotently:
    kind: claim
    subject_id: G5_retry_resolves_idempotently
    subject_signature: 93c1b9a7210b8c86927bdd3ba4fcb6ea270582b709e259cadd96d9b4c331947c
    roundtrip:
      subject_signature: 93c1b9a7210b8c86927bdd3ba4fcb6ea270582b709e259cadd96d9b4c331947c
      status: TRANSLATED
      natural_language: 'The conjunction of all of the following holds. (1) For every authoritative state s and every idempotency
        key k, if s is reachable under the canonical server protocol and failure model and k, as the exact full composite
        identity (document_id, client_change_id), is within the configured normal retry eligibility horizon in s (this predicate
        assuming no fixed duration such as 30 days), then all of the following hold in s for k: s contains at most one durable
        terminal result for the exact full composite identity k, with equal client_change_id values in different document
        namespaces counting as distinct identities; if that exact identity has an ACCEPTED terminal outcome in s, the canonical
        accepted history for that same document contains the matching canonical acceptance for that exact identity and no
        incompatible REJECTED outcome exists for that same identity; if that exact identity has a REJECTED terminal outcome
        in s, the canonical accepted history for that same document contains no canonical acceptance for that exact identity;
        and the terminal outcome for k is immutable in the sense that, once a terminal outcome for k has linearized, every
        later acceptance or definitive-rejection transition for that same identity whose resulting authoritative state remains
        within the configured normal retry eligibility horizon for k preserves the same single-valued outcome, with post-horizon
        transitions or re-submissions outside this immutability predicate and with no added progress requirement. (2a) For
        every terminal result record t, if t is an authoritative ACCEPTED (canonical result) outcome and t is within the normal
        retry eligibility horizon (i.e., the full identity t carries is still a normal_retry_eligible_identity, the horizon
        in which producer provenance must be retained, this horizon predicate classifying horizon membership only), then there
        exists a canonical acceptance a such that a is a committed canonical accepted-change record in authoritative accepted
        history, the full idempotency key carried by t equals the authoritative idempotency identity carried by a, and t carries
        a canonical result produced by the same acceptance execution that produced and committed a for the same full identity,
        with that producer provenance correct at authoritative terminalization and remaining the same in any later lifecycle
        representation on which this relation is asserted, without requiring that the binding metadata have been materialized
        during acceptance-transaction assembly and without treating a transient intermediate metadata substitution discarded
        before authoritative terminalization as a violation. (2b) For every protocol transition x and every terminal result
        records before and after, if x is an authoritative lifecycle representation change, within the normal retry eligibility
        horizon, that preserves one already-linearized ACCEPTED logical terminal outcome from representation before to representation
        after while possibly rewriting its durable physical representation, with before and after carrying the same full idempotency
        identity, then there exists a canonical acceptance a such that a is committed as in (2a), the full idempotency key
        carried by before equals the identity carried by a, the full idempotency key carried by after also equals the identity
        carried by a, and the producer-match relation described in (2a) holds both for before with a and for after with a.
        (3) For every terminal result record t, if t is an authoritative REJECTED (definitive rejection reason) outcome, then,
        letting d be the definitive rejection decision from which t derives and letting r be the exact submitted request for
        which d was produced, both of the following hold: t and r carry the exact same full (document_id, client_change_id)
        identity; and, when the definitive rejection reason depends on raw_edit or base_revision, d uses those exact values
        from r. (4) For every terminal result record t, if t is an authoritative rejected terminal result whose definitive
        rejection reason''s truth depends on document/history state, then, with d as in (3), d is bound to authoritative same-document
        rejection context rather than unvalidated stale owner-local state, and the authoritative context/evidence for d remains
        sufficient when t linearizes, either because it is current or because a reason-specific guard, monotonicity argument,
        or revalidation preserves the rejection truth. (5) For every external terminal result x, if x is a definitive externally
        terminal result exposed to a client and x belongs to the normal retry eligibility horizon for its logical edit, whether
        x is returned by the initial normal submission or by an in-horizon retry/reprocessing attempt (a post-expiry re-submission
        being outside this horizon predicate), then x exactly reproduces the already-linearized authoritative terminal outcome
        for the same full key that is the full idempotency key associated with x, and attempt-local transient computations
        cannot substitute a conflicting result. (6a) For every authoritative state s and every idempotency key k, if s is
        reachable as in (1), then if the composite identity k is within the 30-day normal retry/reconnect eligibility horizon
        in s, k is also within the configured normal retry eligibility horizon in s as in (1). (6b) For every request r, if
        r is a normal submitted request representing one logical edit within the 30-day normal retry eligibility horizon,
        then r preserves the same full request identity, raw_edit semantics, and canonical authoring frontier for its logical
        operation, and those coordinates are not cross-bound from another operation. (6c) For every protocol transition t
        and every idempotency key k, if t is any acceptance attempt or definitive-rejection attempt for the exact full key
        k while that logical identity remains within the 30-day normal retry eligibility horizon, with no acceptance or definitive-rejection
        path excluded by being classified outside some narrower terminal-result subprotocol and with post-expiry re-submission
        outside this predicate, then t arbitrates through the same single authoritative per-key terminal state used by every
        competing acceptance and definitive-rejection attempt for k, and no independent arbitration domain may decide a second
        terminal outcome. (6d) For every protocol transition t and every terminal result records before and after, if t is
        an authoritative lifecycle representation rewrite, within the 30-day normal retry eligibility horizon, from representation
        before to representation after for the same already-linearized logical terminal outcome and the same full idempotency
        key, with the durable physical representation possibly changing, then t preserves the same already-linearized logical
        terminal outcome from before to after: an ACCEPTED outcome preserves the exact canonical result, and a REJECTED outcome
        preserves the same definitive rejection reason, with physical representation allowed to change and, for REJECTED,
        without requiring preservation of the same rejection-decision object or producer when the exact request binding and
        required authoritative-context justification remain valid.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 93c1b9a7210b8c86927bdd3ba4fcb6ea270582b709e259cadd96d9b4c331947c
        verdict: EQUIVALENT
        reason: 'Every claim requirement is faithfully encoded: retry-request identity/payload/frontier coherence, per-key
          at-most-one terminal outcome with ACCEPTED/REJECTED mutual exclusion and immutability in reachable in-horizon states,
          accepted producer binding to a committed canonical acceptance for the exact full identity including preservation
          across lifecycle rewrites, rejected binding to the decision''s exact submitted request identity and raw_edit/base_revision
          values, state-dependent rejection requiring same-document authoritative context sufficient at terminalization (with
          request-intrinsic reasons exempt), shared per-key arbitration for all in-horizon attempts, exact-outcome preservation
          across lifecycle rewrites, and external results exactly reproducing the linearized authoritative outcome within
          the horizon, with post-expiry resubmission excluded and no liveness requirement added. The predicate carve-outs
          (no assembly-time metadata materialization, no rejected decision-object identity preservation) match the claim statement
          itself rather than the stronger contract context, so they are not weakenings.'
        differences: []
      strengthening:
        subject_signature: 93c1b9a7210b8c86927bdd3ba4fcb6ea270582b709e259cadd96d9b4c331947c
        verdict: EQUIVALENT
        reason: The formula preserves the horizon-scoped single-valued terminal coherence, accepted producer and lifecycle
          binding, rejected request binding, state-dependent authoritative-context binding, external-result reproduction,
          retry-request coherence, shared per-key arbitration, and lifecycle immutability, with the same full identities and
          exclusions and no added or omitted requirement.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 93c1b9a7210b8c86927bdd3ba4fcb6ea270582b709e259cadd96d9b4c331947c
        verdict: EQUIVALENT
        reason: The rendering preserves the original's quantifiers, full-identity coordinates, horizon and post-expiry boundaries,
          single-valued immutable arbitration, accepted and rejected provenance bindings, state-dependent context sufficiency,
          and external-response reproduction, without adding or omitting a material guarantee.
        differences: []
  claim:G12_client_pending_state_tracks_unresolved_edits:
    kind: claim
    subject_id: G12_client_pending_state_tracks_unresolved_edits
    subject_signature: f884dce95c34db936cc647ee9df4bc3300680a8ab33145e8974d9eb2e97c8811
    roundtrip:
      subject_signature: f884dce95c34db936cc647ee9df4bc3300680a8ab33145e8974d9eb2e97c8811
      status: TRANSLATED
      natural_language: 'All of the following conditions hold simultaneously. (1) For every client state s and every exact
        logical-edit identity e, if s is reachable under the normal client protocol, e is active in client_pending_edits in
        s, and e is still within that same logical edit''s normal speculative lifecycle in s, then the active pending representation
        for e in s remains bound to e''s creation identity, preserving both its document_id and client_change_id rather than
        being relabeled or cross-bound. The lifecycle-active guard is semantic rather than merely physical: the normal speculative
        lifecycle ends when the protocol explicitly expires, conflict/manual-resolves, abandons, authoritatively reconciles,
        or otherwise terminally disposes that edit, and a stale pending entry left after such a boundary does not reactivate
        it. (2) For every reachable client state s and overlay token o, if o is retained in s as an unresolved, acceptance-eligible
        logical edit still within the normal retry/reconnect horizon, then the logical edit represented by o is active in
        client_pending_edits in that same state s. (3) For every reachable client state s and overlay token o, if s reflects
        an acceptance-based retirement of pending edit o with authoritative accepted/reconciled semantics, then that retirement
        is actually derived from canonical acceptance or equivalent authoritative accepted evidence for the exact same full
        logical-edit identity, including both document_id and client_change_id; merely having matching evidence co-present
        is insufficient when an unrelated acceptance source caused the retirement. (4) For every reachable client state s
        and exact logical-edit identity e, if s results from a retirement boundary that has already occurred for e''s normal
        speculative lifecycle with authoritative accepted/reconciled semantics, then that retirement is actually derived from
        canonical acceptance or equivalent authoritative accepted evidence for that same full document_id plus client_change_id
        identity; mere co-presence of matching evidence is insufficient if some unrelated acceptance source caused the retirement.
        This premise classifies an already-occurred accepted-semantics retirement and does not assert that retirement, reconciliation,
        publication, or delivery will eventually occur. (5) For every client state s and exact logical-edit identity e, if
        s is exactly the user-visible state atomically exposed by a normal foreground reconnect/reconciliation publication
        through response head H after the authoritative reconciliation result classified e as ACCEPTED at canonical revision
        r with r <= H, then, at that publication boundary itself, e is not active in client_pending_edits, no normal-lifecycle
        speculative representation for e remains retained in client_speculative_overlays, no normal-lifecycle speculative
        representation for e remains visible in client_visible_speculative_overlays, and e is classified as a terminalized
        normal speculative lifecycle. This publication predicate locates the state and accepted classification boundary only;
        it does not by itself assert that the published canonical state correctly contains the accepted change or is provenance-bound
        to that acceptance. (6) For every protocol transition t and exact logical-edit identity e, if t occurs on a reachable
        execution of the normal client speculative lifecycle and t uses a non-acceptance terminal disposition to terminally
        retire e''s normal speculative lifecycle, then the consumed disposition is for that same logical edit e and preserves
        e''s full document_id plus client_change_id identity through routing, bookkeeping, and the destructive retirement
        sink. (7) Two terminal-lifecycle closure requirements both hold. First, for every reachable client state s and exact
        logical-edit identity e, if e is classified as terminalized in s, then e is not active in client_pending_edits, has
        no retained normal-lifecycle speculative representation, has no visible normal-lifecycle speculative representation,
        and every later user operation that actually occurs for that same document D in the continuing normal client history
        is a genuinely new logical edit rather than a continuation, retry, restore, or reactivation of e=(D,k), and uses a
        client_change_id different from k. If no later user operation for D occurs, that freshness condition is vacuously
        true; it imposes no cross-document change-id restriction, no physical-deletion or tombstone requirement, and no liveness
        or eventual-operation requirement. Second, for every earlier client state, later client state, and exact logical-edit
        identity e, if both states are reachable, the later state is reachable after the earlier state by one or more client-protocol
        transitions in the continuing client lifecycle/history, and e is terminalized in the earlier state, then e is also
        terminalized in the later state and is absent there from pending, retained speculative, and visible speculative active
        state. The allowed intervening transitions include restore/reactivation, view switching, bookkeeping, reconnect/resync,
        and publication transitions. (8) For every client state s and exact logical-edit identity e, if s is exactly the resulting
        user-visible state published at, or atomically with, the authoritative terminal-result publication boundary through
        which the normally participating client observes an authoritative externally terminal definitive REJECTED result carrying
        a definitive rejection reason for e, with that terminal result already linearized before exposure, then that rejection
        observation causes or atomically applies a same-identity non-acceptance terminal disposition or equivalent terminal
        lifecycle transition for e and that terminalizing effect is already effective before or atomically with s; additionally,
        e is not pending, has no retained speculative representation, has no visible speculative representation, and is terminalized
        in s. This premise applies only to that resulting publication-boundary state, not later states that merely remember
        or follow an earlier rejection observation and not authoritative knowledge obtained through another path; a terminalization
        merely scheduled after s, or an unrelated earlier terminalization, does not satisfy the same-identity terminalization
        requirement. (9) For every reachable client state s and exact logical-edit identity e, if s results from authoritative
        reconciliation for that same full identity that actually ends e''s normal speculative lifecycle, regardless of whether
        a foreground publication occurred, then e is not pending, has no retained speculative representation, has no visible
        speculative representation, and is terminalized in s. This premise classifies an already-occurring reconciliation
        boundary and does not assert eventual reconciliation, terminalization, publication, or delivery. (10) For every protocol
        transition t and exact logical-edit identity e, if t occurs on a reachable normal speculative-lifecycle execution
        and performs only bookkeeping deletion, relabeling, or loss of pending/retained speculative representation for e without
        authoritative reconciliation and without an explicit or equivalent terminal disposition ending e''s normal speculative
        lifecycle, then t does not classify, justify, or semantically treat e as resolved or terminalized; e remains unresolved
        in protocol semantics even if buggy physical bookkeeping representations were dropped. (11) For every protocol transition
        t and exact logical-edit identity e, if t occurs on a reachable execution of the normal client speculative lifecycle
        and uses a non-acceptance terminal disposition to terminally retire e''s normal speculative lifecycle, then, before
        or atomically with the destructive retirement, that transition establishes in the resulting reachable client state
        that e''s normal speculative lifecycle is terminalized and no longer active in pending, retained speculative, or visible
        speculative state, so the terminal-lifecycle closure described above applies to every later reachable state.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: f884dce95c34db936cc647ee9df4bc3300680a8ab33145e8974d9eb2e97c8811
        verdict: EQUIVALENT
        reason: No canonical safety obligation C1-C11 is omitted or materially weakened. F1-F11 preserve the corresponding
          reachable-state/transition guards, exact full-identity requirements, causal accepted-evidence derivation for acceptance-semantic
          retirement, exact foreground acceptance-publication boundary semantics, full-identity preservation on non-acceptance
          retirement, absorbing terminalized/inactive closure with genuinely new later same-document edits, exact definitive-rejection
          publication-boundary causal terminalization, same-identity authoritative reconciliation retirement, the prohibition
          on bookkeeping-only removal resolving the lifecycle, and terminalized+inactive establishment before or atomically
          with non-acceptance destructive retirement. The stated helper meanings also retain the canonical non-liveness interpretation
          and the boundary/causality qualifications that prevent foreign acceptance, mere co-presence, prior unrelated terminalization,
          or scheduled-later cleanup from satisfying the clauses.
        differences: []
      strengthening:
        subject_signature: f884dce95c34db936cc647ee9df4bc3300680a8ab33145e8974d9eb2e97c8811
        verdict: EQUIVALENT
        reason: F1-F11 and the stated helper meanings do not add any requirement beyond C1-C11. Their reachability guards,
          exact full-identity matching, causal acceptance/rejection linkage, publication-boundary scope, lifecycle-retirement
          conditions, inactivity/terminalization effects, and explicit no-liveness/no-progress exclusions all track the canonical
          obligations. In particular, F4's matching-acceptance-source causality is already entailed by C4's authoritative
          accepted/reconciled retirement semantics plus its prohibition on foreign acceptance retiring e, and F8's causal
          same-identity terminalization is stated explicitly in C8.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: f884dce95c34db936cc647ee9df4bc3300680a8ab33145e8974d9eb2e97c8811
        verdict: EQUIVALENT
        reason: B is a clause-expanded rendering of A's seven normal-lifecycle contracts with the same effective applicability
          and safety semantics. Its pending/overlay clauses preserve exact (document_id, client_change_id) provenance and
          retained-speculative-to-pending coverage; its accepted-retirement clauses require same-identity authoritative acceptance
          causation and place cleanup/terminalization at the same normal foreground reconnect/reconciliation publication boundary
          without adding a canonical-content/provenance obligation; its rejection and other non-acceptance clauses require
          same-identity terminal disposition at the same destructive/publication boundary. B's separate reconciliation, bookkeeping-loss,
          and terminal-closure clauses make explicit A's rules that bookkeeping cannot resolve an edit, any authoritative
          reconciliation or explicit/equivalent terminal disposition that actually ends the lifecycle leaves no active speculative
          state, and terminalization is absorbing across later protocol transitions. Neither proposition adds liveness, physical-deletion/tombstone
          requirements, cross-document change-id uniqueness, or a requirement to remove archival non-reactivatable state,
          and both require a genuinely new same-document edit to use a different client_change_id. The apparent extra qualifications
          in B (reachability/execution guards, linearized observed rejection, and foreground-publication scoping) merely spell
          out A's declared normal-lifecycle applicability boundaries rather than changing them.
