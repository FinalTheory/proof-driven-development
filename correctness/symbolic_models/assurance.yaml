        acceptance for k; and once a terminal outcome for k has linearized, later acceptance or definitive-rejection attempts
        preserve that same single-valued outcome. For every terminal-result record t, if t is an authoritative ACCEPTED canonical-result
        outcome and is still within the normal retry eligibility horizon in which producer provenance must be retained, there
