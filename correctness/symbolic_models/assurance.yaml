        identity has ended, and may be implemented by deletion or non-reactivatable archival state without a separately materialized
        tombstone. For every client state s and exact logical-edit identity e, if s is reachable and e is active in client_pending_edits
        in s, the pending representation in s remains bound to that edit's creation identity, preserving both document_id
        and client_change_id without relabeling or cross-binding. For every client state s and overlay token o, if s is reachable
        and o represents a retained unresolved acceptance-eligible logical edit within the normal retry/reconnect horizon
        in s, the logical-edit identity represented by o remains active in client_pending_edits in s. For every client state
        s and overlay token o, if s is reachable and s reflects retirement of pending edit o with authoritative accepted/reconciled
        semantics, that retirement is sourced from canonical acceptance or equivalent authoritative accepted evidence for
        the exact same full identity. For every client state s and exact logical-edit identity e, if s is exactly the user-visible
        state atomically exposed by a normal foreground reconnect/reconciliation publication through response head H after
        the authoritative reconciliation result classified e as ACCEPTED at canonical revision r with r <= H, and the reconciled
        canonical state published through H contains that acceptance, then at that publication boundary e is absent from active
        pending edits, has no retained normal-lifecycle speculative representation, has no exposed normal-lifecycle speculative
        representation, and is classified as terminalized in s. These consequences hold at that boundary, not merely after
        a later cleanup transition. For every protocol transition t and exact logical-edit identity e, if t occurs on a reachable
        execution of the normal client speculative lifecycle and uses a non-acceptance terminal disposition to terminally
        retire e's normal speculative lifecycle, the disposition consumed by t was produced for that same logical edit and
        preserves its full document_id and client_change_id identity through routing and the destructive retirement sink.
        A non-acceptance terminal disposition is an explicit lifecycle decision that ends an edit without claiming authoritative
        acceptance, including expiry, abandonment, conflict resolution, manual resolution, or an equivalent path. For every
        client state s and exact logical-edit identity e, if s is reachable and e is classified as terminalized in s, e is
        not active in pending edits in s and has neither a retained nor an exposed normal-lifecycle speculative representation
