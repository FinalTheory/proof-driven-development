        differences: []
      strengthening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: The rendering preserves the original applicability boundary, epoch handoff precondition, provenance direction,
          and equality relation between recovery_head and the authoritative document_latest_revision value observed at the
          capture event. It does not add guarantees beyond the source proposition.
        differences: []
  claim:L108_acceptance_preserves_request_identity:
    kind: claim
    subject_id: L108_acceptance_preserves_request_identity
    subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
    roundtrip:
      subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
      status: TRANSLATED
      natural_language: 'For every canonical acceptance a and every request r, if canonical acceptance a was produced from
        submitted request r, then all of the following hold: the document identity preserved on canonical acceptance a is
        equal to the document identity carried by request r; the client change identity preserved on canonical acceptance
        a is equal to the client-supplied logical edit identity carried by request r; the authoritative idempotency identity
        associated with acceptance a exactly matches the request''s (document_id, client_change_id) identity; and from request
        admission through OT dispatch, idempotency arbitration, retry handling, and canonical commit, neither document_id
        nor client_change_id is dropped, regenerated, substituted, or cross-bound, such that every identity handoff for acceptance
        a remains the originating request r identity. In addition, for every durable idempotency evidence e, if durable idempotency
        evidence e is associated with canonical acceptance a, then e identifies exactly the same (document_id, client_change_id)
        carried by originating request r.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The formula preserves the source proposition's applicability boundary, requiring the guarantees only for canonical
          acceptances produced from submitted requests. It retains both identity coordinates (document_id and client_change_id),
          the end-to-end preservation requirement, and the durable idempotency evidence association requirement. No additional
          cardinality, uniqueness, temporal, or provenance obligation is introduced beyond the canonical claim.
        differences: []
      strengthening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The formula preserves the source applicability boundary by conditioning on an acceptance produced from a request,
          and it encodes the same document_id/client_change_id identity preservation, end-to-end provenance binding, and durable
          idempotency evidence identity requirements stated in the canonical claim. No additional cardinality, uniqueness,
          or out-of-scope guarantee is introduced.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the original contract's quantification, provenance direction, identity
          components, and observation scope. It states that accepted changes retain the originating request's document_id
          and client_change_id and that associated idempotency evidence uses the same identity. The additional wording about
          specific pipeline stages is an expansion of the acceptance path covered by the original claim, not a new semantic
          requirement.
        differences: []
      strengthening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The rendering preserves the original contract's applicability boundary, identity coordinates, provenance direction,
          and observation scope. It restates preservation of document_id and client_change_id through the acceptance path
          and durable idempotency evidence without introducing uniqueness, cardinality, or guarantees beyond the canonical
          acceptance identity-binding requirement.
        differences: []
  claim:L116_live_delivery_is_bound_to_committed_acceptance:
    kind: claim
    subject_id: L116_live_delivery_is_bound_to_committed_acceptance
    subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
    roundtrip:
      subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
      status: TRANSLATED
      natural_language: For every live delivery d such that d is a delivery actually exposed through the websocket live stream,
        there exists a CanonicalAcceptance record a such that a is a committed record in the authoritative accepted_change_log,
        d originates from a as its accepted-history source, and d preserves a's canonical payload and revision provenance
        exactly. The existence of such a committed acceptance record and the two stated relations must hold separately for
        each live delivery; the formula does not assert that the delivery is canonical merely from being a live delivery,
        and it does not treat origin alone as implying commitment or exact payload/revision preservation.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
        verdict: EQUIVALENT
        reason: The formula requires every exposed live delivery to have a committed accepted-history witness, an origin relation
          to that witness, and preservation of canonical payload and revision provenance. These correspond directly to the
          source requirements that live changes are bound to committed canonical records and preserve their payload and provenance,
          while the formula adds no guarantees about ordering, duplication, timing, or delivery success.
        differences: []
      strengthening:
        subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
        verdict: EQUIVALENT
        reason: The formula preserves the original proposition's observation scope over every live stream delivery and requires
          a committed accepted-history source plus preservation of canonical payload and revision provenance. The exclusion
          of provisional, rejected, aborted, or never-committed changes follows from the universal source obligation without
          adding guarantees such as ordering or exactly-once delivery.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
        verdict: EQUIVALENT
        reason: The rendering preserves the original quantification boundary, provenance direction, commitment requirement,
          payload and revision provenance preservation, and exclusion of non-committed changes. It does not add delivery guarantees
          or collapse identity dimensions beyond the canonical contract.
        differences: []
      strengthening:
        subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
        verdict: EQUIVALENT
        reason: The rendering preserves the universal scope over exposed websocket live deliveries, the existential binding
          to a committed accepted-history record, the provenance direction, canonical payload and revision provenance preservation,
          and does not add guarantees beyond the canonical contract.
        differences: []
  claim:C12_live_delivery_contains_only_accepted_changes:
