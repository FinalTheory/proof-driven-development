      natural_language: All of the following conditions hold jointly. An exact logical edit identity is the full pair (document_id,
        client_change_id). Pending, retained speculative, and visible speculative activity refer to that exact identity in the
        specified client state; retained speculative representations need not be visible. Reachable client states are those
        reachable under the normal client protocol, including restore, view switching, bookkeeping, reconnect/resync, publication,
        and explicit terminal disposition. Reachable client protocol transitions are transitions occurring in a reachable execution
        of the normal client speculative lifecycle, excluding impossible transitions and transitions outside that lifecycle.
        Terminalization denotes the logical classification that an identity's normal speculative lifecycle has ended; it need
        not be implemented as a separately materialized tombstone set and may be realized by deletion or non-reactivatable archival
        state. For every client state s and exact logical edit identity e, if s is reachable and e is active in pending edits
        in s, its active pending representation remains bound to its logical edit creation identity, preserving both document_id
        and client_change_id rather than being relabeled or cross-bound. For every client state s and overlay token o, if s
        is reachable and o represents an unresolved, acceptance-eligible logical edit within the normal retry/reconnect horizon
        that remains retained in s, the logical edit identity represented by o remains active in pending edits in s. For every
        client state s and overlay token o, if s is reachable and reflects acceptance-based retirement of pending edit o with
        authoritative accepted/reconciled semantics, that retirement is derived from canonical acceptance or equivalent authoritative
        accepted evidence for the exact same full logical edit identity. Mere co-presence of matching evidence does not suffice
        when an unrelated source actually caused the retirement. For every client state s and exact logical edit identity e,
        if s is exactly the user-visible state atomically exposed by a normal foreground reconnect/reconciliation publication
        through response head H after the authoritative reconciliation result classified e as ACCEPTED at canonical revision
        r with r less than or equal to H, and the reconciled canonical state published through H contains that acceptance, then
        at that publication boundary e is absent from active pending edits, retained normal-lifecycle speculative representations,
        and visible normal-lifecycle speculative representations in s, and e is classified as terminalized in s. Satisfaction
        only after a later cleanup transition is insufficient. For every protocol transition t and exact logical edit identity
        e, if t is a reachable client protocol transition and uses a non-acceptance terminal disposition to terminally retire
        e's normal speculative lifecycle, the disposition consumed by t was produced for that same logical edit e and preserves
        e's full document_id and client_change_id identity through routing and the destructive retirement sink. Such a disposition
        is an explicit lifecycle decision that terminates the edit without claiming authoritative acceptance, including expiry,
        abandonment, conflict resolution, manual resolution, or an equivalent non-acceptance terminal path. For every client
        state s and exact logical edit identity e, if s is reachable and e is classified as terminalized in s, e is absent from
        active pending edits, retained normal-lifecycle speculative representations, and visible normal-lifecycle speculative
        representations in s. For every pair of client states earlier and later and every exact logical edit identity e, if
        both states are reachable, later is reachable from earlier through one or more client-protocol transitions in the continuing
        client lifecycle/history, and e is terminalized in earlier, then e remains terminalized in later and is absent from
        active pending edits, retained normal-lifecycle speculative representations, and visible normal-lifecycle speculative
        representations in later. The transitions relating these states include restore/reactivation, view switching, bookkeeping,
        reconnect/resync, and publication. For every client state s and exact logical edit identity e, if the normally participating
        client has observed an authoritative externally terminal definitive REJECTED result for e before or atomically with
        visible state s, then e is absent from active pending edits, retained normal-lifecycle speculative representations,
        and visible normal-lifecycle speculative representations in s, and e is terminalized in s. In addition, that rejection
        observation causes or atomically applies a same-identity non-acceptance terminal disposition, or an equivalent terminal
        lifecycle transition, for e; a lifecycle that happened to have been terminalized earlier for an unrelated reason does
        not satisfy this requirement. An externally terminal result is exposed after its corresponding authoritative terminal
        result has linearized. For every client state s and exact logical edit identity e, if s is a reachable client state
        exactly equal to the user-visible state published by a qualifying authoritative reconnect/reconciliation through response
        head H after e was classified ACCEPTED at canonical revision r with r less than or equal to H, and the reconciled canonical
        state published through H contains that acceptance, then e is absent from active pending edits, retained normal-lifecycle
        speculative representations, and visible normal-lifecycle speculative representations in s, and e is terminalized in
        s. This condition does not require the publication to be foreground and applies at that publication state. For every
        protocol transition t and exact logical edit identity e, if t is a reachable client protocol transition that performs
        bookkeeping deletion, relabeling, or loss of pending or retained speculative representation for e without authoritative
        reconciliation and without an explicit or equivalent terminal disposition ending e's normal speculative lifecycle, then
        t does not classify, justify, or semantically treat e as resolved or terminalized. The edit remains unresolved in protocol
        semantics even if buggy physical bookkeeping representations were dropped. For every protocol transition t and exact
        logical edit identity e, if t is a reachable client protocol transition and uses a non-acceptance terminal disposition
        to terminally retire e's normal speculative lifecycle, then before or atomically with destructive retirement t establishes
        that e's normal speculative lifecycle is terminalized in the resulting reachable client state and that e is no longer
        active in pending, retained speculative, or visible speculative state. The terminalization persistence and inactivity
        conditions above therefore apply to every later reachable state of that continuing lifecycle/history. For every client
        state s, old exact logical edit identity old, and logical edit new, if s is reachable, old denotes a terminalized logical
        edit for document D in s, and new is a genuinely new user logical edit for that same document D rather than a continuation,
        retry, restore, or reactivation of old, then the client_change_id assigned to new is unequal to the client_change_id
        coordinate of old. The referenced semantic contracts supply vocabulary and relations; their entire formulas are not
        additional conjuncts of this proposition.
