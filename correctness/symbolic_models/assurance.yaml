        differences: []
      strengthening:
        subject_signature: 658c7d8f87ecfc57bdac00c6a92a9458222940ddf3695182af79768e6eee5622
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the original precondition that the authoritative accepted-key identity
