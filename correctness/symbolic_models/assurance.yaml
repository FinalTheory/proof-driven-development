  claim:L19_client_applies_only_contiguous_revisions:
    kind: claim
    subject_id: L19_client_applies_only_contiguous_revisions
    subject_signature: 5572348bf62fc09bd6879d55e9972516beb6e8b120ad3323cf327144a95a285e
    roundtrip:
      subject_signature: 5572348bf62fc09bd6879d55e9972516beb6e8b120ad3323cf327144a95a285e
      status: TRANSLATED
      natural_language: 'For every client state s and every canonical revision r, all of the following hold. First, if in
        client state s the client applies canonical revision r, then the visible frontier of s — the last canonical revision
        applied by s — is the immediate predecessor of r in the document''s canonical accepted-revision numbering, meaning
        r is the next revision position after that frontier, no canonical revision lies strictly between them, and the frontier
        is exactly one less than r. Second, conversely, if the visible frontier of s is the immediate predecessor of r in
        that sense, then in client state s the client applies canonical revision r. Third, if r is at or before the visible
        frontier of s in the canonical revision order (r <= the frontier), then in client state s the client ignores the presented
        canonical revision r as a duplicate at or below its frontier: r is not applied, and the presentation of r does not
        change the client''s applied history or frontier. Fourth, if r is not at or before the visible frontier of s and the
        visible frontier of s is not the immediate predecessor of r, then in client state s the presented canonical revision
        r lies above the next contiguous revision the client can apply, so the client performs buffer_or_gap_recovery for
        r: it buffers r or triggers recovery for the gap, rather than applying r out of order.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 5572348bf62fc09bd6879d55e9972516beb6e8b120ad3323cf327144a95a285e
        verdict: EQUIVALENT
        reason: 'The formula encodes exactly the formal intent: applying is biconditional with r being the immediate successor
          of the visible frontier (last_applied_revision), revisions at or below the frontier are ignored, and revisions neither
          at-or-below nor the immediate successor—i.e. above L+1—are buffered or gap-recovered, with no added or dropped conditions.'
        differences: []
      strengthening:
        subject_signature: 5572348bf62fc09bd6879d55e9972516beb6e8b120ad3323cf327144a95a285e
        verdict: EQUIVALENT
        reason: 'The formula exactly partitions revisions relative to visible_frontier: application holds iff the frontier
          is the immediate predecessor of r, revisions at or below the frontier are ignored, and revisions neither at/below
          nor immediately after the frontier trigger buffer-or-gap-recovery, matching the statement and formal intent without
          added scope or conditions.'
        differences: []
    roundtrip_reviews:
