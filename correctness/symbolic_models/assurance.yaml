        of s is exactly the deterministic replay of that represented document through s''s visible frontier, namely the last
        canonical revision applied by s. This requirement applies to every state satisfying that user-visible canonical-state
        predicate, regardless of whether it became visible by publication, initialization, restoration, view activation, or
        an in-place visible-tuple replacement, and it includes user-visible historical-version or rollback modes; states representing
        no document and private or intermediate resynchronization candidates that have not become user-visible are outside
        the guarded scope.'
