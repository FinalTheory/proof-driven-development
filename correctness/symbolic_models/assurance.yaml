      status: TRANSLATED
      natural_language: For every client state s and every logical edit identity e, if the user-visible
        state s is the result of authoritative reconnect/reconciliation that classified that exact logical
        edit identity e as ACCEPTED within the published response head, then that exact logical edit identity
        e does not remain active in client_pending_edits in that same client state s.
