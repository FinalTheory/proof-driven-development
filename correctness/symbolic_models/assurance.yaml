  obligation:visible_canonical_frontier_never_regresses:
    kind: obligation
    subject_id: visible_canonical_frontier_never_regresses
    subject_signature: 2435dccd92bac34fa72ecd8130588a30c9fb3c85281e6bbb3968b2269a730032
    roundtrip:
      subject_signature: 2435dccd92bac34fa72ecd8130588a30c9fb3c85281e6bbb3968b2269a730032
      status: TRANSLATED
      natural_language: For every pair of ClientState values, earlier and later, if both states are ordinary
        user-visible states in the same normal client/session, later is later than earlier, the session
        continuously represents the same document from earlier through later, and both earlier and later
        represent that same document, then the later state's last_applied_revision for that document is
        not strictly lower than the earlier state's visible frontier.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 2435dccd92bac34fa72ecd8130588a30c9fb3c85281e6bbb3968b2269a730032
        verdict: EQUIVALENT
        reason: 'The formula preserves the source scope and relation: it ranges over ordinary user-visible
          earlier/later states in one normal client/session with continuous representation of the same
          document, and forbids the later frontier from being strictly below the earlier visible frontier.
          The additional same-session/same-document predicate is redundant given the stronger continuous-same-document
          predicate''s supplied meaning, so it does not change applicability. No quantifier, identity
          boundary, observation scope, or exclusion is dropped or added.'
        differences: []
      strengthening:
        subject_signature: 2435dccd92bac34fa72ecd8130588a30c9fb3c85281e6bbb3968b2269a730032
        verdict: EQUIVALENT
        reason: The source requires non-regression of last_applied_revision between later ordinary user-visible
          states in the same normal client/session exactly while that session continuously represents
          the same document, excluding document switch-away-and-back and independent session boundaries.
          The formula quantifies state pairs under that same continuous same-document/session visibility
          boundary and forbids a strictly lower later frontier. The additional same_session_later_visible_same_document
          conjunct is redundant because its conditions are already entailed by same_session_later_visible_continuous_same_document,
          so it does not narrow applicability or add a requirement.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 2435dccd92bac34fa72ecd8130588a30c9fb3c85281e6bbb3968b2269a730032
        verdict: EQUIVALENT
        reason: 'The rendering preserves the same universal pairwise scope and guards: two ordinary user-visible
          states in one normal client/session, temporal ordering, continuous representation of the same
          document across the interval, and non-regression of that document''s visible canonical frontier.
          In the cited design, the visible canonical frontier is `last_applied_revision`, so expressing
          the later frontier through that field does not change the contract. The added endpoint statement
          that both states represent the same document is redundant with continuous same-document representation
          and does not strengthen the requirement.'
        differences: []
      strengthening:
        subject_signature: 2435dccd92bac34fa72ecd8130588a30c9fb3c85281e6bbb3968b2269a730032
        verdict: EQUIVALENT
        reason: 'The rendering preserves the same scoped transition-safety contract: for any earlier/later
