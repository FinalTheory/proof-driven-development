      weakening:
        subject_signature: 1dec9096242e6972fa4754c219475a05735be1965453b40cabf549a87d7172e1
        verdict: EQUIVALENT
        reason: Quantification over every client state and overlay prohibits any visible
          speculative representation of an accepted logical edit in that same state.
          The defined same-edit predicate preserves the document and client-change identity.
          Because the invariant is unconditional on transition type or frontier advancement,
          it covers first publication and all later visible states, including bookkeeping,
          live delivery, buffered delivery, and reconnect/resync publication. The second
          formula preserves the distinct client-change-ID requirement for genuinely
          new edits within a document. Neither formula imposes rebase or progress obligations
          on unresolved edits.
        differences: []
      strengthening:
        subject_signature: 1dec9096242e6972fa4754c219475a05735be1965453b40cabf549a87d7172e1
        verdict: EQUIVALENT
        reason: The first universal condition prohibits a speculative overlay whenever
          the same logical edit's acceptance is in the visible canonical prefix. Because
          it applies at every state, it covers publication and subsequent transitions
          regardless of delivery mode or canonical-frontier advancement. Its predicates
          concern user-visible content, so it adds no constraint on hidden bookkeeping.
          The second condition expresses the source's requirement that a genuinely new
          logical edit use its own distinct client_change_id within the document; it
          does not require overlay creation or constrain retries as new edits. Neither
          condition adds a rebase or progress guarantee for unresolved edits.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 1dec9096242e6972fa4754c219475a05735be1965453b40cabf549a87d7172e1
        verdict: EQUIVALENT
        reason: 'In the specified typed context, quantification over every client state
          covers every user-visible publication and subsequent transition, including
          delivery, catch-up, reconnect/resync, and bookkeeping transitions that leave
          the canonical frontier unchanged. Both propositions prohibit a speculative
          overlay for the same logical edit whenever its acceptance is in the visible
