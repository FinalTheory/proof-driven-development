  claim:L29_non_append_lifecycle_preserves_revision_domain:
    kind: claim
    subject_id: L29_non_append_lifecycle_preserves_revision_domain
    subject_signature: 9edb16852a0ae321dffcc8ab148a7f9a7bd6ebadcdd70f50cd855c401a023afd
    roundtrip:
      subject_signature: 9edb16852a0ae321dffcc8ab148a7f9a7bd6ebadcdd70f50cd855c401a023afd
      status: TRANSLATED
      natural_language: 'For all authoritative states before and after and for every document d, the following two conditions
        hold conjunctively. (1) If after is the immediate successor of before under one committed authoritative protocol transition,
        with the transition''s full authoritative effect separating the two states and no intermediate authoritative state
        between them, and aborted, rolled-back, or never-committed work creating no such step and no successor authoritative
        state, and that step is, for d, an authoritative non-append representation/lifecycle transition that accepts no new
        edit for d, i.e. it changes d''s authoritative representation or lifecycle state while committing no canonical accepted
        change for d, excluding steps that do not change d''s representation or lifecycle state, including steps that accept
        edits only for other documents and steps that leave d entirely untouched, and excluding steps that commit an append
        for d, then both: the step preserves d''s logical accepted prefix, meaning d''s logical accepted history denotes exactly
        the same logical accepted prefix in after as in before, the same accepted revisions each represented by the same logical
        accepted change, with physical representation changing only in semantics-preserving ways, and the document_latest_revision
        frontier value of d in before equals the document_latest_revision frontier value of d in after. (2) If the same step
        and no-new-edit conditions hold and, in addition, in before d''s accepted canonical history is one gap-free revision
        sequence and d''s logical canonical accepted history in before starts at d''s canonical beginning and ends exactly
        at before''s document_latest_revision frontier for d with no logically represented accepted revision above that frontier,
        an empty accepted history ending at d''s initial frontier, the history being its logical denotation across authoritative
        representations rather than the set of physically retained accepted rows, and missing or undefined authoritative coordinates
        not satisfying this predicate, then both: in after d''s accepted canonical history is one gap-free revision sequence,
        and d''s logical canonical accepted history in after starts at d''s canonical beginning and ends exactly at after''s
        document_latest_revision frontier for d with no logically represented accepted revision above that frontier, under
        the same empty-history, logical-denotation, and defined-coordinates provisions.'
      ambiguities: []
