  contract:acked_edit_failover_survival:
    kind: contract
    subject_id: acked_edit_failover_survival
    subject_signature: 4f3fb5f2d060f676e5ee7140eabbd54e1b103054bdaae2cf2406440e0a54b832
    roundtrip:
      subject_signature: 4f3fb5f2d060f676e5ee7140eabbd54e1b103054bdaae2cf2406440e0a54b832
      status: TRANSLATED
      natural_language: For every SuccessAck observation x, if x was actually exposed to the client for one particular exact
        logical edit, then there exists a CanonicalAcceptance a bound to x for that exact acknowledged logical edit and document
        such that a was durably committed at its authoritative acceptance linearization point strictly before x was exposed.
        The physical accepted-change row for a need not remain retained or directly queryable afterward. For every RecoveryAttempt
        r, if r is an owner recovery attempt whose recovery-completion event and service-resumption event both occur strictly
        after x was exposed, and r is an already-completed recovery for the same target document as a that resumed service
        from that document's authoritative frontier H with a's canonical revision at or before H, then the recovered logical
        document state produced by r equals canonical replay through that recovery frontier, with a not omitted relative to
        that replay even if later accepted edits alter a's visible effect. The two post-ACK recovery events are each required
        to occur strictly after x, with no additional ordering required between them; a recovery that completed before x but
        resumed service after x does not satisfy that guard. The proposition does not require any recovery attempt to be scheduled
        or to complete, so the recovery condition constrains only already-existing attempts that satisfy its antecedent. SuccessAck
        is scoped per acknowledged logical edit, so a transport response may acknowledge multiple edits represented by distinct
        SuccessAck observations without violating this proposition.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 4f3fb5f2d060f676e5ee7140eabbd54e1b103054bdaae2cf2406440e0a54b832
        verdict: EQUIVALENT
