  contract:accepted_terminal_result_binding:
    kind: contract
    subject_id: accepted_terminal_result_binding
    subject_signature: b45521345fa3b583648143cf705878f5a5f071b8879478c2f8415a00451d73b6
    roundtrip:
      subject_signature: b45521345fa3b583648143cf705878f5a5f071b8879478c2f8415a00451d73b6
      status: TRANSLATED
      natural_language: This proposition constrains the identity/provenance relation between canonical accepted changes and
        authoritative ACCEPTED terminal results, without adding liveness, delivery, ordering, durable-commit, co-commit, metadata-materialization,
        lifecycle-ancestry, or other temporal requirements beyond what the predicates explicitly state. First, for every terminal-result
        symbol t and canonical-acceptance symbol a, if t and a are one of the terminal-result/matching-canonical-accepted-change
        pairs constructed at the successful acceptance_transaction assembly for a single logical acceptance, t is an authoritative
        ACCEPTED(canonical result) terminal result, and t is still within the normal retry/provenance-retention horizon, then
        a is a canonical_accepted_change on the authoritative accepted_change_log source side of the producer relation; the
        full idempotency identity carried by t, namely terminal_result_idempotency_key(t), equals the authoritative full idempotency
        identity carried by a, namely acceptance_key(a); the semantic producer binding between t and a is established at that
        successful assembly boundary; and t is bound to the same acceptance execution that produced a, meaning the canonical
        result carried by t comes from that same execution rather than from another request, document, or execution or from
        a merely extensionally equal substitute. Second, for every t, if t is an authoritative ACCEPTED(canonical result)
        terminal result and is within that retry/provenance-retention horizon, then there exists at least one a such that
        a is an authoritative accepted_change_log source-side canonical_accepted_change, terminal_result_idempotency_key(t)
        equals acceptance_key(a), and t is bound to the same acceptance execution that produced a. Third, for every lifecycle-transition
        symbol x and every before and after representation, if x is an in-horizon authoritative lifecycle transition that
        preserves one already-linearized ACCEPTED logical terminal outcome from before to after under the same full idempotency
        identity, then there exists at least one single a witnessing the entire transition such that a is an authoritative
        accepted_change_log source-side canonical_accepted_change, terminal_result_idempotency_key(before) equals acceptance_key(a),
        terminal_result_idempotency_key(after) equals acceptance_key(a), before is bound to the same acceptance execution
        that produced a, and after is bound to that same acceptance execution that produced a. The existential requirements
        do not assert uniqueness of a, and the source-acceptance and binding relations themselves carry only the provenance
        semantics defined here, including no independent assertion that a was durably committed, that producer-binding metadata
        was separately materialized, or that provenance is reachable from an origin record.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: b45521345fa3b583648143cf705878f5a5f071b8879478c2f8415a00451d73b6
        verdict: EQUIVALENT
        reason: The three clauses cover the canonical contract without weakening it under the authoritative predicate meanings.
          Clause 1 makes successful in-horizon acceptance assembly establish the producer-correct binding for the matching
          full identity; assembly_binding_established and bound jointly state that the terminal canonical result comes from
          the same acceptance execution as the paired canonical_accepted_change, excluding merely extensionally equal substitutes.
          Clause 2 requires every in-horizon authoritative ACCEPTED terminal result to retain at least one same-full-key source_acceptance
          witness to that producer binding. Clause 3 requires every lifecycle_transition to preserve one common source_acceptance
          witness across before and after, which is exactly preservation of the same logical producer binding through representation
          rewrites; lifecycle_transition already denotes only in-horizon authoritative transitions of an already-linearized
          ACCEPTED outcome under the same full identity, so separate accepted/within_horizon premises there are unnecessary.
          The definitions of bound, assembly_binding_established, full_key, and source_acceptance already exclude cross-document,
          cross-request, cross-acceptance-execution, and merely extensionally equal substitution. No uniqueness/cardinality,
          terminal arbitration, response-delivery, commit/co-commit, metadata-timing, or post-horizon obligation is added.
        differences: []
      strengthening:
        subject_signature: b45521345fa3b583648143cf705878f5a5f071b8879478c2f8415a00451d73b6
        verdict: EQUIVALENT
        reason: The three clauses match the canonical producer-binding contract under the authoritative predicate meanings.
          Clause 1 establishes, at successful in-horizon ACCEPTED assembly, that the terminal result and its matching canonical_accepted_change
          share the full identity and that the same-acceptance producer binding is established and holds. Clause 2 requires
          every in-horizon authoritative ACCEPTED terminal result to have at least one same-full-key source_acceptance witness
          to which it is bound, which captures the contract's per-terminal producer binding without adding uniqueness. Clause
          3 uses one shared acceptance witness for both sides of every lifecycle_transition; because that predicate is defined
          to cover exactly the in-horizon authoritative transitions of an already-linearized ACCEPTED logical terminal outcome,
          the shared witness enforces preservation of the same producer binding across representation rewrites. None of the
          clauses adds single-valued arbitration, witness uniqueness/cardinality, commit or co-commit, metadata timing, global
          ancestry/reachability, liveness, delivery, ordering, stronger lifecycle coverage, or physical-retention requirements.
          The existential witnesses permit multiple qualifying representations or witnesses when the authoritative semantics
          do, and post-horizon cleanup remains outside scope.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: b45521345fa3b583648143cf705878f5a5f071b8879478c2f8415a00451d73b6
        verdict: EQUIVALENT
        reason: 'Both propositions impose the same in-horizon provenance invariant on authoritative ACCEPTED terminal results:
          the terminal result must share the full idempotency identity with a matching canonical_accepted_change and its canonical
          result must be producer-bound to the same acceptance execution, excluding substitution by another request, document,
          execution, or merely extensionally equal result. The rendering also preserves the original establishment point at
          successful acceptance-transaction assembly and the lifecycle-preservation requirement by requiring a common canonical
          accepted-change witness to bind both the before and after representations of the same authoritative ACCEPTED logical
          outcome. Its existential formulation does not add uniqueness or cardinality beyond the original; it explicitly leaves
          witnesses non-unique and does not displace separate terminal-arbitration or delivery contracts. The normal retry/provenance-retention
          horizon remains the guard, representation rewrites remain allowed when binding is preserved, and no extra liveness,
          commit, timing, ancestry, ordering, or delivery property is introduced.'
        differences: []
