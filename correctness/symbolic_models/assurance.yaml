    subject_id: L192_terminal_publication_preserves_store_identity_provenance
    subject_signature: 55c2c92c5a0e8f595c68329b2b14ecbac6ade08058da1a7fc218ceae7a17d243
    roundtrip:
      subject_signature: 55c2c92c5a0e8f595c68329b2b14ecbac6ade08058da1a7fc218ceae7a17d243
      status: TRANSLATED
      natural_language: 'The conjunction of the following holds. (1) For every terminal result record t, if t is published,
        then the document of t equals the document of the stored record reproduced by t, and the client change id of t equals
        the client change id of that stored record, where the stored record is the authoritative terminal_result in the durable
        terminal outcome store that the published t reproduces. (2) For every t, if t is published and t is an authoritative
        ACCEPTED terminal result record, then that stored record is also an authoritative ACCEPTED terminal result record
        and that stored record is the authoritative creation of an ACCEPTED terminal_result for one eligible full idempotency
        identity. (3) For every t, if t is published and its stored record is an authoritative ACCEPTED terminal result record,
        then t is an authoritative ACCEPTED terminal result record. (4) For every t, if t is published and t is an authoritative
        REJECTED terminal result record, then its stored record is an authoritative REJECTED terminal result record. (5) For
        every t, if t is published and its stored record is an authoritative REJECTED terminal result record, then t is an
        authoritative REJECTED terminal result record. (6) For every t, if t is published, then t is equal to its stored record.
        (7) For every t, if t is published and t is an authoritative ACCEPTED terminal result record, then t is the authoritative
        creation of an ACCEPTED terminal_result for one eligible full idempotency identity. (8) For every terminal result
        record r, if r is an authoritative ACCEPTED terminal result record and r is the authoritative creation of an ACCEPTED
        terminal_result for one eligible full idempotency identity, then r is the authoritative creation of an ACCEPTED terminal_result
        for one eligible full idempotency identity and there exists a canonical acceptance a such that all of the following
        hold: r and a are the ACCEPTED terminal-result creation and its matching canonical accepted-change creation for one
        logical acceptance; that creation pair atomically commits, sharing one authoritative transaction boundary so they
        commit or roll back together with no reachable authoritative post-boundary state containing exactly one side; the
        matching canonical acceptance a is committed for the corresponding ACCEPTED terminal outcome by the acceptance execution
        that produced a; r is bound to the acceptance execution for a, in that the canonical result carried by r was produced
        by the same acceptance execution that produced a; the matching canonical accepted change for r''s full identity is
        present in canonical accepted history; and r and a carry the same full (document_id, client_change_id) identity. (9)
        For every authoritative state s, idempotency key k, and terminal result record t, if t is the terminal_result contained
        in the terminal outcome store in state s for the exact full idempotency identity k and t is an authoritative ACCEPTED
        terminal result record, then t is the authoritative creation of an ACCEPTED terminal_result for one eligible full
        idempotency identity. (10) For every terminal result record r and canonical acceptances a1 and a2, if r and a1 are
        a matching ACCEPTED creation pair and r and a2 are a matching ACCEPTED creation pair, then a1 equals a2.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 55c2c92c5a0e8f595c68329b2b14ecbac6ade08058da1a7fc218ceae7a17d243
        verdict: EQUIVALENT
        reason: The formula requires every published result to equal its stored record with matching document_id and client_change_id,
          preserves ACCEPTED/REJECTED kind in both directions, and requires every stored or published ACCEPTED record to be
          the eligible-identity creation record bound to a unique matching canonical acceptance that is produced and committed
          by the same acceptance execution and atomically committed with that result.
        differences: []
      strengthening:
        subject_signature: 55c2c92c5a0e8f595c68329b2b14ecbac6ade08058da1a7fc218ceae7a17d243
        verdict: EQUIVALENT
        reason: The formula preserves the publication scope, full document/change identity, exact reproduction of the stored
          record for both ACCEPTED and REJECTED results, and, for stored ACCEPTED results, eligible-identity creation by the
          same acceptance execution with atomic co-commit of the matching canonical acceptance and a unique matching acceptance,
          without adding or omitting a source requirement.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 55c2c92c5a0e8f595c68329b2b14ecbac6ade08058da1a7fc218ceae7a17d243
        verdict: EQUIVALENT
        reason: 'The rendering preserves exact reproduction as record equality for the same full (document_id, client_change_id)
          identity, preserves ACCEPTED/REJECTED status in both directions, and preserves ACCEPTED provenance: a stored or
          published ACCEPTED result is the authoritative creation record for its eligible full identity, produced by the same
          single acceptance execution whose one atomic transaction commits both that result and its matching canonical accepted
          change. No source requirement is omitted and no material requirement is added.'
        differences: []
  claim:L190_authoritative_terminal_publication_surfaces_are_exhaustive:
