      natural_language: 'The proposition is a conjunction of two statements, both quantified over every AcceptedEvidence e.
        First: for every e, if e is authoritative accepted-idempotency evidence (authoritative durable state counts e as establishing
        that the full identity e carries is already accepted) and e is created, replaced, or preserved by a durable accepted-history
        lifecycle transformation outside the normal acceptance transaction, such as compaction, cleanup, or snapshot replacement,
        then there exists a CanonicalAcceptance a such that all of the following hold: a is a committed canonical accepted-change
        record in authoritative accepted history; the document_id component of the full identity carried by e equals the document_id
        component of the full identity carried by a; the client_change_id component of the full identity carried by e equals
        the client_change_id component of the full identity carried by a; and e is derived from and corresponds to a, and
        a was committed before the lifecycle transformation or runtime reconstruction that created or preserved e. Second:
        for every e, if e is authoritative accepted-idempotency evidence as defined above and e is created, replaced, or preserved
        by such a durable accepted-history lifecycle transformation, then e has only committed provenance, meaning every provenance
        source of e is a canonical acceptance for the same full (document_id, client_change_id) identity as e that was committed
        before e was created, replaced, or preserved, or an intermediate whose own provenance terminates at such an acceptance;
        no never-committed attempt, reservation, in-progress arbitration, timeout, cancellation, or other provisional state
        is a provenance source of e, and no acceptance for a different identity is a provenance source of e.'
