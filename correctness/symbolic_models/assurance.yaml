        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 686689c758e48bd95d4f539ac7ba73a99778d4adfef81eb94d710539276b21cf
        verdict: EQUIVALENT
        reason: 'The rendering preserves both guarantees: each covered optimized authoritative representation or completed
          recovery at common frontier H has the same canonical logical state, latest_revision = H, and acceptance-relevant
          resumable state required by logical_state_equivalence_at_frontier; and each new-owner recovery remains document-bound
          from the pre-head authoritative owner context through every actually occurring captured/selected/replayed source,
          rebuilt runtime state, installed state, and resumed owner context. Its exclusions for merely examined candidates
          and unrelated intermediate artifacts do not omit source obligations, while its stalled/aborted-prefix treatment
