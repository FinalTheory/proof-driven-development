      subject_signature: 60ca3d417c7b7c87faba55da4fbbf7e6112e8b5f9c652010d7b313749a4974c4
      status: TRANSLATED
      natural_language: 'All of the following four conditions hold conjunctively. (1) For every client state s and every overlay
        o, if s is a visible canonical speculative observation state (i.e., s is currently exposed at the user-visible client
        observation boundary for its visible canonical prefix and speculative overlay set, with private, intermediate, or
        not-yet-published states excluded and with no added progress or freshness requirement) and the canonical prefix visible
        in s already contains a canonical acceptance whose full (document_id, client_change_id) identity equals the full identity
        carried by o — where full-identity equality alone triggers this relation, no additional proof that the acceptance
        and the overlay denote the same semantic edit is required, and an identity collision does not bypass this relation
        — then o is not visible in s, i.e., o is not currently exposed as a speculative user-visible overlay in s. (2) For
        every client state e, every client state l, and every overlay o, if l is later reachable from e (l is reachable after
        e by one or more client-protocol transitions for the continuing client lifecycle/history, including restore/reactivation,
        view switching, bookkeeping, reconnect/resync, or publication transitions), l is a visible canonical speculative observation
        state, the canonical prefix visible in e does not contain such a full-identity-matching canonical acceptance for o,
        and the canonical prefix visible in l does contain such a full-identity-matching canonical acceptance for o, then
        o is not visible in l. (3) For every client state e, every client state l, and every overlay o, if l is later reachable
        from e, l is a visible canonical speculative observation state, the canonical prefix visible in e does contain such
        a full-identity-matching canonical acceptance for o, and the canonical prefix visible in l also does contain such
        a full-identity-matching canonical acceptance for o, then o is not visible in l. (4) For every client state e, every
        client state l, and every overlay o, if l is later reachable from e, e is a visible canonical speculative observation
        state, l is a visible canonical speculative observation state, the canonical prefix visible in e does contain such
        a full-identity-matching canonical acceptance for o, the canonical prefix visible in l does contain such a full-identity-matching
        canonical acceptance for o, and o is not visible in e, then it is not the case that a client transition recreates
        the speculative overlay from e to l: i.e., along the client-protocol path from user-visible state e to later user-visible
        state l, no client transition creates or re-enables speculative overlay o — the speculative representation of the
        logical client edit identified by (document_id, client_change_id) — as a user-visible speculative overlay exposing
        it at the user-visible client observation boundary at some point on that path, although that overlay was absent in
        e; this recreation predicate classifies only user-visible creation or re-enablement, recreation remaining in private,
        intermediate, or not-yet-published states and never exposed at the user-visible boundary is outside it, and it does
        not assert that the overlay is visible in l.'
