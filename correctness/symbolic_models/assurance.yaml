      subject_signature: 38dea58bd1d4ca07aab634cce57998ca692153a3b255958408fbb75df81d6fe7
      status: TRANSLATED
      natural_language: 'Both of the following requirements hold. First, for every canonical acceptance a, if a is a canonical
        accepted-change record in authoritative accepted history, then there exists an OT success result s such that a is
        bound to the exact successful OT result s that produced its accepted payload, with no synthesized or substituted result
        qualifying, and s was produced for a''s corresponding submitted raw edit and base revision. In addition, every in-scope
        path whose effect creates or commits a must have successful OT-result provenance for those corresponding submitted
        inputs. No path lacking that provenance may create or commit a; in particular, an invalid or rebase-required OT outcome
        cannot create or commit a. Paths that only read, return, retry-resolve, deliver, restore, or otherwise observe an
        already-committed acceptance are excluded from this producer requirement. That requirement imposes no idempotency
        arbitration, acceptance-frontier, owner-generation or fencing, liveness, or unrelated rejection or terminal-outcome
        semantics. Second, for every canonical acceptance a, if a is a canonical accepted-change record in authoritative accepted
        history, then there exist a submitted request q and a logical client edit e such that all of the following hold together:
        a was produced from q; q represents e rather than a different logical operation, and q''s submitted document identifier,
        client change identifier, server-visible raw edit, and base revision F remain bound to that same logical operation
        and its canonical authoring state D@F, where D is the document represented by q; the document identity preserved on
        a equals the document identity carried by q; the client change identifier preserved on a equals the client-supplied
        logical edit identifier carried by q; the successful OT result committed as a was computed for q against the canonical
        committed prefix immediately preceding a''s accepted revision; and the successful OT result bound to a satisfies the
        OT engine''s algorithmic convergence contract for the submitted raw edit, base revision, and preceding canonical prefix.
        A logical edit is scoped to its document; retransmissions are request instances for the same logical operation, not
        new logical edits. These requirements do not assert the existence of any canonical acceptance, require unique witnesses,
        or establish stability of client change identifiers across retries or uniqueness across distinct logical edits. The
        referenced semantic contract supplies vocabulary and relations; its entire formula is not additionally conjoined.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 38dea58bd1d4ca07aab634cce57998ca692153a3b255958408fbb75df81d6fe7
        verdict: EQUIVALENT
        reason: Every authoritative acceptance requires exact successful OT-result provenance for its corresponding submitted
          input, a request bound to the same logical edit and canonical authoring state, preservation of both document and
          change identity, the immediately preceding canonical committed prefix, and algorithmic convergence. The producer
          exclusion prohibits acceptance without successful provenance, including reject/rebase-required outcomes. The supplied
          predicate meanings preserve these bindings without adding unrelated guarantees.
        differences: []
      strengthening:
        subject_signature: 38dea58bd1d4ca07aab634cce57998ca692153a3b255958408fbb75df81d6fe7
        verdict: EQUIVALENT
        reason: Restricted to authoritative canonical acceptances, the formula requires submitted-request provenance, binding
          to the same logical edit and canonical authoring state, preservation of document and change identity, the exact
          successful OT result for the submitted input, the immediately preceding canonical prefix, and algorithmic convergence.
          The producer exclusion captures the prohibition on acceptance without successful OT provenance, including reject/rebase-required
          outcomes, without extending obligations to observation paths or imposing additional cardinality requirements.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 38dea58bd1d4ca07aab634cce57998ca692153a3b255958408fbb75df81d6fe7
        verdict: EQUIVALENT
