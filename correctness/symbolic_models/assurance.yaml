        reason: The symbolic contract preserves the canonical provenance boundary without weakening it. Its guard is scoped
          to non-append authoritative-history lifecycle execution for target document d and explicitly includes incomplete
          prefixes and stalled, crashed, or aborted executions while imposing no completion, publication, or progress obligation.
          The consequent quantifies exactly over history/checkpoint inputs that actually semantically supply the transformation
          and authoritative lifecycle outputs that are actually installed or published, requiring both source-side and output-side
          provenance to remain bound to d. This rules out cross-document rebinding merely from extensional equality of revision,
          payload, frontier, or replay values, while still permitting content-addressed bytes, immutable pages, or other physical
          storage to be shared beneath document-scoped references. Unrelated candidates that are only inspected and rejected
          are correctly excluded from semantic-input provenance, and paths where no relevant stage or output occurs remain
          vacuous rather than acquiring a progress requirement. The stated exclusions also preserve the canonical non-claims
          about replay equivalence, frontier preservation, recovery correctness, lifecycle progress, retention, and object
          identity. Treating installed/published authoritative lifecycle output as durable does not narrow the canonical obligation
          in context, because the covered output is the authoritative lifecycle result being installed or published, not a
          transient intermediate.
        differences: []
      strengthening:
        subject_signature: 6a9492197e239a44e9dd94ed5e0c8cf17e43a295f4f47e34aad7ec9c23f84634
