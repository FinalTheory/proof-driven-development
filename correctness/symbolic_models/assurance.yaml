      status: TRANSLATED
      natural_language: 'For every client state s and every logical edit identity e, if the normally participating
        client has observed, before or atomically with visible state s, an authoritative externally terminal
        definitive REJECTED result for that exact logical edit identity e, then all of the following hold
        in that same client state s for that same logical edit identity e: e is not active in client_pending_edits;
        s does not retain a normal-lifecycle speculative representation for e in client_speculative_overlays;
        s does not expose a normal-lifecycle speculative representation for e in client_visible_speculative_overlays;
        and e is classified in s as having a terminalized normal speculative lifecycle in client_terminalized_speculative_lifecycles.
        This terminalized classification is logical control state: an implementation may represent it
        by deletion or non-reactivatable archival state rather than by a separately materialized tombstone
        set.'
      ambiguities: []
    direct_reviews:
      weakening:
