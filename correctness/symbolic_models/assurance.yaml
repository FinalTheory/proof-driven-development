          logical edit lifecycle before or atomically with the resulting visible state, removing active pending, retained,
          and visible speculative participation and preventing subsequent reactivation. The formula preserves these requirements,
          normal-client applicability, full identity, and observation timing through the supplied predicate meanings. Terminalization
          is a logical classification, so it does not require a materialized tombstone or prohibit non-reactivatable archives.
        differences: []
      strengthening:
        subject_signature: ef8b001b3cc0812554c55117d8b3899270a33effce59fbab44a712165821697c
        verdict: EQUIVALENT
        reason: The canonical source explicitly requires observed authoritative definitive rejection of the exact identity
          to terminalize its lifecycle and remove active pending, retained, and visible speculative participation before or
          atomically with the resulting visible state. The predicate meanings preserve normal-client applicability, authoritative
          observation, full identity, and the visible-state boundary. Application to subsequent states is supported by the
