        verdict: EQUIVALENT
        reason: Quantification over every client state and overlay prohibits any visible speculative representation of an
          accepted logical edit in that same state. The defined same-edit predicate preserves the document and client-change
          identity. Because the invariant is unconditional on transition type or frontier advancement, it covers first publication
          and all later visible states, including bookkeeping, live delivery, buffered delivery, and reconnect/resync publication.
