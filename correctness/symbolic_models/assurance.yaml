version: 1
records:
  contract:accepted_evidence_correspondence:
    kind: contract
    subject_id: accepted_evidence_correspondence
    subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
    roundtrip:
      subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
      status: TRANSLATED
      natural_language: 'For every authoritative state s and every idempotency key
        k, if the composite authoritative idempotency identity k = (document_id, client_change_id)
        is within the 30-day normal retry/reconnect eligibility horizon in authoritative
        state s, then the following two implications must hold: if authoritative accepted_idempotency_evidence
        exists in state s for the same composite idempotency key k, then accepted_change_log
        in authoritative state s contains exactly one committed canonical acceptance
        whose authoritative idempotency_key is the same composite identity k; and
        if accepted_change_log in authoritative state s contains exactly one committed
        canonical acceptance whose authoritative idempotency_key is the same composite
        identity k, then authoritative accepted_idempotency_evidence exists in state
        s for the same composite idempotency key k.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The formula preserves the original iff correspondence between accepted_idempotency_evidence
          and exactly one committed canonical acceptance within the 30-day eligibility
          scope, with the same idempotency identity and authoritative-state observation
          boundary.
        differences: []
      strengthening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The formula preserves the source contract's applicability boundary,
          identity coordinates, bidirectional correspondence, cardinality requirement,
          and authoritative-state observation scope. The lifecycle preservation statement
          is represented by the state invariant semantics rather than an additional
          predicate.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the bidirectional correspondence,
          identity coordinates, 30-day eligibility boundary, authoritative state scope,
          and exactly-one committed canonical acceptance cardinality of the source
          invariant.
        differences: []
      strengthening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The rendering preserves the original state invariant, applicability
          horizon, authoritative observation scope, identity coordinates, bidirectional
          correspondence, and exactly-one cardinality requirement without adding guarantees
          outside the contract boundary.
        differences: []
  claim:L92_captured_recovery_head_equals_authoritative_frontier:
    kind: claim
    subject_id: L92_captured_recovery_head_equals_authoritative_frontier
    subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
    roundtrip:
      subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
      status: TRANSLATED
      natural_language: For every recovery attempt r, if r has reached the new-owner
        recovery-head capture event after epoch handoff, then the recovery_head value
        bound to r is equal to the authoritative document_latest_revision value read
        when r captures its recovery frontier.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: 'The formula exactly captures the source proposition: for every recovery
          attempt, after the recovery-head capture event, recovery_head_value equals
          the authoritative document_latest_revision value captured at that event.
          No additional guarantees from the contextual semantic contract are introduced.'
        differences: []
      strengthening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: 'The symbolic formula matches the canonical proposition: after the
          capture event, the recovery_head value equals the authoritative revision
          value captured at that event. No additional guarantees or missing requirements
          are introduced.'
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: The rendering preserves the original contract's applicability boundary
          after epoch handoff, the capture-event condition, the equality relation,
          the authoritative source of document_latest_revision, and the binding of
          recovery_head to that captured value. No quantifier, provenance direction,
          identity component, or guarantee scope is changed.
        differences: []
      strengthening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: The rendering preserves the original applicability boundary, epoch
          handoff precondition, provenance direction, and equality relation between
          recovery_head and the authoritative document_latest_revision value observed
          at the capture event. It does not add guarantees beyond the source proposition.
        differences: []
  claim:L108_acceptance_preserves_request_identity:
    kind: claim
    subject_id: L108_acceptance_preserves_request_identity
    subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
    roundtrip:
      subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
      status: TRANSLATED
      natural_language: 'For every canonical acceptance a and every request r, if
        canonical acceptance a was produced from submitted request r, then all of
        the following hold: the document identity preserved on canonical acceptance
        a is equal to the document identity carried by request r; the client change
        identity preserved on canonical acceptance a is equal to the client-supplied
        logical edit identity carried by request r; the authoritative idempotency
        identity associated with acceptance a exactly matches the request''s (document_id,
        client_change_id) identity; and from request admission through OT dispatch,
        idempotency arbitration, retry handling, and canonical commit, neither document_id
        nor client_change_id is dropped, regenerated, substituted, or cross-bound,
        such that every identity handoff for acceptance a remains the originating
        request r identity. In addition, for every durable idempotency evidence e,
        if durable idempotency evidence e is associated with canonical acceptance
        a, then e identifies exactly the same (document_id, client_change_id) carried
        by originating request r.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The formula preserves the source proposition's applicability boundary,
          requiring the guarantees only for canonical acceptances produced from submitted
          requests. It retains both identity coordinates (document_id and client_change_id),
          the end-to-end preservation requirement, and the durable idempotency evidence
          association requirement. No additional cardinality, uniqueness, temporal,
          or provenance obligation is introduced beyond the canonical claim.
        differences: []
      strengthening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The formula preserves the source applicability boundary by conditioning
          on an acceptance produced from a request, and it encodes the same document_id/client_change_id
          identity preservation, end-to-end provenance binding, and durable idempotency
          evidence identity requirements stated in the canonical claim. No additional
          cardinality, uniqueness, or out-of-scope guarantee is introduced.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the original contract's quantification,
          provenance direction, identity components, and observation scope. It states
          that accepted changes retain the originating request's document_id and client_change_id
          and that associated idempotency evidence uses the same identity. The additional
          wording about specific pipeline stages is an expansion of the acceptance
          path covered by the original claim, not a new semantic requirement.
        differences: []
      strengthening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The rendering preserves the original contract's applicability boundary,
          identity coordinates, provenance direction, and observation scope. It restates
          preservation of document_id and client_change_id through the acceptance
          path and durable idempotency evidence without introducing uniqueness, cardinality,
          or guarantees beyond the canonical acceptance identity-binding requirement.
        differences: []
  claim:L116_live_delivery_is_bound_to_committed_acceptance:
    kind: claim
    subject_id: L116_live_delivery_is_bound_to_committed_acceptance
    subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
    roundtrip:
      subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
      status: TRANSLATED
      natural_language: For every live delivery d such that d is a delivery actually
        exposed through the websocket live stream, there exists a CanonicalAcceptance
        record a such that a is a committed record in the authoritative accepted_change_log,
        d originates from a as its accepted-history source, and d preserves a's canonical
        payload and revision provenance exactly. The existence of such a committed
        acceptance record and the two stated relations must hold separately for each
        live delivery; the formula does not assert that the delivery is canonical
        merely from being a live delivery, and it does not treat origin alone as implying
        commitment or exact payload/revision preservation.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
        verdict: EQUIVALENT
        reason: The formula requires every exposed live delivery to have a committed
          accepted-history witness, an origin relation to that witness, and preservation
          of canonical payload and revision provenance. These correspond directly
          to the source requirements that live changes are bound to committed canonical
          records and preserve their payload and provenance, while the formula adds
          no guarantees about ordering, duplication, timing, or delivery success.
        differences: []
      strengthening:
        subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
        verdict: EQUIVALENT
        reason: The formula preserves the original proposition's observation scope
          over every live stream delivery and requires a committed accepted-history
          source plus preservation of canonical payload and revision provenance. The
          exclusion of provisional, rejected, aborted, or never-committed changes
          follows from the universal source obligation without adding guarantees such
          as ordering or exactly-once delivery.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
        verdict: EQUIVALENT
        reason: The rendering preserves the original quantification boundary, provenance
          direction, commitment requirement, payload and revision provenance preservation,
          and exclusion of non-committed changes. It does not add delivery guarantees
          or collapse identity dimensions beyond the canonical contract.
        differences: []
      strengthening:
        subject_signature: 304dce79d40b4efee56ca83ff8810a13e3608856d587f246769e569a9da185bf
        verdict: EQUIVALENT
        reason: The rendering preserves the universal scope over exposed websocket
          live deliveries, the existential binding to a committed accepted-history
          record, the provenance direction, canonical payload and revision provenance
          preservation, and does not add guarantees beyond the canonical contract.
        differences: []
  claim:C12_live_delivery_contains_only_accepted_changes:
