        subject_signature: 9060da21a446d6931e3debec61d96bdd957f48e8f99c2af65ea2e1880034d774
        verdict: EQUIVALENT
        reason: 'The formula preserves the canonical contract''s two universal obligations without silently narrowing either
          domain. For authoritative states, the same (s,d) coordinates flow from the scope predicate into both gap-freedom
          and endpoint matching; because document_has_authoritative_state includes empty as well as malformed, missing, or
          inconsistent coordinates, bad states are not filtered out before the invariant is checked, and undefined coordinates
          fail through the consequent predicates. Gap-freedom plus endpoint matching captures one canonical logical prefix
          from the canonical beginning through exactly that document''s latest revision, including the empty-history initial
          frontier and excluding logical revisions above it. For transitions, the same (t,d) coordinates quantify every actual
          reachable canonical-server representation/lifecycle transition for an existing document that accepts no edit, with
          classification independent of whether preservation succeeds, so the antecedent cannot become vacuous by correctness
          filtering. The consequent compares the immediate pre/post logical accepted prefix and frontier while permitting
          physical re-encoding. This also preserves the stated exclusions: no physical-retention requirement is introduced
          for semantics-preserving compaction, and no durability or owner-fencing property is asserted.'
        differences: []
      strengthening:
        subject_signature: 9060da21a446d6931e3debec61d96bdd957f48e8f99c2af65ea2e1880034d774
