  contract:idempotency_terminal_outcome_coherence:
    kind: contract
    subject_id: idempotency_terminal_outcome_coherence
    subject_signature: b2674654f50a903304c4ba071fc96e08e928ff3105cf808f80ae5bb4418e44b3
    roundtrip:
      subject_signature: b2674654f50a903304c4ba071fc96e08e928ff3105cf808f80ae5bb4418e44b3
      status: TRANSLATED
      natural_language: For every authoritative state s and every full composite idempotency identity k = (document_id, client_change_id),
        if s is reachable under the canonical server protocol and failure model and k is within the configured normal retry
        eligibility horizon in s, then all of the following hold in s for that exact identity k. The authoritative idempotency
        terminal-outcome state contains at most one durable terminal result for k; equal client_change_id values in different
        document namespaces are distinct identities. This terminal-outcome state represents durable ACCEPTED(canonical result)
        or REJECTED(definitive reason) outcomes, and uncertainty has no terminal entry. If k has an ACCEPTED terminal outcome,
        the canonical accepted-change history for the same document contains the matching canonical acceptance for that exact
        identity and there is no incompatible REJECTED outcome for that same identity. If k has a REJECTED terminal outcome,
        the canonical accepted-change history for the same document contains no canonical acceptance for that exact identity.
        Once a terminal outcome for k has linearized, every later acceptance or definitive-rejection transition for that same
        identity whose resulting authoritative state remains within the configured normal retry eligibility horizon for k
        preserves that same single-valued terminal outcome. Transitions or re-submissions after the retry horizon are outside
        that immutability condition, and the condition imposes no progress requirement. Impossible or purely hypothetical
        authoritative states are outside the reachability guard, and no premise is added requiring k already to have a terminal
        outcome.
