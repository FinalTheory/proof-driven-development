        capture event as above, then both: r''s recovered local head is initialized, as part of r''s reconstruction completion,
        to h, with the recovered owner''s local head value being h before the recovery is considered complete; and there exists
        a revision v such that h is the immediate predecessor of v in the document''s canonical accepted-revision numbering
