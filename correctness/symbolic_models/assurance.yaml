        handoff, then the recovery_head value bound to r is equal to the authoritative document_latest_revision value read
        when r captures its recovery frontier.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: 'The formula exactly captures the source proposition: for every recovery attempt, after the recovery-head
          capture event, recovery_head_value equals the authoritative document_latest_revision value captured at that event.
          No additional guarantees from the contextual semantic contract are introduced.'
        differences: []
      strengthening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: 'The symbolic formula matches the canonical proposition: after the capture event, the recovery_head value
          equals the authoritative revision value captured at that event. No additional guarantees or missing requirements
          are introduced.'
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: af9ce92ddced7847779f198c4cd75dada8cf26f0f598c7d14812f41870bbd6b5
        verdict: EQUIVALENT
        reason: The rendering preserves the original contract's applicability boundary after epoch handoff, the capture-event
          condition, the equality relation, the authoritative source of document_latest_revision, and the binding of recovery_head
