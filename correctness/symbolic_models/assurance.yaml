        change must originate from the accepted_change_log for D. Every resulting client_resync_candidate must remain semantically
        bound to D. Substituting authoritative material from another document violates the requirement even when values are
        equal or relabeled; shared immutable bytes are permitted only when the semantic reference remains bound to D. The
        requirement applies only to stages and sources actually reached or used and does not require construction of a candidate,
