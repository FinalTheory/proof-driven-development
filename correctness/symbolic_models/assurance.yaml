        verdict: EQUIVALENT
        reason: The formula preserves the canonical state-invariant scope by quantifying every reachable authoritative state
          and exact composite idempotency identity only while that key is within the normal retry horizon. Its predicates
          retain the single-terminal cardinality bound, ACCEPTED-to-matching-canonical-acceptance provenance plus exclusion
          of REJECTED, REJECTED exclusion of canonical acceptance, and within-horizon immutability across later acceptance
          or definitive-rejection transitions. The catalog and predicate meanings also preserve document-scoped identity and
          the exclusion of uncertain attempt outcomes from terminal state, without adding progress or post-horizon obligations.
        differences: []
      strengthening:
