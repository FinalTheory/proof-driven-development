        verdict: EQUIVALENT
        reason: 'The formula preserves the canonical claim''s applicability boundaries and decomposes its guarantees without
          changing their scope: eligible foreground catch-up attempts bind and preserve one authoritative response head, foreground
          publication eligibility requires uninterrupted visible-document binding with permanent blocking after a binding
