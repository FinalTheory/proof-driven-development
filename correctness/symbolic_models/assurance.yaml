  claim:L6_frontier_advance_and_insert_commit_together:
    kind: claim
    subject_id: L6_frontier_advance_and_insert_commit_together
    subject_signature: c8aae26ac817410a85819c0395486e1a8260061dac6a22eb280987c0f7ee52f4
    roundtrip:
      subject_signature: c8aae26ac817410a85819c0395486e1a8260061dac6a22eb280987c0f7ee52f4
      status: TRANSLATED
      natural_language: 'For every authoritative state s, every document d, and every revision r: if s includes an authoritative
        state instance for d, so that d''s document_latest_revision frontier coordinate is defined in s, then both of the
        following hold. First, if s''s logical accepted history for d contains a canonical accepted change at revision r,
        then r is at or before, in the canonical revision order, the document_latest_revision frontier value of d in s, namely
        the revision coordinate at which s''s logical accepted history for d ends. Second, if the document_latest_revision
        frontier value of d in s is equal to r, then s''s logical accepted history for d contains a canonical accepted change
        at revision r. And, for every authoritative states before and after, every document d, and every revision r: if after
        is the immediate successor of before under one committed authoritative protocol transition, with no intermediate authoritative
        state between them, and that step is a committed canonical accepted-change append for d whose one new canonical accepted
        change is at revision r and which commits no other accepted-history change for d, then both of the following hold:
        that step advances d''s document_latest_revision to exactly r in after, with that frontier advance authoritatively
        visible in after as the co-visible companion of the insertion of the matching canonical accepted change at r by the
        same committed append, and after''s logical accepted history for d contains a canonical accepted change at revision
        r.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: c8aae26ac817410a85819c0395486e1a8260061dac6a22eb280987c0f7ee52f4
        verdict: EQUIVALENT
        reason: 'The formula faithfully encodes co-visibility: a contained change at r requires the frontier to have reached
          at least r, frontier exactly r requires the matching change at r, and any committed append step at r must also advance
          the frontier to r with the change present in the post-state. No requirement is omitted, added, or altered in scope,
          identity, or cardinality.'
        differences: []
      strengthening:
        subject_signature: c8aae26ac817410a85819c0395486e1a8260061dac6a22eb280987c0f7ee52f4
        verdict: EQUIVALENT
        reason: The state conjunct requires any contained change to lie at or before the frontier and requires the matching
          change whenever the frontier equals r, while the step conjunct requires every committed append at r to advance the
          frontier to r and expose that change in the successor state, exactly encoding co-visibility of insertion and frontier
          advance.
        differences: []
    roundtrip_reviews:
