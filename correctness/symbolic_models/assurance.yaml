        reason: The formula's three conjuncts jointly encode completeness (every canonical change with revision in (s,h] is
          in the tail), soundness (every tail change's canonical revision lies in (s,h]), and exactly-once increasing-order
          via the tail predicate, all guarded by snapshot mode with the selected frontier s and head h matching the statement's
          scope and range S+1..H.
        differences: []
      strengthening:
        subject_signature: 3e55d99c3cd840a2cb9acbb8be47a57adc6eb203d5f4b383f12021936a7b4a52
        verdict: EQUIVALENT
