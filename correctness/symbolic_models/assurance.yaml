  obligation:externally_rejected_edit_closes_active_speculative_lifecycle:
    kind: obligation
    subject_id: externally_rejected_edit_closes_active_speculative_lifecycle
    subject_signature: ef8b001b3cc0812554c55117d8b3899270a33effce59fbab44a712165821697c
    roundtrip:
      subject_signature: ef8b001b3cc0812554c55117d8b3899270a33effce59fbab44a712165821697c
