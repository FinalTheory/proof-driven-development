        reason: The first conjunct requires every user-visible canonical state to match
          deterministic replay of its represented document at its visible frontier,
          preserving all tuple coordinates across visible replacements, including unchanged-frontier
          transitions. The second forbids regression between every qualifying earlier
          and later same-document observation within one normal session, including observations
          separated by document switches. The supplied meanings preserve the exclusions
