          adding guarantees of ordering, uniqueness, timeliness, or eventual delivery.
        differences: []
  claim:L20_acceptance_paths_are_authoritatively_mediated:
    kind: claim
    subject_id: L20_acceptance_paths_are_authoritatively_mediated
    subject_signature: 0e9d01680298f60fa3c59dd7065ba08c52c76ee292a84bf8a2c49d7454be4bf4
    roundtrip:
      subject_signature: 0e9d01680298f60fa3c59dd7065ba08c52c76ee292a84bf8a2c49d7454be4bf4
