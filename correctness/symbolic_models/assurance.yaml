version: 1
records:
  contract:accepted_evidence_correspondence:
    kind: contract
    subject_id: accepted_evidence_correspondence
    subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
    roundtrip:
      subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
      status: TRANSLATED
      natural_language: 'For every authoritative state s and every idempotency key k, if the composite authoritative idempotency
        identity k = (document_id, client_change_id) is within the 30-day normal retry/reconnect eligibility horizon in authoritative
        state s, then the following two implications must hold: if authoritative accepted_idempotency_evidence exists in state
        s for the same composite idempotency key k, then accepted_change_log in authoritative state s contains exactly one
        committed canonical acceptance whose authoritative idempotency_key is the same composite identity k; and if accepted_change_log
        in authoritative state s contains exactly one committed canonical acceptance whose authoritative idempotency_key is
        the same composite identity k, then authoritative accepted_idempotency_evidence exists in state s for the same composite
        idempotency key k.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The formula preserves the original iff correspondence between accepted_idempotency_evidence and exactly one
          committed canonical acceptance within the 30-day eligibility scope, with the same idempotency identity and authoritative-state
          observation boundary.
        differences: []
      strengthening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The formula preserves the source contract's applicability boundary, identity coordinates, bidirectional correspondence,
          cardinality requirement, and authoritative-state observation scope. The lifecycle preservation statement is represented
          by the state invariant semantics rather than an additional predicate.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the bidirectional correspondence, identity coordinates, 30-day eligibility
          boundary, authoritative state scope, and exactly-one committed canonical acceptance cardinality of the source invariant.
        differences: []
      strengthening:
        subject_signature: 109acabd77450b243070b130d03bbedb2768aa4a80cdb198eb026cae8aa2a0dd
        verdict: EQUIVALENT
        reason: The rendering preserves the original state invariant, applicability horizon, authoritative observation scope,
          identity coordinates, bidirectional correspondence, and exactly-one cardinality requirement without adding guarantees
          outside the contract boundary.
        differences: []
  claim:L92_captured_recovery_head_equals_authoritative_frontier:
    kind: claim
    subject_id: L92_captured_recovery_head_equals_authoritative_frontier
    subject_signature: 8b28a158453cf63f6fa93a0a65b144fd0b9e8afccd918fc084a1a03b78964d40
    roundtrip:
      subject_signature: 8b28a158453cf63f6fa93a0a65b144fd0b9e8afccd918fc084a1a03b78964d40
      status: TRANSLATED
      natural_language: 'For every recovery attempt r, if r has reached the new-owner recovery-head capture event after epoch handoff, at which it reads the authoritative frontier and binds recovery_head, then both of the following hold: the recovery_head value bound to r equals the authoritative persisted document_latest_revision frontier for the document read when r captures its recovery frontier; and that same captured recovery_head governs checkpoint selection, exact tail replay, recovered metadata reconstruction, and acceptance resumption for r.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 8b28a158453cf63f6fa93a0a65b144fd0b9e8afccd918fc084a1a03b78964d40
        verdict: EQUIVALENT
        reason: Universal quantification and the capture-event guard preserve applicability to each new-owner attempt reaching capture after epoch handoff. Equality binds that attempt's recovery head to the authoritative frontier read at its capture event. The preservation predicate requires the same captured head to govern all four downstream stages, excluding substitution of a different recovery head. No progress obligation is imposed before capture, and no checkpoint, replay, or metadata correctness guarantee is added.
        differences: []
      strengthening:
        subject_signature: 8b28a158453cf63f6fa93a0a65b144fd0b9e8afccd918fc084a1a03b78964d40
        verdict: EQUIVALENT
        reason: The capture-event guard restricts obligations to new-owner recovery attempts reaching head capture after epoch handoff. Equality binds the attempt's recovery head to the authoritative frontier read at that event, and preservation requires that same captured head to govern all four named downstream stages, excluding substitution of a different frontier. Attempts not reaching capture incur no obligation. Attempt identity, observation timing, and provenance are preserved, with no additional progress or stage-correctness requirements.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 8b28a158453cf63f6fa93a0a65b144fd0b9e8afccd918fc084a1a03b78964d40
        verdict: EQUIVALENT
        reason: Both propositions apply to new-owner recovery attempts reaching head capture after epoch handoff, bind recovery_head to the authoritative document_latest_revision read at that event, and require that same captured value to govern all four downstream stages. This preserves the prohibition on substituting a different recovery head and imposes no progress obligation on attempts that terminate before capture.
        differences: []
  claim:L108_acceptance_preserves_request_identity:
    kind: claim
    subject_id: L108_acceptance_preserves_request_identity
    subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
    roundtrip:
      subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
      status: TRANSLATED
      natural_language: 'For every canonical acceptance a and every request r, if canonical acceptance a was produced from
        submitted request r, then all of the following hold: the document identity preserved on canonical acceptance a is
        equal to the document identity carried by request r; the client change identity preserved on canonical acceptance
        a is equal to the client-supplied logical edit identity carried by request r; the authoritative idempotency identity
        associated with acceptance a exactly matches the request''s (document_id, client_change_id) identity; and from request
        admission through OT dispatch, idempotency arbitration, retry handling, and canonical commit, neither document_id
        nor client_change_id is dropped, regenerated, substituted, or cross-bound, such that every identity handoff for acceptance
        a remains the originating request r identity. In addition, for every durable idempotency evidence e, if durable idempotency
        evidence e is associated with canonical acceptance a, then e identifies exactly the same (document_id, client_change_id)
        carried by originating request r.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The formula preserves the source proposition's applicability boundary, requiring the guarantees only for canonical
          acceptances produced from submitted requests. It retains both identity coordinates (document_id and client_change_id),
          the end-to-end preservation requirement, and the durable idempotency evidence association requirement. No additional
          cardinality, uniqueness, temporal, or provenance obligation is introduced beyond the canonical claim.
        differences: []
      strengthening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The formula preserves the source applicability boundary by conditioning on an acceptance produced from a request,
          and it encodes the same document_id/client_change_id identity preservation, end-to-end provenance binding, and durable
          idempotency evidence identity requirements stated in the canonical claim. No additional cardinality, uniqueness,
          or out-of-scope guarantee is introduced.
        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The round-trip rendering preserves the original contract's quantification, provenance direction, identity
          components, and observation scope. It states that accepted changes retain the originating request's document_id
          and client_change_id and that associated idempotency evidence uses the same identity. The additional wording about
          specific pipeline stages is an expansion of the acceptance path covered by the original claim, not a new semantic
          requirement.
        differences: []
      strengthening:
        subject_signature: 1971e5b39c849f13dbbf57e833af1968d7809dd5453c6a74976b4a20aad02e48
        verdict: EQUIVALENT
        reason: The rendering preserves the original contract's applicability boundary, identity coordinates, provenance direction,
          and observation scope. It restates preservation of document_id and client_change_id through the acceptance path
          and durable idempotency evidence without introducing uniqueness, cardinality, or guarantees beyond the canonical
          acceptance identity-binding requirement.
        differences: []
  claim:L116_live_delivery_is_bound_to_committed_acceptance:
    kind: claim
    subject_id: L116_live_delivery_is_bound_to_committed_acceptance
    subject_signature: 5a28b7e9d561cb1483416363a7e74af5daf44b25754d6128f926ad3541abdb99
    roundtrip:
      subject_signature: 5a28b7e9d561cb1483416363a7e74af5daf44b25754d6128f926ad3541abdb99
      status: TRANSLATED
      natural_language: 'For every LiveDelivery d, if d is a change actually exposed through the websocket live stream, then there exists a CanonicalAcceptance a such that all of the following hold: a is a committed record in the authoritative accepted_change_log; d originates from a as its accepted-history source; d preserves a''s canonical payload and revision provenance exactly; and d is consumed on the same document-scoped stream as a, with an equally-valued acceptance from another document unable to satisfy this document-scope condition. The implication applies to every actually exposed change, including any provisional, speculative, rejected, aborted, or never-committed change that is exposed.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 5a28b7e9d561cb1483416363a7e74af5daf44b25754d6128f926ad3541abdb99
        verdict: EQUIVALENT
        reason: Every actually exposed delivery requires a single acceptance witness that is committed, is its accepted-history source, and preserves both document scope and canonical payload/revision provenance. These obligations exclude uncommitted sources and other-document substitutions even when values collide. The formula adds no uniqueness, ordering, timeliness, or eventual-delivery requirement and introduces no unsupported identity or temporal bridge.
        differences: []
      strengthening:
        subject_signature: 5a28b7e9d561cb1483416363a7e74af5daf44b25754d6128f926ad3541abdb99
        verdict: EQUIVALENT
        reason: Every actually exposed delivery must originate from a committed canonical acceptance that preserves both document scope and canonical payload/revision provenance. All obligations share the same acceptance witness, excluding other-document substitution despite value collisions. The exposure predicate includes invalid provisional deliveries rather than excluding them by preclassification. The formula adds no uniqueness, ordering, timeliness, or eventual-delivery requirement and introduces no unsupported identity or temporal bridge.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 5a28b7e9d561cb1483416363a7e74af5daf44b25754d6128f926ad3541abdb99
        verdict: EQUIVALENT
        reason: 'Both require every exposed change to originate from a committed canonical acceptance for the same document, preserving canonical payload and revision provenance even when values collide across documents. Including provisional or otherwise uncommitted changes within the implication''s scope does not authorize their exposure: they must satisfy the same committed-source requirement. Neither adds uniqueness, ordering, timeliness, or delivery success guarantees.'
        differences: []
  claim:C12_live_delivery_contains_only_accepted_changes:
    kind: claim
    subject_id: C12_live_delivery_contains_only_accepted_changes
    subject_signature: f0958426822769f618719a1b97a2d340c7cf3fa6e99dc48501345118a6e6a060
    roundtrip:
      subject_signature: f0958426822769f618719a1b97a2d340c7cf3fa6e99dc48501345118a6e6a060
      status: TRANSLATED
      natural_language: 'For every live delivery d, if d is a change actually exposed through the websocket live stream, then there exists a canonical acceptance record a such that all of the following hold: a is a committed record in the authoritative accepted_change_log; d originates from a as its accepted-history source; d preserves a''s canonical payload and revision provenance exactly; and d is consumed on the same document-scoped stream as a. An equally-valued acceptance from another document cannot satisfy this document-scope condition. The exposure guard includes any provisional, speculative, rejected, aborted, or never-committed change actually exposed through the stream; such exposure must satisfy the same committed-source, origin, payload/revision, and document-scope requirements with a single acceptance record a.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: f0958426822769f618719a1b97a2d340c7cf3fa6e99dc48501345118a6e6a060
        verdict: EQUIVALENT
        reason: Every exposed live change must originate from one committed acceptance record that preserves both document scope and canonical payload/revision provenance. The same witness satisfies all obligations, excluding uncommitted changes and equally-valued records from other documents. No uniqueness, ordering, timeliness, or delivery-completeness requirement is imposed, so duplication and reordering remain permitted. No identity, observation, or provenance coordinate is lost.
        differences: []
      strengthening:
        subject_signature: f0958426822769f618719a1b97a2d340c7cf3fa6e99dc48501345118a6e6a060
        verdict: EQUIVALENT
        reason: Every exposed live change must originate from a committed acceptance record, preserving that same record's document scope, canonical payload, and revision provenance. The shared existential witness prevents substitution of an equally-valued record from another document. No uniqueness, ordering, timeliness, or eventual-delivery obligation is added; duplication and reordering remain permitted. The typed predicates preserve the source's distinct delivery and acceptance coordinates without adding temporal or cross-claim bridges.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: f0958426822769f618719a1b97a2d340c7cf3fa6e99dc48501345118a6e6a060
        verdict: EQUIVALENT
        reason: Both require every exposed live change to originate from committed accepted history for the same document, preserving canonical payload and revision provenance. The single-record witness prevents mixing provenance coordinates or substituting equally-valued records from other documents. The exposure guard restates the universal scope without adding guarantees of ordering, uniqueness, timeliness, or eventual delivery.
        differences: []
