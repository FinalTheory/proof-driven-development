  claim:L159_owner_append_authorization_is_generation_bound:
    kind: claim
    subject_id: L159_owner_append_authorization_is_generation_bound
    subject_signature: 894b540378cef54a3d907e798b05ca655975eff13775c9fae349bd8a2492a319
    roundtrip:
      subject_signature: 894b540378cef54a3d907e798b05ca655975eff13775c9fae349bd8a2492a319
      status: TRANSLATED
      natural_language: 'For every protocol transition t and every document d, all of the following hold conjunctively. First,
        if t is a canonical append attempt for d — that is, t executes a canonical accepted-history append attempt targeting
        d, including successful, rejected, aborted, delayed, and interrupted attempts, independently of whether their supplied
        fencing tuple is valid or any canonical acceptance commits, and noting that every transition performing a canonical
        accepted-history append for d is such an attempt, while a transition solely arbitrating or writing a per-key terminal
        outcome does not qualify on that basis — then the append tuple is bound to the executing document generation for d
        and t: throughout the attempt, the supplied owner_epoch and append_owner_generation_id originate from and remain bound
        to the immutable trusted server-side owner generation actually executing that attempt, whose ownership document is
        d; neither coordinate nor the document namespace may be copied, substituted, refreshed, or rebound to impersonate
        another generation, and equal scalar values from another document or generation do not establish this provenance;
        this binding does not require the executing generation to remain authoritative current, and does not require the attempt
        to commit. Second, if t performs a canonical accepted-history append for d, then t uses the exact current document
        generation for t and d: the append is authorized by the exact current document-scoped generation identity for d, including
        epoch and generation-bound server append identity, and copied scalar values or another document''s tuple do not authorize
        it. Third, if t performs a canonical accepted-history append for d, then the append tuple matches the current generation
        at commit for t and d: t committed with its supplied document-scoped generation tuple matching d''s authoritative
        generation at commit, specifically the supplied owner_epoch equaled d''s authoritative document_current_epoch at t''s
        commit point and the supplied append_owner_generation_id equaled d''s authoritative document_owner_generation_id at
        t''s commit point; a tuple whose generation was superseded between attempt and commit, or that was copied from or
        merely scalar-collides with another document''s generation, does not satisfy this condition.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 894b540378cef54a3d907e798b05ca655975eff13775c9fae349bd8a2492a319
