  contract:terminal_speculative_lifecycle_closure:
    kind: contract
    subject_id: terminal_speculative_lifecycle_closure
    subject_signature: 4b11b94dd8a5de95a6a3f288d29a4edd3e57837cfa68bb1fdf7f2b2191a4e241
    roundtrip:
      subject_signature: 4b11b94dd8a5de95a6a3f288d29a4edd3e57837cfa68bb1fdf7f2b2191a4e241
      status: TRANSLATED
      natural_language: Both of the following must hold. First, for every client state s and every exact logical-edit identity
        e=(D,k), if s is reachable under the normal client protocol (including restore, view switching, bookkeeping, reconnect/resync,
        publication, and explicit terminal disposition) and e is classified in s as a terminalized normal speculative lifecycle,
        then in s that exact identity e is not active in client_pending_edits, is not retained as a normal-lifecycle speculative
        representation in client_speculative_overlays, is not exposed as a normal-lifecycle speculative representation in
        client_visible_speculative_overlays, and every later user operation that actually occurs for the same document D in
        the continuing normal client history is a genuinely new logical edit rather than a continuation, retry, restore, or
        reactivation of e, with a client_change_id different from k. If no later user operation for D occurs, this last condition
        is vacuously true; it imposes no cross-document change-id restriction, no physical-deletion or tombstone requirement,
        and no liveness or eventual-operation obligation. Second, for every earlier client state, every later client state,
        and every exact logical-edit identity e, if both states are reachable under the normal client protocol, the later
        state is reachable after the earlier state by one or more client-protocol transitions in the continuing client lifecycle/history
        (including restore/reactivation, view switching, bookkeeping, reconnect/resync, or publication transitions), and e
        is classified as terminalized in the earlier state, then e is also classified as terminalized in the later state and,
        in that later state, e is not active in client_pending_edits, is not retained as a normal-lifecycle speculative representation
        in client_speculative_overlays, and is not exposed as a normal-lifecycle speculative representation in client_visible_speculative_overlays.
        Terminalized classification denotes that the normal speculative lifecycle of the full logical-edit identity has ended
        by authoritative reconciliation or an explicit terminal disposition; it need not be implemented as a separately materialized
        tombstone and may instead be realized by deletion or non-reactivatable archival state.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 4b11b94dd8a5de95a6a3f288d29a4edd3e57837cfa68bb1fdf7f2b2191a4e241
        verdict: EQUIVALENT
        reason: 'The two conjuncts jointly preserve the source''s absorbing invariant over the exact logical-edit identity
          (D,k): every reachable state already classifying e as terminalized excludes that same identity from pending, retained
          speculative, and visible speculative state, and every later reachable state in the continuing client history preserves
          both terminal classification and those exclusions. The freshness helper also preserves the final source clause by
          requiring any later user operation for D to be a genuinely new logical edit with a client_change_id different from
          k, while adding no liveness, physical-deletion/tombstone, or cross-document requirement. Reachability, transition
          scope, identity coordinates, and exclusions therefore match the canonical proposition.'
        differences: []
      strengthening:
        subject_signature: 4b11b94dd8a5de95a6a3f288d29a4edd3e57837cfa68bb1fdf7f2b2191a4e241
        verdict: EQUIVALENT
        reason: 'The formula preserves the canonical all-reachable-state boundary and exact logical-edit identity (D,k): terminalized
          identities are excluded from all three normal speculative-state sets, remain terminalized in every later reachable
          client state, and later same-document user operations are required to be fresh logical edits with a client_change_id
          different from k. The helper meanings retain the canonical transition scope while explicitly avoiding cross-document
          uniqueness, physical-deletion/tombstone, and liveness requirements, so they introduce no extra guarantee or omission.'
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 4b11b94dd8a5de95a6a3f288d29a4edd3e57837cfa68bb1fdf7f2b2191a4e241
        verdict: EQUIVALENT
        reason: 'The rendering preserves the all-reachable-state invariant over the full (D,k) identity: terminalization by
          the stated causes is absorbing along every subsequent reachable client transition, the identity is excluded from
          all three normal speculative sets, and later operations for D cannot reuse k as a continuation or reactivation of
          that lifecycle. Its explicit same-document change-id scope and allowances for deletion or non-reactivatable archival
