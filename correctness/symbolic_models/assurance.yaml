  contract:recovered_ot_state_provenance:
    kind: contract
    subject_id: recovered_ot_state_provenance
    subject_signature: 6ff0234fb6cf0306687da128d9bf1164f01d5e6956da9d3ee6c25f82b9f2143e
    roundtrip:
      subject_signature: 6ff0234fb6cf0306687da128d9bf1164f01d5e6956da9d3ee6c25f82b9f2143e
      status: TRANSLATED
      natural_language: 'For every recovery attempt r, if r is within the canonical new-owner recovery boundary for its target
        document and r has actually completed and installed its recovered owner state, then the following provenance requirement
        holds for r, its bound target document d, and its bound recovery-head revision h. Every component of the installed
        ot_owner_memory must derive exclusively from d''s selected authoritative checkpoint P=(content,S), whose content is
        atomically published with the exact canonical revision frontier S it represents, and d''s exact canonical ordered
        accepted-change-log tail (S,h], excluding S and including h. The checkpoint, canonical tail entries, recovery head,
        and installed OT state must all preserve the same document identity d. The recovery head is the authoritative revision
        frontier captured after epoch handoff and used to bound checkpoint selection, replay, metadata reconstruction, and
        resumption. Provenance must be from these actual document-scoped authoritative sources; a different document''s checkpoint
        or history cannot substitute even if its values are identical. Holding those authoritative inputs and h fixed, changing
        or removing failed-owner memory, new-owner caches, process-local recovery data, or any other non-authoritative runtime
        sources must not change any part of the complete installed OT state. No installed component may originate from those
        sources, even if its value matches the authoritative result. Intermediate computations derived solely from the permitted
        authoritative inputs are allowed. The installed ot_owner_memory comprises the complete volatile materialized set of
        document-history-dependent OT metadata and state on the owner that can influence server-side OT transformation or
        canonical acceptance and is reconstructable from authoritative truth for d. Outside recovered logical document state
        and local head/next-revision state, there is no separate recovery-installed history-dependent OT metadata carrier
        that may influence canonical semantics. Entry into the canonical new-owner recovery boundary establishes the attempt''s
        classification independently of successful progress: it remains such an attempt even if it stalls, crashes, or aborts
        before owner-generation installation, recovery-head capture, or completion. Recovery or reconstruction outside that
        boundary is excluded. Actual completion is classified independently of the correctness of the installed state, recovery
        inputs, or provenance. The provenance obligation applies only when both guards hold; it does not require any recovery
        attempt to complete, assert correctness of the OT transformation algorithm, impose an independent full-history reconstruction
        equality, or add liveness, delivery, ordering, or other temporal requirements beyond what is explicitly stated.'
      ambiguities: []
