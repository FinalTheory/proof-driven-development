      natural_language: 'All of the following requirements hold conjunctively. The full idempotency key is the pair (document_id,
        client_change_id). References to semantic contracts supply vocabulary and relations; their entire formulas are not
        additional conjuncts of this proposition. For every authoritative state s and every idempotency key k, if s is reachable
        under the canonical server protocol and failure model and k is within the 30-day normal retry eligibility horizon
        in s, then s contains at most one durable terminal result for k; if k has an ACCEPTED terminal outcome in s, canonical
        accepted history contains the matching acceptance for k and no incompatible REJECTED outcome exists; if k has a REJECTED
        terminal outcome in s, canonical accepted history contains no canonical acceptance for k; and, once a terminal outcome
        for k has linearized, later acceptance or definitive-rejection attempts preserve that same single-valued outcome.
        For every terminal-result record t, if t is an authoritative ACCEPTED(canonical result) outcome and is still within
        the 30-day normal retry eligibility horizon in which producer provenance must be retained, there exists a canonical
        acceptance a that is committed in authoritative accepted history, whose authoritative idempotency key equals the full
        key carried by t, and such that t stores the canonical result produced by the same acceptance execution that produced
        a. An extensionally equal result from another producer does not satisfy this binding. For every protocol transition
