  contract:owner_generation_authorization_binding:
    kind: contract
    subject_id: owner_generation_authorization_binding
    subject_signature: aa176e0d8aa261012a8dac53f028fe5ec795be2897712ef6b284839dd78f5716
    roundtrip:
      subject_signature: aa176e0d8aa261012a8dac53f028fe5ec795be2897712ef6b284839dd78f5716
      status: TRANSLATED
      natural_language: "For every protocol transition t and every document d, both of the following hold. First, if t executes\
        \ a canonical accepted-history append attempt targeting d\u2014including a successful, rejected, aborted, delayed,\
        \ or interrupted attempt, regardless of whether its supplied fencing tuple is valid or any canonical acceptance commits\u2014\
        then throughout that attempt the supplied owner_epoch and append_owner_generation_id must originate from and remain\
        \ bound to the immutable trusted server-side owner generation that is actually executing that attempt and whose ownership\
        \ document is d. Neither of those coordinates nor the document namespace may be copied, substituted, refreshed, or\
        \ rebound to impersonate another generation, and equality of scalar values with values from another document or generation\
        \ does not establish the required provenance. This requirement does not require the executing generation to remain\
        \ the authoritative current generation and does not require the attempt to commit; a transition that solely arbitrates\
        \ or writes a per-key terminal outcome does not qualify as such an append attempt merely for doing so. Second, if\
        \ t performs a canonical accepted-history append for d, then t must be authorized by the exact current generation\
        \ identity scoped to d, including both the current ownership epoch and the generation-bound server append identity;\
        \ copied scalar values or a tuple belonging to another document do not authorize that append."
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: aa176e0d8aa261012a8dac53f028fe5ec795be2897712ef6b284839dd78f5716
        verdict: EQUIVALENT
        reason: 'The formula preserves both source obligations: every canonical append attempt binds both supplied fencing
          coordinates to the immutable server-side generation actually executing for the same document, while every canonical
          append that commits must use the exact authoritative current document-scoped epoch/generation identity. The helper
          meanings also preserve rejection of cross-document scalar collisions and superseded-generation impersonation without
          extending the contract to terminal-only arbitration, liveness, ordering, serialization, or idempotency.'
        differences: []
      strengthening:
        subject_signature: aa176e0d8aa261012a8dac53f028fe5ec795be2897712ef6b284839dd78f5716
        verdict: EQUIVALENT
        reason: The first implication enforces the required per-attempt binding of both supplied generation coordinates to
          the immutable trusted owner generation actually executing for the same document, while the second applies exact-current
          document generation authorization to the transition that performs the canonical accepted-history append, matching
          the source's at-commit condition. The predicate meanings preserve document scope, provenance, both identity coordinates,
          collision/substitution rejection, and the exclusion of terminal-only writes without adding temporal, cardinality,
          or observation requirements.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: aa176e0d8aa261012a8dac53f028fe5ec795be2897712ef6b284839dd78f5716
        verdict: EQUIVALENT
        reason: The rendering preserves the universal scope over canonical append attempts, the document-scoped provenance
          binding of both supplied coordinates to the immutable trusted server-side generation actually executing the attempt,
          and the requirement that any committed canonical append be authorized by that document's exact current epoch and
          generation identity. It also preserves the rejection of authority from cross-document or superseded-generation scalar
          collisions or rebinding and the exclusion of standalone per-key terminal-outcome writes, without adding liveness,
          ordering, serialization, or idempotency guarantees.
        differences: []
  contract:ot_result_frontier_binding:
    kind: contract
    subject_id: ot_result_frontier_binding
    subject_signature: 04d856c404086ad4ae3e714e38f239e0f388251901eb87a208aa00cc4ec9ff01
    roundtrip:
      subject_signature: 04d856c404086ad4ae3e714e38f239e0f388251901eb87a208aa00cc4ec9ff01
      status: TRANSLATED
      natural_language: 'For every OT success result r, if r is a successful result actually produced by an OT computation
        in an in-scope protocol execution, then there exists a revision n such that n is the actual frontier of the canonical
        committed document prefix used by the computation that produced r, and r remains semantically bound to that original
        computation frontier throughout every subsequent representation and handoff that preserves r, including any use of
        r for acceptance; relabeling, copying, or changing revision metadata on that same computed result cannot establish
        a different computation frontier, while a fresh computation has its own result and actual computation frontier even
        if its payload bytes equal those of r. For that same revision n, for every canonical acceptance a, if a is a committed
        canonical accepted-change record in authoritative accepted history and a is bound to the exact successful OT result
        r that produced its accepted payload, with no synthesized or substituted result qualifying, then all of the following
        hold: the document identity preserved on canonical acceptance a is equal to the semantic document identity of the
        canonical committed accepted_change_log prefix actually used by the OT computation that produced r; the authoritative
        document_latest_revision of a''s document immediately before a''s acceptance linearization point is equal to n, where
        this is the actual acceptance pre-state value rather than an earlier read, an owner-memory estimate, a submitted frontier
        field, or the post-acceptance value; and the canonical revision assigned to a is exactly n+1, the immediate next revision
        after n. The bindings asserted for r do not themselves imply liveness, delivery, ordering, OT algorithm correctness,
        submitted-request identity, owner-generation authorization, accepted-payload equality beyond separately stated contracts,
        permanent physical retention of discarded results, or any particular physical token representation.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 04d856c404086ad4ae3e714e38f239e0f388251901eb87a208aa00cc4ec9ff01
        verdict: EQUIVALENT
        reason: For every actual OT success result, the formula binds the result to the actual canonical committed-prefix
          frontier used by its computation and preserves that provenance; every committed canonical acceptance consuming that
          exact result must be for the same document, observe authoritative pre-state revision N, and receive revision N+1.
          The supplied helper meanings also preserve the no-rebinding/fresh-computation distinction while adding no liveness
          or payload-correctness guarantee, so the canonical contract and exclusions are preserved.
        differences: []
      strengthening:
        subject_signature: 04d856c404086ad4ae3e714e38f239e0f388251901eb87a208aa00cc4ec9ff01
        verdict: EQUIVALENT
        reason: 'The formula preserves the canonical provenance boundary: every actual in-scope OT success result is bound
          to its actual committed-prefix frontier, and any committed canonical acceptance using that exact result must be
          on the same document coordinate with authoritative immediate pre-state revision N and accepted revision N+1. The
          helper meanings make the source''s stale-result/relabeling exclusion explicit and do not add liveness, payload-correctness,
          or other guarantees outside the contract.'
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 04d856c404086ad4ae3e714e38f239e0f388251901eb87a208aa00cc4ec9ff01
        verdict: EQUIVALENT
        reason: The rendering preserves each actual OT success result's provenance to the document-scoped canonical committed
          prefix and its computation frontier N, forbids metadata-only rebinding, and permits canonical acceptance bound to
          that exact result only when the same document's authoritative immediate acceptance pre-state is N and the assigned
          revision is N+1. A frontier mismatch therefore prevents acceptance of the stale result and requires a fresh computation.
          The explicit document-identity clause follows from accepted_change_log's supplied document scope and the provenance_binding
          semantics; the remaining elaborations preserve the stated exclusions without adding liveness, ordering, payload-correctness,
          or other guarantees.
        differences: []
  contract:ot_success_acceptance_binding:
    kind: contract
    subject_id: ot_success_acceptance_binding
    subject_signature: d34dfdb39712ba738e6e0bc8c65197ec594668094316bf2cc7000258ac68e15e
    roundtrip:
      subject_signature: d34dfdb39712ba738e6e0bc8c65197ec594668094316bf2cc7000258ac68e15e
      status: TRANSLATED
      natural_language: For every CanonicalAcceptance a, if a is a canonical_accepted_change in authoritative accepted history,
        then both of the following hold. First, there exists an OTSuccessResult r such that a is bound to the exact successful
        OT result r that produced its accepted payload, with no synthesized or substituted result qualifying, and r was produced
        for a's corresponding submitted raw_edit and declared base_revision. Here raw_edit is the client-submitted edit before
        server-side transformation or rebase, base_revision is its declared canonical client revision frontier, and r is the
        successful transformed payload returned by the OT engine for that input and canonical committed context. Correctness
        of the declared base_revision is a separate obligation. Second, every in-scope path whose effect creates or commits
        a has successful OT-result provenance for a's corresponding submitted raw_edit and base_revision. No path lacking
        that provenance may create or commit a; in particular, an invalid or rebase-required OT outcome cannot create or commit
        a. A path that only reads, returns, retry-resolves, delivers, restores, or otherwise observes an already-committed
        canonical acceptance is not an acceptance producer for this condition. These requirements constrain identity and provenance
        for every modeled occurrence covered by the formula. They impose no liveness, delivery, ordering, additional temporal
        behavior, idempotency arbitration, acceptance-frontier, owner-generation or fencing, or unrelated rejection or terminal-outcome
        semantics.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: d34dfdb39712ba738e6e0bc8c65197ec594668094316bf2cc7000258ac68e15e
        verdict: EQUIVALENT
        reason: Every canonical acceptance requires an exact successful OT-result witness for its corresponding submitted
          raw_edit and base_revision. The producer predicate additionally excludes creation or commitment without that provenance,
          including invalid or rebase-required outcomes. The translation preserves the source's identity and provenance requirements
          without adding liveness, uniqueness, convergence, or authoring-frontier obligations.
        differences: []
      strengthening:
        subject_signature: d34dfdb39712ba738e6e0bc8c65197ec594668094316bf2cc7000258ac68e15e
        verdict: EQUIVALENT
        reason: Every canonical acceptance must bind to the exact successful OT result for its corresponding submitted raw_edit
          and base_revision. The producer predicate excludes creation or commitment without that provenance, including reject
          and rebase-required outcomes, while excluding mere observations of existing acceptances. The translation adds no
          uniqueness, liveness, ordering, convergence, or authoring-frontier requirement.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: d34dfdb39712ba738e6e0bc8c65197ec594668094316bf2cc7000258ac68e15e
        verdict: EQUIVALENT
        reason: The rendering preserves universal coverage of canonical acceptances and all acceptance-producing paths, binding
          each payload to the exact successful OT result for its corresponding raw_edit, declared base_revision, and canonical
