  assumption:A6_normal_retry_reconnect_identity_is_eligible_for_30_days:
    kind: assumption
    subject_id: A6_normal_retry_reconnect_identity_is_eligible_for_30_days
    subject_signature: 0a52491277f193f44ee6973ffdeb86db462d99452e561ca0fb7baf0e56823c8e
    roundtrip:
      subject_signature: 0a52491277f193f44ee6973ffdeb86db462d99452e561ca0fb7baf0e56823c8e
      status: TRANSLATED
      natural_language: For every state s and exact identity e, if e is a pending logical edit of a normally participating
        client to which this age-boundary assumption applies, both of the following hold. If the client submits e through
        normal retry or authoritative reconnect-reconciliation, e has a defined pending/retry age of at most 30 days. If e
        has a defined pending/retry age exceeding 30 days, the client does not submit e through either of those normal paths
        and, because e is outside the normal 30-day horizon, discards e or routes it through explicit expired, conflict, or
        manual-resolution handling. Being in scope does not itself assert submission or eligibility, and having a defined
        pending/retry age of at most 30 days does not itself assert retention, eligibility, or submission. These requirements
        are conditional on e being in scope; the assumption imposes no requirements on identities outside that scope. This
        is an accepted proof assumption. Any execution or state that violates it is outside any correctness guarantee whose
        proof depends on it.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 0a52491277f193f44ee6973ffdeb86db462d99452e561ca0fb7baf0e56823c8e
        verdict: EQUIVALENT
        reason: The formula preserves the age restriction on normal retry/reconnect submissions and requires both non-submission
          and discard or explicit resolution handling after 30 days. Its scope restricts these obligations to applicable normally
          participating clients, leaving boundary-violating submissions outside the normal-path guarantees. It does not turn
          age at most 30 days into a sufficient condition for retention, eligibility, or submission.
        differences: []
      strengthening:
        subject_signature: 0a52491277f193f44ee6973ffdeb86db462d99452e561ca0fb7baf0e56823c8e
        verdict: EQUIVALENT
        reason: The formula preserves the restriction on normal retry/reconnect submissions and the required discard or explicit
          expired/conflict/manual handling after 30 days. Its scope does not require submission, retention, or eligibility
          within 30 days. It introduces no stronger obligations and preserves the exclusion of boundary-violating submissions
          from normal-path guarantees.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 0a52491277f193f44ee6973ffdeb86db462d99452e561ca0fb7baf0e56823c8e
        verdict: EQUIVALENT
        reason: Both make age <=30 days a necessary, not sufficient, condition for normal retry/reconnect submission of the
          same logical edit identity. Both prohibit normal submission after 30 days and require discard or explicit expired/conflict/manual
          handling. The roundtrip makes explicit the absence of converse obligations and limits its guarantee exclusion to
          guarantees whose proofs depend on the premise; it does not independently withdraw unrelated guarantees.
        differences: []
  claim:G0_acked_edit_survives_failover:
