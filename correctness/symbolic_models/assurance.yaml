  obligation:accepted_reconciliation_closes_pending_lifecycle:
    kind: obligation
    subject_id: accepted_reconciliation_closes_pending_lifecycle
    subject_signature: 10eea52c52ac29be5a03a363d5eef6be49b124fad364cdc6603e151f4d9f97cf
    roundtrip:
      subject_signature: 10eea52c52ac29be5a03a363d5eef6be49b124fad364cdc6603e151f4d9f97cf
      status: TRANSLATED
      natural_language: For every client state s and logical edit identity e, if s is exactly the user-visible client state
        atomically exposed by a normal foreground reconnect/reconciliation publication through response head H after the authoritative
        reconciliation result classified that exact logical edit identity e as ACCEPTED at a canonical revision r satisfying
        r <= H, then, in that same published state s and at that publication boundary, the exact logical edit identity e is
        not active in client_pending_edits. The antecedent by itself does not assert that the published canonical state correctly
        contains or is provenance-bound to that acceptance, nor does it assert response-head correctness.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 10eea52c52ac29be5a03a363d5eef6be49b124fad364cdc6603e151f4d9f97cf
        verdict: EQUIVALENT
        reason: The formula preserves the source contract's universal quantification over published normal foreground reconnect/reconciliation
          states and exact logical edit identities, its same-identity ACCEPTED-within-response-head precondition, and its
          publication-boundary requirement that the resulting state contain no active unresolved pending entry for that identity.
          The helper predicates do not add a cross-claim provenance or canonical-content requirement beyond the cited contract.
        differences: []
      strengthening:
        subject_signature: 10eea52c52ac29be5a03a363d5eef6be49b124fad364cdc6603e151f4d9f97cf
        verdict: EQUIVALENT
        reason: The formula preserves the source contract's universal scope over published normal foreground reconciliation
          states and logical edit identities, its exact same-identity ACCEPTED classification within the captured response
          head, and its publication-boundary requirement that the resulting client state no longer retain that identity as
          an active unresolved entry in client_pending_edits. The helper predicate adds no independent canonical-containment
          or provenance guarantee and matches the cited atomic publication boundary.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 10eea52c52ac29be5a03a363d5eef6be49b124fad364cdc6603e151f4d9f97cf
        verdict: EQUIVALENT
        reason: 'The rendering preserves the obligation''s universal scope over normal foreground reconnect/reconciliation
          publication states and exact logical edit identities, and preserves the same transition condition: authoritative
          same-identity ACCEPTED classification at revision r within the response head H implies that the resulting atomically
          published client state has no active unresolved pending entry for that identity. The cited canonical section explicitly
          requires accepted same-identity speculative lifecycle retirement before or atomically with reconciled publication
          and states that the published state no longer contains the identity as an unresolved client_pending_edits entry.
          The rendering''s disclaimer about not independently asserting canonical-source provenance or response-head correctness
          does not weaken this extracted obligation, because those are separate correctness dimensions rather than claims
          made by this pending-lifecycle bridge itself.'
        differences: []
  obligation:visible_speculative_representation_valid_on_current_base:
