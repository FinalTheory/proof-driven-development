        t''s full idempotency key, and such that t stores the canonical result produced by the same acceptance execution that
        both produced a and committed a into authoritative accepted history. An extensionally equal result from another producer,
        or an acceptance committed by a different execution, does not satisfy that execution binding. For every protocol transition
        x and every pair of terminal-result records before and after, if x is an authoritative lifecycle representation change
        within the normal retry eligibility horizon that preserves one already-linearized ACCEPTED logical terminal outcome
        from before to after, with before and after carrying the same full idempotency identity while their durable physical
        representation may change, then there exists one canonical acceptance a committed in authoritative accepted history
        such that the full idempotency keys of before and after each equal a''s full idempotency key, and both before and after
        store the canonical result produced by the same acceptance execution that both produced and committed a. For every terminal-result
        record t, if t is an authoritative REJECTED definitive-reason outcome and its logical identity remains within the normal
        retry eligibility horizon in which definitive-rejection request and authoritative-context provenance are guaranteed,
        let d be the definitive rejection decision from which t derives and let r be the exact submitted request for which d
        was produced. Then t and r carry exactly the same full (document_id, client_change_id) identity, and, when the definitive
        rejection reason depends on raw_edit or base_revision, d uses those exact values from r. For every terminal-result record
        t, if t is a rejected terminal result whose definitive rejection reason depends on document or history state and its
        logical identity remains within that same normal retry eligibility horizon, then the definitive rejection decision d
        from which t derives is bound to authoritative rejection context for the same document, rather than unvalidated stale
        owner-local state, and the authoritative context or evidence for d remains sufficient when t linearizes, either because
