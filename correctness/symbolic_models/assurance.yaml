  claim:G7_reconnect_does_not_double_render_accepted_optimistic_edit:
    kind: claim
    subject_id: G7_reconnect_does_not_double_render_accepted_optimistic_edit
    subject_signature: 2c2263e2776f0e20ae63f195360a07960abefe28218f2380516fdf6ab63d4f8d
    roundtrip:
      subject_signature: 2c2263e2776f0e20ae63f195360a07960abefe28218f2380516fdf6ab63d4f8d
      status: TRANSLATED
      natural_language: For every catch-up response c and every logical edit identity e, if c is a reconnect/resync attempt
        for document D by a normally participating client, then all of the following requirements hold, whether or not the
        attempt is foreground or D is currently visible. While c is in progress, the client creates or applies no new speculative
        local edit for D, regardless of whether such a new edit would currently be acceptance-eligible. If the exact logical
        edit identity e=(D,k) is pending at the start of c for that same document D and is within the normal 30-day reconnect
        eligibility horizon for c, then the catch-up request for c includes e for authoritative reconciliation of that exact
        full identity through c's response head. If those same pending and within-horizon conditions hold and canonical acceptance
        for the exact same full identity e is included through c's response head H_D, then any user-visible publication through
        H_D removes or suppresses the matching speculative overlay before or atomically with that publication, so no published
        user-visible state exposes both representations. If e is pending at the start of c for that same document D and is
        within the normal 30-day reconnect eligibility horizon, then no intermediate resync candidate for c may expose a candidate
        state whose canonical prefix already contains acceptance for e together with a speculative overlay for e; purely internal,
        unexposed candidate representations are not constrained by this requirement, and this requirement applies independently
        of whether c's response head itself is classified as containing that acceptance. If e has the same document coordinate
        D as the document being reconnected/resynchronized by c, then a stale response for c cannot restore a speculative
        overlay for e that a newer published reconciliation already removed; this requirement does not depend on e being pending
        at c's start or being within the normal horizon. If e is pending at the start of c for that same document D and has
        a defined pending/retry age greater than the 30-day normal reconnect eligibility horizon, then c does not submit e
        through normal authoritative reconciliation, and the client discards e or uses an explicit expired, conflict, or manual-resolution
        path. If, after reconciled publication or conflict entry for c, the exact identity e for that same resync document
        D remains protocol-eligible and unresolved, then while e remains unresolved the client stays read-only or in an explicit
        conflict/reconciliation state and creates no new acceptance-eligible speculative edit. This last requirement does
        not additionally require e to have been pending at the start of c or to satisfy the within-horizon predicate.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 2c2263e2776f0e20ae63f195360a07960abefe28218f2380516fdf6ab63d4f8d
        verdict: EQUIVALENT
        reason: The formula preserves the resync-wide speculative-edit freeze, reconciliation of every eligible pending full
          identity through the response head, and acceptance-conditioned publication suppression. Intermediate exposure is
          prohibited independently of response-head acceptance, stale restoration is prohibited for same-document identities,
          expired identities use non-normal resolution, and unresolved eligible identities block normal editing. The supplied
          predicate meanings preserve document identity, temporal scope, and user-visible observation boundaries without adding
          progress or rebase guarantees.
        differences: []
      strengthening:
        subject_signature: 2c2263e2776f0e20ae63f195360a07960abefe28218f2380516fdf6ab63d4f8d
        verdict: EQUIVALENT
        reason: The formula preserves the normal-client applicability boundary, resync edit freeze, eligible pending-identity
          reconciliation, exact document/edit identity, and acceptance-conditioned publication suppression. Intermediate exposure
          is constrained independently of response-head acceptance, stale responses cannot restore retired overlays for the
          resync document, expired identities use non-normal resolution, and unresolved eligible identities block normal editing.
          No automatic rebase, conflict-resolution, or progress guarantee is added.
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 2c2263e2776f0e20ae63f195360a07960abefe28218f2380516fdf6ab63d4f8d
        verdict: EQUIVALENT
        reason: The rendering preserves the resync edit freeze, eligible pending-identity reconciliation, exact document-and-edit
