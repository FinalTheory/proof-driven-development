      natural_language: 'All of the following hold conjunctively. (1) For every catch-up response r, if the client catch-up
        attempt associated with r is considered complete and r is a retained-delta-mode catch-up response (catch-up selected
        the retained canonical revision range for r, and r is to be constructed by returning canonical accepted changes from
        that range rather than by snapshot replacement), then the client has consumed the entire canonical representation
        of delta-mode response r: it has applied every returned revision L+1..H of r, from r''s client frontier L through
        r''s captured head H. (2) For every catch-up response r, if the client catch-up attempt associated with r is considered
        complete and r is a snapshot-replacement-mode catch-up response (catch-up selected a checkpoint for r and r is to
        be constructed by snapshot replacement rather than by delta/range application), then the client has consumed the entire
        canonical representation of snapshot-mode response r: it has installed r''s selected checkpoint (content, S) and applied
        every returned tail revision S+1..H, through r''s captured head H. (3) For every catch-up response r and every revision
        h, if the client catch-up attempt associated with r is considered complete and h is the authoritative response head
        captured for response r (this relation names r''s head only), then h is the client''s user-visible last_applied_revision
        at the moment the catch-up attempt for r completes, where last_applied_revision is the highest contiguous canonical
        revision already applied by a client.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 2c42c00f1012889e4c8ec30ae573877dc38d7b89659a933e3345cc793f9bfe9d
        verdict: EQUIVALENT
        reason: 'The formula preserves the necessity direction of ''only after'': completion plus delta mode requires entire
          delta consumption, completion plus snapshot mode requires checkpoint installation and entire tail consumption, and
          completion with captured head h requires the visible last_applied_revision at completion to equal h. No requirement
          is added, dropped, or collapsed beyond the supplied predicate meanings.'
        differences: []
      strengthening:
        subject_signature: 2c42c00f1012889e4c8ec30ae573877dc38d7b89659a933e3345cc793f9bfe9d
        verdict: EQUIVALENT
        reason: 'The formula exactly encodes the ''only after'' necessity: completion in delta mode implies consuming all
          revisions L+1..H, completion in snapshot mode implies installing checkpoint S and applying all tail revisions S+1..H,
          and completion with authoritative head H implies last_applied_revision = H at completion, with no converse, extra
