      status: TRANSLATED
      natural_language: 'Both of the following hold: (1) For every protocol transition x and every terminal result record
        t, if x exposes t to a protocol consumer and t is a terminal result for a normal_retry_eligible_identity — that is,
        a logical edit identity (document_id, client_change_id) whose pending/retry age is no more than 30 days and therefore
        remains inside the normal retry/reconnect protocol boundary defined by A6 — then x exposes t through the terminal_outcome_publication_gate.
        And (2) for every terminal result record t, if t is exposed to a protocol consumer through an authoritative publication
        path for its identity and t is a terminal result for a normal_retry_eligible_identity as defined above, then t is
        exposed to a protocol consumer through the terminal_outcome_publication_gate.'
      ambiguities: []
    direct_reviews:
      weakening:
