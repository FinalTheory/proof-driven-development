      subject_signature: 2435dccd92bac34fa72ecd8130588a30c9fb3c85281e6bbb3968b2269a730032
      status: TRANSLATED
      natural_language: For every pair of ClientState values, earlier and later, if
        both states are ordinary user-visible states in the same normal client/session,
        later is later than earlier, the session continuously represents the same
        document from earlier through later, and both earlier and later represent
        that same document, then the later state's last_applied_revision for that
        document is not strictly lower than the earlier state's visible frontier.
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 2435dccd92bac34fa72ecd8130588a30c9fb3c85281e6bbb3968b2269a730032
        verdict: EQUIVALENT
        reason: 'The formula preserves the source scope and relation: it ranges over
          ordinary user-visible earlier/later states in one normal client/session
          with continuous representation of the same document, and forbids the later
          frontier from being strictly below the earlier visible frontier. The additional
          same-session/same-document predicate is redundant given the stronger continuous-same-document
          predicate''s supplied meaning, so it does not change applicability. No quantifier,
          identity boundary, observation scope, or exclusion is dropped or added.'
        differences: []
