        differences: []
    roundtrip_reviews:
      weakening:
        subject_signature: 45bf7508462ebbe46adb3f9a45040fa3a5ab0cb3a71876ac549fdd6b4f511df3
        verdict: EQUIVALENT
        reason: 'The rendering preserves the core provenance binding: every exposed
          live delivery must originate from a committed accepted-change record. It
          retains the existential acceptance witness, the direction from canonical
