        reason: Every exposed live change must originate from one committed acceptance record that preserves both document
          scope and canonical payload/revision provenance. The same witness satisfies all obligations, excluding uncommitted
          changes and equally-valued records from other documents. No uniqueness, ordering, timeliness, or delivery-completeness
