  contract:authoritative_history_lifecycle_provenance:
    kind: contract
    subject_id: authoritative_history_lifecycle_provenance
    subject_signature: 6a9492197e239a44e9dd94ed5e0c8cf17e43a295f4f47e34aad7ec9c23f84634
    roundtrip:
      subject_signature: 6a9492197e239a44e9dd94ed5e0c8cf17e43a295f4f47e34aad7ec9c23f84634
      status: TRANSLATED
      natural_language: 'For every protocol execution t, including any execution prefix and any stalled, crashed, or aborted
        execution, and every document d, if t is a non-append authoritative snapshotting, checkpoint-replacement, cleanup,
        or compaction lifecycle execution targeting d, then t preserves d''s authoritative history scope: every authoritative
        accepted-history or checkpoint input that actually semantically supplies the lifecycle transformation remains bound
        to d throughout its participation, and every durable authoritative lifecycle output that t actually installs or publishes
        is bound to d. The document targeted by t is considered independently of whichever documents own the actual inputs
        or outputs, so history or checkpoint state from another document may not be relabeled as belonging to d even when
        revision, payload, frontier, replay, or other relevant values happen to coincide. Physical content-addressed blobs,
        pages, or bytes may be shared across documents provided the authoritative references participating in the lifecycle
        remain bound to d. Merely inspecting or rejecting an unrelated candidate does not make that candidate a semantic input.
        This requirement applies without assuming that any input or output stage is reached, that the execution completes
        or makes eventual progress, or that replay equivalence, frontier behavior, recovery correctness, physical retention,
        or physical object identity has any particular property; ordinary canonical appends and recovery procedures, as such,
        are outside this lifecycle classification.'
      ambiguities: []
    direct_reviews:
      weakening:
        subject_signature: 6a9492197e239a44e9dd94ed5e0c8cf17e43a295f4f47e34aad7ec9c23f84634
        verdict: EQUIVALENT
        reason: The symbolic contract preserves the canonical provenance boundary without weakening it. Its guard is scoped
          to non-append authoritative-history lifecycle execution for target document d and explicitly includes incomplete
          prefixes and stalled, crashed, or aborted executions while imposing no completion, publication, or progress obligation.
          The consequent quantifies exactly over history/checkpoint inputs that actually semantically supply the transformation
          and authoritative lifecycle outputs that are actually installed or published, requiring both source-side and output-side
          provenance to remain bound to d. This rules out cross-document rebinding merely from extensional equality of revision,
          payload, frontier, or replay values, while still permitting content-addressed bytes, immutable pages, or other physical
          storage to be shared beneath document-scoped references. Unrelated candidates that are only inspected and rejected
          are correctly excluded from semantic-input provenance, and paths where no relevant stage or output occurs remain
          vacuous rather than acquiring a progress requirement. The stated exclusions also preserve the canonical non-claims
          about replay equivalence, frontier preservation, recovery correctness, lifecycle progress, retention, and object
          identity. Treating installed/published authoritative lifecycle output as durable does not narrow the canonical obligation
          in context, because the covered output is the authoritative lifecycle result being installed or published, not a
          transient intermediate.
        differences: []
      strengthening:
        subject_signature: 6a9492197e239a44e9dd94ed5e0c8cf17e43a295f4f47e34aad7ec9c23f84634
        verdict: EQUIVALENT
        reason: 'The formula preserves the original contract''s document-scoped provenance boundary exactly: it quantifies
          every non-append authoritative snapshotting, checkpoint-replacement, cleanup, or compaction execution targeting
          document d, including incomplete or aborted executions without making completion a precondition, and constrains
          precisely the accepted-history/checkpoint inputs that actually semantically supply the transformation plus every
          authoritative lifecycle output actually installed or published. The predicate meanings preserve provenance direction
          and the document identity coordinate, reject cross-document rebinding despite extensional equality of revision/payload/frontier/replay
          values, permit physical storage sharing beneath the authoritative reference, and add no replay-equivalence, frontier,
          recovery, progress, retention, cardinality, or physical-object-identity guarantee. Prefix coverage is consistent
          with the contract''s requirement that participating authoritative bindings remain document-scoped throughout the
          lifecycle rather than introducing an additional temporal obligation.'
        differences: []
    roundtrip_reviews:
      balanced:
        subject_signature: 6a9492197e239a44e9dd94ed5e0c8cf17e43a295f4f47e34aad7ec9c23f84634
        verdict: EQUIVALENT
        reason: 'The rendering preserves the same document-scoped provenance invariant for exactly the lifecycle cases covered
          by the canonical contract: any authoritative history/checkpoint input that actually semantically supplies the transformation
          must remain bound to the target document, and any authoritative lifecycle output actually installed or published
          must be bound to that document. Its explicit treatment of execution prefixes and stalled, crashed, or aborted attempts
          does not strengthen the contract because it imposes no obligation before a semantic input participates or an authoritative
          output is installed/published; once participation occurs, the canonical "remain bound" requirement is already a
          safety property independent of eventual completion. "Durable authoritative lifecycle output" matches the canonical
          vocabulary and therefore adds no durability precondition. The extensional-equality prohibition, allowance for shared
          physical storage with document-scoped authoritative references, exclusion of merely inspected/rejected candidates,
          and exclusion of ordinary appends and recovery procedures preserve rather than alter the canonical scope. No additional
