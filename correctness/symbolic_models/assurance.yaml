        \ (so unpublished private or intermediate resynchronization candidates are outside this condition, while a user-visible\
        \ historical-version or rollback mode is not excluded); the document identity carried by r equals the document identity\
        \ represented by that user-visible canonical client state; the base revision carried by r equals that state's visible\
        \ frontier, namely the last canonical revision applied by that client state; the raw edit carried by r is the edit\
        \ authored against the canonical client content in s; and the semantic authoring tuple captured from s is preserved\
