version: 1

sorts:
  - ClientState
  - Document
  - Revision
  - Overlay
  - Request
  - CatchupResponse
  - AuthoritativeState
  - Acceptance
  - AcceptedEvidence
  - IdempotencyKey
  - ClientChangeId
  - LiveDelivery
  - RecoveryAttempt
  - DurableIdempotencyEvidence

functions:
  visible_document:
    args: [ClientState]
    returns: Document
    catalog_symbols: [client_document_id]
    meaning: >-
      The document identity represented by this user-visible canonical client state.

  visible_frontier:
    args: [ClientState]
    returns: Revision
    catalog_symbols: [last_applied_revision]
    meaning: >-
      The last canonical revision applied by this client state.

  canonical_content_matches:
    args: [ClientState, Document, Revision]
    returns: Bool
    catalog_symbols: [client_local_document]
    meaning: >-
      The client state's canonical content is exactly deterministic replay of document D through revision F.

  visible_overlay:
    args: [ClientState, Overlay]
    returns: Bool
    catalog_symbols: [client_speculative_overlays]
    meaning: >-
      Overlay o is currently exposed as a speculative user-visible overlay in client state s.

  canonical_contains_same_edit:
    args: [ClientState, Overlay]
    returns: Bool
    catalog_symbols: [client_local_document, last_applied_revision]
    meaning: >-
      The canonical prefix visible in state s already contains the accepted logical edit represented by overlay o.

  overlay_document:
    args: [Overlay]
    returns: Document
    catalog_symbols: []
    meaning: >-
      The document identity carried by speculative overlay o.

  authored_from:
    args: [Request, ClientState]
    returns: Bool
    catalog_symbols: []
    meaning: >-
      Request r was constructed from client state s as its authoring state.

  request_document:
    args: [Request]
    returns: Document
    catalog_symbols: [document_id]
    meaning: >-
      The document identity carried by request r.

  request_base_revision:
    args: [Request]
    returns: Revision
    catalog_symbols: [base_revision]
    meaning: >-
      The base revision carried by request r.

  request_raw_edit_bound_to_source_content:
    args: [Request, ClientState]
    returns: Bool
    catalog_symbols: [raw_edit, client_local_document]
    meaning: >-
      The raw edit carried by request r is the edit authored against the canonical client content in source state s.


  eligible_catchup_response:
    args: [CatchupResponse]
    returns: Bool
    catalog_symbols: []
    meaning: >-
      Response r belongs to a normal catch-up/reconnect attempt within the protocol guarantee being modeled.

  captured_authoritative_head:
    args: [CatchupResponse]
    returns: Revision
    catalog_symbols: [document_latest_revision]
    meaning: >-
      The authoritative document latest revision captured for the catch-up response's attempt.

  catchup_response_head_value:
    args: [CatchupResponse]
    returns: Revision
    catalog_symbols: [catchup_response_head]
    meaning: >-
      The response head revision carried by catch-up response r.

  catchup_head_preserved:
    args: [CatchupResponse]
    returns: Bool
    catalog_symbols: [catchup_response_head]
    meaning: >-
      The captured response head remains the same bound value through construction, return, and candidate publication for this response.

  within_retry_reconnect_eligibility:
    args: [AuthoritativeState, IdempotencyKey]
    returns: Bool
    catalog_symbols: []
    meaning: >-
      Composite authoritative idempotency identity k = (document_id, client_change_id) is within the 30-day normal retry/reconnect eligibility horizon in authoritative state s.

  accepted_evidence_for_key:
    args: [AuthoritativeState, IdempotencyKey]
    returns: Bool
    catalog_symbols: [accepted_idempotency_evidence, idempotency_key]
    meaning: >-
      authoritative accepted_idempotency_evidence exists in state s for the same composite idempotency_key k = (document_id, client_change_id).

  exactly_one_committed_acceptance_for_key:
    args: [AuthoritativeState, IdempotencyKey]
    returns: Bool
    catalog_symbols: [accepted_change_log]
    meaning: >-
      accepted_change_log in authoritative state s contains exactly one committed canonical acceptance whose authoritative idempotency_key is the same composite identity k = (document_id, client_change_id).

  authoritative_evidence:
    args: [AcceptedEvidence]
    returns: Bool
    catalog_symbols: [accepted_idempotency_evidence]
    meaning: >-
      Evidence e is an authoritative accepted-idempotency evidence record.

  evidence_key:
    args: [AcceptedEvidence]
    returns: IdempotencyKey
    catalog_symbols: [idempotency_key]
    meaning: >-
      The authoritative idempotency identity carried by evidence e.

  committed_canonical_acceptance:
    args: [Acceptance]
    returns: Bool
    catalog_symbols: [canonical_accepted_change, accepted_change_log]
    meaning: >-
      Acceptance a is a committed canonical accepted-change record in authoritative accepted history.

  acceptance_key:
    args: [Acceptance]
    returns: IdempotencyKey
    catalog_symbols: [canonical_accepted_change]
    meaning: >-
      The authoritative idempotency identity carried by canonical acceptance a.

  evidence_derived_from_acceptance:
    args: [AcceptedEvidence, Acceptance]
    returns: Bool
    catalog_symbols: [accepted_idempotency_evidence, canonical_accepted_change]
    meaning: >-
      Evidence e is derived from and corresponds to committed canonical acceptance a.

  request_change_id:
    args: [Request]
    returns: ClientChangeId
    catalog_symbols: [client_change_id]
    meaning: >-
      The client-supplied logical edit identity carried by request r.

  acceptance_produced_from_request:
    args: [Acceptance, Request]
    returns: Bool
    catalog_symbols: []
    meaning: >-
      Canonical acceptance a was produced from submitted request r.

  acceptance_document:
    args: [Acceptance]
    returns: Document
    catalog_symbols: [canonical_accepted_change]
    meaning: >-
      The document identity preserved on canonical acceptance a.

  acceptance_change_id:
    args: [Acceptance]
    returns: ClientChangeId
    catalog_symbols: [canonical_accepted_change]
    meaning: >-
      The client_change_id preserved on canonical acceptance a.

  acceptance_idempotency_identity_matches_request:
    args: [Acceptance, Request]
    returns: Bool
    catalog_symbols: [idempotency_key]
    meaning: >-
      The authoritative idempotency identity associated with acceptance a is exactly the request's (document_id, client_change_id).

  acceptance_identity_preserved_end_to_end:
    args: [Acceptance, Request]
    returns: Bool
    catalog_symbols: [canonical_accepted_change, document_id, client_change_id]
    meaning: >-
      From request admission through OT dispatch, idempotency arbitration, retry handling, and canonical commit, neither document_id nor client_change_id is dropped, regenerated, substituted, or cross-bound; every identity handoff for acceptance a remains the originating request r identity.

  durable_idempotency_evidence_for_acceptance:
    args: [DurableIdempotencyEvidence, Acceptance]
    returns: Bool
    catalog_symbols: [idempotency_key]
    meaning: >-
      Durable idempotency evidence e is associated with canonical acceptance a.

  durable_evidence_identity_matches_request:
    args: [DurableIdempotencyEvidence, Request]
    returns: Bool
    catalog_symbols: [idempotency_key, document_id, client_change_id]
    meaning: >-
      Durable idempotency evidence e identifies exactly the same (document_id, client_change_id) carried by originating request r.

  live_delivery_record:
    args: [LiveDelivery]
    returns: Bool
    catalog_symbols: [websocket_live_stream]
    meaning: >-
      Delivery d is a canonical change exposed through the websocket live stream.

  committed_history_record:
    args: [Acceptance]
    returns: Bool
    catalog_symbols: [accepted_change_log]
    meaning: >-
      Acceptance a is a committed record in authoritative accepted_change_log.

  live_delivery_derived_from:
    args: [LiveDelivery, Acceptance]
    returns: Bool
    catalog_symbols: []
    meaning: >-
      Live delivery d carries the canonical payload and revision provenance of acceptance record a; whether a is committed is expressed separately by committed_history_record(a).

  recovery_head_capture_event:
    args: [RecoveryAttempt]
    returns: Bool
    catalog_symbols: []
    meaning: >-
      Recovery attempt r has reached the new-owner recovery-head capture event after epoch handoff, at which it reads the authoritative frontier and binds recovery_head.

  captured_recovery_authoritative_head:
    args: [RecoveryAttempt]
    returns: Revision
    catalog_symbols: [document_latest_revision]
    meaning: >-
      The authoritative document_latest_revision value read when recovery attempt r captures its recovery frontier.

  recovery_head_value:
    args: [RecoveryAttempt]
    returns: Revision
    catalog_symbols: [recovery_head]
    meaning: >-
      The recovery_head value bound to recovery attempt r.

  recovery_head_preserved:
    args: [RecoveryAttempt]
    returns: Bool
    catalog_symbols: [recovery_head]
    meaning: >-
      The same captured recovery_head governs checkpoint selection, exact tail replay, recovered metadata reconstruction, and acceptance resumption for recovery attempt r.

claims:
  L108_acceptance_preserves_request_identity:
    contracts: [acceptance_request_identity_binding]
    formula:
      forall:
        vars:
          a: Acceptance
          r: Request
        body:
          implies:
            - {call: {fn: acceptance_produced_from_request, args: [{var: a}, {var: r}]}}
            - and:
                - eq:
                    - {call: {fn: acceptance_document, args: [{var: a}]}}
                    - {call: {fn: request_document, args: [{var: r}]}}
                - eq:
                    - {call: {fn: acceptance_change_id, args: [{var: a}]}}
                    - {call: {fn: request_change_id, args: [{var: r}]}}
                - {call: {fn: acceptance_idempotency_identity_matches_request, args: [{var: a}, {var: r}]}}
                - {call: {fn: acceptance_identity_preserved_end_to_end, args: [{var: a}, {var: r}]}}
                - forall:
                    vars:
                      e: DurableIdempotencyEvidence
                    body:
                      implies:
                        - {call: {fn: durable_idempotency_evidence_for_acceptance, args: [{var: e}, {var: a}]}}
                        - {call: {fn: durable_evidence_identity_matches_request, args: [{var: e}, {var: r}]}}

  C12_live_delivery_contains_only_accepted_changes:
    contracts: [live_delivery_acceptance_binding]
    formula:
      forall:
        vars:
          d: LiveDelivery
        body:
          implies:
            - {call: {fn: live_delivery_record, args: [{var: d}]}}
            - exists:
                vars:
                  a: Acceptance
                body:
                  and:
                    - {call: {fn: committed_history_record, args: [{var: a}]}}
                    - {call: {fn: live_delivery_derived_from, args: [{var: d}, {var: a}]}}

  L116_live_delivery_is_bound_to_committed_acceptance:
    contracts: [live_delivery_acceptance_binding]
    formula:
      forall:
        vars:
          d: LiveDelivery
        body:
          implies:
            - {call: {fn: live_delivery_record, args: [{var: d}]}}
            - exists:
                vars:
                  a: Acceptance
                body:
                  and:
                    - {call: {fn: committed_history_record, args: [{var: a}]}}
                    - {call: {fn: live_delivery_derived_from, args: [{var: d}, {var: a}]}}

  L92_captured_recovery_head_equals_authoritative_frontier:
    contracts: [recovery_head_binding]
    formula:
      forall:
        vars:
          r: RecoveryAttempt
        body:
          implies:
            - {call: {fn: recovery_head_capture_event, args: [{var: r}]}}
            - eq:
                - {call: {fn: recovery_head_value, args: [{var: r}]}}
                - {call: {fn: captured_recovery_authoritative_head, args: [{var: r}]}}

contracts:
  client_canonical_frontier_coherence:
    class: state_invariant
    observation_scope: user_visible_states
    formula:
      forall:
        vars:
          s: ClientState
        body:
          call:
            fn: canonical_content_matches
            args:
              - {var: s}
              - {call: {fn: visible_document, args: [{var: s}]}}
              - {call: {fn: visible_frontier, args: [{var: s}]}}

  visible_canonical_speculative_exclusion:
    class: state_invariant
    observation_scope: user_visible_states
    formula:
      forall:
        vars:
          s: ClientState
          o: Overlay
        body:
          implies:
            - {call: {fn: canonical_contains_same_edit, args: [{var: s}, {var: o}]}}
            - not:
                call:
                  fn: visible_overlay
                  args: [{var: s}, {var: o}]

  request_authoring_frontier_binding:
    class: provenance_binding
    formula:
      forall:
        vars:
          r: Request
          s: ClientState
        body:
          implies:
            - {call: {fn: authored_from, args: [{var: r}, {var: s}]}}
            - and:
                - eq:
                    - {call: {fn: request_document, args: [{var: r}]}}
                    - {call: {fn: visible_document, args: [{var: s}]}}
                - eq:
                    - {call: {fn: request_base_revision, args: [{var: r}]}}
                    - {call: {fn: visible_frontier, args: [{var: s}]}}
                - call:
                    fn: request_raw_edit_bound_to_source_content
                    args: [{var: r}, {var: s}]

  catchup_head_binding:
    class: provenance_binding
    formula:
      forall:
        vars:
          r: CatchupResponse
        body:
          implies:
            - {call: {fn: eligible_catchup_response, args: [{var: r}]}}
            - and:
                - eq:
                    - {call: {fn: catchup_response_head_value, args: [{var: r}]}}
                    - {call: {fn: captured_authoritative_head, args: [{var: r}]}}
                - call:
                    fn: catchup_head_preserved
                    args: [{var: r}]

  accepted_evidence_correspondence:
    class: state_invariant
    observation_scope: authoritative_states
    formula:
      forall:
        vars:
          s: AuthoritativeState
          k: IdempotencyKey
        body:
          implies:
            - {call: {fn: within_retry_reconnect_eligibility, args: [{var: s}, {var: k}]}}
            - and:
                - implies:
                    - {call: {fn: accepted_evidence_for_key, args: [{var: s}, {var: k}]}}
                    - {call: {fn: exactly_one_committed_acceptance_for_key, args: [{var: s}, {var: k}]}}
                - implies:
                    - {call: {fn: exactly_one_committed_acceptance_for_key, args: [{var: s}, {var: k}]}}
                    - {call: {fn: accepted_evidence_for_key, args: [{var: s}, {var: k}]}}

  accepted_evidence_provenance:
    class: provenance_binding
    formula:
      forall:
        vars:
          e: AcceptedEvidence
        body:
          implies:
            - {call: {fn: authoritative_evidence, args: [{var: e}]}}
            - exists:
                vars:
                  a: Acceptance
                body:
                  and:
                    - {call: {fn: committed_canonical_acceptance, args: [{var: a}]}}
                    - eq:
                        - {call: {fn: evidence_key, args: [{var: e}]}}
                        - {call: {fn: acceptance_key, args: [{var: a}]}}
                    - {call: {fn: evidence_derived_from_acceptance, args: [{var: e}, {var: a}]}}

  acceptance_request_identity_binding:
    class: provenance_binding
    formula:
      forall:
        vars:
          a: Acceptance
          r: Request
        body:
          implies:
            - {call: {fn: acceptance_produced_from_request, args: [{var: a}, {var: r}]}}
            - and:
                - eq:
                    - {call: {fn: acceptance_document, args: [{var: a}]}}
                    - {call: {fn: request_document, args: [{var: r}]}}
                - eq:
                    - {call: {fn: acceptance_change_id, args: [{var: a}]}}
                    - {call: {fn: request_change_id, args: [{var: r}]}}
                - {call: {fn: acceptance_idempotency_identity_matches_request, args: [{var: a}, {var: r}]}}
                - {call: {fn: acceptance_identity_preserved_end_to_end, args: [{var: a}, {var: r}]}}
                - forall:
                    vars:
                      e: DurableIdempotencyEvidence
                    body:
                      implies:
                        - {call: {fn: durable_idempotency_evidence_for_acceptance, args: [{var: e}, {var: a}]}}
                        - {call: {fn: durable_evidence_identity_matches_request, args: [{var: e}, {var: r}]}}

  live_delivery_acceptance_binding:
    class: provenance_binding
    formula:
      forall:
        vars:
          d: LiveDelivery
        body:
          implies:
            - {call: {fn: live_delivery_record, args: [{var: d}]}}
            - exists:
                vars:
                  a: Acceptance
                body:
                  and:
                    - {call: {fn: committed_history_record, args: [{var: a}]}}
                    - {call: {fn: live_delivery_derived_from, args: [{var: d}, {var: a}]}}

  recovery_head_binding:
    class: provenance_binding
    formula:
      forall:
        vars:
          r: RecoveryAttempt
        body:
          implies:
            - {call: {fn: recovery_head_capture_event, args: [{var: r}]}}
            - and:
                - eq:
                    - {call: {fn: recovery_head_value, args: [{var: r}]}}
                    - {call: {fn: captured_recovery_authoritative_head, args: [{var: r}]}}
                - {call: {fn: recovery_head_preserved, args: [{var: r}]}}
