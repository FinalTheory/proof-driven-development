assumptions:
  A2_ot_engine_is_correct:
    statement: Given a canonical committed document prefix through revision N and a raw_edit with
      any submitted client base revision B, the OT engine either returns a canonical transformed
      change satisfying its algorithmic convergence contract for that raw edit, B, and prefix N, or
      rejects the input as invalid or rebase-required; it never returns a successful result outside
      that contract.
    status: external_assumption
    note: The source article explicitly treats the transformation function as out of scope.
    source_refs:
      - ot_input_output
      - raft_analogy
  A3_client_change_id_identifies_logical_edit:
    statement: Within a document, each logical client edit is assigned one client_change_id. All
      retries of that edit reuse the same client_change_id, and distinct logical edits use distinct
      client_change_ids.
    status: protocol_assumption
    source_refs:
      - accepted_change_log
      - owner_failover
  A5_apply_accepted_change_is_deterministic:
    statement: Applying the same canonical accepted-change sequence to the same starting state
      yields the same document state.
    status: external_assumption
    source_refs:
      - authoritative_truth
      - raft_analogy
  A6_normal_retry_reconnect_identity_is_eligible_for_30_days:
    statement: For a normally participating client, a logical edit identified by (document_id=D,
      client_change_id=k) is submitted through normal retry or authoritative reconnect
      reconciliation only while its pending/retry age is no more than 30 days. Once that age exceeds
      30 days, the client does not submit the old identity through those normal protocol paths and
      instead discards the pending operation or enters an explicit expired, conflict, or
      manual-resolution path; a submission that violates this boundary is outside the normal
      retry/reconnect correctness guarantees.
    status: protocol_assumption
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
roots:
  - G0_acked_edit_survives_failover
  - G1_retry_is_logically_exactly_once
  - G2_canonical_history_is_linear_and_fenced
  - G3_snapshot_and_recovery_preserve_state
  - G4_reconnect_converges_without_gap_or_duplicate
  - G5_retry_resolves_idempotently
  - G6_accepted_change_preserves_ot_semantics
  - G7_reconnect_does_not_double_render_accepted_optimistic_edit
  - G8_user_visible_state_does_not_double_render_accepted_optimistic_edit
  - G9_accepted_idempotency_evidence_matches_committed_acceptance
  - G10_user_visible_client_state_matches_document
  - G11_visible_speculative_overlays_match_document
  - G12_client_pending_state_tracks_unresolved_edits
claims:
  G0_acked_edit_survives_failover:
    kind: root
    statement: >-
      Every edit acknowledged to the client satisfies the acked_edit_failover_survival semantic contract.
    depends_on:
      - L143_acked_edit_completed_recovery_matches_canonical_replay
      - L144_success_ack_follows_corresponding_canonical_commit
      - L146_ack_justifying_acceptance_survives_process_and_owner_failures
    source_refs:
      - accepted_change_log
      - owner_failover
      - final_architecture
    semantic_contracts:
      - acked_edit_failover_survival
  G1_retry_is_logically_exactly_once:
    kind: root
    statement: >-
      For a normally participating client, ACK loss, reconnect, or retry of one logical client edit while
      its (document_id, client_change_id) remains within the 30-day normal retry/reconnect eligibility
      horizon cannot cause that logical edit to create more than one accepted canonical change. Re-submission
      of an expired identity outside that protocol horizon is outside this guarantee.
    depends_on:
      - C13_idempotency_key_is_temporally_unique
      - L34_retries_of_logical_edit_reuse_identity
      - L108_acceptance_preserves_request_identity
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: 'Within the 30-day normal retry/reconnect eligibility horizon, count(acceptance_events
      where idempotency_key = (document_id, client_change_id)) <= 1 for each logical edit.'
  G2_canonical_history_is_linear_and_fenced:
    kind: root
    statement: >-
      For each document D, accepted history is a single gap-free revision sequence. Every authoritative
      ownership handoff installs a strictly greater epoch and fresh immutable owner-generation identity
      before or atomically with the new generation becoming acceptance-eligible. An owner generation is
      one concrete immutable server-side ownership tenure for D, with document-scoped authority identity
      (D, its installed epoch, its owner-generation identity). Superseded epochs and superseded ownership
      tenures never become authoritative again. After an authoritative epoch value for D has been superseded
      by a strictly greater epoch, D's authoritative current epoch never decreases across any authoritative
      lifecycle transition, including recovery, restart, delayed metadata publication, ownership handoff,
      or any corresponding authoritative state step. Throughout every canonical append attempt targeting
      D, including successful, rejected, aborted, delayed, and interrupted attempts whether or not they
      commit, the supplied owner_epoch and append_owner_generation_id originate from and remain bound
      to the immutable trusted server-side owner generation actually executing that attempt, whose ownership
      document is D. Neither coordinate nor the document namespace may be copied, substituted, refreshed,
      or rebound to impersonate another generation; equal scalar values from another document or generation
      do not establish this provenance. This binding does not require the executing generation to remain
      authoritative current or the attempt to commit. Every canonical append for D commits only when its
      document-scoped generation authorization—D together with its epoch and generation-bound server-side
      append identity—matches D's authoritative current ownership generation. Equality to copied/current
      scalar fencing values, including an accidental collision with another document's ownership tuple,
      cannot authorize a different or superseded owner generation to append to D.
    depends_on:
      - C8_stale_owner_is_fenced
      - C39_authoritative_history_state_is_gap_free
      - L222_superseded_document_ownership_authority_never_returns
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: 'For each document D: the accepted_change_log denoted by authoritative state is a single
      gap-free revision sequence; document_current_epoch strictly increases at every ownership handoff
      and a fresh document_owner_generation_id is installed before or atomically with the new generation
      becoming acceptance-eligible; a canonical append for D commits only when the owner_epoch and append_owner_generation_id
      supplied with the append are bound to and match D''s authoritative current ownership generation.'
  G3_snapshot_and_recovery_preserve_state:
    kind: root
    statement: >-
      Every optimized authoritative lifecycle representation at a common frontier H—including snapshotting,
      checkpoint replacement, cleanup, and compaction—and every completed owner recovery satisfy the logical_state_equivalence_at_frontier
      semantic contract relative to canonical accepted history. For every new-owner recovery targeting
      document D, recovery_document_scope_binding holds throughout the attempt starting with the authoritative
      owner context before recovery-head capture and continuing, whenever those stages occur, across the
      captured head, selected checkpoint, replayed canonical tail, rebuilt logical/OT runtime state, installed
      recovered state, and resumed owner context: extensionally equal authoritative objects or owner contexts
      from D2 != D cannot substitute for D at any recovery stage. This provenance requirement does not
      impose recovery progress or completion.
    depends_on:
      - C9_recovery_reconstructs_committed_state
      - C16_non_append_lifecycle_preserves_logical_revision_prefix
      - L172_snapshot_compaction_preserves_concurrent_append_suffix
      - L173_optimized_lifecycle_representation_resumes_only_through_recovery
      - L246_completed_recovery_result_equivalence_bridge
      - L247_full_scope_to_runtime_projection_bridge
      - L248_lifecycle_representation_replay_equivalence
      - L249_lifecycle_resume_authoritative_reconstruction
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    semantic_contracts:
      - logical_state_equivalence_at_frontier
      - recovery_document_scope_binding
  G4_reconnect_converges_without_gap_or_duplicate:
    kind: root
    statement: >-
      For a normal foreground, visible-document-bound reconnect/catch-up attempt for document D starting
      from last_applied_revision L, every such catch-up attempt eligible for completion or publication
      binds one response-specific head H captured from that document's authoritative document_latest_revision
      at one authoritative-store read/linearization point, and preserves that same H through response
      selection, reconciliation, completion, and publication. The attempt remains foreground-publication-eligible
      only while its visible-document binding to D remains uninterrupted; if the user-visible document
      switches away from D before publication, that attempt permanently loses publication eligibility
      under this foreground protocol and cannot later publish merely because the user switches back. If
      an eligible attempt completes and publishes its reconciled result, the user-visible canonical state
      equals canonical replay of document D through H without omitting or double-applying any accepted
      revision through H. Reconnect/resync publication is atomic and monotonic across overlapping or retried
      attempts: no intermediate candidate prefix is user-visible, and a response whose H is below the
      already visible canonical frontier cannot regress or otherwise mutate that visible canonical/frontier
      state. Acceptances after H capture are outside that response; this claim does not require catching
      a continuously advancing live head. Independently of catch-up mode, every change exposed through
      websocket_live_stream for document D satisfies live_delivery_acceptance_binding: it originates from
      committed accepted history for that same D and preserves the canonical payload and revision provenance
      of its committed acceptance source; an extensionally equal acceptance from another document cannot
      substitute for D.
    depends_on:
      - C10_catchup_represents_exact_missing_suffix
      - L19_client_applies_only_contiguous_revisions
      - C12_live_delivery_contains_only_accepted_changes
      - A5_apply_accepted_change_is_deterministic
      - L97_client_adopts_snapshot_before_tail
      - L101_client_completes_catchup_through_response_head
      - C7_revision_frontier_is_linear
      - L109_resync_publication_is_atomic_and_monotonic
      - C36_reconnect_starts_from_canonical_client_frontier
      - L119_completed_resync_candidate_stays_at_response_head_until_publication
      - L121_delta_resync_candidate_starts_from_canonical_client_base
      - L122_catchup_response_head_is_bound_to_authoritative_frontier
      - L126_pending_reconciliation_preserves_resync_canonical_candidate
      - L237_foreground_catchup_response_head_binding
      - L238_foreground_catchup_publication_is_exact_replay
      - L239_foreground_catchup_publication_atomic_and_non_regressing
      - L240_foreground_catchup_eligibility_requires_uninterrupted_binding
      - L157_foreground_reconnect_loses_publication_eligibility_after_document_switch
    source_refs:
      - reconnect_revision_boundary
      - owner_failover
      - raft_analogy
      - final_architecture
    semantic_contracts:
      - live_delivery_acceptance_binding
  G5_retry_resolves_idempotently:
    kind: root
    statement: >-
      For every logical edit whose idempotency_key remains within the normal retry eligibility horizon,
      each normal submitted_request representing that edit preserves the same request identity, raw_edit
      semantics, and canonical authoring frontier, so those values cannot be cross-bound to a different
      logical operation. idempotency_terminal_outcome_coherence holds in every reachable authoritative
      state and terminal_response_outcome_binding holds for every externally_terminal_result. If an authoritative
      ACCEPTED(canonical result) linearizes, accepted_terminal_result_binding also holds: that canonical
      result is produced by the same acceptance execution that commits the matching canonical_accepted_change
      for the exact same full identity, and later authoritative lifecycle representation changes do not
      rebind it to another producer. If an authoritative REJECTED(definitive rejection reason) linearizes,
      definitive_rejection_request_binding also holds: that rejected terminal result derives from a definitive
      rejection decision produced for the exact same submitted request identity and rejection-relevant
      request context, not from another request. If that rejection reason depends on document/history
      state, state_dependent_rejection_context_binding also holds: the decision is justified by same-document
      authoritative_rejection_context whose reason-specific evidence remains sufficient at terminalization;
      stale superseded-owner local state alone cannot justify the authoritative REJECTED. Request-intrinsic
      rejection reasons do not require document-context authority. The first authoritative terminal_result
      to linearize for full identity (document_id=D, client_change_id=k) is immutable and is either ACCEPTED(canonical
      result) or REJECTED(definitive reason); the two are mutually exclusive, all acceptance and definitive-rejection
      attempts arbitrate through the same per-key terminal state, and every externally terminal result
      for that key exactly reproduces the already-linearized terminal result. Pending, timeout, cancellation,
      transport loss, and crash-before-terminal-commit remain non-terminal uncertainty. Consequently,
      if a normally participating client reprocessing the same logical edit within the 30-day normal retry
      horizon obtains an externally terminal result, that result is the same authoritative terminal result
      for that logical operation rather than an incompatible second terminal outcome; this guarantee does
      not require eventual terminal observation. Re-submission after expiry is outside this guarantee.
    depends_on:
      - A3_client_change_id_identifies_logical_edit
      - C13_idempotency_key_is_temporally_unique
      - L35_losing_retry_resolves_through_canonical_acceptance
      - L54_absent_key_winner_returns_its_canonical_acceptance
      - L55_successful_retry_resolution_paths_are_exhaustive
      - L108_acceptance_preserves_request_identity
      - L117_retry_existing_acceptance_matches_full_idempotency_key
      - C40_terminal_outcome_is_single_valued_per_idempotency_key
      - L161_definitive_retry_response_comes_from_terminal_outcome
      - L182_logical_edit_request_payload_binding_is_preserved
      - L183_definitive_rejection_preserves_request_provenance
      - C46_accepted_terminal_result_preserves_acceptance_provenance
      - L204_state_dependent_rejection_uses_authoritative_context
      - L229_terminal_attempt_arbitration_classification_and_gate
      - L230_reachable_state_terminal_outcome_coherence_and_lifecycle_preservation
      - L231_accepted_terminal_result_producer_binding_and_identity
      - L164_terminal_paths_share_per_key_arbitration
      - C42_nonterminal_lifecycle_preserves_terminal_outcomes
      - C43_terminal_outcome_entry_state_is_coherent
      - L232_retry_reconnect_eligibility_implies_retry_horizon
      - L233_normal_submitted_request_scope_eligibility
      - C48_normal_retry_request_coherence_and_horizon_alignment
    source_refs:
      - ot_input_output
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: idempotency_terminal_outcome_coherence; accepted_terminal_result_binding;
      definitive_rejection_request_binding; state_dependent_rejection_context_binding;
      terminal_response_outcome_binding
    semantic_contracts:
      - idempotency_terminal_outcome_coherence
      - accepted_terminal_result_binding
      - definitive_rejection_request_binding
      - state_dependent_rejection_context_binding
      - terminal_response_outcome_binding
  C7_revision_frontier_is_linear:
    kind: derived
    statement: >-
      In every authoritative state for a document, accepted_change_log and document_latest_revision denote
      exactly one gap-free canonical accepted prefix ending at document_latest_revision. Each committed
      accepted-change append at revision r preserves the entire prior logical accepted prefix, adds exactly
      revision r as the next position, and advances document_latest_revision to r. Any authoritative transition
      that accepts no edit but changes representation or lifecycle state preserves the same logical accepted
      prefix and the same frontier. Physical retention of every accepted row is not required after semantics-preserving
      compaction.
    depends_on:
      - L4_append_requires_previous_frontier
      - L6_frontier_advance_and_insert_commit_together
      - L22_initial_history_matches_frontier
      - L29_non_append_lifecycle_preserves_revision_domain
      - L33_committed_append_preserves_existing_revision_prefix
      - L137_authoritative_history_mutators_are_exhaustively_classified
      - L215_denotation_change_is_coordinate_change
      - L216_authoritative_state_descends_from_initialization
      - L217_append_step_commits_acceptance_at_previous_frontier
      - L218_append_at_next_position_preserves_frontier_shape
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: accepted_history_frontier_coherence
    semantic_contracts:
      - accepted_history_frontier_coherence
  C8_stale_owner_is_fenced:
    kind: derived
    statement: >-
      Every authoritative ownership handoff for document D installs a strictly greater document_current_epoch
      and fresh document_owner_generation_id before or atomically with the new generation becoming authoritative
      and acceptance-eligible. After supersession, the authoritative epoch never decreases or restores
      a superseded value. owner_generation_authorization_binding holds for every canonical append attempt
      and for every canonical append: for every canonical append attempt targeting D, whether or not that
      attempt commits, the attempt's document scope, owner_epoch, and append_owner_generation_id remain
      bound to the immutable server-side generation for D actually executing that attempt; and every canonical
      append must match D's authoritative current epoch/generation at commit, so neither a superseded
      generation nor another document's generation can regain append authority through copied or colliding
      fencing values.
    depends_on:
      - L5_append_requires_current_epoch
      - L28_authoritative_epoch_never_regresses_or_reuses
      - L156_owner_handoff_installs_fresh_epoch
      - L159_owner_append_authorization_is_generation_bound
      - L168_owner_handoff_installs_fresh_generation
    source_refs:
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: owner_generation_authorization_binding
    semantic_contracts:
      - owner_generation_authorization_binding
  C9_recovery_reconstructs_committed_state:
    kind: derived
    statement: >-
      In this model, every attempt that enters a recovery/reconstruction path whose role is to establish
      a new authoritative owner generation uses the same new-owner recovery boundary: owner-identity change,
      cold takeover, warm promotion, and same-owner restart/reacquisition are all such paths. If such
      an attempt reaches the point of becoming authoritative or acceptance-eligible, it installs a strictly
      newer epoch and fresh owner generation before or atomically with that point; classification as a
      new-owner recovery attempt does not depend on reaching that point, so the attempt may stall, crash,
      or abort earlier. For every such recovery targeting document D, recovery_document_scope_binding
      holds throughout the attempt starting with its authoritative ownership context before recovery_head
      capture and continuing, whenever those stages occur, through captured head, selected checkpoint,
      replayed canonical tail, rebuilt logical/OT runtime state, installed recovered state, and any resumed
      owner context; extensionally equal objects or owner contexts from D2 != D cannot substitute at any
      stage. If that recovery completes at authoritative frontier H, the recovered logical document state
      equals deterministic canonical replay of D's accepted revisions through H and the recovered service
      frontier is H. If that recovered owner is used to resume acceptance, every document-history-dependent
      runtime state value that can influence server-side OT transformation or canonical acceptance is
      equivalent to a clean reconstruction from D's authoritative canonical history through H, so resumed
      canonical semantics are unchanged. A recovery attempt may stall, crash, or abort at any stage without
      any progress obligation, but provenance remains mandatory for every recovery context/input/state
      that has actually been established, selected, captured, consumed, constructed, installed, or used
      before that point.
    depends_on:
      - L8_snapshot_is_exact_committed_prefix
      - L10_replay_covers_exact_tail_in_order_once
      - L39_recovered_owner_resumes_at_head_plus_one
      - C18_recovery_selects_and_loads_authoritative_checkpoint
      - L41_recovery_checkpoint_does_not_exceed_recovery_head
      - C25_recovery_derives_complete_ot_metadata_from_truth
      - L94_recovery_starts_after_epoch_handoff
      - L79_new_owner_accepts_only_after_reconstruction
      - L92_captured_recovery_head_equals_authoritative_frontier
      - L131_post_recovery_acceptance_state_is_exhaustive
      - C8_stale_owner_is_fenced
      - L174_recovery_inputs_and_state_are_document_bound
      - L156_owner_handoff_installs_fresh_epoch
      - L168_owner_handoff_installs_fresh_generation
      - L210_new_owner_recovery_boundary_is_attempt_scoped
      - L241_recovery_publication_installs_epoch_and_generation
      - L242_recovery_scope_preservation_for_new_owner_attempts
      - L243_recovery_completion_replay_state_and_frontier
