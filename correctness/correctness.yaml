          intent: Inspect the acceptance transaction and require the OT computation frontier N to be
            checked by the same transaction that would commit the transformed result; if
            latest_revision != N, the transaction cannot commit any canonical acceptance for that
            stale result.
        - kind: state_machine
          intent: Explore transform/commit races where another acceptance advances latest_revision
            after OT computation; require a result computed at frontier N to commit only as N+1
            while the authoritative pre-state remains N, otherwise require
            re-transform/retry/rejection before any acceptance.
        - kind: control_flow
          intent: Prove that the frontier token/context used for OT computation is carried to the
            authoritative acceptance guard and cannot be replaced by a newer revision number while
            reusing the stale transformed payload.
    kind: leaf
    formal_intent: ot_result_frontier_binding
    semantic_contracts:
      - ot_result_frontier_binding
  L101_client_completes_catchup_through_response_head:
    statement: "A client catch-up attempt for authoritative response head H is considered complete only
      after the client has consumed the response's entire canonical representation through H: delta mode
      applies every returned revision L+1..H, while snapshot mode installs the selected checkpoint frontier
      S and applies every returned tail revision S+1..H; on completion last_applied_revision = H."
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore both catch-up modes, pagination, buffered live delivery, interruption, and
            retry; require every transition that declares completion for response head H to occur
            only after the selected checkpoint if any and every canonical response revision through
            H have been consumed, with last_applied_revision exactly H.
    kind: leaf
  G7_reconnect_does_not_double_render_accepted_optimistic_edit:
    statement: 'During reconnect/resync for document D by a normally participating client, the client
      does not create or apply new speculative local edits for D while the resync attempt is in progress.
      For every pending logical edit identity (D,k) at resync start that remains within the 30-day normal
      reconnect eligibility horizon, the catch-up request for D includes k for authoritative reconciliation
      through response head H_D; if canonical acceptance(D,k) is included in H_D, authoritative reconciliation
      identifies that same full identity and any user-visible publication through H_D removes or suppresses
      the speculative overlay for (D,k) before or atomically with publication, so no user-visible state
      exposes both representations. An acceptance(D2,k) for D2 != D is irrelevant. No intermediate resync
      candidate may expose a canonical prefix that already contains acceptance(D,k) together with its
      overlay, and a stale response may not restore an overlay removed by a newer published reconciliation.
      An identity whose pending/retry age exceeds 30 days is not submitted through normal authoritative
      reconciliation; it is discarded or handled through an explicit expired, conflict, or manual-resolution
      path outside this guarantee. If any protocol-eligible pending edit remains unresolved after reconciled
      publication or conflict entry, the client remains non-normal-editable/read-only or in explicit conflict/reconciliation
      state and creates no new acceptance-eligible speculative edit until those unresolved edits are explicitly
      reconciled or removed. This claim makes no automatic local-rebase, conflict-resolution, or progress
      guarantee.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    kind: root
    depends_on:
      - C37_pending_identity_resolution_is_bound_to_response_head
      - L106_resync_request_covers_start_pending_set
      - L107_client_freezes_speculative_edits_during_resync
      - L109_resync_publication_is_atomic_and_monotonic
      - L110_client_retires_matching_speculative_overlay_before_canonical_publication
      - A6_normal_retry_reconnect_identity_is_eligible_for_30_days
  L106_resync_request_covers_start_pending_set:
    statement: For every reconnect/resync attempt for document D, the pending client_change_id set
      supplied under that catch-up request contains every speculative local edit identity (D,k) that
      is pending for D when the attempt begins and remains within the 30-day normal reconnect
      eligibility horizon; each supplied eligible k is interpreted only under the request document
      D, and no eligible start-pending (D,k) is omitted or rebound to another document during
      authoritative reconciliation through that request response head. Expired identities are
      outside the normal authoritative reconciliation request.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate reconnect-start transitions and request construction with pending maps
            for multiple documents, including the same client_change_id reused across documents and
            identities on either side of the 30-day eligibility boundary. For a normal catch-up
            request for D, require every eligible pending (D,k) at attempt start to be represented
            as k under that same D request context, with no omission or cross-document rebinding;
            expired identities are not required to enter authoritative reconciliation.
    kind: leaf
  L107_client_freezes_speculative_edits_during_resync:
    statement: 'In every reachable client protocol state, unresolved_pending_blocks_normal_editing holds:
      if client_pending_edits contains any unresolved logical edit that has not been safely reconciled
      or explicitly removed, client_editing_mode is not normal-editable and no normal editing transition
      may create or apply a new acceptance-eligible speculative edit for that document. In particular,
      from the moment a client begins reconnect/resync and captures the pending client_change_id set for
      its catch-up request until that attempt either publishes a reconciled canonical state or enters
      explicit conflict/reconciliation state, the client creates or applies no new speculative local edit
      to the document being resynchronized. No eventual resolution, automatic local-rebase, or eventual-editability
      guarantee is implied.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore user-edit input, reconnect start, request capture/send, catch-up response,
            reconciliation, interruption, retry, atomic publication, conflict entry, repeated
            conflict/reconciliation transitions, and attempted return to normal editing. Require
            editing to remain frozen during resync and, whenever unresolved client_pending_edits
            remain afterward, require client_editing_mode to stay non-normal and all new
            acceptance-eligible speculative-edit transitions to remain unreachable.
        - kind: control_flow
          intent: Enumerate every path that enables normal editing or creates a new
            acceptance-eligible speculative edit and prove each is guarded by an empty/reconciled
            unresolved-pending set after reconnect/conflict handling.
    kind: leaf
    formal_intent: unresolved_pending_blocks_normal_editing
    semantic_contracts:
      - unresolved_pending_blocks_normal_editing
  L108_acceptance_preserves_request_identity:
    statement: 'For every canonical acceptance produced from a submitted logical request carrying document_id
      D and client_change_id k, the authoritative identity of that acceptance is exactly (D, k): the acceptance
      path does not drop, regenerate, substitute, or bind either identity component to a different request
      between request admission and canonical commit, and any durable idempotency evidence associated
      with that acceptance identifies the same (D, k).'
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace document_id and client_change_id from request admission through OT dispatch,
            idempotency arbitration, and every canonical-commit sink; prove every successful
            acceptance persists exactly the originating request identity and no path can replace,
            regenerate, cross-bind, or omit either component.
        - kind: integration_test
          intent: Submit distinguishable concurrent requests with different
            document_id/client_change_id pairs, force retries and ACK loss, and assert that each
            canonical accepted record and its durable idempotency evidence retain exactly the
            originating pair without cross-binding.
    kind: leaf
    formal_intent: acceptance_request_identity_binding
    semantic_contracts:
      - acceptance_request_identity_binding
  L109_resync_publication_is_atomic_and_monotonic:
    statement: During reconnect/resync, canonical catch-up and pending-identity reconciliation are
      built in a non-user-visible candidate state. Let F be the currently user-visible canonical
      frontier when a candidate response through authoritative head H is ready to publish. If H < F,
      the entire candidate is discarded without mutating the visible canonical base,
      last_applied_revision, pending-resolution state, or speculative overlays. If H >= F, the
      client may expose state from that candidate only by one atomic publication after the
      candidate's specified reconciliation work is complete; no checkpoint/tail/intermediate
      candidate prefix is user-visible, no previously removed speculative overlay or
      pending-resolution state is restored by that response, and the user-visible canonical frontier
      never decreases.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore overlapping and retried resync attempts with arbitrary response delays,
            checkpoint/tail progress, pending-key resolutions, and publication order; require all
            intermediate candidate states to remain unobservable, discard any H below the currently
            visible frontier, and permit only atomic non-regressing reconciled publication.
        - kind: integration_test
          intent: Delay an older resync response behind a newer published response and separately
            pause catch-up after an accepted pending edit enters an intermediate canonical prefix;
            assert that neither the stale response nor any intermediate prefix mutates user-visible
            canonical, frontier, pending, or overlay state before one valid reconciled publication.
    kind: leaf
  L110_client_retires_matching_speculative_overlay_before_canonical_publication:
    statement: For every logical client edit identified by (document_id=D, client_change_id=k), once
      the user-visible canonical prefix contains the canonical acceptance identified by (D,k), every
      user-visible client transition keeps speculative overlay (D,k) absent for as long as that
      canonical acceptance remains visible. The transition that first makes the acceptance visible
      must remove or suppress any matching overlay before or atomically with that publication, and
      later overlay-only, ACK/retry/pending-bookkeeping, UI-restore, buffered-live,
      reconnect/resync, or other client transitions cannot recreate or re-enable the same overlay.
      Only a distinct new logical edit with a distinct client_change_id may create a new speculative
      representation.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_revision_continuity
      - catchup_protocol
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore ordinary live delivery, buffered post-catch-up delivery, resync
            publication, ACK loss, retry/pending bookkeeping, UI state restoration, reconnect
            completion, and arbitrary later client transitions. Once the visible canonical prefix
            contains acceptance (D,k), require speculative overlay (D,k) to remain absent in every
            subsequently visible state while that acceptance remains visible; only a distinct new
            logical edit with a distinct client_change_id may create a new speculative overlay.
        - kind: control_flow
          intent: Enumerate every transition that can publish canonical state or create, restore,
            reactivate, or expose a speculative overlay. Prove that any path producing a
            user-visible overlay (D,k) is blocked whenever the currently visible canonical prefix
            already contains acceptance (D,k), and that the first canonical publication containing
            (D,k) retires the matching overlay before exposure.
    kind: leaf
    formal_intent: visible_canonical_speculative_exclusion
    semantic_contracts:
      - visible_canonical_speculative_exclusion
  G8_user_visible_state_does_not_double_render_accepted_optimistic_edit:
    statement: At every user-visible client state, for every logical client edit identified by
      (document_id=D, client_change_id=k), if the currently visible canonical prefix contains the
      canonical acceptance identified by (D,k), the same user-visible state contains no speculative
      overlay identified by (D,k). This invariant must remain true across the canonical publication
      that first exposes the acceptance and across every later user-visible client transition while
      that canonical acceptance remains visible, including ACK/retry/pending bookkeeping and other
      transitions that do not advance the canonical frontier. Ordinary live delivery, buffered
      post-catch-up delivery, and reconnect/resync publication are all covered. A genuinely new
      logical edit may create a new speculative overlay only under its distinct client_change_id;
      this claim makes no automatic local-rebase or progress guarantee for unresolved edits with no
      acceptance in the visible canonical prefix.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    kind: root
    depends_on:
      - L110_client_retires_matching_speculative_overlay_before_canonical_publication
    formal_intent: visible_canonical_speculative_exclusion
    semantic_contracts:
      - visible_canonical_speculative_exclusion
  G9_accepted_idempotency_evidence_matches_committed_acceptance:
    statement: 'For every (document_id=D, client_change_id=k) while its logical edit remains within the
      30-day normal retry/reconnect eligibility horizon, accepted_evidence_correspondence holds in every
      authoritative state: authoritative durable accepted-key evidence means already-accepted(D,k) if
      and only if canonical history contains exactly one committed canonical acceptance identified by
      the same (D,k). On the normal hot path this correspondence is established either because the committed
      accepted row / unique identity itself is the success evidence, or because any separate accepted-key
      success record commits and aborts atomically with the canonical acceptance in the same acceptance
      transaction. Lifecycle compaction may replace the physical evidence only by deriving equivalent
      evidence from a previously committed acceptance; reservation, in-progress arbitration, timeout,
      cancellation, or another non-committed attempt is not accepted evidence. The protocol does not require
      ordinary retry/reconnect classification of that old identity after the 30-day horizon expires.'
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    kind: root
    depends_on:
      - C13_idempotency_key_is_temporally_unique
      - L14_accepted_idempotency_identity_survives_lifecycle
      - C35_accepted_key_classification_requires_committed_acceptance
      - C7_revision_frontier_is_linear
    formal_intent: accepted_evidence_correspondence
    semantic_contracts:
      - accepted_evidence_correspondence
  L113_request_raw_edit_is_bound_to_authoring_frontier:
    statement: "For every submitted request whose OT result may become a canonical acceptance, request_authoring_frontier_binding
      holds: the submitted tuple (document_id=D, server-visible raw_edit, base_revision=F) is captured
      from one user-visible client canonical tuple with client_document_id=D and last_applied_revision=F.
      Request construction, serialization, dispatch, and retry preserve that document/raw_edit/base binding
      and cannot substitute another document or frontier for the raw_edit. Canonical correctness of the
      source visible client tuple is proved separately."
    formal_intent: request_authoring_frontier_binding
    source_refs:
      - ot_input_output
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_revision_continuity
      - server_authoritative_ot
    semantic_contracts:
      - request_authoring_frontier_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every acceptance-eligible client request construction and OT-dispatch path.
            Prove the serialized document_id, raw_edit, and base_revision are captured from one
            user-visible source tuple whose client_document_id is the same D, base_revision equals
            that tuple frontier, and no serialization/retry path can cross-bind the raw edit to
            another document or frontier.
        - kind: integration_test
          intent: Construct distinguishable visible canonical states for documents A and B at the
            same numeric frontier, produce distinguishable raw edits, perturb document/frontier
            metadata during request construction and retry, and require every acceptance-eligible
            request to retain the exact document/raw_edit/base tuple captured from its source
            visible state.
    kind: leaf
  L114_hot_path_accepted_evidence_requires_committed_acceptance:
    statement: On the normal acceptance path, authoritative durable state may acquire protocol
      semantics already-accepted(D,k) for identity (document_id=D, client_change_id=k) only if the
      matching canonical acceptance(D,k) commits. If the committed accepted row or unique identity
      itself is the idempotency success evidence, that committed row is the evidence; if a separate
      hot-path accepted-key record or index exists, that record and the canonical acceptance must
      commit or abort in the same acceptance_transaction. Reservation, in-progress arbitration,
      pre-commit ownership, or other provisional state cannot serve as accepted evidence, and an
      aborted, timed-out, or cancelled attempt with no committed acceptance cannot by itself make
      (D,k) already accepted.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the normal acceptance transaction and prove that any separate hot-path
            already-accepted success evidence for (D,k) commits or aborts atomically with canonical
            acceptance(D,k); crash or rollback cannot leave one durable without the other.
        - kind: control_flow
          intent: Enumerate every normal-path state or branch that can classify (D,k) as already
            accepted. Require the classification to originate from the matching committed canonical
            acceptance or same-transaction success evidence, and prove reservation, arbitration,
            pre-commit, timeout, cancellation, and aborted paths cannot reach the accepted-evidence
            sink.
    kind: leaf
  C35_accepted_key_classification_requires_committed_acceptance:
    statement: Authoritative durable state may acquire or preserve protocol semantics
      already-accepted(D,k) for identity (document_id=D, client_change_id=k) only from the matching
      committed canonical acceptance(D,k). On the normal acceptance path, if the committed accepted
      row / unique identity itself is the idempotency success evidence, that committed row is the
      evidence; if a separate hot-path accepted-key record or index exists, that record and the
      canonical acceptance must commit or abort in the same acceptance transaction. On every other
      path that creates, rebuilds, restores, materializes, or preserves authoritative
      already-accepted(D,k) evidence—including compaction, cleanup, snapshot replacement, recovery,
      owner restart, index rebuild, or another lifecycle/runtime reconstruction—the evidence may be
      derived only from a previously committed canonical acceptance for the same (D,k). Reservation,
      in-progress arbitration, pre-commit ownership, aborted/timed-out/cancelled attempts, caches,
      failed-owner residue, or other provisional or non-authoritative state cannot by themselves
      make (D,k) already accepted.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the acceptance transaction and prove any separate hot-path
            already-accepted success evidence for (D,k) commits or aborts atomically with the
            canonical acceptance(D,k); crash or rollback cannot leave one durable without the other.
        - kind: state_machine
          intent: Explore first submission, existing-key retry, reservation, arbitration,
            transaction begin/commit/rollback, crash, timeout, cancellation, recovery, and
            compaction transitions. Require every state interpreted as already-accepted(D,k) to be
            either the committed canonical accepted row/identity itself, a separate record that
            committed atomically with that acceptance, or lifecycle replacement evidence derived
            from a prior committed acceptance; pre-commit and aborted states remain distinguishable
            from accepted.
        - kind: fault_injection
          intent: Crash or abort before, during, and after the acceptance transaction and around any
            separate accepted-key evidence write. After recovery, assert that canonical
            acceptance(D,k) and any hot-path already-accepted evidence either both committed or both
            did not commit; a timeout/cancellation without committed acceptance must not leave a
            phantom accepted marker.
    kind: derived
    formal_intent: accepted_evidence_provenance
    semantic_contracts:
      - accepted_evidence_provenance
    depends_on:
      - L114_hot_path_accepted_evidence_requires_committed_acceptance
      - L134_durable_lifecycle_accepted_evidence_derives_from_committed_acceptance
      - L135_runtime_reconstruction_accepted_evidence_derives_from_committed_acceptance
  L116_live_delivery_is_bound_to_committed_acceptance:
    statement: "live_delivery_acceptance_binding holds for every change exposed through websocket_live_stream
      for document D: the delivered change is bound to a committed canonical accepted-change record from
      accepted_change_log for that same D, preserving document scope together with canonical payload and
      revision provenance. A provisional, speculative, rejected, aborted, never-committed, or committed-but-other-document
      change cannot reach D's live stream as D's canonical change, even when revision/payload values collide."
    source_refs:
      - authoritative_truth
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
    semantic_contracts:
      - live_delivery_acceptance_binding
    formal_intent: live_delivery_acceptance_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every producer/routing path that can expose a canonical change through
            websocket_live_stream; trace document scope, payload, and revision to a committed
            accepted-history record for the same document consumed by that stream.
        - kind: state_machine
          intent: Create two documents with equal next revision and equal payload/effect, then
            cross-route B’s committed record to A’s stream; same-document provenance must reject the
            substitution even though all non-scope observations collide.
    kind: leaf
  L117_retry_existing_acceptance_matches_full_idempotency_key:
    statement: If a normal retry within the 30-day eligibility horizon carrying idempotency identity
      (document_id=D, client_change_id=k) refers to a logical edit whose canonical acceptance for
      that same full identity (D,k) is already committed, processing may remain pending, time out,
      or be cancelled, but every other terminal outcome returns exactly that existing canonical
      accepted record for (D,k). No stale-base, OT-invalid, rebase-required, compaction artifact, or
      other definitive negative path may become externally terminal once that same-key acceptance is
      authoritative, and an acceptance for another document or client_change_id cannot satisfy this
      retry.
    source_refs:
      - accepted_change_log
      - owner_failover
      - final_architecture
    mechanisms:
      - accepted_history_log
      - idempotency_gate
      - retry_resolution
    verification:
      verifiers:
        - kind: control_flow
          intent: For normal retries within the eligibility horizon whose full (D,k) already has
            committed canonical acceptance, enumerate every externally terminal path after request
            admission, stale-base/admission checks, OT dispatch, idempotency lookup,
            compaction-aware evidence lookup, and retry resolution. Except for
            pending/timeout/cancellation, every terminal path must return exactly the existing
            canonical record for the same (D,k); definitive negative outcomes must be unreachable.
        - kind: integration_test
          intent: Commit (D,k), lose its ACK, advance/compact history so the original base is stale,
            then retry the same full key within the horizon under paths that would otherwise reject
            or require rebase; require either pending/timeout/cancellation or return of exactly the
            existing canonical acceptance, never a definitive negative result.
    kind: leaf
  C36_reconnect_starts_from_canonical_client_frontier:
    statement: "A normal reconnect/catch-up attempt for document D is foreground and visible-document-bound:
      it may start only while the current user-visible canonical tuple represents D. If that tuple's last_applied_revision
      is L, the attempt captures its reconnect-start base from the same tuple, with client_document_id=D
      and client_local_document equal to deterministic canonical replay of document D through L. Private
      resync-candidate or request-construction scratch state does not replace this user-visible canonical
      starting tuple. If the user-visible document switches away from D before publication, that attempt
      permanently loses normal foreground publication eligibility; a later return to D requires a fresh
      foreground attempt. Background or non-visible per-document synchronization is outside this reconnect
      guarantee."
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    kind: derived
    depends_on:
      - L130_reconnect_start_is_bound_to_visible_client_tuple
      - L136_reconnect_initiation_visible_frontier_is_canonical
      - L157_foreground_reconnect_loses_publication_eligibility_after_document_switch
  L119_completed_resync_candidate_stays_at_response_head_until_publication:
    statement: For a reconnect/resync attempt with captured response head H, once the attempt has
      completed its canonical catch-up and pending reconciliation through H, its private reconciled
      candidate keeps canonical frontier exactly H until that candidate is either atomically
      published or discarded. Canonical live revisions accepted after H may be buffered or deferred
      for later processing, but they cannot be applied into or advance this already completed
      candidate before its publication. Therefore any successful publication of that candidate
      exposes canonical state through exactly H.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore completion through H, later accepted live revisions H+1 and above,
            buffering/defer paths, overlapping reconnect attempts, publication, and discard. Once
            one candidate is complete through H, require its private canonical frontier and
            canonical contents to remain bounded exactly at H until publication/discard; later live
            revisions must remain outside that candidate.
        - kind: control_flow
          intent: Enumerate every post-completion path that can mutate the completed resync
            candidate before publication. Prove that no buffered/live-delivery consumer can apply a
            revision greater than H into that candidate, and that the publication sink exposes
            exactly the candidate at H rather than a later frontier.
    kind: leaf
  L121_delta_resync_candidate_starts_from_canonical_client_base:
    statement: For a reconnect/resync attempt starting from user-visible last_applied_revision L
      that selects delta catch-up, before any returned canonical revision greater than L is applied,
      the private resync candidate canonical document/frontier is initialized from the same
      reconnect-start client document/frontier pair at L, either by exact copy or by a deterministic
      reconstruction equal to that pair. Candidate construction cannot substitute stale/private
      scratch content, cross-bind a document from another client state to frontier L, or otherwise
      change either member of the reconnect-start pair before the first delta is applied. Whether
      the reconnect-start pair itself equals canonical replay through L is a separate obligation.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every delta-mode resync candidate construction path before the first
            catch-up revision is applied. Prove that candidate document and frontier are initialized
            from one coherent reconnect-start document/frontier pair at L, or an exactly equal
            deterministic reconstruction, with no stale scratch, cross-binding, substitution, or
            mutation before applying L+1.
        - kind: integration_test
          intent: Seed distinguishable reconnect-start and stale/private scratch document/frontier
            pairs, enter delta catch-up, and verify that the candidate immediately before applying
            L+1 equals the reconnect-start pair in both document content and frontier.
    kind: leaf
  L122_catchup_response_head_is_bound_to_authoritative_frontier:
    statement: 'For every catch-up response eligible for completion or publication, catchup_head_binding
      holds: for catch-up document D, response head H is captured from authoritative document_latest_revision(D)
      at one response-specific authoritative-store read/linearization point, and that exact H is preserved
      through delta/snapshot selection, canonical range construction, pending reconciliation, completion,
      and publication. Later canonical acceptances may advance document_latest_revision(D) but cannot
      rewrite H for that response.'
    formal_intent: catchup_head_binding
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - accepted_history_log
    semantic_contracts:
      - catchup_head_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every completion/publication-eligible catch-up response from authoritative
            frontier read through response construction and publication. Require one
            response-specific document_latest_revision(D) capture and prove the same H reaches every
            mode-selection, range/checkpoint, reconciliation, completion, and publication consumer.
        - kind: integration_test
          intent: Use two documents and deliberately stale/cacheable frontier values while advancing
            canonical history around catch-up construction. A response may use only the H captured
            from its own document authoritative frontier, and later acceptances must not change that
            response H.
    kind: leaf
  L123_acceptance_payload_and_identity_share_submitted_request:
    statement: For every canonical_accepted_change, there is one submitted request R such that the
      successful OT invocation whose output is committed as that acceptance consumes R's submitted
      raw_edit and base_revision, and the authoritative document_id and client_change_id persisted
      for that same acceptance are exactly R's submitted identity. No acceptance path may combine
      OT-result payload provenance from one submitted request with document or idempotency identity
      provenance from another request.
    source_refs:
      - ot_input_output
      - accepted_change_log
      - final_architecture
    mechanisms:
      - server_authoritative_ot
      - acceptance_transaction
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every canonical-acceptance path from one decoded submitted request through
            OT dispatch and the canonical commit sink; require the committed OT payload and
            persisted document_id/client_change_id to retain provenance from the same submitted
            request, rejecting any cross-request field or result substitution.
        - kind: integration_test
          intent: Submit distinguishable concurrent requests with different raw edits, base
            revisions, document IDs, and client_change_ids, force overlap/retry interleavings, and
            assert that every committed acceptance pairs the OT result and authoritative identity
            from one and the same submitted request.
    kind: leaf
  C37_pending_identity_resolution_is_bound_to_response_head:
    statement: 'For every protocol-eligible pending identity (document_id=D, client_change_id=k) within
      the 30-day normal reconnect eligibility horizon supplied under a catch-up request for document D
      with authoritative response head H_D, the response classifies only that same full identity against
      authoritative acceptance through H_D: it reports accepted at revision r only for the unique canonical
      acceptance(D,k) with r <= H_D, and reports unresolved through H_D only when no canonical acceptance(D,k)
      exists through H_D. An acceptance(D2,k) for D2 != D cannot satisfy or suppress pending(D,k). Snapshotting,
      compaction, cleanup, and recovery preserve enough same-identity accepted revision or equivalent
      frontier evidence to make this classification throughout that eligibility horizon. Expired identities
      are outside ordinary authoritative reconnect classification.'
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    kind: derived
    depends_on:
      - C13_idempotency_key_is_temporally_unique
      - L124_pending_identity_classifier_uses_same_identity_and_response_head
      - C41_pending_identity_revision_evidence_survives_lifecycle
      - A6_normal_retry_reconnect_identity_is_eligible_for_30_days
  L124_pending_identity_classifier_uses_same_identity_and_response_head:
    statement: For every protocol-eligible pending identity (document_id=D, client_change_id=k)
      within the 30-day normal reconnect eligibility horizon supplied under a catch-up request for
      document D with captured response head H_D, the response classifier uses only authoritative
      canonical acceptance evidence for that same full identity (D,k) through H_D. Given the
      canonical acceptance uniqueness obligation for (D,k), it reports accepted at revision r
      exactly when the matching canonical acceptance exists with r <= H_D, otherwise it reports
      unresolved through H_D; an acceptance(D2,k) for D2 != D and any acceptance after H_D cannot
      satisfy or suppress pending(D,k). No classification guarantee is made here for an expired
      identity submitted outside the normal protocol boundary.
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - accepted_history_log
      - idempotency_gate
    verification:
      verifiers:
        - kind: state_machine
          intent: Within the 30-day normal reconnect eligibility horizon, vary catch-up document D,
            captured response head H_D, same client_change_id reused by another document, and
            matching acceptance timing before or after H_D; require classifier output to depend only
            on canonical acceptance(D,k) through the captured head.
        - kind: integration_test
          intent: For eligible identities, create distinguishable same-key acceptances across
            documents and accept the target identity both before and after a captured head; verify
            cross-document and post-head records cannot affect response classification. Expired
            identities are outside this ordinary authoritative reconciliation test oracle.
    kind: leaf
  L126_pending_reconciliation_preserves_resync_canonical_candidate:
    statement: For every reconnect/resync attempt with captured response head H, once the private
      resync candidate canonical document/frontier is initialized and until that candidate is
      published or discarded, every pending-identity reconciliation transition for that same attempt
      preserves the candidate canonical document and canonical frontier. Reconciliation may update
      pending-resolution state, speculative overlays, and related control/bookkeeping state, but it
      cannot insert, remove, rewrite, reapply, or otherwise mutate canonical accepted content or
      change the candidate canonical frontier before, during, or after canonical catch-up reaches H.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every pending-identity reconciliation path that can run after resync
            candidate initialization and before publication or discard; prove all writes are
            confined to pending-resolution, speculative-overlay, or control/bookkeeping state and no
            path mutates candidate canonical document/frontier regardless of whether catch-up has
            already reached H.
        - kind: state_machine
          intent: Explore reconciliation before, during, and after delta/snapshot catch-up,
            including accepted and unresolved pending identities, overlap, retry, and conflict
            entry; require candidate canonical document/frontier to remain unchanged across every
            reconciliation transition.
    kind: leaf
  G10_user_visible_client_state_matches_document:
    statement: "At every user-visible client state representing document D, client_canonical_frontier_coherence
      holds for the full visible canonical tuple: client_document_id=D and client_local_document equals
      deterministic canonical replay of document D through last_applied_revision. visible_canonical_frontier_non_regression
      also holds for the normal current-document protocol: within one client/session, once D has been
      exposed at frontier F, any later ordinary user-visible state in that session that again represents
      D has frontier F2 >= F; restoration, tab/view activation, cached-state replacement, live delivery,
      catch-up publication, and other ordinary visible tuple replacements cannot roll D back to an older
      coherent frontier. This does not compare different documents, require freshness to authoritative
      latest, or constrain a genuinely new session or separately modeled historical-version/rollback mode.
      Initialization, restoration, tab/view switching, live delivery, catch-up publication, and every
      other transition that can replace or publish any tuple coordinate preserve the same-document canonical
      binding; no user-visible state may pair one document's canonical content/frontier with another document
      identity."
    source_refs:
      - authoritative_truth
      - reconnect_revision_boundary
      - final_architecture
    depends_on:
      - C38_client_frontier_matches_canonical_base
      - L207_visible_canonical_frontier_never_regresses_per_session_document
    formal_intent: client_canonical_frontier_coherence; visible_canonical_frontier_non_regression
    semantic_contracts:
      - client_canonical_frontier_coherence
      - visible_canonical_frontier_non_regression
    kind: root
  L128_client_canonical_frontier_is_established_on_publication:
    statement: 'At every client initialization and every canonical publication that creates or replaces
      a user-visible client state representing document D, the published full visible tuple is coherent:
      client_document_id = D and client_local_document equals deterministic application of all and only
      document D canonical accepted revisions through last_applied_revision. This includes publication
      from restoration, document/view switching, snapshot replacement, or reconnect/resync state. Private
      client_resync_candidate state is outside this boundary until publication, and speculative raw edits
      are not part of client_local_document.'
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - catchup_protocol
      - client_revision_continuity
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: state_machine
          intent: Model initialization and every visible tuple publication/replacement path,
            including restoration, document/view switching, snapshot replacement, and reconnect
            publication. Use distinguishable documents with equal numeric frontiers and require each
            resulting visible tuple for D to contain client_document_id=D and exactly
            Replay_D(last_applied_revision); private resync candidates may violate the relation only
            before publication.
    kind: leaf
  L129_client_canonical_frontier_is_preserved_by_visible_transitions:
    statement: From any user-visible client state for document D whose full visible canonical tuple
      is coherent, every subsequent user-visible transition capable of mutating, restoring,
      replacing, switching, or publishing client_document_id, client_local_document, or
      last_applied_revision preserves that coherence in its resulting visible state, including
      transitions that leave last_applied_revision unchanged. Contiguous canonical application,
      duplicate/gap handling, restoration, switching, and canonical publication may not expose a
      tuple whose document identity, materialized canonical document, and frontier come from
      different canonical bases. Private client_resync_candidate state remains outside this observer
      boundary until publication, and speculative raw edits are not part of client_local_document.
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - catchup_protocol
      - client_revision_continuity
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every implementation path that can assign, restore, swap, switch, or
            publish any visible tuple coordinate and prove that, assuming the pre-state tuple is
            coherent, every user-visible post-state remains same-document canonical through its
            frontier or the path mutates only non-user-visible client_resync_candidate state.
        - kind: state_machine
          intent: Explore contiguous live/catch-up application, duplicate/gap handling, restoration,
            switching, snapshot replacement, buffered live delivery, interruption, retry, and
            reconnect publication from coherent visible states; require every visible successor
            state to satisfy the same canonical replay relation, including unchanged-frontier paths.
    kind: leaf
  C38_client_frontier_matches_canonical_base:
    statement: 'At every user-visible client state representing document D, client_canonical_frontier_coherence
      holds for the full visible canonical tuple: client_document_id = D and client_local_document equals
      deterministic application of all and only document D canonical accepted revisions through last_applied_revision.
      The invariant is established at client initialization or canonical publication and preserved by
      every user-visible transition capable of mutating, restoring, replacing, switching, or publishing
      client_document_id, client_local_document, or last_applied_revision, including transitions that
      leave the frontier unchanged. Speculative raw edits are not part of client_local_document, and private
      client_resync_candidate construction is outside this observer boundary until atomic publication.'
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    kind: derived
    formal_intent: client_canonical_frontier_coherence
    semantic_contracts:
      - client_canonical_frontier_coherence
    depends_on:
      - L128_client_canonical_frontier_is_established_on_publication
      - L129_client_canonical_frontier_is_preserved_by_visible_transitions
  L130_reconnect_start_is_bound_to_visible_client_tuple:
    statement: 'For every normal foreground reconnect/catch-up attempt for document D, attempt initiation
      is permitted only while the current user-visible tuple represents D, and the reconnect-start document
      identity, canonical client document, and last_applied_revision L used to construct the attempt are
      captured from that same visible tuple or one exact private copy of that tuple. Reconnect-start construction
      may not independently reread, substitute, synthesize, or cross-bind any of those three coordinates
      across a visible-state transition. Background or non-visible per-document synchronization is outside
      this obligation.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate normal foreground reconnect initiation paths and prove all three start
            coordinates come from one visible tuple observation or exact copy, including document
            switching, restoration, and canonical publication transitions.
        - kind: integration_test
          intent: Use distinguishable documents and equal numeric frontiers while changing visible
            state around reconnect initiation; require every attempt to capture one complete visible
            tuple without mixed coordinates.
    kind: leaf
  L131_post_recovery_acceptance_state_is_exhaustive:
    statement: When a completed new-owner recovery at authoritative head H is used to resume owner
      service, every document-history-dependent runtime state value present on that owner that can
      influence server-side OT transformation or canonical acceptance is contained in the recovered
      logical document state through H, the recovered local head and next-candidate revision, or
      ot_owner_memory. ot_owner_memory is the complete recovered OT metadata carrier for such
      history-dependent influence; no separate recovered OT metadata bucket exists outside these
      components. No stale, retained, cached, otherwise pre-existing, or newly produced per-document
      runtime state outside those components can influence post-recovery canonical semantics.
    source_refs:
      - authoritative_truth
      - owner_failover
      - final_architecture
    mechanisms:
      - recovery_replay
      - server_authoritative_ot
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every document-history-dependent state/control input read by post-recovery
            OT transformation and canonical-acceptance paths, including values retained from earlier
            ownership intervals, caches, process-local state, and values produced by the current
            recovery. Require every influencing input to belong to recovered document state,
            recovered head/next-revision state, or ot_owner_memory; additionally require there to be
            no distinct recovery-installed history-dependent OT metadata carrier outside
            ot_owner_memory that can reach either path. Reject any additional influencing state.
    kind: leaf
  L132_visible_overlay_document_binding_established_on_publication:
    statement: Every user-visible client transition that establishes, replaces, or changes
      client_document_id so that the resulting visible state represents document D also produces
      client_visible_speculative_overlays in which every exposed speculative overlay has document_id
      D. This applies regardless of the transition's implementation-specific name or whether it is
      classified as initialization, restoration, switching, publication, or another visible-document
      replacement path.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_document_scoped_speculative_state
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate every user-visible transition capable of changing or establishing
            client_document_id. For every transition whose resulting visible document is D, require
            every overlay in the resulting client_visible_speculative_overlays set to have
            document_id D, including unnamed or newly introduced document-replacement paths.
    kind: leaf
  L133_visible_overlay_document_binding_preserved_by_local_transitions:
    statement: From any user-visible client state representing document D in which every exposed
      speculative overlay has document_id D, every subsequent user-visible transition that creates,
      removes, suppresses, reactivates, or otherwise mutates client_visible_speculative_overlays
      while D remains the visible document preserves that same-document property.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_document_scoped_speculative_state
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate local optimistic-edit creation, ACK/retry/pending bookkeeping, overlay
            suppression/reactivation, and every other exposed-overlay-set mutation that leaves
            document D visible; require every resulting exposed overlay to have document_id D.
    kind: leaf
  G11_visible_speculative_overlays_match_document:
    statement: 'speculative_overlay_identity_provenance and speculative_overlay_operation_provenance hold
      for every logical client edit represented speculatively: if the logical edit is created with identity
      (document_id=D, client_change_id=k) and logical operation X, every retained representation in client_speculative_overlays
      and every exposed representation in client_visible_speculative_overlays preserves exactly that same
      (D,k) and continues to encode operation X for the lifetime of the edit across creation, retention,
      restoration, tab/view switching, suppression/reactivation, ACK/retry bookkeeping, canonical publication,
      resync publication, and every other transition that preserves the same logical edit. Physical representation
      may change only in ways that preserve X''s semantics; another edit''s operation cannot be cross-bound
      under (D,k). visible_speculative_effect_uniqueness also holds at every user-visible client state:
      each full logical identity (D,k) contributes at most one effective speculative logical operation
      to the rendered document, even if multiple physical representations exist. visible_speculative_retention_coherence
      also holds at every user-visible client state: every exposed speculative representation has a matching
      retained representation of the same logical edit and full identity, and terminal removal/disposition
      of retained state cannot leave an orphaned visible overlay. At every user-visible client state representing
      document D, visible_speculative_overlay_document_binding also holds: every currently exposed speculative
      overlay belongs to D. Retained overlays for another document may remain retained but must not be
      exposed while D is the visible document.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    formal_intent: visible_speculative_overlay_document_binding AND
      speculative_overlay_identity_provenance AND speculative_overlay_operation_provenance AND
      visible_speculative_effect_uniqueness AND visible_speculative_retention_coherence
    semantic_contracts:
      - visible_speculative_overlay_document_binding
      - speculative_overlay_identity_provenance
      - speculative_overlay_operation_provenance
      - visible_speculative_effect_uniqueness
      - visible_speculative_retention_coherence
    kind: root
    depends_on:
      - L132_visible_overlay_document_binding_established_on_publication
      - L133_visible_overlay_document_binding_preserved_by_local_transitions
      - L176_visible_speculative_overlay_is_backed_by_retained_state
      - L179_speculative_overlay_identity_provenance_is_preserved
      - L202_speculative_overlay_operation_provenance_is_preserved
      - L205_visible_speculative_effect_is_unique_per_identity
  L134_durable_lifecycle_accepted_evidence_derives_from_committed_acceptance:
    statement: Whenever a durable accepted-history lifecycle transformation outside the normal
      acceptance transaction—including compaction, cleanup, or snapshot replacement—creates,
      replaces, or preserves authoritative evidence whose protocol meaning is already-accepted(D,k),
      that evidence is derived only from a previously committed canonical acceptance for the same
      (document_id=D, client_change_id=k). No never-committed attempt, reservation, in-progress
      arbitration, timeout, cancellation, or other provisional state may become the provenance
      source of durable lifecycle accepted evidence.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every durable compaction, cleanup, and snapshot/history replacement
            producer of authoritative already-accepted(D,k) evidence; trace each producer to
            authoritative accepted history and prove same-key provenance from a previously committed
            canonical acceptance.
        - kind: state_machine
          intent: Exercise durable history lifecycle transitions for committed and never-committed
            attempts. Representation may change, but authoritative already-accepted(D,k) evidence
            may survive or be recreated only when authoritative history contains a prior committed
            canonical acceptance for that same identity.
    kind: leaf
  L135_runtime_reconstruction_accepted_evidence_derives_from_committed_acceptance:
    statement: Whenever any non-hot-path runtime reconstruction or materialization—including
      recovery, owner restart, restore, index rebuild, cache rebuild, or another runtime
      reconstruction— creates or preserves authoritative evidence whose protocol meaning is
      already-accepted(D,k), that evidence is derived only from a previously committed canonical
      acceptance for the same (document_id=D, client_change_id=k). Failed-owner residue, caches,
      reservations, never-committed attempts, timeout/cancellation state, or other provisional or
      non-authoritative runtime data may not become the provenance source.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - owner_failover
      - final_architecture
    mechanisms:
      - idempotency_gate
      - accepted_history_log
      - recovery_replay
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate recovery, restart, restore, index/cache rebuild, and every other runtime
            materialization path that can emit authoritative already-accepted(D,k) evidence. Prove
            each path derives same-key evidence only from committed canonical accepted history and
            never from failed-owner residue, cache-only state, or provisional attempt state.
        - kind: state_machine
          intent: Exercise runtime reconstruction across crashes, owner moves, committed identities,
            and never-committed attempts. Any reconstructed authoritative already-accepted(D,k)
            evidence must correspond to a prior committed canonical acceptance for that same
            identity.
    kind: leaf
  L136_reconnect_initiation_visible_frontier_is_canonical:
    statement: 'For every user-visible client tuple from which normal foreground reconnect/catch-up initiation
      is enabled, let that tuple identify document D and last_applied_revision L. client_local_document
      equals deterministic application of all and only document D canonical accepted revisions through
      L. Background or non-visible per-document synchronization is outside this obligation.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate client-state transitions that can enter or preserve a state in which
            normal foreground reconnect initiation is enabled. At every such reachable visible
            state, compare client_local_document with deterministic canonical replay for the tuple's
            client_document_id through its last_applied_revision and require exact equality.
        - kind: integration_test
          intent: Exercise initialization, restoration, visible document switch, live canonical
            application, snapshot publication, and reconnect/resync publication that can lead to
            reconnect-enabled visible states. Require each exposed document/frontier pair to match
            the exact canonical prefix through that frontier before initiation is allowed.
    kind: leaf
  L137_authoritative_history_mutators_are_exhaustively_classified:
    statement: 'Every authoritative write that can create or change accepted_change_log or document_latest_revision
      is covered by at least one correctness-relevant transition class whose preservation proof applies:
      document-state initialization, a committed canonical accepted-change append, or an authoritative
      non-append representation/lifecycle transition that accepts no new edit. No authoritative mutation
      path may change either symbol without belonging to one of these covered classes.'
    source_refs:
      - authoritative_truth
      - final_architecture
    mechanisms:
      - accepted_history_log
      - acceptance_transaction
      - revision_frontier_guard
      - recovery_replay
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every authoritative write site and transaction path capable of creating
            or mutating accepted_change_log or document_latest_revision. Require every site to be
            covered by initialization, committed accepted append, or non-append
            representation/lifecycle preservation, including recovery, snapshotting, compaction,
            cleanup, and storage replacement; reject any unclassified mutator.
    kind: leaf
  C39_authoritative_history_state_is_gap_free:
    statement: In every authoritative state for a document, accepted_change_log denotes one gap-free
      accepted revision sequence.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - accepted_history_log
      - revision_frontier_guard
    kind: derived
    depends_on:
      - L138_committed_append_preserves_gap_free_state_shape
      - L139_non_append_lifecycle_preserves_gap_free_state_shape
      - L140_initial_authoritative_history_is_gap_free
      - L137_authoritative_history_mutators_are_exhaustively_classified
  L138_committed_append_preserves_gap_free_state_shape:
    statement: If an authoritative pre-state has one gap-free accepted revision sequence and a
      canonical accepted-change append commits, the authoritative post-state also has one gap-free
      accepted revision sequence.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - accepted_history_log
      - revision_frontier_guard
    verification:
      verifiers:
        - kind: property_test
          intent: Generate authoritative pre-states with gap-free accepted revision sequences,
            execute every successful canonical append path, and require the committed post-state
            accepted revision sequence to remain gap-free.
        - kind: fault_injection
          intent: Race and crash canonical acceptance around its commit boundaries; every observable
            committed post-state accepted history must still be one gap-free revision sequence.
    kind: leaf
  L139_non_append_lifecycle_preserves_gap_free_state_shape:
    statement: If an authoritative pre-state has one gap-free accepted revision sequence and an
      authoritative representation/lifecycle transition that accepts no new edit completes, the
      authoritative post-state also has one gap-free accepted revision sequence.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - accepted_history_log
      - recovery_replay
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: state_machine
          intent: Exercise every no-edit authoritative snapshotting, compaction, cleanup, recovery
            publication, and storage-replacement transition from valid gap-free histories; require
            each reachable post-state accepted history to remain one gap-free revision sequence.
    kind: leaf
  L140_initial_authoritative_history_is_gap_free:
    statement: At document-state initialization, authoritative accepted_change_log denotes one
      gap-free accepted revision sequence.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - accepted_history_log
    verification:
      verifiers:
        - kind: integration_test
          intent: Exercise every document creation or bootstrap path and require the initialized
            authoritative accepted history to denote one gap-free revision sequence.
    kind: leaf
  L143_acked_edit_completed_recovery_matches_canonical_replay:
    statement: For every edit e that received a success ACK after canonical acceptance at revision
      r, any later owner recovery that completes and resumes service from authoritative frontier H
      with H >= r produces a recovered logical document state exactly equal to canonical replay
      through H. This guarantee does not require recovery to be scheduled or complete, does not
      require a client to reconnect, and does not require physical retention of e's individual
      accepted row.
    source_refs:
      - accepted_change_log
      - owner_failover
      - final_architecture
    mechanisms:
      - recovery_replay
      - snapshot_checkpoint
      - accepted_history_log
    verification:
      verifiers:
        - kind: differential_test
          intent: Generate acknowledged canonical edits and later authoritative histories, compact
            or checkpoint at arbitrary valid frontiers, complete owner recovery at H >= the ACKed
            edit's revision, and require recovered logical state to equal an independent canonical
            replay through H.
        - kind: integration_test
          intent: ACK an edit, apply arbitrary later accepted changes, exercise owner failover and
            completed recovery with snapshots/compaction, and compare the recovered logical document
            against canonical replay through the resumed authoritative frontier.
    kind: leaf
  L144_success_ack_follows_corresponding_canonical_commit:
    statement: For every edit e for which the client actually receives a success ACK, there exists a
      corresponding canonical accepted change for e at some revision r whose authoritative
      acceptance transaction successfully committed before the server emitted that ACK. No
      pre-commit, rolled-back, process-local-only, provisional, rejected, or
      never-canonically-accepted edit may result in a client-observed success ACK.
    source_refs:
      - accepted_change_log
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - accepted_history_log
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate success-ACK paths that can reach client receipt and prove each is
            dominated by successful commit of the authoritative acceptance transaction that produced
            the corresponding canonical accepted change for the same edit; reject provisional,
            rollback, error, and non-canonical paths that can produce client-observed success.
        - kind: integration_test
          intent: Exercise accepted, rejected, aborted, duplicated, crash-interrupted, and
            response-loss edit paths; every client-observed success ACK must correspond to a
            matching canonical acceptance commit that completed before ACK emission.
    kind: leaf
  L146_ack_justifying_acceptance_survives_process_and_owner_failures:
    statement: For every edit e for which the client actually receives a success ACK and whose
      matching canonical accepted change is e@r, any covered server-process crash/restart or
      ownership move preserves e@r in recoverable authoritative logical accepted history. Such a
      failure may destroy process-local state or replace the serving owner, but it may not make that
      acknowledged committed canonical acceptance disappear from authoritative history.
    source_refs:
      - accepted_change_log
      - owner_failover
      - final_architecture
    mechanisms:
      - accepted_history_log
      - recovery_replay
    verification:
      verifiers:
        - kind: fault_injection
          intent: Starting from a client-observed success ACK whose matching committed canonical
            acceptance is e@r, inject every covered process crash/restart and owner-move boundary
            while preserving authoritative storage; after each failure, require recoverable
            authoritative logical accepted history still to contain that acceptance.
        - kind: state_machine
          intent: Model covered owner/process failure transitions from states containing a canonical
            acceptance corresponding to a client-observed success ACK and prove none can remove,
            regress, or substitute that acknowledged acceptance in recoverable authoritative
            history.
    kind: leaf
  L151_selectable_checkpoint_publication_binds_content_and_frontier_atomically:
    statement: 'For every checkpoint identity P=(content,S) actually selected by a new-owner recovery
      attempt, the authoritative publication record from which P is selected bound that content and frontier
      S atomically as one checkpoint identity. The selected P cannot be an intermediate or mixed content/frontier
      pair assembled from different publication states.'
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: For every recovery-selected checkpoint P, trace P back to its authoritative
            publication record and require content and frontier S to have become visible as one
            all-or-nothing pair in that publication.
        - kind: fault_injection
          intent: Race recovery selection with checkpoint publication changes and crash/pause
            publication at every boundary; every checkpoint actually selected by recovery must
            correspond to one complete atomic publication record, never a mixed pair.
    kind: leaf
  L154_pending_edit_identity_provenance_is_preserved:
    statement: 'pending_edit_identity_provenance holds for every logical client edit created for document
      D with client_change_id k while it remains in the normal speculative lifecycle: every pending representation
      in client_pending_edits remains bound to the same creation identity (D,k) across creation, restore,
      tab/view switching, ACK/retry bookkeeping, reconnect capture, authoritative reconciliation, and
      every other transition that preserves the same logical edit. A transition may suppress, retain,
      reconcile, or terminally dispose the edit, but it may not preserve the logical edit while rebinding
      its pending identity from (D,k) to another pair.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_document_scoped_speculative_state
    formal_intent: pending_edit_identity_provenance
    semantic_contracts:
      - pending_edit_identity_provenance
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace document_id and client_change_id provenance for every producer, restore
            path, ACK/retry bookkeeping path, reconnect-capture path, reconciliation path, and
            removal path touching client_pending_edits; any path preserving the logical edit must
            preserve the original full (D,k) identity.
        - kind: state_machine
          intent: Generate multi-document traces that reuse the same client_change_id across
            documents and explore restore, switching, ACK loss, retry, reconnect, and
            reconciliation; no pending representation may cross-bind to another document or
            client_change_id while the logical edit survives.
    kind: leaf
  L155_unresolved_speculative_edit_has_pending_entry:
    statement: "pending_speculative_lifecycle_coverage holds in every reachable client protocol state:
      every unresolved acceptance-eligible logical edit within the normal retry/reconnect eligibility
      horizon that remains represented in client_speculative_overlays has a matching entry in client_pending_edits
      until authoritative reconciliation or an explicit expiry, conflict/manual resolution, or abandonment
      ends that logical edit's normal speculative lifecycle. A transition that merely deletes or omits
      pending bookkeeping while retaining the unresolved speculative edit does not constitute reconciliation
      or terminal disposition."
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_document_scoped_speculative_state
    formal_intent: pending_speculative_lifecycle_coverage
    semantic_contracts:
      - pending_speculative_lifecycle_coverage
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore optimistic-edit creation, request uncertainty, ACK/retry bookkeeping,
            restore, tab/view switching, reconnect, reconciliation, conflict entry, expiry,
            abandonment, and attempted pending-entry deletion. While an unresolved eligible
            speculative representation remains in normal lifecycle, require a matching pending entry
            in every reachable state.
        - kind: control_flow
          intent: Enumerate every insertion and removal path for client_pending_edits and require
            removal of an entry for a still-retained unresolved eligible speculative edit to be
            justified only by authoritative reconciliation or an explicit terminal disposition.
    kind: leaf
  G12_client_pending_state_tracks_unresolved_edits:
    statement: "In every reachable client protocol state, pending_edit_identity_provenance, pending_speculative_lifecycle_coverage,
      pending_retirement_acceptance_binding, non_acceptance_terminal_disposition_binding, terminal_speculative_lifecycle_closure,
      and rejected_terminal_speculative_retirement hold for the normal speculative lifecycle. For every
      logical client edit created for document D with client_change_id k that remains unresolved, acceptance-eligible,
      within the normal retry/reconnect eligibility horizon, and represented in retained speculative state,
      client_pending_edits contains a matching pending representation bound to the same creation identity
      (D,k). That binding is preserved across restore, tab/view switching, ACK/retry bookkeeping, reconnect
      capture, and reconciliation until authoritative reconciliation or an explicit terminal disposition
      ends the lifecycle. Mere bookkeeping deletion or relabeling cannot resolve the edit. If the edit
      is retired with authoritative accepted/reconciled semantics, that retirement must derive from canonical
      acceptance or equivalent authoritative accepted evidence for the exact same full identity (D,k);
      an acceptance for another document or another client_change_id cannot retire it merely because one
      identity coordinate matches. If the client observes an externally_terminal_result = REJECTED carrying
      a definitive rejection reason for exact identity (D,k), that observation must before or atomically
      with the resulting user-visible state terminate the same edit's normal speculative lifecycle through
      a same-identity non_acceptance_terminal_disposition or equivalent terminal transition, so the edit
      no longer remains active in pending, retained speculative, or visible speculative state. If the
      edit is instead retired by expiry, abandonment, conflict/manual resolution, or another explicit
      non-acceptance terminal disposition, that disposition must itself have been produced for the same
      logical edit and preserve the exact full identity (D,k) through the destructive retirement path;
      a disposition for another edit cannot retire this one. Once authoritative reconciliation or an explicit/equivalent
      terminal disposition ends (D,k)'s normal speculative lifecycle, terminal_speculative_lifecycle_closure
      makes that terminal state absorbing: the same lifecycle cannot later reappear in pending, retained
      speculative, or visible speculative state through restore, reactivation, view switching, bookkeeping,
      or resync/publication. Archival/non-reactivatable state may remain, and a genuinely new user edit
      receives a new client_change_id."
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    formal_intent: pending_edit_identity_provenance; pending_speculative_lifecycle_coverage;
      pending_retirement_acceptance_binding; non_acceptance_terminal_disposition_binding;
      terminal_speculative_lifecycle_closure; rejected_terminal_speculative_retirement
    semantic_contracts:
      - pending_edit_identity_provenance
      - pending_speculative_lifecycle_coverage
      - pending_retirement_acceptance_binding
      - non_acceptance_terminal_disposition_binding
      - terminal_speculative_lifecycle_closure
      - rejected_terminal_speculative_retirement
    depends_on:
      - L154_pending_edit_identity_provenance_is_preserved
      - L155_unresolved_speculative_edit_has_pending_entry
      - L158_pending_retirement_requires_matching_acceptance_identity
      - L203_non_acceptance_terminal_disposition_preserves_edit_provenance
      - L206_terminal_speculative_lifecycle_is_absorbing
      - L208_externally_rejected_edit_terminalizes_speculative_lifecycle
    kind: root
  L156_owner_handoff_installs_fresh_epoch:
    statement: For every authoritative transition from one document-owner generation to a distinct
      new generation, including owner-identity change, same-owner restart/reacquisition, cold
      takeover, and warm-standby promotion, the new generation does not become authoritative or
      acceptance-eligible until document_current_epoch has committed to a strictly greater value
      than the superseded generation's epoch, with the epoch advance occurring before or atomically
      with publication/eligibility of the new generation. No new authoritative generation may reuse
      the superseded current epoch.
    source_refs:
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - owner_epoch_fencing
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate every transition that installs a fresh owner generation, including
            same-owner restart/reacquisition and owner-identity changes; require strictly greater
            document_current_epoch before or atomically with that generation becoming
            authoritative/acceptance-eligible.
        - kind: fault_injection
          intent: Delay the superseded generation across each generation-transition path and verify
            there is no reachable state where a fresh authoritative/acceptance-eligible generation
            is published while document_current_epoch still equals the superseded generation's
            epoch.
    kind: leaf
  L157_foreground_reconnect_loses_publication_eligibility_after_document_switch:
    statement: A normal foreground reconnect/resync attempt started for document D is
      publication-eligible only while it remains bound to the foreground visible-document path for
      D. If, before that attempt publishes, any user-visible transition switches the represented
      document from D to a different document, that attempt permanently loses foreground publication
      eligibility under this protocol; a later switch back to D does not re-qualify the same
      attempt. Its delayed response may be discarded or processed only under a separately defined
      background/non-visible synchronization boundary, and cannot mutate the current user-visible
      state through the normal foreground reconnect path.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Start reconnect(A), switch the user-visible tuple to B before
            response/publication, then deliver A responses before and after optional switches back
            to A. The original attempt never regains foreground publication eligibility; only a
            fresh eligible foreground attempt may later publish for A.
    kind: leaf
  L158_pending_retirement_requires_matching_acceptance_identity:
    statement: 'pending_retirement_acceptance_binding holds for every pending logical edit identified
      by (document_id=D, client_change_id=k): any client transition that removes or retires that edit
      with authoritative accepted/reconciled semantics derives that disposition only from a canonical_accepted_change
      or equivalent authoritative accepted evidence for the exact same full identity (D,k). An acceptance
      for (D2,k) where D2 != D, or for (D,k2) where k2 differs from k, cannot retire pending(D,k). Explicit
      expiry, conflict/manual resolution, or abandonment may terminate the lifecycle without claiming
      authoritative acceptance.'
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - accepted_history_log
      - idempotency_gate
    formal_intent: pending_retirement_acceptance_binding
    semantic_contracts:
      - pending_retirement_acceptance_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every client path that removes client_pending_edits with
            accepted/reconciled semantics, including normal ACK/retry handling and reconnect
            reconciliation. Trace the authoritative acceptance/evidence source and require exact
            equality of both document_id and client_change_id with the pending edit's bound identity
            before retirement.
        - kind: state_machine
          intent: Generate two-document traces with deliberately colliding client_change_id values
            and same-document traces with distinct client_change_ids. No foreign acceptance may
            retire pending(D,k); only exact same-key authoritative acceptance or an explicit
            non-acceptance terminal disposition may end the pending lifecycle.
    kind: leaf
  L159_owner_append_authorization_is_generation_bound:
    statement: 'owner_generation_authorization_binding holds for every canonical accepted-change append
      attempt for document D: owner_epoch and append_owner_generation_id come from the immutable server-side
      owner generation for that same D executing the attempt; the document-scoped generation tuple must
      match D''s authoritative document_current_epoch and document_owner_generation_id at commit. A superseded
      generation of D or a valid generation of D2 != D cannot gain authority for D by copying, substituting,
      or colliding on scalar fencing values.'
    source_refs:
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - owner_epoch_fencing
      - acceptance_transaction
    formal_intent: owner_generation_authorization_binding
    semantic_contracts:
      - owner_generation_authorization_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace target document identity together with owner_epoch and
            append_owner_generation_id from server-side ownership-session creation through every
            acceptance path; require all three to remain bound to the same owner generation and
            authoritative document at commit.
        - kind: state_machine
          intent: Use two documents with deliberately equal epoch/generation scalar values, delay or
            cross-route one owner generation, and attempt append against the other document; scalar
            equality must never authorize cross-document or superseded-generation append.
    kind: leaf
  L161_definitive_retry_response_comes_from_terminal_outcome:
    statement: 'terminal_response_outcome_binding holds within the normal retry horizon: every externally_terminal_result
      for (document_id=D, client_change_id=k) is emitted only from the authoritative terminal_result already
      committed for exactly (D,k), and exactly reproduces that ACCEPTED or REJECTED result. Pending, timeout,
      cancellation, transport loss, and crash-before-terminal-commit remain non-terminal and do not create
      a conflicting result.'
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - retry_resolution
      - idempotency_gate
    formal_intent: terminal_response_outcome_binding
    semantic_contracts:
      - terminal_response_outcome_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every path that returns a definitive accepted or rejected result and
            require dominance by a read/commit of the exact same-key authoritative terminal_result;
            attempt-local stale-base or OT checks may become terminal only after winning that
            arbitration.
        - kind: state_machine
          intent: Race two same-key attempts where one computes rejection while the other is
            acceptance-eligible; once either terminal result linearizes, every definitive response
            from both attempts and later retries must reproduce that same result.
    kind: leaf
  L162_terminal_state_transition_preserves_single_outcome:
    statement: For every eligible idempotency_key, once idempotency_terminal_outcomes contains one
      terminal_result, every later authoritative terminal-state transition preserves exactly that
      same result; ACCEPTED and REJECTED are mutually exclusive for the key, and a committed
      REJECTED outcome makes any later canonical acceptance for that same key unreachable.
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - acceptance_transaction
    verification:
      verifiers:
        - kind: state_machine
          intent: Model concurrent and sequential ACCEPTED/REJECTED attempts, retries, crashes,
            timeouts, and cancellations for one key; after either terminal result linearizes, no
            transition may replace it or reach the opposite terminal result or a canonical
            acceptance inconsistent with it.
    kind: leaf
  L163_accepted_terminal_outcome_commits_with_canonical_acceptance:
    statement: For every eligible idempotency_key whose terminal_result becomes ACCEPTED, creation
      of that ACCEPTED terminal result and creation of the matching canonical accepted change occur
      in the same authoritative transaction boundary and therefore commit or roll back together; no
      reachable authoritative state contains one without the other.
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - acceptance_transaction
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the acceptance transaction and prove the canonical accepted-change append
            and same-key ACCEPTED terminal outcome share one commit/rollback boundary, including
            crash and abort points.
    kind: leaf
  L164_terminal_paths_share_per_key_arbitration:
    statement: Every path that can create a canonical acceptance or authoritative definitive
      rejection for an eligible idempotency_key passes through the same per-key terminal-outcome
      arbitration gate before becoming authoritative; there is no bypass path that can publish or
      commit a terminal decision outside that gate.
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - acceptance_transaction
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate all authoritative acceptance and definitive-rejection sinks and prove
            every path to them is dominated by the same per-key idempotency terminal-outcome
            arbitration gate with the full (document_id, client_change_id) identity.
    kind: leaf
  C40_terminal_outcome_is_single_valued_per_idempotency_key:
    statement: 'idempotency_terminal_outcome_coherence holds for every eligible idempotency_key: idempotency_terminal_outcomes
      contains at most one immutable terminal_result; ACCEPTED is committed atomically with the matching
      canonical accepted change and excludes REJECTED, while REJECTED excludes any current or future canonical
      acceptance for the same key. All acceptance and definitive-rejection paths arbitrate against this
      same per-key terminal state.'
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - acceptance_transaction
    formal_intent: idempotency_terminal_outcome_coherence
    semantic_contracts:
      - idempotency_terminal_outcome_coherence
    kind: derived
    depends_on:
      - L162_terminal_state_transition_preserves_single_outcome
      - L163_accepted_terminal_outcome_commits_with_canonical_acceptance
      - L164_terminal_paths_share_per_key_arbitration
      - C42_nonterminal_lifecycle_preserves_terminal_outcomes
      - C43_terminal_outcome_entry_state_is_coherent
  L165_pending_identity_revision_evidence_survives_retention:
    statement: If canonical acceptance(D,k) commits at revision r and (D,k) is a
      normal_retry_eligible_identity, every snapshotting, compaction, cleanup, or other durable
      retention transition preserves logical accepted_identity_frontier_evidence for that same (D,k)
      bound to r. Physical-row deletion is allowed only when the replacement representation
      preserves the exact query semantics that the identity is included through response head H iff
      r <= H; expiry may permit cleanup but does not require immediate deletion.
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - snapshot_checkpoint
      - idempotency_gate
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore every durable retention transition after acceptance(D,k)@r while
            pending/retry age is <=30 days; require the post-state to preserve the same logical
            (D,k)->r accepted_identity_frontier_evidence and its exact included-through-H iff r<=H
            query semantics.
        - kind: schema_constraint
          intent: Inspect retained/replacement metadata and cleanup guards so physical accepted-row
            removal cannot erase or alter the logical (D,k)->r evidence while the identity remains
            normal-retry eligible.
    kind: leaf
  L166_recovery_preserves_pending_identity_revision_evidence:
    statement: Given authoritative accepted_identity_frontier_evidence binding a
      normal_retry_eligible_identity (document_id=D, client_change_id=k) to canonical accepted
      revision r before recovery, every completed recovery/restart reconstruction preserves the same
      logical (D,k)->r evidence and therefore the same exact included-through-H iff r<=H query
      semantics. Recovery may change physical representation but cannot drop, relabel, or
      reinterpret that evidence.
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - reconnect_revision_boundary
      - owner_failover
      - final_architecture
    mechanisms:
      - recovery_replay
      - idempotency_gate
    verification:
      verifiers:
        - kind: fault_injection
          intent: Crash/restart after durable (D,k)->r accepted_identity_frontier_evidence exists;
            require completed recovery to expose the same logical evidence and identical
            included-through-H iff r<=H behavior for all tested H.
        - kind: control_flow
          intent: Trace every recovery/rebuild path that reconstructs accepted-identity evidence and
            prove the recovered mapping preserves the same document_id, client_change_id, accepted
            revision r, and query semantics.
    kind: leaf
  C41_pending_identity_revision_evidence_survives_lifecycle:
    statement: 'If canonical acceptance(D,k) commits at revision r and (D,k) remains a normal_retry_eligible_identity,
      accepted_identity_frontier_evidence for the same full identity remains authoritatively bound to
      r across durable retention and completed recovery/restart transitions. Physical representation may
      change, but the logical query remains exact: (D,k) is included through response head H iff r <=
      H. After the identity leaves the normal retry/reconnect boundary, this proposition does not require
      ordinary retry/reconnect classification evidence or immediate physical cleanup.'
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - snapshot_checkpoint
      - recovery_replay
      - idempotency_gate
    kind: derived
    depends_on:
      - L165_pending_identity_revision_evidence_survives_retention
      - L166_recovery_preserves_pending_identity_revision_evidence
  L168_owner_handoff_installs_fresh_generation:
    statement: For every authoritative ownership handoff of a document from one owner generation to
      a distinct new generation, a fresh document_owner_generation_id different from the superseded
      generation identity is committed before or atomically with the new generation becoming
      authoritative and acceptance-eligible. Cold takeover, warm-standby promotion,
      restart/reacquisition, and equivalent handoff paths cannot publish or enable the new
      generation while the authoritative generation identity still names the superseded tenure.
    source_refs:
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - owner_epoch_fencing
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate cold takeover, warm promotion, restart/reacquisition, and delayed
            coordinator interleavings; every transition to a new authoritative/acceptance-eligible
            generation must already expose a fresh authoritative document_owner_generation_id.
        - kind: control_flow
          intent: Inspect all ownership publication/eligibility paths and prove fresh generation-id
            installation dominates or atomically accompanies publication; no path may reuse the
            superseded tenure identity.
    kind: leaf
  C42_nonterminal_lifecycle_preserves_terminal_outcomes:
    statement: For every normal_retry_eligible_identity whose terminal_result has linearized, all
      authoritative non-terminal lifecycle transitions preserve the exact logical per-key terminal
      outcome. Persistence lifecycle operations, recovery/restart, and physical representation
      replacement/migration cannot erase, replace, relabel, or reinterpret the already-linearized
      ACCEPTED or REJECTED value.
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - recovery_replay
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: state_machine
          intent: Compose the independently verified persistence, recovery, and
            representation-preservation transition families and require exact terminal-result
            preservation for every normal-retry eligible key.
    kind: derived
    depends_on:
      - L169_persistence_lifecycle_preserves_terminal_outcomes
      - L170_recovery_preserves_terminal_outcomes
      - L171_terminal_outcome_representation_migration_preserves_mapping
  L169_persistence_lifecycle_preserves_terminal_outcomes:
    statement: For every normal_retry_eligible_identity with an already-linearized terminal_result,
      every authoritative deletion, expiry, retention-GC, or cleanup path that would remove that key
      from idempotency_terminal_outcomes is unreachable while the identity remains normal-retry
      eligible. Such removal becomes permitted only after the identity leaves the normal
      retry/reconnect boundary; this leaf does not govern value-preserving representation rewrites,
      which are a separate proof obligation.
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every authoritative delete/expire/cleanup sink for
            idempotency_terminal_outcomes and prove each path is dominated by the condition that the
            full key is no longer a normal_retry_eligible_identity.
        - kind: schema_constraint
          intent: Inspect TTL/retention/GC policies for terminal outcomes and require that no policy
            can expire an entry while pending/retry age is <=30 days.
    kind: leaf
  L170_recovery_preserves_terminal_outcomes:
    statement: For every normal_retry_eligible_identity with an authoritative terminal_result before
      crash/restart or owner recovery, that terminal_result remains in
      durable_terminal_outcome_store independently of volatile owner state, and every completed
      recovery/restart resumes idempotency arbitration against exactly that same authoritative
      per-key ACCEPTED or REJECTED value. Recovery cannot omit a prior rejection, synthesize a
      different result, or rely on reconstructing terminal outcomes solely from snapshot plus
      accepted history.
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - durable_terminal_outcome_store
    verification:
      verifiers:
        - kind: fault_injection
          intent: Commit distinguishable ACCEPTED and REJECTED terminal outcomes, crash/restart or
            replace the owner, and require the recovered service to observe the exact same durable
            per-key outcomes before retry/acceptance arbitration resumes, including REJECTED keys
            with no accepted row.
        - kind: control_flow
          intent: Trace every restart/takeover path into idempotency arbitration and prove it reads
            the durable authoritative terminal-outcome store rather than rebuilding terminal results
            from volatile owner memory or accepted-history replay.
    kind: leaf
  L171_terminal_outcome_representation_migration_preserves_mapping:
    statement: Any non-terminal representation replacement, schema/index migration, or equivalent
      transformation of authoritative idempotency_terminal_outcomes for
      normal_retry_eligible_identity values preserves a one-to-one logical mapping from each full
      idempotency_key to exactly the same terminal_result; no key may be dropped, duplicated,
      cross-bound, or have ACCEPTED/REJECTED meaning changed by representation.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
    verification:
      verifiers:
        - kind: differential_test
          intent: Compare logical key->terminal-result mappings before and after every
            representation migration/replacement and require exact equality for all normal-retry
            eligible keys.
        - kind: schema_constraint
          intent: Inspect migration/index key structure so full (document_id, client_change_id)
            identity and terminal variant/value are preserved without aliasing or loss.
    kind: leaf
  L172_snapshot_compaction_preserves_concurrent_append_suffix:
    statement: For every authoritative snapshotting or compaction lifecycle procedure that overlaps
      one or more canonical accepted-change appends, let H be document_latest_revision after all
      canonical appends that committed before that lifecycle procedure completes. The completed
      authoritative representation preserves document_latest_revision = H and denotes exactly the
      same logical document state as deterministic canonical replay through H; no canonical accepted
      suffix committed during the overlap is deleted, omitted, rewritten, or double-applied by
      snapshot publication or compaction. Canonical appends that commit only after the lifecycle
      procedure completes are outside this transition's post-state.
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - storage_selection
      - final_architecture
    mechanisms:
      - accepted_history_log
      - snapshot_checkpoint
      - acceptance_transaction
      - revision_frontier_guard
    verification:
      verifiers:
        - kind: state_machine
          intent: Interleave snapshot publication/compaction steps with one or more canonical append
            commits; at lifecycle completion capture authoritative H and require frontier H plus
            exact logical equivalence to independent replay through H, preserving every concurrently
            committed suffix revision exactly once.
        - kind: fault_injection
          intent: Pause lifecycle work around checkpoint publication, pointer swap, and cleanup
            while accepted edits commit; completion must not regress the frontier or lose,
            duplicate, or rewrite any append committed before the lifecycle operation completes.
    kind: leaf
  L173_optimized_lifecycle_representation_resumes_only_through_recovery:
    statement: An authoritative snapshot publication or compaction transition never directly
      replaces the acceptance-relevant runtime state of an already-serving owner and never makes an
      optimized snapshot or compacted representation acceptance-eligible by itself. If an optimized
      authoritative representation is later used to initialize or resume an owner at frontier H, all
      transform and acceptance entrypoints remain closed until that owner completes authoritative
      recovery/reconstruction through H and installs the recovered logical state, recovered head,
      and recovered OT metadata.
    source_refs:
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - snapshot_checkpoint
      - recovery_replay
      - server_authoritative_ot
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate snapshot publication, compaction, owner initialization, and owner-resume
            paths; prove no lifecycle path can install optimized durable state directly into
            acceptance-serving runtime state or expose transform/acceptance entrypoints before the
            completed recovery barrier.
        - kind: state_machine
          intent: Interleave snapshot/compaction completion with owner continuation, crash, restart,
            and takeover; any owner that starts from an optimized representation must remain
            non-accepting until completed recovery through its bound authoritative frontier.
    kind: leaf
  L174_recovery_inputs_and_state_are_document_bound:
    statement: 'recovery_document_scope_binding holds for every completed new-owner recovery: for recovery
      target document D, the authoritative owner/epoch context, captured recovery_head, selected checkpoint,
      every canonical tail entry consumed by replay, and the installed recovered_owner_runtime_state are
      all document-scoped to the same D. A checkpoint, history entry, head, or runtime state from D2 !=
      D cannot satisfy the recovery merely because its frontier, payload, logical state, or reconstructed
      metadata is extensionally equal.'
    source_refs:
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - document_lifecycle_lock
      - recovery_replay
      - snapshot_checkpoint
      - accepted_history_log
    formal_intent: recovery_document_scope_binding
    semantic_contracts:
      - recovery_document_scope_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace recovery target document identity through owner/epoch lookup, recovery-head
            capture, checkpoint selection, tail queries, metadata reconstruction, runtime
            installation, and service resumption; every authoritative source and sink must retain
            the same document scope.
        - kind: state_machine
          intent: Construct two documents with equal frontiers, checkpoint contents, canonical
            tails, and reconstructed metadata, then cross-substitute one document recovery input at
            a time; every cross-document substitution must be rejected or remain unable to
            complete/install recovery.
    kind: leaf
  L176_visible_speculative_overlay_is_backed_by_retained_state:
    statement: 'visible_speculative_retention_coherence holds at every user-visible client state: each
      exposed speculative representation has a matching retained representation for the same logical edit
      and full identity, and any transition that removes or terminally disposes retained speculative state
      removes or suppresses the matching exposed representation before or atomically with the resulting
      visible state.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_document_scoped_speculative_state
    semantic_contracts:
      - visible_speculative_retention_coherence
    formal_intent: visible_speculative_retention_coherence
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate speculative creation, restore, switch, suppression/reactivation, ACK
            bookkeeping, abandonment, expiry, conflict/manual resolution, authoritative
            reconciliation, canonical publication, and resync publication; every visible overlay
            after each transition must have the matching retained logical edit, and retained
            terminal removal must leave no orphan visible overlay.
    kind: leaf
  L177_catchup_canonical_sources_preserve_document_provenance:
    statement: "catchup_canonical_source_provenance holds for every catch-up targeting D: delta rows come
      from accepted_change_log(D); snapshot mode selects D's authoritative checkpoint and reads the tail
      from accepted_change_log(D); the constructed client_resync_candidate stays bound to D. An extensionally
      equal source object from D2 != D cannot satisfy the obligation."
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - snapshot_checkpoint
      - catchup_protocol
    semantic_contracts:
      - catchup_canonical_source_provenance
    formal_intent: catchup_canonical_source_provenance
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace document_id from the catch-up target through delta queries, checkpoint
            selection, tail queries, candidate construction, and publication; inject D2 objects with
            identical payloads and frontiers and require them to be rejected unless the semantic
            authoritative reference remains D.
    kind: leaf
  L178_non_append_lifecycle_preserves_authoritative_document_provenance:
    statement: 'authoritative_history_lifecycle_provenance holds for every non-append snapshotting, checkpoint-replacement,
      cleanup, or compaction lifecycle transition targeting D: its authoritative history/checkpoint inputs
      and authoritative_history_lifecycle_output remain bound to D even when a different document has
      extensionally equal canonical history.'
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - accepted_history_log
      - snapshot_checkpoint
      - document_lifecycle_lock
    semantic_contracts:
      - authoritative_history_lifecycle_provenance
    formal_intent: authoritative_history_lifecycle_provenance
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace the target document through snapshot/compaction source selection and
            authoritative replacement publication; substitute an extensionally identical D2
            history/checkpoint and require document-scoped authority to reject cross-document
            rebinding while allowing byte-level deduplication.
    kind: leaf
  L179_speculative_overlay_identity_provenance_is_preserved:
    statement: 'speculative_overlay_identity_provenance holds for every logical_client_edit created with
      full identity (document_id=D, client_change_id=k): every retained representation in client_speculative_overlays
      and every exposed representation in client_visible_speculative_overlays preserves exactly that same
      (D,k) across creation, retention, restoration, tab/view switching, suppression/reactivation, ACK/retry
      bookkeeping, canonical publication, resync publication, and every other client transition that preserves
      the same logical edit. A transition may suppress, retain, restore, expose, or terminally dispose
      the edit, but while it preserves that logical edit it may not regenerate, substitute, drop, or cross-bind
      either identity coordinate.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_document_scoped_speculative_state
    semantic_contracts:
      - speculative_overlay_identity_provenance
    formal_intent: speculative_overlay_identity_provenance
    verification:
      verifiers:
        - kind: state_machine
          intent: Tag each created logical edit with immutable creation identity (D,k), enumerate
            every client transition that retains or exposes that same logical edit, and reject any
            path that regenerates, substitutes, drops, or cross-binds either document_id or
            client_change_id in retained or visible state.
    kind: leaf
  L180_non_append_lifecycle_preserves_logical_state_at_frontier:
    statement: For every authoritative non-append snapshotting, checkpoint-replacement, cleanup, or
      compaction lifecycle transition that completes at frontier H without accepting a new edit, the
      post-transition authoritative representation denotes exactly the same logical document state
      as canonical replay of accepted revisions through H.
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - storage_selection
      - final_architecture
    mechanisms:
      - accepted_history_log
      - snapshot_checkpoint
      - document_lifecycle_lock
    verification:
      verifiers:
        - kind: differential_test
          intent: Across generated authoritative histories and each non-append snapshotting,
            checkpoint-replacement, cleanup, and compaction lifecycle path, compare the completed
            post-transition logical document projection with an independent canonical replay through
            the same frontier H and require exact equivalence.
    kind: leaf
  L181_non_append_lifecycle_preserves_authoritative_frontier:
    statement: For every authoritative non-append snapshotting, checkpoint-replacement, cleanup, or
      compaction lifecycle transition that accepts no new edit, if the authoritative pre-state
      frontier is document_latest_revision = H, then the completed post-state also has
      document_latest_revision = H.
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - storage_selection
      - final_architecture
    mechanisms:
      - revision_frontier_guard
      - snapshot_checkpoint
      - document_lifecycle_lock
    verification:
      verifiers:
        - kind: state_machine
          intent: Exercise every authoritative non-append snapshotting, checkpoint-replacement,
            cleanup, and compaction lifecycle transition from states with frontier H and require
            every completed no-edit post-state to preserve exactly the same document_latest_revision
            H.
    kind: leaf
  L182_logical_edit_request_payload_binding_is_preserved:
    statement: "logical_edit_request_payload_binding holds for every submitted_request eligible for server-side
      OT or an authoritative terminal decision: the request's document_id, client_change_id, raw_edit,
      and base_revision all derive from one logical_client_edit and its canonical authoring state, and
      request construction, serialization, dispatch, or retry cannot preserve (D,k,F) while substituting
      a semantically different logical operation into raw_edit."
    source_refs:
      - ot_input_output
      - final_architecture
    mechanisms:
      - server_authoritative_ot
    semantic_contracts:
      - logical_edit_request_payload_binding
    formal_intent: logical_edit_request_payload_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace one logical edit from creation and client_change_id assignment through
            request construction, serialization, dispatch, and retry. Prove that document_id,
            client_change_id, base_revision, and the semantic operation encoded by raw_edit remain
            bound to that same edit; reject any path that can retain identity/frontier while
            sourcing raw_edit from a different edit.
        - kind: integration_test
          intent: Create distinguishable logical edits X and Y that are both valid against the same
            D@F, force request construction/retry interleavings, and assert that no request carrying
            X's (D,k,F) can serialize Y's operation while still being accepted as a valid request
            for X.
    kind: leaf
  L183_definitive_rejection_preserves_request_provenance:
    statement: 'definitive_rejection_request_binding holds for every authoritative REJECTED terminal_result:
      the definitive_rejection_decision that becomes REJECTED for (document_id=D, client_change_id=k)
      was produced for the exact submitted_request carrying that same identity and rejection-relevant
      raw_edit/base_revision context, and the binding is preserved through routing, arbitration, and commit.'
    source_refs:
      - accepted_change_log
      - ot_input_output
      - final_architecture
    mechanisms:
      - server_authoritative_ot
      - idempotency_gate
    semantic_contracts:
      - definitive_rejection_request_binding
    formal_intent: definitive_rejection_request_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every definitive validation/OT/rebase rejection from the submitted request
            that produced it through asynchronous handoff, idempotency arbitration, and the REJECTED
            commit sink. Prove the sink cannot pair request A's terminal identity with request B's
            rejection decision or rejection-relevant payload/base context.
        - kind: integration_test
          intent: Run distinguishable concurrent requests A and B, make only B definitively reject,
            perturb routing/retry timing, and require that no terminal row for A can contain B's
            rejection reason or decision provenance while all retries continue to resolve from the
            authoritative terminal state.
    kind: leaf
  L184_terminal_outcome_entry_has_single_authoritative_value:
    statement: At every authoritative initialization, restoration, import, or publication boundary
      that makes a normal_retry_eligible_identity observable to the idempotency protocol,
      idempotency_terminal_outcomes contains no terminal_result for a fresh identity or exactly one
      previously authoritative terminal_result; no entry transition may expose duplicate or
      conflicting ACCEPTED/REJECTED values for the same full key.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - durable_terminal_outcome_store
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate every authoritative entry/publication boundary and require the per-key
            terminal mapping to be absent or single-valued for each full idempotency identity;
            reject duplicate/conflicting entry state.
    kind: leaf
  C43_terminal_outcome_entry_state_is_coherent:
    statement: At every authoritative initialization, restoration, import, or publication boundary
      that makes a normal_retry_eligible_identity observable, entry state contains at most one
      authoritative terminal_result, and any such ACCEPTED/REJECTED result is coherent with
      canonical accepted history for the same full identity.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - acceptance_transaction
      - durable_terminal_outcome_store
    kind: derived
    depends_on:
      - L184_terminal_outcome_entry_has_single_authoritative_value
      - C44_terminal_outcome_entry_matches_canonical_acceptance
  C44_terminal_outcome_entry_matches_canonical_acceptance:
    statement: At every authoritative initialization, restoration, import, or publication boundary
      that makes a normal_retry_eligible_identity observable to the idempotency protocol, if the
      single terminal_result is ACCEPTED then the matching canonical accepted change is co-present,
      and if the single terminal_result is REJECTED then no canonical acceptance for that same full
      identity is present.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - durable_terminal_outcome_store
    kind: derived
    depends_on:
      - L186_terminal_outcome_initialization_matches_canonical_acceptance
      - L187_terminal_outcome_restoration_matches_canonical_acceptance
      - L188_terminal_outcome_import_matches_canonical_acceptance
      - C45_terminal_outcome_publication_matches_canonical_acceptance
  L186_terminal_outcome_initialization_matches_canonical_acceptance:
    statement: At every authoritative initialization boundary for a normal_retry_eligible_identity,
      if the initialized terminal_result is ACCEPTED then the matching canonical accepted change is
      co-present, and if it is REJECTED then no canonical acceptance for that same full identity is
      present.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - durable_terminal_outcome_store
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate authoritative initialization transitions and cross-check each terminal
            result against canonical accepted history for the same full identity.
    kind: leaf
  L187_terminal_outcome_restoration_matches_canonical_acceptance:
    statement: At every authoritative restoration boundary for a normal_retry_eligible_identity,
      ACCEPTED is restored only with the matching canonical accepted change and REJECTED is restored
      only when no canonical acceptance for that same full identity is present.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - durable_terminal_outcome_store
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate restoration/load transitions and require restored terminal outcome and
            accepted history to agree for the exact full identity.
    kind: leaf
  L188_terminal_outcome_import_matches_canonical_acceptance:
    statement: At every authoritative import boundary for a normal_retry_eligible_identity, ACCEPTED
      import state includes the matching canonical accepted change and REJECTED import state
      contains no canonical acceptance for that same full identity.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - durable_terminal_outcome_store
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate import/migration ingestion transitions and reject any imported ACCEPTED
            without matching acceptance or REJECTED alongside one.
    kind: leaf
  C45_terminal_outcome_publication_matches_canonical_acceptance:
    statement: At every authoritative publication boundary that makes a
      normal_retry_eligible_identity observable, an ACCEPTED terminal_result is published only with
      the matching canonical accepted change and a REJECTED terminal_result is published only when
      no canonical acceptance for the same full identity is present.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - durable_terminal_outcome_store
    kind: derived
    depends_on:
      - L190_authoritative_terminal_publication_surfaces_are_exhaustive
      - L192_terminal_publication_preserves_store_identity_provenance
      - L195_rejected_terminal_publication_excludes_canonical_acceptance
      - L163_accepted_terminal_outcome_commits_with_canonical_acceptance
  L190_authoritative_terminal_publication_surfaces_are_exhaustive:
    statement: Every authoritative path that can expose an ACCEPTED or REJECTED terminal result for
      a normal_retry_eligible_identity to a protocol consumer flows through
      terminal_outcome_publication_gate; ordinary request, retry, reconnect, restoration-facing, and
      any other terminal-result handler cannot read durable_terminal_outcome_store and publish a
      terminal outcome through a bypass path.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - durable_terminal_outcome_store
      - terminal_outcome_publication_gate
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every protocol-visible terminal-result sink and prove each is dominated
            by or converges on terminal_outcome_publication_gate after reading the exact full
            identity from durable_terminal_outcome_store; reject any direct store-to-output or
            attempt-local bypass.
    kind: leaf
  L192_terminal_publication_preserves_store_identity_provenance:
    statement: Every ACCEPTED or REJECTED terminal result exposed through
      terminal_outcome_publication_gate exactly reproduces the authoritative terminal_result read
      from durable_terminal_outcome_store for the same full (document_id, client_change_id)
      identity; publication cannot substitute another key, another stored value, or an attempt-local
      result.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - durable_terminal_outcome_store
      - terminal_outcome_publication_gate
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace full identity and terminal-result value from durable store read through
            publication gate to every protocol-visible sink and reject any key/value substitution or
            attempt-local publication.
    kind: leaf
  L195_rejected_terminal_publication_excludes_canonical_acceptance:
    statement: At every terminal_outcome_publication_gate observation for a
      normal_retry_eligible_identity, if the authoritative terminal_result is REJECTED then
      canonical accepted history contains no canonical acceptance for that exact full (document_id,
      client_change_id) identity.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - idempotency_gate
      - durable_terminal_outcome_store
      - terminal_outcome_publication_gate
    verification:
      verifiers:
        - kind: state_machine
          intent: Race acceptance and definitive-rejection attempts for the same full identity in
            both orders and require that any state published as REJECTED has no matching canonical
            acceptance, including overlapping commits.
    kind: leaf
  C46_accepted_terminal_result_preserves_acceptance_provenance:
    statement: 'accepted_terminal_result_binding holds for every authoritative ACCEPTED terminal_result
      within the normal retry eligibility horizon: the canonical result stored for (document_id=D, client_change_id=k)
      is produced by the same acceptance execution that commits the matching canonical_accepted_change
      for that full identity, and every authoritative lifecycle transformation that preserves the same
      logical terminal outcome while possibly rewriting its durable representation preserves that producer
      binding. No result produced for another request, document, or acceptance execution may be substituted
      merely because it is extensionally equal; after the identity leaves the normal retry horizon, ordinary
      cleanup may remove the terminal outcome without preserving this provenance.'
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - durable_terminal_outcome_store
    semantic_contracts:
      - accepted_terminal_result_binding
    formal_intent: accepted_terminal_result_binding
    kind: derived
    depends_on:
      - L197_accepted_terminal_result_captures_same_acceptance_producer
      - C47_accepted_terminal_result_provenance_survives_lifecycle
      - L163_accepted_terminal_outcome_commits_with_canonical_acceptance
  L197_accepted_terminal_result_captures_same_acceptance_producer:
    statement: When an authoritative ACCEPTED terminal_result for (document_id=D,
      client_change_id=k) is created at acceptance linearization, the canonical result placed into
      that terminal outcome is sourced from the same acceptance execution that creates the matching
      canonical_accepted_change for the same full identity. Acceptance-transaction assembly cannot
      substitute a result from another request, document, or acceptance execution even when the
      substituted result is extensionally equal.
    source_refs:
      - accepted_change_log
      - final_architecture
    mechanisms:
      - acceptance_transaction
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace the canonical result producer through acceptance-transaction assembly into
            both the matching canonical_accepted_change and ACCEPTED terminal-result payload for the
            same full identity; reject any path that can source the terminal payload from another
            acceptance execution or equal-valued result object.
    kind: leaf
  C47_accepted_terminal_result_provenance_survives_lifecycle:
    statement: Once an authoritative ACCEPTED terminal_result is bound to the matching canonical
      acceptance producer for (document_id=D, client_change_id=k), then while that identity remains
      within the normal retry eligibility horizon every durable persistence, recovery/restoration,
      compaction, retention, or representation-migration transition that preserves the same logical
      terminal outcome while possibly rewriting its durable representation preserves the same
      logical producer binding. Such a transition cannot reconstruct, relabel, or cross-bind the
      result from another request, document, or acceptance execution merely because the replacement
      value is extensionally equal. Cleanup after the identity leaves the normal retry horizon may
      remove the terminal outcome and is outside this proposition.
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - durable_terminal_outcome_store
    kind: derived
    depends_on:
      - L199_accepted_terminal_provenance_survives_persistence_and_restore
      - L200_accepted_terminal_provenance_survives_compaction_and_retention
      - L201_accepted_terminal_provenance_survives_representation_migration
  L199_accepted_terminal_provenance_survives_persistence_and_restore:
    statement: Once an authoritative ACCEPTED terminal_result is bound to the matching canonical
      acceptance producer for (document_id=D, client_change_id=k), then while that identity remains
      within the normal retry eligibility horizon, durable persistence and every completed
      recovery/restoration that preserves the terminal outcome preserve that same full identity and
      acceptance-producer binding. Persist/reload cannot reconstruct the terminal result from
      another request, document, or acceptance execution merely because the replacement value is
      extensionally equal. Cleanup after the retry horizon that removes the terminal outcome is
      outside this proposition.
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - durable_terminal_outcome_store
    verification:
      verifiers:
        - kind: fault_injection
          intent: Persist distinguishable producer provenance for an ACCEPTED outcome, crash/restart
            or restore authoritative state, and require the recovered terminal record to remain
            bound to the original acceptance execution and full identity rather than an equal-valued
            alternate source.
    kind: leaf
  L200_accepted_terminal_provenance_survives_compaction_and_retention:
    statement: Once an authoritative ACCEPTED terminal_result is bound to the matching canonical
      acceptance producer for (document_id=D, client_change_id=k), then while that identity remains
      within the normal retry eligibility horizon, every compaction, cleanup, or retention rewrite
      that preserves the terminal outcome also preserves that same acceptance-producer binding. Such
      rewrites cannot reconstruct or relabel the result from an extensionally equal different
      acceptance execution or document. Cleanup after the retry horizon that removes the terminal
      outcome is outside this proposition.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - durable_terminal_outcome_store
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate compaction, cleanup, and retention transitions for bound ACCEPTED
            terminal records and require each replacement representation to preserve the original
            full identity and acceptance-producer provenance, rejecting value-only reconstruction or
            cross-binding.
    kind: leaf
  L201_accepted_terminal_provenance_survives_representation_migration:
    statement: Once an authoritative ACCEPTED terminal_result is bound to the matching canonical
      acceptance producer for (document_id=D, client_change_id=k), then while that identity remains
      within the normal retry eligibility horizon, every authoritative representation migration that
      preserves the terminal outcome preserves a one-to-one mapping to that same full identity and
      acceptance producer. Migration cannot substitute an extensionally equal result from another
      request, document, or acceptance execution. Post-horizon cleanup that removes the terminal
      outcome is outside this proposition.
    source_refs:
      - accepted_change_log
      - storage_selection
      - final_architecture
    mechanisms:
      - durable_terminal_outcome_store
    verification:
      verifiers:
        - kind: differential_test
          intent: Migrate terminal records whose accepted payloads are intentionally extensionally
            equal but originate from distinguishable acceptance executions, and require the
            post-migration mapping to preserve each record's original full identity and producer
            provenance exactly.
    kind: leaf
  L202_speculative_overlay_operation_provenance_is_preserved:
    statement: "speculative_overlay_operation_provenance holds for every logical_client_edit: every retained
      representation in client_speculative_overlays and every exposed representation in client_visible_speculative_overlays
      continues to encode that same edit's logical_edit_operation across creation, retention, restoration,
      tab/view switching, suppression/reactivation, ACK/retry bookkeeping, canonical publication, resync
      publication, and every other client transition that preserves the same logical edit. Physical representation
      may change, but another logical edit's operation cannot be substituted or cross-bound under the
      preserved speculative identity merely because the resulting value is extensionally equal."
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_document_scoped_speculative_state
    semantic_contracts:
      - speculative_overlay_operation_provenance
    formal_intent: speculative_overlay_operation_provenance
    verification:
      verifiers:
        - kind: state_machine
          intent: Tag each created logical edit with immutable logical-operation provenance,
            enumerate every client transition that creates, retains, restores, rewrites,
            reactivates, or exposes a speculative representation of that edit, and reject any path
            that sources the retained or visible representation from another edit's operation while
            preserving the original logical edit/identity. Include adversarial fixtures with
            extensionally equal operations from distinct edits so value equality cannot substitute
            for producer provenance.
    kind: leaf
  L203_non_acceptance_terminal_disposition_preserves_edit_provenance:
    statement: "non_acceptance_terminal_disposition_binding holds for every explicit non-acceptance terminal
      disposition that removes or terminally retires a normal speculative lifecycle: if the disposition
      terminates logical_client_edit X with full identity (document_id=D, client_change_id=k), that disposition
      was produced for X and preserves the same full identity through routing/bookkeeping to every pending,
      retained-overlay, and visible-overlay retirement sink. A disposition produced for another logical
      edit cannot retire X merely by carrying or being rebound to X's identity."
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_document_scoped_speculative_state
    semantic_contracts:
      - non_acceptance_terminal_disposition_binding
    formal_intent: non_acceptance_terminal_disposition_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every expiry, abandonment, conflict/manual-resolution, and equivalent
            explicit non-acceptance path that can remove client_pending_edits or retained/visible
            speculative state. Trace the disposition producer and full (document_id,
            client_change_id) identity through routing and bookkeeping to the destructive sink, and
            reject any path where disposition(Y) can retire X.
        - kind: state_machine
          intent: Generate two unresolved edits X and Y in the same document and across distinct
            documents, apply a non-acceptance terminal disposition only to Y, perturb
            routing/bookkeeping order, and require that pending/retained/visible state for X cannot
            be removed or suppressed by Y's disposition.
    kind: leaf
  L204_state_dependent_rejection_uses_authoritative_context:
    statement: 'state_dependent_rejection_context_binding holds for every authoritative REJECTED terminal_result
      whose reason depends on document/history state: the producing definitive_rejection_decision is bound
      to an authoritative_rejection_context for the same document whose reason-specific evidence remains
      sufficient at terminalization to establish that rejection. A superseded owner cannot terminalize
      REBASE_REQUIRED or another state-dependent rejection from unvalidated stale OT/runtime state merely
      because it received the exact legitimate request and wins the independent per-key terminal arbitration.
      Request-intrinsic rejection reasons remain outside this context-authority requirement.'
    source_refs:
      - accepted_change_log
      - ot_input_output
      - owner_failover
      - final_architecture
    mechanisms:
      - server_authoritative_ot
      - idempotency_gate
      - durable_terminal_outcome_store
    semantic_contracts:
      - state_dependent_rejection_context_binding
    formal_intent: state_dependent_rejection_context_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every definitive rejection path that can reach authoritative REJECTED.
            Classify whether the reason is request-intrinsic or document/history-state-dependent.
            For each state-dependent path, trace the document-scoped rejection context/evidence from
            authoritative truth through decision production and terminal arbitration, and require
            either direct authoritative evaluation or a reason-specific guard/revalidation proving
            the same reason remains valid at terminalization.
        - kind: state_machine
          intent: Explore failover races where an old owner captured document state at N, ownership
            moves and the authoritative document advances to M, then the stale owner receives the
            exact valid request and computes a state-dependent rejection from N. The rejection may
            terminalize only if independent authoritative evidence still proves the reason at the
            terminal boundary; stale owner-local state alone must not permanently reject the edit.
    kind: leaf
  L205_visible_speculative_effect_is_unique_per_identity:
    statement: "visible_speculative_effect_uniqueness holds at every user-visible client state: for each
      full logical edit identity (document_id=D, client_change_id=k), the visible speculative composition
      contributes at most one effective instance of that edit's optimistic logical operation to the rendered
      document. Duplicate physical representations are permitted only when the projection/composition
      path deduplicates them by full logical identity before they can apply the operation more than once."
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_document_scoped_speculative_state
    semantic_contracts:
      - visible_speculative_effect_uniqueness
    formal_intent: visible_speculative_effect_uniqueness
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate creation, restore, reactivation, view-switch, ACK/retry bookkeeping, and
            resync/publication transitions that can introduce or expose speculative representations.
            Inject two physical representations with the same (D,k) and operation and require the
            user-visible composition to produce effective application multiplicity at most one in
            every reachable visible state.
        - kind: integration_test
          intent: Create one insertion edit, force duplicate retained/exposed representations
            through restore or reactivation races, and assert that the rendered document reflects
            exactly one optimistic insertion before canonical acceptance regardless of physical
            duplicate objects.
    kind: leaf
  L206_terminal_speculative_lifecycle_is_absorbing:
    statement: "terminal_speculative_lifecycle_closure holds in every reachable client protocol state:
      when authoritative reconciliation or an explicit terminal disposition ends logical edit (D,k)'s
      normal speculative lifecycle, the identity enters client_terminalized_speculative_lifecycles and
      no subsequent restore, tab/view switch, reactivation, ACK/retry bookkeeping, reconnect/resync publication,
      or other transition can reintroduce that same lifecycle into client_pending_edits, client_speculative_overlays,
      or client_visible_speculative_overlays. Archival/non-reactivatable representation may remain outside
      those normal speculative-state sets."
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_document_scoped_speculative_state
      - catchup_protocol
    semantic_contracts:
      - terminal_speculative_lifecycle_closure
    formal_intent: terminal_speculative_lifecycle_closure
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate both terminalization classes—authoritative acceptance/reconciliation and
            explicit non-acceptance disposition—then explore every later transition capable of
            creating/restoring pending, retained, or visible speculative state. Once (D,k) is
            terminal, reject any path that restores or exposes the same lifecycle under (D,k); only
            a newly created logical edit with a new client_change_id may re-enter normal speculative
            state.
        - kind: control_flow
          intent: Trace every restore/reactivation/publication producer of client_pending_edits,
            client_speculative_overlays, and client_visible_speculative_overlays and prove it cannot
            source a representation whose normal lifecycle was terminalized, including retained
            archival objects that survive physical cleanup.
    kind: leaf
  L207_visible_canonical_frontier_never_regresses_per_session_document:
    statement: 'visible_canonical_frontier_non_regression holds for the normal user-visible current-document
      protocol: within one client/session, once document D has been exposed at canonical frontier F, every
      later ordinary user-visible state in that same session that again represents D exposes last_applied_revision
      F2 >= F. Restoration, tab/view activation, cached-view replacement, live/buffered delivery, and
      other ordinary canonical tuple publication/replacement paths cannot publish an older same-document
      frontier merely because the older tuple is internally coherent. A new client/session or an explicitly
      modeled historical version/rollback mode is outside this per-session current-document non-regression
      boundary.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_revision_continuity
      - accepted_history_log
    semantic_contracts:
      - visible_canonical_frontier_non_regression
    formal_intent: visible_canonical_frontier_non_regression
    verification:
      verifiers:
        - kind: state_machine
          intent: Track a per-session, per-document visible-frontier high-water mark while exploring
            initialization, live/buffered delivery, restore, tab/view switching away and back,
            cached-state activation, duplicate/gap handling, and canonical publication. Whenever an
            ordinary visible state represents D, require its last_applied_revision to be at least
            the highest frontier previously exposed for D in that same session; do not compare
            different documents or a newly initialized session.
        - kind: control_flow
          intent: Enumerate every ordinary path that can publish or replace a user-visible canonical
            tuple and prove same-session restoration/view/cached-state paths cannot source a lower
            frontier for the same document than one already exposed, while explicit new-session and
            historical-version boundaries remain separate.
    kind: leaf
  L208_externally_rejected_edit_terminalizes_speculative_lifecycle:
    statement: "rejected_terminal_speculative_retirement holds for every normally participating client:
      when the client observes an externally_terminal_result = REJECTED carrying a definitive rejection
      reason for full identity (document_id=D, client_change_id=k), response handling terminates that
      exact logical edit's normal speculative lifecycle before or atomically with the resulting user-visible
      state. It produces or applies a same-identity non_acceptance_terminal_disposition, or an equivalent
      terminal lifecycle transition, so the same lifecycle is no longer active in client_pending_edits,
      client_speculative_overlays, or client_visible_speculative_overlays. From that terminalization onward,
      the same lifecycle remains terminal for (D,k): no later restore, tab/view switch, reactivation,
      ACK/retry bookkeeping, reconnect/resync publication, or other transition may reintroduce the same
      lifecycle into pending, retained speculative, or visible speculative state. Archival/non-reactivatable
      failed-edit state may remain, and no eventual terminal-result observation is required."
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - terminal_outcome_publication_gate
      - durable_terminal_outcome_store
      - client_document_scoped_speculative_state
    semantic_contracts:
      - rejected_terminal_speculative_retirement
    formal_intent: rejected_terminal_speculative_retirement
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every client consumer of an externally terminal REJECTED result. Trace
            the full (document_id, client_change_id) from terminal-result publication through
            response handling and require the same logical edit to enter a non-acceptance terminal
            lifecycle before any resulting user-visible state can retain it as active pending,
            retained speculative, or visible speculative state; a foreign-key rejection must not
            retire this edit.
        - kind: state_machine
          intent: Start with pending/retained/visible speculative edit X=(D,k), deliver a legitimate
            authoritative externally terminal REJECTED for exactly X, and require the next resulting
            visible protocol state to have terminalized X with no active pending/retained/visible
            speculative representation. Explore restore, view switching, retry bookkeeping, and
            wrong-identity rejections to ensure only exact-key terminal rejection triggers this
            retirement and the lifecycle cannot reactivate afterward.
    kind: leaf
catalog:
  terms:
    logical_client_edit:
      description: One user operation from the client's protocol perspective. Retransmissions of the
        same logical operation are retries of that edit, not new logical edits.
      scope_dimensions:
        - document
    raw_edit:
      description: The client-submitted edit before server-side transformation/rebase against
        accepted document history.
    client_change_id:
      description: A protocol identifier supplied by the client for a logical client edit. Stability
        across retries and uniqueness across distinct logical edits are explicit protocol
        assumptions, not part of this vocabulary definition.
    canonical_accepted_change:
      description: The server-authoritative representation of an edit after any required OT
        transformation and after the system has decided to accept it. Creating two accepted records
        for one logical client edit counts as duplicate acceptance even if their transformed
        payloads happen to be equal.
    accepted_history:
      description: The authoritative collection/sequence of canonical accepted changes for a
        document. Properties such as uniqueness, gap freedom, fencing, and durability are proved or
        assumed elsewhere; this definition alone does not grant them.
    revision:
      description: The server-assigned position/identifier used to order a canonical accepted change
        within one document's accepted history. Contiguity and uniqueness are correctness
        obligations, not part of this definition.
    acceptance:
      description: The system decision that creates a canonical accepted-change record in
        authoritative history. The exact atomicity conditions for that decision are separate claims.
    ack:
      description: A server response informing a client that its submitted edit was accepted. The
        relationship between ACK emission and durable commit is a separate correctness claim.
    retry:
      description: Resubmission caused by uncertainty such as timeout, lost ACK, reconnect, or
        process failure. A retry may race with the original request or another retry.
    authoritative_store:
      description: The persistence layer whose committed contents the model treats as authoritative
        system state. Durability across failures is not implied by this definition and is
        represented explicitly as an assumption where needed.
    owner_epoch:
      description: A fencing token associated with document ownership. The rule that stale epochs
        are rejected is a correctness claim rather than part of the term's definition.
      scope_dimensions:
        - document
    latest_revision:
      description: Authoritative per-document frontier equal to the highest canonical accepted
        revision.
    current_epoch:
      description: Shorthand for the authoritative current owner epoch of a document.
    accepted_change:
      description: A canonical accepted change record stored in authoritative history.
    document_id:
      description: Stable identifier of one collaborative document.
    last_applied_revision:
      description: Highest contiguous canonical revision already applied by a client.
    document_current_epoch:
      description: Authoritative persisted epoch identifying the current fenced document owner
        generation.
      scope_dimensions:
        - document
    snapshot_revision:
      description: Canonical revision frontier represented by a published snapshot checkpoint.
    new_epoch:
      description: Newly assigned owner epoch that is strictly greater than the superseded epoch.
    client_change_ids:
      description: Plural shorthand for multiple client_change_id values.
    edit_id:
      description: Abstract identifier of one logical edit in formal ordering notation.
    buffer_or_gap_recovery:
      description: Client action that buffers a future revision or triggers recovery when a
        canonical revision gap is observed.
    idempotency_key:
      description: Authoritative deduplication identity for a logical edit, concretely document_id
        plus client_change_id.
    acceptance_events:
      description: Abstract set of canonical acceptance decisions used in formal idempotency
        notation.
    snapshot_state:
      description: Document state represented by a snapshot checkpoint at its declared frontier.
    base_revision:
      description: Canonical client revision frontier that a submitted server-visible raw_edit
        declares as its authoring base; correctness of that declaration is a separate
        provenance-binding obligation.
    catchup_response_head:
      description: One authoritative revision frontier captured for a catch-up response and used to
        bound that response's canonical range, reconciliation, completion, and publication.
    recovery_head:
      description: Authoritative revision frontier captured by new-owner recovery after epoch
        handoff and used to bound checkpoint selection, replay, metadata reconstruction, and
        resumption.
      scope_dimensions:
        - document
    ot_success_result:
      description: Successful transformed payload returned by the OT engine for one raw_edit,
        declared base_revision, and canonical committed context.
    ot_computation_frontier:
      description: Canonical committed revision frontier N against which one OT success result was
        computed before acceptance arbitration.
    candidate_canonical_change:
      description: A server-produced canonical-form edit after OT transformation but before the
        authoritative acceptance transaction commits it. It is not yet accepted and must not appear
        in accepted history unless the acceptance transaction succeeds.
    owner_generation_id:
      description: Immutable identifier of one concrete server-side document-owner generation or
        ownership tenure; a restart or reacquisition receives a fresh generation identity.
    append_owner_generation_id:
      description: Immutable server-side owner-generation identity carried by one authoritative
        append attempt from the generation executing that attempt; it is not a client-controlled
        field.
      scope_dimensions:
        - document
    terminal_result:
      description: Authoritative terminal outcome for one idempotency_key within the normal retry
        horizon, either an accepted canonical result or a definitive rejected result.
      scope_dimensions:
        - document
    externally_terminal_result:
      description: Definitive result exposed to the client for one logical operation after the
        corresponding authoritative terminal_result has linearized.
    normal_retry_eligible_identity:
      description: A logical edit identity (document_id, client_change_id) whose pending/retry age
        is no more than 30 days and therefore remains inside the normal retry/reconnect protocol
        boundary defined by A6.
    submitted_request:
      description: One client-to-server protocol request instance carrying document_id,
        client_change_id, raw_edit, and base_revision for one logical client edit. Retries may
        create multiple request instances, but each instance remains semantically bound to the
        logical edit and document it represents.
      scope_dimensions:
        - document
    definitive_rejection_decision:
      description: A server-side definitive negative decision, such as invalid or rebase-required,
        computed for one submitted_request and eligible to become an authoritative REJECTED terminal
        result. Timeout, cancellation, transport loss, and crash-before-decision are not definitive
        rejection decisions.
      scope_dimensions:
        - document
    logical_edit_operation:
      description: The semantic user operation carried by one logical_client_edit before canonical
        acceptance. Retained or exposed optimistic representations may use different physical
        encodings or rendering objects, but while they still represent that logical edit they must
        preserve this same operation semantics rather than substitute another edit's operation.
      scope_dimensions:
        - document
    non_acceptance_terminal_disposition:
      description: One explicit client lifecycle decision that terminates a logical edit without
        claiming authoritative acceptance, including expiry, abandonment, conflict resolution,
        manual resolution, or an equivalent non-acceptance terminal path. The disposition carries
        the full logical-edit identity it is produced for.
      scope_dimensions:
        - document
    authoritative_rejection_context:
      description: Document-scoped authoritative context or reason-specific authoritative evidence
        used to establish a definitive rejection whose truth depends on canonical document/history
        state. It may be a canonical committed prefix/frontier, authoritative metadata, or a
        proof/guard derived from authoritative state; stale owner-local runtime state is not
        authoritative merely because it was once valid.
      scope_dimensions:
        - document
  state:
    accepted_change_log:
      class: authoritative
      description: Canonical ordered history of accepted changes for a document.
      scope_dimensions:
        - document
    document_latest_revision:
      class: authoritative
      description: Authoritative persisted canonical revision frontier for a document.
    document_current_epoch:
      class: authoritative
      description: Authoritative persisted fencing epoch for the current document owner.
      symbolic_dimensions:
        - document
        - observation
      scope_dimensions:
        - document
    snapshot_content_with_snapshot_revision:
      class: authoritative
      description: Atomically published checkpoint content paired with the exact canonical revision
        frontier it represents.
      scope_dimensions:
        - document
    ot_owner_memory:
      class: derived
      description: Complete volatile materialized set of document-history-dependent OT
        metadata/state on one owner that can influence server-side OT transformation or canonical
        acceptance, reconstructable from authoritative truth for that document. Outside recovered
        logical document state and local head/next-revision state, there is no separate
        recovery-installed history-dependent OT metadata carrier that may influence canonical
        semantics.
      scope_dimensions:
        - document
    websocket_live_stream:
      class: derived
      description: Best-effort live delivery stream of already accepted canonical changes.
      scope_dimensions:
        - document
    client_local_document:
      class: derived
      description: Client-side materialized document state reconstructed from canonical revisions.
    search_index:
      class: derived
      description: Derived search representation that is not authoritative collaboration state.
    cache:
      class: derived
      description: Non-authoritative cached data that may be discarded and rebuilt.
    client_speculative_overlays:
      class: speculative
      description: Locally retained optimistic representations of unresolved logical edits,
        partitioned by document identity; retained overlays need not all be exposed in the current
        user-visible document.
      scope_dimensions:
        - document
    client_pending_edits:
      class: speculative
      description: Unresolved logical client edits retained by client_change_id while their
        canonical acceptance outcome or conflict disposition is not yet known.
    client_editing_mode:
      class: control
      description: Client protocol mode controlling whether normal user edits may create
        acceptance-eligible speculative requests, including resyncing, conflict/reconciliation,
        read-only, and normal-editable states.
    client_resync_candidate:
      class: control
      description: Non-user-visible candidate canonical/pending/overlay state built during reconnect
        reconciliation before atomic publication or discard.
      scope_dimensions:
        - document
    accepted_idempotency_evidence:
      class: authoritative
      description: Logical durable evidence that an idempotency key has a committed canonical
        acceptance, represented by the accepted row/unique identity itself or lifecycle-derived
        equivalent evidence.
    client_document_id:
      class: control
      description: Document identity represented by the current user-visible client canonical state;
        it is bound with client_local_document and last_applied_revision as one visible canonical
        tuple.
    client_visible_speculative_overlays:
      class: speculative
      description: The subset of retained speculative overlays currently exposed in the user-visible
        client state; each exposed overlay retains its document identity.
      scope_dimensions:
        - document
    document_owner_id:
      class: authoritative
      description: Authoritative identity of the owner currently designated for the document. A
        transition to a distinct owner is an ownership handoff whose fencing relation to
        document_current_epoch is an explicit correctness obligation.
    document_owner_generation_id:
      class: authoritative
      description: Authoritative immutable generation identity of the currently designated
        acceptance-eligible owner for one document, installed together with the ownership epoch
        during handoff.
      scope_dimensions:
        - document
    idempotency_terminal_outcomes:
      class: authoritative
      description: Authoritative per-idempotency_key terminal outcome state. Within the normal retry
        horizon a key has at most one durable terminal result, ACCEPTED(canonical result) or
        REJECTED(definitive reason); uncertainty has no terminal entry.
    accepted_identity_frontier_evidence:
      class: authoritative
      description: 'Logical authoritative per-idempotency evidence binding an accepted identity (document_id,
        client_change_id) to its canonical accepted revision r. Physical representation may be compacted,
        but its query semantics are exact: for a response head H, the identity is included through H if
        and only if r <= H.'
    recovered_owner_runtime_state:
      class: derived
      description: Completed recovery materialization for one document, including recovered logical
        document state, recovered service frontier, and acceptance-relevant runtime state installed
        before service resumption.
      scope_dimensions:
        - document
    authoritative_history_lifecycle_output:
      class: authoritative
      description: The durable authoritative representation installed or published for a target
        document by a non-append snapshotting, checkpoint-replacement, cleanup, or compaction
        lifecycle procedure. Physical bytes/storage may be shared, but the semantic authoritative
        binding remains document-scoped.
      scope_dimensions:
        - document
    client_terminalized_speculative_lifecycles:
      class: control
      description: Logical control-state classification of full logical-edit identities whose normal
        speculative lifecycle has ended by authoritative reconciliation or an explicit terminal
        disposition. An implementation may realize this by deletion or non-reactivatable archival
        state rather than a separately materialized tombstone set.
      scope_dimensions:
        - document
  symbolic_dimensions:
    document:
      description: Document identity coordinate preserved explicitly by symbolic functions whose
        value varies per document.
    observation:
      description: Logical observation or protocol-state coordinate preserved explicitly when a
        state value may vary across observations.
  mechanisms:
    server_authoritative_ot:
      description: Server OT owner transforms client edits against canonical accepted history before
        acceptance.
      automation_reusable: true
    accepted_history_log:
      description: Canonical accepted-change log is the durable source of truth for edit history.
      automation_reusable: true
    acceptance_transaction:
      description: Accepted-change creation and authoritative metadata updates commit as one
        database transaction.
      automation_reusable: true
    revision_frontier_guard:
      description: Acceptance checks the authoritative latest revision and advances it exactly with
        the accepted append.
      automation_reusable: true
    idempotency_gate:
      description: "All authoritative ACCEPTED and definitive REJECTED outcomes for one (document_id,
        client_change_id) arbitrate through one per-key terminal-result boundary so only one terminal
        decision can linearize."
      automation_reusable: true
    owner_epoch_fencing:
      description: Every authoritative append is conditioned on both the current document epoch and
        generation-bound server-side owner identity; matching a copied/current numeric epoch alone
        does not confer append authority.
      automation_reusable: true
    snapshot_checkpoint:
      description: Snapshots are authoritative checkpoints whose content is bound atomically to a
        canonical revision frontier.
      automation_reusable: true
    recovery_replay:
      description: A new owner reconstructs state from one authoritative checkpoint plus the exact
        canonical tail through the captured head.
      automation_reusable: true
    catchup_protocol:
      description: Reconnect catch-up returns either the exact retained canonical suffix or a
        checkpoint replacement plus exact tail.
      automation_reusable: true
    client_revision_continuity:
      description: Clients apply only the next contiguous canonical revision, ignore duplicates, and
        recover gaps.
      automation_reusable: true
    commit_before_delivery:
      description: ACK and live broadcast occur only after canonical acceptance is durably
        committed.
      automation_reusable: true
    retry_resolution:
      description: 'Retries resolve through the authoritative per-key terminal_result: an existing ACCEPTED
        or REJECTED result is replayed exactly, while timeout, cancellation, or crash-before-decision
        remains non-terminal uncertainty.'
      automation_reusable: true
    document_lifecycle_lock:
      description: A session-scoped PostgreSQL advisory lock keyed by document_id serializes
        new-owner recovery, checkpoint publication, and checkpoint cleanup/compaction for one
        document. The lock spans the low-frequency lifecycle procedure, while normal accepted-edit
        transactions do not acquire it.
      automation_reusable: true
    client_document_scoped_speculative_state:
      description: Retained speculative overlays are partitioned by document identity, and the
        user-visible overlay set is projected only from the currently visible document's retained
        partition.
      automation_reusable: true
    durable_terminal_outcome_store:
      description: Authoritative per-(document_id, client_change_id) terminal outcomes are persisted
        in durable document-scoped storage independent of volatile OT-owner memory. Owner
        restart/takeover reuses this same authoritative state directly; definitive REJECTED outcomes
        are not reconstructed from accepted-change history and therefore cannot disappear merely
        because no accepted row exists.
      automation_reusable: true
    terminal_outcome_publication_gate:
      description: The complete protocol-visible authoritative read boundary for per-key terminal
        outcomes. Every ordinary request, retry, reconnect, or other handler that exposes an
        ACCEPTED or REJECTED terminal result must read the exact full identity from
        durable_terminal_outcome_store and flow through this publication abstraction; direct
        store-to-protocol-output bypasses are forbidden. Multiple concrete handlers may exist, but
        static control flow must converge on this one semantic gate.
      automation_reusable: true
  failure_events:
    request_delivery_uncertainty:
      class: allowed
      description: Request delivery may be delayed, duplicated by retry, or have an uncertain
        outcome.
    ack_loss_after_processing:
      class: allowed
      description: ACK delivery may be lost after server-side processing.
    overlapping_requests:
      class: allowed
      description: Multiple client requests or retries may overlap in time.
    owner_crash_restart:
      class: allowed
      description: An OT owner process may crash and later restart.
    ownership_move_with_delayed_old_owner:
      class: allowed
      description: Document ownership may move to another owner while an old owner is delayed.
    catchup_live_interleaving:
      class: allowed
      description: Catch-up and live delivery may interleave around reconnect.
    history_lifecycle_change:
      class: allowed
      description: Accepted history may undergo snapshotting, compaction, or lifecycle cleanup.
    byzantine_behavior:
      class: excluded
      description: Byzantine behavior by clients, servers, or storage is excluded.
    permanent_authoritative_quorum_loss:
      class: excluded
      description: Permanent loss of the authoritative storage quorum is excluded.
  verifier_kinds:
    schema_constraint:
      description: Static database/schema constraint inspection.
    state_machine:
      description: Bounded or model-based exploration of state transitions and concurrency
        interleavings.
    property_test:
      description: Generated-input property testing of an invariant.
    integration_test:
      description: Multi-component contract or end-to-end integration verification.
    fault_injection:
      description: Crash, abort, stale-owner, or transaction-boundary fault injection.
    control_flow:
      description: Static/symbolic/taint/control-flow proof that all relevant paths pass through a
        required gate.
    differential_test:
      description: Compare two independent reconstructions or implementations for semantic equality.
    runtime_invariant:
      description: Runtime trace or invariant observation over executed system behavior.
    mutation_test:
      description: Deliberately corrupt implementation semantics and require tests to detect the
        mutation.
    transaction_atomicity:
      description: Static transaction-boundary inspection that proves the named authoritative writes
        or success evidence share one database transaction and therefore commit or roll back
        all-or-nothing. It does not by itself prove uniqueness, guard correctness, or concurrency
        serialization.
  sources:
    ot_input_output:
      heading: OT 首先要有明确的输入输出
    accepted_change_log:
      heading: 从 OT 输出自然推导出 accepted-change-set log
    authoritative_truth:
      heading: 谁是 truth，谁只是 materialized state
    snapshot_frontier:
      heading: Snapshot 必须绑定 frontier
    reconnect_revision_boundary:
      heading: 客户端重连：last revision 是协议边界
    owner_failover:
      heading: 服务端崩溃：OT owner 可丢，accepted history 不可丢
    raft_analogy:
      heading: 为什么这和 Raft 如此相似
    crdt_boundary:
      heading: CRDT 是另一种边界选择
    storage_selection:
      heading: 存储选型叙事：先从 DynamoDB 起步，再收敛到 PostgreSQL
    final_architecture:
      heading: 最终架构
  semantic_contracts:
    acked_edit_failover_survival:
      class: safety_contract
      definition: For an edit e accepted at canonical revision r, a success ACK means e was durably
        accepted before the ACK. For any later owner recovery that completes and resumes service
        from authoritative frontier H with H >= r, the recovered logical document state equals
        canonical replay through H; owner failover therefore cannot omit e relative to that replay,
        although later accepted edits may legitimately overwrite or reverse e's visible effect.
      excludes:
        - No guarantee that owner recovery is eventually scheduled, completes, or meets a particular
          recovery-time objective.
        - No guarantee that any client eventually reconnects or observes the acknowledged edit.
        - No guarantee that the individual accepted-change row for the edit remains physically
          retained or directly queryable after compaction.
      automation_reusable: true
    logical_state_equivalence_at_frontier:
      class: equivalence_relation
      definition: At a common authoritative frontier H, an optimized authoritative representation or
        completed recovery is equivalent to canonical replay when it denotes the same logical
        document state as deterministic replay of accepted revisions through H and preserves
        latest_revision = H. When the representation is used to resume owner service, it also
        reconstructs the acceptance-relevant state required to continue from H without changing
        canonical semantics.
      excludes:
        - Physical accepted-row retention, storage layout, checkpoint identity, and cache contents
          are not observations in this equivalence relation.
        - Audit-query equivalence for individual compacted revisions is not guaranteed.
        - Latency, CPU or I/O cost, timing, and internal scheduling are not observations in this
          equivalence relation.
      automation_reusable: true
    accepted_history_frontier_coherence:
      class: state_invariant
      definition: In every authoritative state, accepted_change_log and document_latest_revision
        denote one gap-free canonical accepted prefix ending exactly at document_latest_revision;
        representation-changing lifecycle transitions that accept no edit preserve the same logical
        prefix/frontier relation.
      state_symbols:
        - accepted_change_log
        - document_latest_revision
      observation_scope: authoritative_states
      excludes:
        - Does not require physical retention of every accepted row after semantics-preserving
          compaction.
        - Does not by itself prove storage durability or owner fencing.
      automation_reusable: true
    snapshot_frontier_coherence:
      class: state_invariant
      definition: Every authoritative published snapshot_content_with_snapshot_revision at
        snapshot_revision S denotes exactly canonical replay through S, and no authoritative
        published checkpoint exposes content paired with a different frontier.
      state_symbols:
        - snapshot_content_with_snapshot_revision
        - accepted_change_log
        - snapshot_revision
      observation_scope: authoritative_states
      excludes:
        - Private snapshot-build scratch state and non-authoritative caches are outside this
          invariant until publication.
        - No guarantee is made that the newest possible snapshot is eventually produced.
      automation_reusable: true
    client_canonical_frontier_coherence:
      class: state_invariant
      definition: At every user-visible client state representing document D, client_document_id
        equals D and client_local_document equals deterministic canonical replay of document D
        through last_applied_revision. The invariant is established at initialization or canonical
        publication and preserved by every user-visible transition capable of mutating, restoring,
        replacing, switching, or publishing any member of the (client_document_id,
        client_local_document, last_applied_revision) tuple, including transitions that leave the
        frontier unchanged.
      state_symbols:
        - client_document_id
        - client_local_document
        - last_applied_revision
      observation_scope: user_visible_states
      excludes:
        - Speculative overlays are not part of client_local_document and are governed by separate
          observer invariants.
        - Private client_resync_candidate state is outside the user-visible boundary until atomic
          publication.
      automation_reusable: true
    visible_canonical_speculative_exclusion:
      class: state_invariant
      definition: At every user-visible client state, if the visible canonical prefix represented by
        client_local_document through last_applied_revision contains canonical acceptance identified
        by (document_id, client_change_id), client_visible_speculative_overlays contains no matching
        speculative representation for that same logical edit. Every later user-visible transition
        preserves the exclusion while that acceptance remains visible.
      state_symbols:
        - client_local_document
        - last_applied_revision
        - client_visible_speculative_overlays
      observation_scope: user_visible_states
      excludes:
        - A distinct new logical edit with a distinct client_change_id may create a new speculative
          overlay.
        - An unresolved edit with no acceptance in the visible canonical prefix is not suppressed by
          this contract alone.
      automation_reusable: true
    unresolved_pending_blocks_normal_editing:
      class: state_invariant
      definition: In every reachable client protocol state, if client_pending_edits contains any
        unresolved logical edit that has not been safely reconciled or explicitly removed,
        client_editing_mode is not normal-editable and no normal editing transition may create or
        apply a new acceptance-eligible speculative edit for that document.
      state_symbols:
        - client_pending_edits
        - client_editing_mode
      observation_scope: all_reachable_states
      excludes:
        - Does not require automatic client-side OT/rebase of unresolved edits.
        - Does not require eventual conflict resolution, eventual editability, or any particular
          conflict-resolution UI.
      automation_reusable: true
    accepted_evidence_correspondence:
      class: state_invariant
      definition: During the 30-day normal retry/reconnect eligibility horizon for an idempotency
        identity, authoritative accepted_idempotency_evidence means already-accepted(D,k) if and
        only if accepted_change_log contains exactly one committed canonical acceptance for the same
        idempotency_key; lifecycle representation changes preserve this logical correspondence
        throughout that horizon.
      state_symbols:
        - accepted_change_log
        - accepted_idempotency_evidence
        - idempotency_key
      observation_scope: authoritative_states
      excludes:
        - Physical evidence representation may change after compaction if the same logical accepted
          fact remains authoritative throughout the eligibility horizon.
        - Timeout, cancellation, reservation, or in-progress arbitration need not create terminal
          failure evidence.
        - After pending/retry age exceeds 30 days, this contract does not require ordinary retry or
          authoritative reconnect classification for a re-submitted old identity.
        - The 30-day eligibility boundary is not an exact storage TTL; authoritative evidence may be
          retained longer.
      automation_reusable: true
    request_authoring_frontier_binding:
      class: provenance_binding
      definition: 'For every request eligible for server-side OT and canonical acceptance, one semantic
        authoring tuple binds the user-visible source state (client_document_id, client_local_document,
        last_applied_revision) to the submitted (document_id, raw_edit, base_revision): source client_document_id
        and submitted document_id are the same D, raw_edit is produced or encoded against that same document
        D canonical client base at frontier F, base_revision equals F, and request construction, serialization,
        dispatch, and retry preserve the same document/raw_edit/base binding. Whether the source visible
        tuple satisfies client_canonical_frontier_coherence is a separate state-invariant obligation.'
      source_symbols:
        - client_document_id
        - client_local_document
        - last_applied_revision
      bound_symbols:
        - document_id
        - raw_edit
        - base_revision
      excludes:
        - Does not itself prove client_canonical_frontier_coherence for the source authoring state.
        - Does not prove correctness of a client-side OT/rebase algorithm for unresolved speculative
          edits.
        - Does not require the client to remain editable when it cannot produce a raw_edit with a
          valid canonical authoring base.
      automation_reusable: true
    catchup_head_binding:
      class: provenance_binding
      definition: Every catch-up response eligible for completion or publication binds
        catchup_response_head to document_latest_revision read at one authoritative-store capture
        event, and that exact captured value is preserved through range or snapshot selection,
        pending reconciliation, completion, and publication.
      source_symbols:
        - document_latest_revision
      bound_symbols:
        - catchup_response_head
      excludes:
        - Later canonical acceptances may advance document_latest_revision after capture and are
          outside the already captured response.
      automation_reusable: true
    recovery_head_binding:
      class: provenance_binding
      definition: New-owner recovery binds recovery_head to document_latest_revision read from
        authoritative state after epoch handoff, and the same captured recovery_head governs
        checkpoint selection, exact tail replay, recovered metadata reconstruction, and acceptance
        resumption for that recovery attempt.
      source_symbols:
        - document_latest_revision
      bound_symbols:
        - recovery_head
      excludes:
        - Does not itself prove checkpoint validity, replay correctness, or recovered metadata
          correctness.
      automation_reusable: true
    acceptance_request_identity_binding:
      class: provenance_binding
      definition: When one submitted request carrying (document_id, client_change_id) produces a
        canonical acceptance, that exact identity is preserved as the identity of
        canonical_accepted_change and its authoritative idempotency_key; no admission, OT,
        arbitration, retry, or commit path may regenerate, substitute, drop, or cross-bind either
        identity component.
      source_symbols:
        - document_id
        - client_change_id
      bound_symbols:
        - canonical_accepted_change
        - idempotency_key
      excludes:
        - Does not establish uniqueness of client_change_id across distinct logical edits; that is a
          separate protocol assumption.
      automation_reusable: true
    accepted_evidence_provenance:
      class: provenance_binding
      definition: 'Authoritative accepted_idempotency_evidence for idempotency_key (D,k) may be created
        only from the matching committed canonical_accepted_change in accepted_change_log: on the hot
        path it is the committed row/identity itself or commits atomically with it, and lifecycle replacement
        evidence is derived only from that prior committed acceptance.'
      source_symbols:
        - canonical_accepted_change
        - accepted_change_log
      bound_symbols:
        - accepted_idempotency_evidence
        - idempotency_key
      excludes:
        - Reservation, in-progress arbitration, timeout, cancellation, or another never-committed
          attempt is not accepted evidence.
        - The physical accepted row need not be retained forever after semantics-preserving
          compaction.
      automation_reusable: true
    recovered_ot_state_provenance:
      class: provenance_binding
      definition: OT state installed by completed new-owner recovery for document D is derived
        exclusively from D's selected snapshot_content_with_snapshot_revision and the exact
        accepted_change_log tail for D through D's recovery_head; all source objects and the
        resulting ot_owner_memory preserve the same document scope. Failed-owner memory, caches,
        another document's extensionally equal checkpoint/history, or other non-authoritative
        runtime state cannot influence the recovered ot_owner_memory.
      source_symbols:
        - snapshot_content_with_snapshot_revision
        - accepted_change_log
        - recovery_head
      bound_symbols:
        - ot_owner_memory
      excludes:
        - Does not prove the OT transformation algorithm itself correct.
        - Does not require recovery to eventually complete.
      automation_reusable: true
      scope_bindings:
        - dimension: document
          source_symbols:
            - snapshot_content_with_snapshot_revision
            - accepted_change_log
            - recovery_head
          bound_symbols:
            - ot_owner_memory
    ot_success_acceptance_binding:
      class: provenance_binding
      definition: Every canonical_accepted_change payload is bound to the exact ot_success_result
        produced for its corresponding submitted raw_edit and base_revision; no acceptance path may
        synthesize, substitute, or commit a payload without that successful OT-result provenance,
        and reject/rebase-required outcomes cannot produce canonical acceptance.
      source_symbols:
        - raw_edit
        - base_revision
        - ot_success_result
      bound_symbols:
        - canonical_accepted_change
      excludes:
        - Does not prove the OT algorithmic convergence contract; that remains an explicit
          assumption.
        - Does not prove that base_revision was sourced from the correct client authoring frontier;
          request_authoring_frontier_binding is separate.
      automation_reusable: true
    ot_result_frontier_binding:
      class: provenance_binding
      definition: Each ot_success_result remains bound to the ot_computation_frontier N representing
        the canonical committed prefix against which it was computed; that result may become
        canonical_accepted_change only if the authoritative acceptance pre-state still has
        document_latest_revision = N and the accepted revision is N+1, otherwise a fresh transform
        is required.
      source_symbols:
        - accepted_change_log
        - document_latest_revision
      bound_symbols:
        - ot_computation_frontier
        - ot_success_result
        - canonical_accepted_change
      excludes:
        - Does not prove correctness of the transformed payload itself.
        - Does not allow a stale transformed payload to be rebound to a newer frontier merely by
          changing a revision field.
      automation_reusable: true
    live_delivery_acceptance_binding:
      class: provenance_binding
      definition: Every change exposed through websocket_live_stream for document D is derived from
        a committed record in accepted_change_log for that same document D; document scope,
        canonical payload, and revision provenance remain bound from accepted history to the
        consuming live stream. Delivery may duplicate or reorder across reconnect boundaries but
        cannot invent, expose a never-committed change, or substitute an equally-valued committed
        record from another document.
      source_symbols:
        - accepted_change_log
      bound_symbols:
        - websocket_live_stream
      excludes:
        - Does not guarantee exactly-once, ordered, timely, or eventually successful delivery.
      automation_reusable: true
      scope_bindings:
        - dimension: document
          source_symbols:
            - accepted_change_log
          bound_symbols:
            - websocket_live_stream
    visible_speculative_overlay_document_binding:
      class: state_invariant
      definition: At every user-visible client state representing document D, every speculative
        overlay in client_visible_speculative_overlays is identified by document_id=D.
        Initialization, restoration, tab/view switching, overlay activation or reactivation,
        canonical publication, resync publication, and every other in-scope transition capable of
        changing client_document_id or client_visible_speculative_overlays preserve this
        same-document binding.
      state_symbols:
        - client_document_id
        - client_visible_speculative_overlays
      observation_scope: user_visible_states
      excludes:
        - Locally retained speculative overlays for other documents may remain stored while they are
          not exposed in the current user-visible state.
        - This contract does not require automatic rebase, eventual reconciliation, or eventual
          visibility of a retained overlay.
      automation_reusable: true
    pending_edit_identity_provenance:
      class: provenance_binding
      definition: Every pending representation of a logical_client_edit created for document_id D
        with client_change_id k remains bound to that same creation identity (D,k) throughout the
        edit's normal speculative lifecycle. Creation, restore, tab/view switching, ACK/retry
        bookkeeping, reconnect capture, reconciliation, and any other transition that preserves the
        same logical edit may change bookkeeping state but may not relabel or rebind its pending
        identity to another document or client_change_id.
      source_symbols:
        - logical_client_edit
        - document_id
        - client_change_id
      bound_symbols:
        - client_pending_edits
      excludes:
        - Does not require client_change_id to be globally unique across documents; document
          identity remains a separate coordinate.
        - Does not require eventual reconciliation, automatic rebase, or eventual editability.
        - Explicit expiry, conflict/manual resolution, or abandonment may end the normal speculative
          lifecycle according to the protocol boundary.
      automation_reusable: true
    pending_speculative_lifecycle_coverage:
      class: state_invariant
      definition: In every reachable client protocol state, every unresolved acceptance-eligible
        logical edit that remains within the normal retry/reconnect eligibility horizon and remains
        represented in client_speculative_overlays has a matching entry in client_pending_edits
        until authoritative reconciliation or an explicit terminal disposition ends that logical
        edit's normal speculative lifecycle. Removing pending bookkeeping alone while retaining such
        an unresolved speculative edit does not resolve or retire the logical edit.
      state_symbols:
        - client_speculative_overlays
        - client_pending_edits
      observation_scope: all_reachable_states
      excludes:
        - Does not require automatic client-side OT/rebase, eventual reconciliation, or eventual
          editability.
        - After the normal eligibility horizon expires, explicit expiry, conflict/manual resolution,
          or abandonment may terminate the normal speculative lifecycle.
        - Does not require a stronger one-representation-per-unresolved-edit UI cardinality
          guarantee.
      automation_reusable: true
    pending_retirement_acceptance_binding:
      class: provenance_binding
      definition: A pending logical edit identified by (document_id=D, client_change_id=k) may be
        retired with authoritative accepted/reconciled semantics only from a
        canonical_accepted_change or equivalent accepted_idempotency_evidence for that exact same
        full identity (D,k). An acceptance for another document or another client_change_id cannot
        serve as the acceptance-retirement source for this pending edit merely because one identity
        coordinate matches.
      source_symbols:
        - canonical_accepted_change
        - accepted_idempotency_evidence
        - document_id
        - client_change_id
      bound_symbols:
        - client_pending_edits
      excludes:
        - Explicit expiry, conflict/manual resolution, or abandonment may terminate the normal
          speculative lifecycle without claiming an authoritative acceptance.
        - Does not require eventual reconciliation, automatic local rebase, or eventual editability.
      automation_reusable: true
    owner_generation_authorization_binding:
      class: provenance_binding
      definition: Every canonical append attempt for document D binds its supplied owner_epoch and
        append_owner_generation_id to the immutable server-side owner generation for that same
        document D actually executing that attempt, and that document-scoped generation tuple must
        match D's authoritative document_current_epoch and document_owner_generation_id at commit. A
        generation owned by another document, or a superseded generation of D, cannot gain append
        authority merely because epoch/generation scalar values collide or can be copied,
        substituted, refreshed, or rebound.
      source_symbols:
        - document_current_epoch
        - document_owner_generation_id
      bound_symbols:
        - owner_epoch
        - append_owner_generation_id
      excludes:
        - Does not require cryptographic authentication against a Byzantine process; the failure
          model treats owner-generation identity as trusted server-side execution context rather
          than client-controlled input.
        - Does not itself prove revision-frontier serialization or idempotency arbitration.
        - This contract authorizes canonical accepted-history append only. Per-key terminal-outcome
          arbitration is a separate authority boundary and does not implicitly require the terminal
          write itself to carry or match the current OT owner generation; an ACCEPTED terminal
          outcome still depends separately on its matching fenced canonical append.
      automation_reusable: true
      scope_bindings:
        - dimension: document
          source_symbols:
            - document_current_epoch
            - document_owner_generation_id
          bound_symbols:
            - owner_epoch
            - append_owner_generation_id
    idempotency_terminal_outcome_coherence:
      class: state_invariant
      definition: In every reachable authoritative state within the normal retry eligibility
        horizon, each idempotency_key has at most one durable terminal_result. ACCEPTED for (D,k)
        exists only with the matching canonical accepted change and excludes REJECTED for that key;
        REJECTED for (D,k) excludes any canonical acceptance for that key. Once either terminal
        result linearizes it is immutable for that logical identity, and every later acceptance or
        definitive rejection transition preserves that single-valued outcome.
      state_symbols:
        - idempotency_terminal_outcomes
        - accepted_change_log
      observation_scope: all_reachable_states
      excludes:
        - Timeout, cancellation, crash-before-terminal-commit, network loss, and other uncertain
          attempt outcomes do not create a terminal result.
        - Re-submission after the normal retry eligibility horizon is outside this contract.
      automation_reusable: true
    terminal_response_outcome_binding:
      class: provenance_binding
      definition: Every externally_terminal_result for idempotency_key (D,k) is derived from and
        exactly reproduces the authoritative terminal_result already linearized for that same full
        identity. Attempt-local validation, stale-base checks, OT rejection, or other transient
        computations cannot independently publish a conflicting terminal result.
      source_symbols:
        - idempotency_terminal_outcomes
        - idempotency_key
      bound_symbols:
        - externally_terminal_result
      excludes:
        - Pending, timeout, cancellation, transport failure, and crash-before-terminal-commit are
          non-terminal observations and need not bind to a terminal result.
        - Re-submission after the normal retry eligibility horizon is outside this contract.
      automation_reusable: true
    recovery_document_scope_binding:
      class: provenance_binding
      definition: For a new-owner recovery target document D, the authoritative ownership
        generation/current epoch context, captured recovery_head, selected
        snapshot_content_with_snapshot_revision, every replayed accepted_change_log entry, and the
        installed recovered_owner_runtime_state all belong to that same document D. Extensionally
        equal authoritative objects from another document cannot substitute for D at checkpoint
        selection, tail replay, metadata reconstruction, runtime installation, or service
        resumption.
      source_symbols:
        - document_current_epoch
        - document_owner_generation_id
        - recovery_head
        - snapshot_content_with_snapshot_revision
        - accepted_change_log
      bound_symbols:
        - recovered_owner_runtime_state
      scope_bindings:
        - dimension: document
          source_symbols:
            - document_current_epoch
            - document_owner_generation_id
            - recovery_head
            - snapshot_content_with_snapshot_revision
            - accepted_change_log
          bound_symbols:
            - recovered_owner_runtime_state
      excludes:
        - Does not require checkpoint/history bytes from different documents to be distinguishable
          when their logical values happen to be equal; correctness is the document provenance
          binding itself.
        - Does not require recovery to eventually complete.
      automation_reusable: true
    speculative_overlay_identity_provenance:
      class: provenance_binding
      definition: Every retained or exposed speculative representation of one logical_client_edit
        preserves that edit's complete creation identity (document_id=D, client_change_id=k) for the
        lifetime of the logical edit. Creation, retention, restoration, tab/view switching,
        suppression/reactivation, ACK/retry bookkeeping, canonical publication, resync publication,
        and every other transition that preserves the same logical edit may not regenerate,
        substitute, drop, or cross-bind either identity coordinate.
      source_symbols:
        - logical_client_edit
        - document_id
        - client_change_id
      bound_symbols:
        - client_speculative_overlays
        - client_visible_speculative_overlays
      scope_bindings:
        - dimension: document
          source_symbols:
            - logical_client_edit
          bound_symbols:
            - client_speculative_overlays
            - client_visible_speculative_overlays
      excludes:
        - Does not require every retained speculative representation to be currently visible.
        - Does not require automatic rebase, eventual reconciliation, or global uniqueness of
          client_change_id across documents.
      automation_reusable: true
    visible_speculative_retention_coherence:
      class: state_invariant
      definition: At every user-visible client state, every representation in
        client_visible_speculative_overlays corresponds to a retained representation in
        client_speculative_overlays for the same logical edit and the same full identity
        (document_id, client_change_id). Any transition that removes or terminally disposes the
        retained representation must remove or suppress the exposed representation before or
        atomically with the resulting user-visible state.
      state_symbols:
        - client_speculative_overlays
        - client_visible_speculative_overlays
      observation_scope: user_visible_states
      excludes:
        - A retained speculative edit need not be visible while another document or view is active.
        - Does not require automatic rebase, eventual reconciliation, or progress for unresolved
          edits.
      automation_reusable: true
    catchup_canonical_source_provenance:
      class: provenance_binding
      definition: For a catch-up targeting document D at its already-captured response head H, every
        canonical payload source remains document-scoped to D through candidate construction and
        publication. Delta mode reads accepted changes from accepted_change_log for D; snapshot mode
        selects D's authoritative snapshot_content_with_snapshot_revision and reads its canonical
        tail from accepted_change_log for D; the resulting client_resync_candidate remains bound to
        D. An extensionally equal authoritative object from another document cannot substitute for D
        solely because revision, payload, frontier, or replay result values collide.
      source_symbols:
        - accepted_change_log
        - snapshot_content_with_snapshot_revision
      bound_symbols:
        - client_resync_candidate
      scope_bindings:
        - dimension: document
          source_symbols:
            - accepted_change_log
            - snapshot_content_with_snapshot_revision
          bound_symbols:
            - client_resync_candidate
      excludes:
        - Does not forbid content-addressed or deduplicated immutable bytes when the semantic
          authoritative reference remains bound to D.
        - Canonical acceptances after the captured response head H are outside that catch-up
          response.
      automation_reusable: true
    authoritative_history_lifecycle_provenance:
      class: provenance_binding
      definition: For every non-append authoritative snapshotting, checkpoint-replacement, cleanup,
        or compaction lifecycle procedure targeting document D, the authoritative history/checkpoint
        inputs that semantically supply the transformation and the
        authoritative_history_lifecycle_output installed or published by that procedure remain bound
        to D. An extensionally equal authoritative history object from another document cannot be
        rebound as D's authoritative source merely because revision, payload, frontier, or replay
        result values collide.
      source_symbols:
        - accepted_change_log
        - snapshot_content_with_snapshot_revision
      bound_symbols:
        - authoritative_history_lifecycle_output
      scope_bindings:
        - dimension: document
          source_symbols:
            - accepted_change_log
            - snapshot_content_with_snapshot_revision
          bound_symbols:
            - authoritative_history_lifecycle_output
      excludes:
        - Does not forbid physical content-addressed storage, immutable-page sharing, or byte-level
          deduplication beneath the document-scoped authoritative reference.
        - Does not by itself establish logical replay equivalence, frontier preservation, recovery
          correctness, or lifecycle progress.
      automation_reusable: true
    logical_edit_request_payload_binding:
      class: provenance_binding
      definition: For every submitted_request eligible for server-side OT or an authoritative
        terminal decision, one logical_client_edit is the semantic source of the complete submitted
        tuple. If that logical edit was created with identity (document_id=D, client_change_id=k)
        against canonical authoring frontier F, the submitted_request carries exactly document_id=D
        and client_change_id=k, its raw_edit encodes that same logical operation against the
        captured D@F authoring state, and base_revision=F. Request construction, serialization,
        dispatch, and normal retry may change physical representation only in semantics-preserving
        ways; they may not substitute a different logical operation while retaining the original
        identity or frontier.
      source_symbols:
        - logical_client_edit
      bound_symbols:
        - submitted_request
        - document_id
        - client_change_id
        - raw_edit
        - base_revision
      scope_bindings:
        - dimension: document
          source_symbols:
            - logical_client_edit
          bound_symbols:
            - submitted_request
      excludes:
        - Does not require byte-identical serialization when two encodings represent the same
          logical operation.
        - Does not define a client-side rebase algorithm for an unresolved edit that cannot safely
          be encoded against the declared canonical base.
      automation_reusable: true
    definitive_rejection_request_binding:
      class: provenance_binding
      definition: Every authoritative REJECTED(definitive rejection reason) terminal_result for
        identity (document_id=D, client_change_id=k) derives from a definitive_rejection_decision
        produced for the exact submitted_request carrying that same request identity and
        rejection-relevant request tuple. Validation, OT/rebase evaluation, asynchronous routing,
        per-key arbitration, and terminal commit preserve that producer binding; a decision produced
        for another request or logical edit cannot be terminalized under (D,k). If the definitive
        reason depends on raw_edit or base_revision, those values are the values of that same bound
        submitted_request.
      source_symbols:
        - submitted_request
        - definitive_rejection_decision
        - document_id
        - client_change_id
        - raw_edit
        - base_revision
      bound_symbols:
        - terminal_result
      scope_bindings:
        - dimension: document
          source_symbols:
            - submitted_request
            - definitive_rejection_decision
          bound_symbols:
            - terminal_result
      excludes:
        - Pending, timeout, cancellation, transport loss, and crash-before-terminal-commit are
          non-terminal uncertainty and do not create REJECTED.
        - Does not by itself prove single-valued terminal arbitration or faithful replay of an
          already-linearized terminal result.
        - Does not require definitive REJECTED terminalization to be authorized by the current OT
          owner generation; terminal-outcome arbitration is an independent per-key authority
          boundary unless another explicit contract states otherwise.
      automation_reusable: true
    accepted_terminal_result_binding:
      class: provenance_binding
      definition: Within the normal retry eligibility horizon, every authoritative
        ACCEPTED(canonical result) terminal_result for identity (document_id=D, client_change_id=k)
        is bound to the matching canonical_accepted_change produced by the same acceptance execution
        for that same full identity. The canonical result stored in the terminal outcome derives
        from that acceptance producer, not merely from an extensionally equal result.
        Acceptance-transaction assembly establishes this producer binding, and every authoritative
        lifecycle transition that preserves the same logical terminal outcome while possibly
        rewriting its durable representation preserves the same binding; a result from another
        request, document, or acceptance execution cannot be substituted or cross-bound under (D,k).
      source_symbols:
        - accepted_change_log
        - canonical_accepted_change
        - idempotency_key
      bound_symbols:
        - terminal_result
      scope_bindings:
        - dimension: document
          source_symbols:
            - accepted_change_log
          bound_symbols:
            - terminal_result
      excludes:
        - Does not replace idempotency_terminal_outcome_coherence; single-valued arbitration and
          ACCEPTED/REJECTED mutual exclusion remain separate state properties.
        - Does not replace terminal_response_outcome_binding; protocol-visible responses must
          separately reproduce the already-bound authoritative terminal result.
        - Physical representation may change when provenance-preserving lifecycle transformations
          retain the same logical terminal outcome and acceptance producer binding.
        - After the identity leaves the normal retry eligibility horizon, this contract does not
          require the terminal outcome or its producer provenance to be retained.
      automation_reusable: true
    speculative_overlay_operation_provenance:
      class: provenance_binding
      definition: Every retained or exposed speculative representation of one logical_client_edit is
        semantically derived from that same edit's logical_edit_operation. Creation, retention,
        restoration, tab/view switching, suppression/reactivation, ACK/retry bookkeeping, canonical
        publication, resync publication, and every other transition that preserves the same logical
        edit may change physical representation only in semantics-preserving ways; they may not
        substitute or cross-bind the operation of another logical edit while retaining the original
        speculative identity, even when the substituted representation is extensionally equal at the
        current UI observation.
      source_symbols:
        - logical_client_edit
        - logical_edit_operation
      bound_symbols:
        - client_speculative_overlays
        - client_visible_speculative_overlays
      scope_bindings:
        - dimension: document
          source_symbols:
            - logical_client_edit
            - logical_edit_operation
          bound_symbols:
            - client_speculative_overlays
            - client_visible_speculative_overlays
      excludes:
        - Does not require byte-identical speculative representation when multiple encodings
          preserve the same logical operation semantics.
        - Does not define client-side OT, automatic rebase, eventual reconciliation, or renderer
          correctness for an already-canonical accepted change.
      automation_reusable: true
    non_acceptance_terminal_disposition_binding:
      class: provenance_binding
      definition: Every non_acceptance_terminal_disposition used to retire the normal speculative
        lifecycle of a logical_client_edit with full identity (document_id=D, client_change_id=k) is
        produced for that same logical edit and remains bound to the same full identity through
        routing, bookkeeping, and the destructive retirement sink. A disposition produced for
        another logical edit, document, or client_change_id cannot remove, suppress, expire,
        abandon, conflict-resolve, manually resolve, or otherwise terminally retire pending,
        retained, or visible speculative state belonging to (D,k), even if the foreign disposition
        can be relabeled or routed to the same client state container.
      source_symbols:
        - logical_client_edit
        - document_id
        - client_change_id
      bound_symbols:
        - non_acceptance_terminal_disposition
      scope_bindings:
        - dimension: document
          source_symbols:
            - logical_client_edit
          bound_symbols:
            - non_acceptance_terminal_disposition
      excludes:
        - Does not require a non-acceptance terminal disposition to eventually occur for every
          unresolved edit.
        - Does not judge whether the product/business reason for expiry, abandonment, conflict
          resolution, or manual resolution is correct.
        - Authoritative acceptance-based retirement is governed separately by
          pending_retirement_acceptance_binding.
      automation_reusable: true
    state_dependent_rejection_context_binding:
      class: provenance_binding
      definition: "Every authoritative REJECTED terminal_result whose definitive rejection reason depends
        on document or history state derives from a definitive_rejection_decision bound to an authoritative_rejection_context
        for the same document. That context/evidence must be sufficient at terminalization to establish
        the rejection reason: the decision may be computed directly from current authoritative state,
        or may use an earlier authoritative context only when a reason-specific guard, monotonicity argument,
        or revalidation proves the same rejection remains valid. A superseded owner's unvalidated stale
        OT/runtime state cannot by itself justify a state-dependent authoritative REJECTED merely because
        the request identity is correct or the decision wins per-key terminal arbitration."
      source_symbols:
        - authoritative_rejection_context
        - definitive_rejection_decision
      bound_symbols:
        - terminal_result
      scope_bindings:
        - dimension: document
          source_symbols:
            - authoritative_rejection_context
            - definitive_rejection_decision
          bound_symbols:
            - terminal_result
      excludes:
        - Request-intrinsic rejection reasons whose truth depends only on the bound request do not
          require document/history context authority.
        - Does not require every state-dependent rejection to read the latest head at terminal
          commit when reason-specific authoritative evidence proves the reason remains valid across
          later state evolution.
        - Does not require terminal-outcome mutation to be authorized by the current OT owner
          generation; it constrains the truth/provenance of the rejection decision, not the terminal
          store's arbitration mechanism.
        - Does not itself prove single-valued terminal arbitration or request provenance.
      automation_reusable: true
    visible_speculative_effect_uniqueness:
      class: state_invariant
      definition: At every user-visible client state, each full logical edit identity
        (document_id=D, client_change_id=k) contributes at most one effective speculative logical
        operation to the rendered document through client_visible_speculative_overlays. Multiple
        physical representations of the same logical edit may exist only if projection/composition
        deduplicates them so the edit's optimistic effect is applied at most once; correct identity
        and operation provenance on each object is not sufficient if the same logical operation is
        effectively applied twice.
      state_symbols:
        - client_visible_speculative_overlays
      observation_scope: user_visible_states
      excludes:
        - Does not require the physical visible-overlay container to contain at most one object per
          identity when the composition layer provably deduplicates by full logical identity.
        - Does not constrain canonical accepted-change rendering; canonical/speculative double
          rendering is governed separately by visible_canonical_speculative_exclusion.
        - Does not require eventual reconciliation or progress for unresolved edits.
      automation_reusable: true
    terminal_speculative_lifecycle_closure:
      class: state_invariant
      definition: In every reachable client protocol state, once a logical edit identity
        (document_id=D, client_change_id=k) enters client_terminalized_speculative_lifecycles
        because authoritative reconciliation or an explicit terminal disposition ended that normal
        speculative lifecycle, that same lifecycle remains terminal and cannot again appear in
        client_pending_edits, client_speculative_overlays, or client_visible_speculative_overlays.
        Restore, tab/view switching, reactivation, ACK/retry bookkeeping, reconnect/resync
        publication, and every other transition must preserve this absorbing classification. A later
        user operation is a new logical edit and therefore uses a new client_change_id.
      state_symbols:
        - client_terminalized_speculative_lifecycles
        - client_pending_edits
        - client_speculative_overlays
        - client_visible_speculative_overlays
      observation_scope: all_reachable_states
      excludes:
        - Does not require physical deletion of terminalized representations;
          archival/history/non-reactivatable state may retain them outside the normal
          speculative-state sets.
        - Does not require a separately persisted tombstone set when implementation structure makes
          reactivation impossible by construction.
        - Does not require every unresolved logical edit to eventually reach a terminal lifecycle
          state.
      automation_reusable: true
    visible_canonical_frontier_non_regression:
      class: safety_contract
      definition: Within one normal client/session, for each document D, the user-visible canonical
        frontier for D never decreases across ordinary current-document observations. If an earlier
        user-visible state for D exposed last_applied_revision F and a later ordinary user-visible
        state in the same session again represents D at frontier F2, then F2 >= F. Restoration,
        tab/view activation, cached-state replacement, live delivery, canonical publication, and
        other ordinary visible-state transitions cannot reset that per-document high-water mark
        merely by publishing an older but internally coherent canonical tuple.
      excludes:
        - Does not require the client to equal or eventually reach the current authoritative latest
          revision.
        - Does not compare numeric revision values across different document identities.
        - A genuinely new client/session initialization may establish its own initial frontier.
        - An explicitly modeled historical-version or rollback mode may define a separate observer
          boundary; the current normal editing protocol contains no such mode.
      automation_reusable: true
    rejected_terminal_speculative_retirement:
      class: safety_contract
      definition: When a normally participating client observes an externally_terminal_result =
        REJECTED carrying a definitive rejection reason for full identity (document_id=D,
        client_change_id=k) through the authoritative terminal-result publication boundary, that
        same logical edit must leave the normal speculative lifecycle before or atomically with the
        resulting user-visible state. The client produces or applies a same-identity
        non_acceptance_terminal_disposition, or an equivalent terminal lifecycle transition, so
        (D,k) no longer remains active in client_pending_edits, client_speculative_overlays, or
        client_visible_speculative_overlays; terminal_speculative_lifecycle_closure then prevents
        reactivation.
      excludes:
        - Does not require a definitive rejection to eventually be delivered or observed by the
          client.
        - Does not prescribe conflict, error, or manual-resolution UI after terminalization;
          failed-edit information may remain in non-reactivatable archival/history state.
        - Does not prove that the authoritative REJECTED was correctly produced or published;
          request/context provenance and terminal-response binding are separate obligations.
      automation_reusable: true
  scope_dimensions:
    document:
      description: Collaborative document/resource namespace; document-scoped authority, history,
        recovery, and delivery objects from distinct documents are not interchangeable even when
        non-scope values are equal.
