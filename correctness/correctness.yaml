assumptions:
  A1_storage_commit_is_durable:
    statement: A successful authoritative-store commit remains recoverable across the server-process
      and owner failures covered by this model.
    status: external_assumption
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - owner_failover
      - storage_selection
  A2_ot_engine_is_correct:
    statement: Given a canonical committed document prefix through revision N and a raw_edit with
      any submitted client base revision B, the OT engine either returns a canonical transformed
      change satisfying its algorithmic convergence contract for that raw edit, B, and prefix N, or
      rejects the input as invalid or rebase-required; it never returns a successful result outside
      that contract.
    status: external_assumption
    note: The source article explicitly treats the transformation function as out of scope.
    source_refs:
      - ot_input_output
      - raft_analogy
  A3_client_change_id_identifies_logical_edit:
    statement: Within a document, each logical client edit is assigned one client_change_id. All
      retries of that edit reuse the same client_change_id, and distinct logical edits use distinct
      client_change_ids.
    status: protocol_assumption
    source_refs:
      - accepted_change_log
      - owner_failover
  A5_apply_accepted_change_is_deterministic:
    statement: Applying the same canonical accepted-change sequence to the same starting state
      yields the same document state.
    status: external_assumption
    source_refs:
      - authoritative_truth
      - raft_analogy
  A6_normal_retry_reconnect_identity_is_eligible_for_30_days:
    statement: For a normally participating client, a logical edit identified by (document_id=D,
      client_change_id=k) is submitted through normal retry or authoritative reconnect
      reconciliation only while its pending/retry age is no more than 30 days. Once that age exceeds
      30 days, the client does not submit the old identity through those normal protocol paths and
      instead discards the pending operation or enters an explicit expired, conflict, or
      manual-resolution path; a submission that violates this boundary is outside the normal
      retry/reconnect correctness guarantees.
    status: protocol_assumption
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
roots:
  - G0_acked_edit_survives_failover
  - G1_retry_is_logically_exactly_once
  - G2_canonical_history_is_linear_and_fenced
  - G3_snapshot_and_recovery_preserve_state
  - G4_reconnect_converges_without_gap_or_duplicate
  - G5_retry_resolves_idempotently
  - G6_accepted_change_preserves_ot_semantics
  - G7_reconnect_does_not_double_render_accepted_optimistic_edit
  - G8_user_visible_state_does_not_double_render_accepted_optimistic_edit
  - G9_accepted_idempotency_evidence_matches_committed_acceptance
  - G10_user_visible_client_state_matches_document
claims:
  G0_acked_edit_survives_failover:
    kind: root
    statement: >-
      Every edit acknowledged to the client satisfies the acked_edit_failover_survival semantic contract.
    depends_on:
      - L16_commit_precedes_ack
      - C9_recovery_reconstructs_committed_state
      - A1_storage_commit_is_durable
      - L8_snapshot_is_exact_committed_prefix
      - A5_apply_accepted_change_is_deterministic
    source_refs:
      - accepted_change_log
      - owner_failover
      - final_architecture
    semantic_contracts:
      - acked_edit_failover_survival
  G1_retry_is_logically_exactly_once:
    kind: root
    statement: >-
      For a normally participating client, ACK loss, reconnect, or retry of one logical client edit while
      its (document_id, client_change_id) remains within the 30-day normal retry/reconnect eligibility
      horizon cannot cause that logical edit to create more than one accepted canonical change. Re-submission
      of an expired identity outside that protocol horizon is outside this guarantee.
    depends_on:
      - C13_idempotency_key_is_temporally_unique
      - L34_retries_of_logical_edit_reuse_identity
      - L108_acceptance_preserves_request_identity
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
  G2_canonical_history_is_linear_and_fenced:
    kind: root
    statement: >-
      For each document, accepted history is a single gap-free revision sequence, and a
      stale owner cannot append after ownership has moved to a higher epoch.
    depends_on:
      - C7_revision_frontier_is_linear
      - C8_stale_owner_is_fenced
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
  G3_snapshot_and_recovery_preserve_state:
    kind: root
    statement: >-
      Snapshotting, compaction, and completed owner recovery satisfy the logical_state_equivalence_at_frontier
      semantic contract relative to canonical accepted history.
    depends_on:
      - C9_recovery_reconstructs_committed_state
      - A5_apply_accepted_change_is_deterministic
      - C16_non_append_lifecycle_preserves_logical_revision_prefix
      - L8_snapshot_is_exact_committed_prefix
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    semantic_contracts:
      - logical_state_equivalence_at_frontier
  G4_reconnect_converges_without_gap_or_duplicate:
    kind: root
    statement: >-
      For a normal foreground, visible-document-bound reconnect/catch-up attempt for document D starting
      from last_applied_revision L, every such catch-up attempt eligible for completion or publication
      establishes catchup_head_binding for one response-specific head H captured from that document's
      authoritative document_latest_revision at one authoritative-store read/linearization point, and
      preserves that same H through response selection, reconciliation, completion, and publication. If
      the attempt completes and publishes its reconciled result, the user-visible canonical state equals
      canonical replay of document D through H without omitting or double-applying any accepted revision
      through H. Reconnect/resync publication is atomic and monotonic across overlapping or retried attempts:
      no intermediate candidate prefix is user-visible, and a response whose H is below the already visible
      canonical frontier cannot regress or otherwise mutate that visible canonical/frontier state. Acceptances
      after H capture are outside that response; this claim does not require catching a continuously advancing
      live head.
    depends_on:
      - C10_catchup_represents_exact_missing_suffix
      - L19_client_applies_only_contiguous_revisions
      - C12_live_delivery_contains_only_accepted_changes
      - A5_apply_accepted_change_is_deterministic
      - L97_client_adopts_snapshot_before_tail
      - L101_client_completes_catchup_through_response_head
      - C7_revision_frontier_is_linear
      - L109_resync_publication_is_atomic_and_monotonic
      - C36_reconnect_starts_from_canonical_client_frontier
      - L119_completed_resync_candidate_stays_at_response_head_until_publication
      - L121_delta_resync_candidate_starts_from_canonical_client_base
      - L122_catchup_response_head_is_bound_to_authoritative_frontier
      - L126_pending_reconciliation_preserves_resync_canonical_candidate
    source_refs:
      - reconnect_revision_boundary
      - owner_failover
      - raft_analogy
      - final_architecture
    formal_intent: catchup_head_binding
    semantic_contracts:
      - catchup_head_binding
  L16_commit_precedes_ack:
    kind: leaf
    statement: >-
      The server emits a success ACK for an edit only after the corresponding canonical
      accepted change has committed to the authoritative store.
    formal_intent: "ack(edit_id) => committed(edit_id)"
    verification:
      verifiers:
        - kind: control_flow
          intent: Every success-ACK path is dominated by successful durable commit.
        - kind: integration_test
          intent: Crash after commit/before ACK; retry must recover the committed result.
    source_refs:
      - accepted_change_log
      - owner_failover
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - accepted_history_log
      - server_authoritative_ot
  G5_retry_resolves_idempotently:
    kind: root
    statement: >-
      For a normally participating client reprocessing the same logical client edit within the 30-day
      normal retry eligibility horizon, if processing produces a non-timeout acceptance-resolution outcome,
      it either returns the previously accepted canonical result or accepts the edit once; pending, timeout,
      or cancellation is permitted, and no eligible execution creates a second logical operation. Re-submission
      after expiry is outside this guarantee.
    depends_on:
      - A3_client_change_id_identifies_logical_edit
      - C13_idempotency_key_is_temporally_unique
      - L35_losing_retry_resolves_through_canonical_acceptance
      - L54_absent_key_winner_returns_its_canonical_acceptance
      - L55_successful_retry_resolution_paths_are_exhaustive
      - L108_acceptance_preserves_request_identity
      - L117_retry_existing_acceptance_matches_full_idempotency_key
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
  C7_revision_frontier_is_linear:
    kind: derived
    statement: >-
      Accepted revisions for a document form one monotonically increasing, gap-free
      sequence in which each committed append advances the frontier by exactly one.
    depends_on:
      - L3_revision_key_is_unique
      - L4_append_requires_previous_frontier
      - L6_frontier_advance_and_insert_commit_together
      - L22_initial_history_matches_frontier
      - L29_non_append_lifecycle_preserves_revision_domain
      - L31_committed_append_sets_frontier_to_revision
      - L33_committed_append_preserves_existing_revision_prefix
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: accepted_history_frontier_coherence
    semantic_contracts:
      - accepted_history_frontier_coherence
  C8_stale_owner_is_fenced:
    kind: derived
    statement: >-
      Once authoritative ownership has moved to a higher epoch, an accepted-change append carrying an
      older owner_epoch cannot commit to the authoritative accepted-change store.
    depends_on:
      - L5_append_requires_current_epoch
      - L28_authoritative_epoch_never_regresses_or_reuses
    source_refs:
      - owner_failover
      - storage_selection
      - final_architecture
  C9_recovery_reconstructs_committed_state:
    kind: derived
    statement: >-
      If a new-owner recovery attempt completes and resumes acceptance, then while holding the per-document
      lifecycle lock it first advances authoritative ownership to its new fenced epoch, captures authoritative
      head H, selects and installs one valid authoritative checkpoint with frontier S <= H, replays exactly
      the canonical tail S+1..H, rebuilds required OT metadata solely from authoritative truth, and initializes
      local head H with next candidate revision H+1. Only after those steps complete may the new owner
      accept edits. An attempt may crash or abort before completion without a progress obligation.
    depends_on:
      - L8_snapshot_is_exact_committed_prefix
      - L10_replay_covers_exact_tail_in_order_once
      - G2_canonical_history_is_linear_and_fenced
      - L39_recovered_owner_resumes_at_head_plus_one
      - C18_recovery_selects_and_loads_authoritative_checkpoint
      - L41_recovery_checkpoint_does_not_exceed_recovery_head
      - C25_recovery_derives_complete_ot_metadata_from_truth
      - L94_recovery_starts_after_epoch_handoff
      - L79_new_owner_accepts_only_after_reconstruction
      - L95_lifecycle_procedures_share_and_hold_document_lock
      - L92_captured_recovery_head_equals_authoritative_frontier
      - L96_recovery_orders_head_selection_replay_and_metadata
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - document_lifecycle_lock
      - owner_epoch_fencing
      - recovery_replay
      - server_authoritative_ot
      - snapshot_checkpoint
  C10_catchup_represents_exact_missing_suffix:
    kind: derived
    statement: >-
      Given last_applied_revision=L and the response head H already captured for this catch-up response,
      catch-up represents canonical state exactly through H. If the complete canonical revision range
      L+1..H is retained and readable, delta mode returns exactly those revisions. Otherwise snapshot
      mode returns an authoritative checkpoint at revision S with S <= H plus exactly the canonical tail
      S+1..H, so applying that checkpoint and tail yields canonical state through H. Canonical acceptances
      after H are outside this already captured response.
    depends_on:
      - L8_snapshot_is_exact_committed_prefix
      - L12_delta_catchup_reads_canonical_revision_range
      - C15_snapshot_catchup_returns_checkpoint_and_exact_tail
      - L32_catchup_selects_complete_mode_for_response_head
      - C17_snapshot_mode_selects_checkpoint_not_after_head
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
  L19_client_applies_only_contiguous_revisions:
    kind: leaf
    statement: >-
      A client applies revision r only when r == last_applied_revision + 1; it ignores
      duplicates at or below the frontier and buffers or recovers gaps above it.
    formal_intent: >-
      r == L+1 => apply; r <= L => ignore; r > L+1 => buffer_or_gap_recovery
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore duplicate, reordered, catch-up/live interleaving, and reconnect sequences.
        - kind: property_test
          intent: Client applied frontier is always a contiguous prefix of canonical history.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_revision_continuity
  C12_live_delivery_contains_only_accepted_changes:
    kind: derived
    statement: >-
      The live stream is derived from committed accepted history; delivery may duplicate
      or reorder across reconnect boundaries, but it never invents an unaccepted change.
    depends_on:
      - L116_live_delivery_is_bound_to_committed_acceptance
    verification:
      verifiers:
        - kind: integration_test
          intent: Every delivered revision must exist in the authoritative accepted log.
        - kind: runtime_invariant
          intent: Observed delivery IDs must resolve to committed accepted-change records.
    source_refs:
      - authoritative_truth
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - commit_before_delivery
    formal_intent: live_delivery_acceptance_binding
    semantic_contracts:
      - live_delivery_acceptance_binding
  C13_idempotency_key_is_temporally_unique:
    kind: derived
    statement: >-
      Across overlapping and sequential normal processing of the same (document_id, client_change_id)
      while that logical edit remains within the 30-day normal retry/reconnect eligibility horizon, including
      retries after owner recovery or accepted-history lifecycle changes, at most one acceptance event
      may create a canonical accepted change for that key.
    formal_intent: "Within the 30-day normal retry/reconnect eligibility horizon, count(acceptance_events
      where idempotency_key = k) <= 1"
    depends_on:
      - L14_accepted_idempotency_identity_survives_lifecycle
      - C14_all_acceptance_paths_honor_idempotency_identity
      - L27_concurrent_first_acceptance_is_atomically_arbitrated
      - A6_normal_retry_reconnect_identity_is_eligible_for_30_days
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - owner_failover
      - storage_selection
      - final_architecture
  L14_accepted_idempotency_identity_survives_lifecycle:
    kind: leaf
    statement: >-
      Once an acceptance event has occurred for an idempotency key, authoritative state preserves sufficient
      non-reusable evidence that the key has already been accepted in every later state while the logical
      edit remains within the 30-day normal retry/reconnect eligibility horizon, including across owner
      recovery, snapshotting, compaction, and accepted-history lifecycle cleanup. The protocol does not
      require this ordinary retry/reconnect classification evidence to remain available after the identity
      has expired from that horizon.
    verification:
      verifiers:
        - kind: state_machine
          intent: After accept(k), exercise recovery, snapshot, compaction, and cleanup transitions
            while the logical edit remains within the 30-day normal retry/reconnect eligibility
            horizon; authoritative state must continue to distinguish k as already accepted
            throughout that horizon.
        - kind: fault_injection
          intent: Crash and recover around idempotency-evidence publication and lifecycle
            transitions within the 30-day eligibility horizon; no completed eligible acceptance may
            become semantically reusable during that horizon.
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - accepted_history_log
      - recovery_replay
      - snapshot_checkpoint
  L3_revision_key_is_unique:
    kind: leaf
    statement: >-
      At most one accepted change exists for a given (document_id, revision).
    formal_intent: "count(accepted where document_id=d and revision=r) <= 1"
    verification:
      verifiers:
        - kind: schema_constraint
          intent: PRIMARY KEY or UNIQUE(document_id, revision) is enforced.
        - kind: property_test
          intent: Competing appends for the same revision cannot both commit.
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
    mechanisms:
      - accepted_history_log
  L4_append_requires_previous_frontier:
    kind: leaf
    statement: >-
      candidate_canonical_change@r may commit as a canonical accepted change only when the authoritative
      pre-state has latest_revision == r - 1.
    formal_intent: "commit(candidate_canonical_change@r) => pre.latest_revision == r-1"
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the acceptance transaction and require the canonical append plus
            conditional latest_revision == r - 1 frontier update to share one commit/rollback
            boundary; if the guard updates zero rows, the transaction aborts so no accepted row can
            commit.
        - kind: integration_test
          intent: Stale or skipped-frontier appends fail without partial commit.
        - kind: state_machine
          intent: Concurrent candidate appends preserve one-step frontier progression.
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
    mechanisms:
      - acceptance_transaction
      - revision_frontier_guard
      - server_authoritative_ot
  L5_append_requires_current_epoch:
    kind: leaf
    statement: >-
      candidate_canonical_change append may commit as a canonical accepted change only when supplied owner_epoch
      equals the authoritative document_current_epoch.
    formal_intent: "commit(candidate_canonical_change, epoch=e) => pre.current_epoch == e"
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the acceptance transaction and require the canonical append plus
            conditional owner_epoch == document_current_epoch guard to share one commit/rollback
            boundary; a failed epoch guard aborts the transaction so no stale-owner accepted row can
            commit.
        - kind: fault_injection
          intent: Old owner resumes after takeover and every append is rejected downstream.
        - kind: state_machine
          intent: No lower epoch can append after a higher epoch is installed.
    source_refs:
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - owner_epoch_fencing
      - server_authoritative_ot
  L6_frontier_advance_and_insert_commit_together:
    kind: leaf
    statement: >-
      Accepted-change insertion and authoritative frontier advancement are one atomic
      acceptance decision; either both commit or neither becomes visible.
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the acceptance transaction boundary and prove the accepted-change insert
            and authoritative frontier update are committed by the same database transaction, with
            rollback/crash leaving neither authoritative effect visible.
        - kind: fault_injection
          intent: Abort/crash at each transaction boundary; no torn acceptance state is observable.
    source_refs:
      - accepted_change_log
      - storage_selection
    mechanisms:
      - acceptance_transaction
      - accepted_history_log
      - server_authoritative_ot
  L8_snapshot_is_exact_committed_prefix:
    kind: leaf
    statement: >-
      snapshot(content, S) represents exactly the document state after applying all and
      only canonical accepted changes through revision S.
    formal_intent: "snapshot_frontier_coherence; snapshot_state(S) == replay(accepted[1..S])"
    verification:
      verifiers:
        - kind: differential_test
          intent: snapshot(S) equals full replay through S over generated histories.
        - kind: mutation_test
          intent: Off-by-one frontier/content mutations must be killed by snapshot tests.
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - accepted_history_log
      - snapshot_checkpoint
    semantic_contracts:
      - snapshot_frontier_coherence
  L9_snapshot_content_and_frontier_publish_atomically:
    kind: leaf
    statement: >-
      A published snapshot cannot expose content from one revision frontier while claiming
      another; content and snapshot_revision switch together as one checkpoint identity.
    verification:
      verifiers:
        - kind: fault_injection
          intent: Crash during snapshot build/publish never exposes a mismatched checkpoint.
    source_refs:
      - snapshot_frontier
    mechanisms:
      - snapshot_checkpoint
  L10_replay_covers_exact_tail_in_order_once:
    kind: leaf
    statement: >-
      Recovery from snapshot frontier S applies each canonical accepted change with
      revision > S through the authoritative head exactly once and in increasing revision order.
    formal_intent: "recover(S,H) == fold(apply, snapshot(S), accepted[S+1..H])"
    verification:
      verifiers:
        - kind: differential_test
          intent: snapshot+tail replay equals full canonical replay for generated histories.
        - kind: integration_test
          intent: Owner crash at arbitrary accepted frontier reconstructs identical state.
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - accepted_history_log
      - recovery_replay
  L12_delta_catchup_reads_canonical_revision_range:
    kind: leaf
    statement: >-
      For client frontier L and one authoritative response head H, when catch-up selects retained-delta
      mode it returns every and only canonical accepted change with revision in L+1..H exactly once and
      in increasing revision order, with no speculative data.
    verification:
      verifiers:
        - kind: integration_test
          intent: Capture L and one authoritative response head H, invoke retained-delta mode, and
            compare the response exactly with canonical accepted history L+1..H.
        - kind: property_test
          intent: Random reconnect frontiers and response heads return complete, exclusive, unique,
            ordered canonical ranges despite pagination.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - catchup_protocol
  C14_all_acceptance_paths_honor_idempotency_identity:
    kind: derived
    statement: >-
      Every transition capable of creating a canonical accepted change for an idempotency
      key is constrained by authoritative accepted-key identity: if that key is already
      recorded as accepted, the transition cannot produce another acceptance event for it.
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every acceptance-producing transition and prove each path consults the
            authoritative accepted-key identity before creating a new accepted change.
        - kind: state_machine
          intent: Explore normal submit, retry, delayed execution, failover, and resumed-owner
            paths; no transition can accept a key whose accepted identity is already authoritative.
    depends_on:
      - L20_acceptance_paths_are_authoritatively_mediated
      - L21_accepted_key_gate_rejects_new_acceptance
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - recovery_replay
      - server_authoritative_ot
  L20_acceptance_paths_are_authoritatively_mediated:
    statement: Every transition capable of creating a canonical accepted change routes its
      acceptance decision through the authoritative accepted-key identity gate; no normal
      submission, retry, delayed execution, owner-recovery, or resumed-owner path can bypass that
      gate.
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every acceptance-producing transition and prove that each reaches the
            authoritative accepted-key decision before its acceptance sink.
    kind: leaf
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - recovery_replay
      - server_authoritative_ot
  L21_accepted_key_gate_rejects_new_acceptance:
    statement: For a transition mediated by the authoritative accepted-key identity gate, if
      authoritative state records the key as already accepted at the acceptance decision, that
      transition cannot create another acceptance event for the key.
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore the gate's already-accepted and create branches under overlapping
            requests; an already-accepted decision can never yield a create outcome.
    kind: leaf
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - accepted_history_log
      - server_authoritative_ot
  L22_initial_history_matches_frontier:
    statement: At document-state initialization, authoritative state represents one gap-free
      accepted-revision prefix ending exactly at latest_revision, with no accepted revision above
      that frontier.
    verification:
      verifiers:
        - kind: integration_test
          intent: Exercise every document creation or bootstrap path and compare the initialized
            logical accepted-revision prefix with latest_revision.
    kind: leaf
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - accepted_history_log
      - revision_frontier_guard
  C15_snapshot_catchup_returns_checkpoint_and_exact_tail:
    statement: Whenever catch-up selects snapshot-replacement mode and checkpoint (content, S) at
      authoritative response head H, the response uses replacement semantics and returns that one
      checkpoint identity together with every and only canonical accepted change in S+1..H exactly
      once and in increasing revision order.
    kind: derived
    depends_on:
      - L25_snapshot_catchup_uses_selected_checkpoint_replacement
      - L26_snapshot_catchup_returns_exact_canonical_tail
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - catchup_protocol
      - snapshot_checkpoint
  L25_snapshot_catchup_uses_selected_checkpoint_replacement:
    statement: When catch-up selects checkpoint (content, S), the snapshot-mode response identifies
      exactly that checkpoint and specifies that its content replaces the client's prior document
      state rather than being appended or patched onto it.
    verification:
      verifiers:
        - kind: integration_test
          intent: Verify checkpoint identity serialization and replacement-mode dispatch
            independently of tail selection.
        - kind: state_machine
          intent: Starting from stale local states, applying the snapshot response replaces prior
            state with exactly the selected checkpoint.
    kind: leaf
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
      - snapshot_checkpoint
  L26_snapshot_catchup_returns_exact_canonical_tail:
    statement: For selected checkpoint frontier S and authoritative response head H, the
      snapshot-mode response returns every and only canonical accepted change with revision in
      S+1..H exactly once and in increasing revision order.
    verification:
      verifiers:
        - kind: property_test
          intent: Generate S and H across compaction and pagination boundaries and compare the
            response tail exactly with canonical accepted history S+1..H.
    kind: leaf
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - catchup_protocol
  L27_concurrent_first_acceptance_is_atomically_arbitrated:
    statement: For overlapping transitions mediated by the authoritative accepted-key gate for the
      same initially absent key, the absent-key decision and create outcome are atomically
      arbitrated so that at most one transition can produce an acceptance event; every other
      contender cannot create an acceptance event for that key.
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the concurrent acceptance transaction path and prove a losing contender
            cannot retain any partial accepted state after UNIQUE(document_id, client_change_id) or
            equivalent arbitration rejects its create attempt; transaction rollback removes all
            loser-side authoritative writes.
        - kind: schema_constraint
          intent: Inspect the authoritative accepted-change/idempotency schema and require
            UNIQUE(document_id, client_change_id) or an equivalent database constraint so two
            concurrent first-acceptance transactions for the same identity cannot both create
            canonical accepted rows.
        - kind: state_machine
          intent: Explore lookup, reservation, insert, commit, conflict, and retry interleavings
            from an absent key; at most one create outcome may occur.
        - kind: integration_test
          intent: Race submissions with one key and observe a single acceptance-event identity even
            for conflict and upsert implementations.
    kind: leaf
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - accepted_history_log
      - server_authoritative_ot
  L28_authoritative_epoch_never_regresses_or_reuses:
    statement: After an authoritative epoch value has been superseded by a strictly greater epoch,
      authoritative recovery, restart, delayed metadata publication, and other lifecycle transitions
      never decrease document_current_epoch or restore any superseded value.
    verification:
      verifiers:
        - kind: state_machine
          intent: Starting after a higher epoch is authoritative, explore crash recovery, restart,
            delayed publication, and coordinator transitions; the current epoch never decreases and
            no superseded value becomes authoritative.
    kind: leaf
    source_refs:
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - owner_epoch_fencing
      - recovery_replay
  C16_non_append_lifecycle_preserves_logical_revision_prefix:
    statement: Any authoritative snapshotting, compaction, cleanup, or recovery-publication
      transition that changes representation without accepting a new edit preserves the same logical
      gap-free accepted-revision prefix and latest_revision; any physically removed revisions in
      that prefix remain represented by an authoritative equivalent.
    kind: derived
    depends_on:
      - L29_non_append_lifecycle_preserves_revision_domain
      - L30_non_append_lifecycle_preserves_prefix_semantics
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - accepted_history_log
      - recovery_replay
      - snapshot_checkpoint
  L29_non_append_lifecycle_preserves_revision_domain:
    statement: A representation-changing authoritative lifecycle transition that accepts no new edit
      preserves exactly the same logical gap-free accepted-revision prefix ending at H and preserves
      latest_revision = H.
    verification:
      verifiers:
        - kind: state_machine
          intent: Generate gap-free histories and exercise snapshotting, compaction, cleanup, and
            recovery-publication transitions that accept no edit; compare the pre-state and
            post-state logical revision-domain projection and latest_revision exactly.
    kind: leaf
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - accepted_history_log
      - recovery_replay
      - revision_frontier_guard
      - snapshot_checkpoint
  L30_non_append_lifecycle_preserves_prefix_semantics:
    statement: If a non-append authoritative lifecycle transition physically removes or replaces
      accepted revision records, the post-state authoritative representation denotes the same
      accepted-prefix document state as the pre-state representation or canonical replay.
    verification:
      verifiers:
        - kind: differential_test
          intent: Across generated histories and representation-changing transitions, compare the
            post-transition authoritative projection with canonical replay and the valid
            pre-transition projection.
    kind: leaf
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - accepted_history_log
      - recovery_replay
      - snapshot_checkpoint
  L31_committed_append_sets_frontier_to_revision:
    statement: For every committed accepted-change append carrying revision r, the authoritative
      post-state has latest_revision = r.
    formal_intent: commit(candidate_canonical_change@r) => post.latest_revision == r
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the acceptance transaction postcondition and require every committed
            accepted-change row at revision r to commit together with the authoritative frontier
            assignment latest_revision = r; rollback leaves neither post-state visible.
        - kind: state_machine
          intent: Explore successful appends and assert that the committed authoritative frontier
            equals the appended revision exactly, including conflict, retry, and failover
            interleavings.
        - kind: integration_test
          intent: Inspect the accepted-change row and authoritative frontier after each committed
            append and require equality of their revision values.
    kind: leaf
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - revision_frontier_guard
      - server_authoritative_ot
  L32_catchup_selects_complete_mode_for_response_head:
    statement: For client frontier L and one authoritative response head H, catch-up selects
      retained-delta mode exactly when the complete canonical range L+1..H is retained and readable;
      otherwise it selects snapshot-replacement mode.
    verification:
      verifiers:
        - kind: state_machine
          intent: Vary L, H, retention and compaction boundaries; require delta mode exactly for a
            complete readable L+1..H range and snapshot-replacement mode for every incomplete range.
    kind: leaf
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - catchup_protocol
      - snapshot_checkpoint
  L33_committed_append_preserves_existing_revision_prefix:
    statement: For every committed accepted-change append carrying revision r, the authoritative
      post-state logical accepted-revision domain equals the pre-state logical accepted-revision
      domain union {r}; every pre-existing accepted revision remains authoritatively represented.
    verification:
      verifiers:
        - kind: property_test
          intent: Generate valid accepted prefixes and successful appends; compare pre/post logical
            revision-domain projections and require that the only added position is r and that no
            existing position is lost.
        - kind: fault_injection
          intent: Exercise acceptance paths combined with cleanup, compaction hooks, retries, and
            failover; every committed append preserves all prior authoritative revision
            representations.
    kind: leaf
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - accepted_history_log
      - server_authoritative_ot
  L34_retries_of_logical_edit_reuse_identity:
    statement: Within a document, every submission and retry of one logical client edit carries the
      same client_change_id.
    verification:
      verifiers:
        - kind: property_test
          intent: Generate ACK loss, reconnect, timeout, and process-retry traces for one logical
            edit and assert that every emitted attempt retains exactly the original
            client_change_id.
    kind: leaf
    source_refs:
      - accepted_change_log
      - owner_failover
    mechanisms:
      - idempotency_gate
      - retry_resolution
  L35_losing_retry_resolves_through_canonical_acceptance:
    statement: 'When a reprocessing attempt reaches absent-key arbitration and loses to an overlapping
      contender, it may remain pending or terminate by timeout or cancellation. If it produces an acceptance-resolution
      outcome, it either becomes the sole acceptance producer or returns exactly the canonical accepted
      result for that key; it never exposes arbitration conflict as a successful resolution or creates
      another acceptance.'
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore absent-key lookup, reservation, conflict, winner abort/commit, retry, and
            result-read interleavings; every completed losing attempt resolves through one of the
            two permitted outcomes.
        - kind: integration_test
          intent: Race identical submissions behind barriers and require every completed caller to
            observe the unique canonical acceptance result rather than an exposed arbitration
            conflict.
    kind: leaf
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - idempotency_gate
      - retry_resolution
      - server_authoritative_ot
  C17_snapshot_mode_selects_checkpoint_not_after_head:
    statement: When catch-up selects snapshot-replacement mode for an authoritative response head H,
      it selects an authoritative checkpoint (content, S) with S <= H.
    kind: derived
    depends_on:
      - L37_snapshot_mode_selects_authoritative_checkpoint
      - L38_selected_checkpoint_does_not_exceed_response_head
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - snapshot_checkpoint
  L37_snapshot_mode_selects_authoritative_checkpoint:
    statement: When catch-up selects snapshot-replacement mode, the selected (content, S) is exactly
      one atomically published authoritative checkpoint identity.
    verification:
      verifiers:
        - kind: integration_test
          intent: Track atomically published authoritative checkpoint identities and require
            snapshot selection to return a member of that exact set, rejecting stale-cache,
            torn-record, and non-authoritative sources.
    kind: leaf
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - snapshot_checkpoint
  L38_selected_checkpoint_does_not_exceed_response_head:
    statement: For an authoritative response head H, the checkpoint frontier S selected for
      snapshot-replacement mode satisfies S <= H.
    verification:
      verifiers:
        - kind: state_machine
          intent: Capture H, race later checkpoint publication and selection, and require every
            selected checkpoint frontier to remain at most the captured H.
    kind: leaf
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - snapshot_checkpoint
  L39_recovered_owner_resumes_at_head_plus_one:
    statement: After recovery reconstructs authoritative state through H = latest_revision, before
      resuming acceptance the new owner initializes its recovered local head to H and its next
      candidate revision exactly to H + 1.
    verification:
      verifiers:
        - kind: integration_test
          intent: Recover generated snapshots and tails through H, then inspect the new owner's
            local head and first candidate revision before any append; require H and H+1 exactly
            across crash and failover paths.
    kind: leaf
    source_refs:
      - authoritative_truth
      - owner_failover
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - recovery_replay
      - revision_frontier_guard
      - server_authoritative_ot
  L41_recovery_checkpoint_does_not_exceed_recovery_head:
    statement: For authoritative recovery head H, the checkpoint frontier S selected and loaded by
      new-owner recovery satisfies S <= H.
    verification:
      verifiers:
        - kind: state_machine
          intent: Capture recovery head H, race later checkpoint publication and lookup, and require
            every loaded recovery checkpoint frontier to be at most H.
    kind: leaf
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - recovery_replay
      - revision_frontier_guard
      - snapshot_checkpoint
  C18_recovery_selects_and_loads_authoritative_checkpoint:
    statement: While holding the per-document lifecycle lock, a new-owner recovery that reaches
      checkpoint selection chooses exactly one atomically published authoritative checkpoint
      P=(content,S) and installs exactly P before replay. Checkpoint publication, cleanup, and
      compaction cannot interleave with that selection-and-load interval; an attempt may crash or
      abort earlier.
    kind: derived
    depends_on:
      - L42_recovery_selects_authoritative_checkpoint_identity
      - L93_recovery_loads_selected_checkpoint_before_replay
      - L9_snapshot_content_and_frontier_publish_atomically
      - L95_lifecycle_procedures_share_and_hold_document_lock
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - document_lifecycle_lock
      - recovery_replay
      - snapshot_checkpoint
  L42_recovery_selects_authoritative_checkpoint_identity:
    statement: If a new-owner recovery attempt reaches checkpoint selection, it selects exactly one
      checkpoint identity (content, S) present in the authoritative published checkpoint set; the
      attempt may crash or abort before selection without a completion obligation.
    verification:
      verifiers:
        - kind: state_machine
          intent: Record the authoritative published checkpoint identities and require every
            recovery initialization to select exactly one member, including concurrent recovery and
            cache-refresh executions.
    kind: leaf
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - recovery_replay
      - snapshot_checkpoint
  L54_absent_key_winner_returns_its_canonical_acceptance:
    statement: When a reprocessing attempt finds its idempotency key absent and is the uncontended
      or winning acceptance producer, any non-timeout, non-cancellation successful
      acceptance-resolution outcome is emitted only after exactly that attempt's canonical accepted
      change commits, and the returned result is exactly that committed canonical record.
    verification:
      verifiers:
        - kind: state_machine
          intent: Exercise uncontended and overlapping absent-key winner paths, inject failures
            before and after commit, and require every successful non-timeout response to equal the
            canonical record committed by that attempt; no pre-commit or fabricated success is
            allowed.
    kind: leaf
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - accepted_history_log
      - idempotency_gate
      - retry_resolution
      - server_authoritative_ot
  L55_successful_retry_resolution_paths_are_exhaustive:
    statement: 'Every non-timeout, non-cancellation successful acceptance-resolution outcome for reprocessing
      a logical client edit is produced through exactly one authoritative case: returning an already accepted
      result, winning or uncontended absent-key acceptance, or losing absent-key arbitration and resolving
      through its winner. No retry, recovery, or fast path may emit such success outside these cases.'
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every successful non-timeout reprocessing response sink and prove its
            dominating authoritative case is exactly existing-key return, absent-key winner, or
            loser-through-winner; reject bypass and recovery fast-path success exits.
    kind: leaf
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - idempotency_gate
      - recovery_replay
      - retry_resolution
      - server_authoritative_ot
  C25_recovery_derives_complete_ot_metadata_from_truth:
    statement: For authoritative recovery head H, every OT metadata value installed by recovery is
      completely derived from the selected authoritative checkpoint and the exact canonical tail
      through H, and equals an independent clean reconstruction from those inputs. No value whose
      only provenance is failed-owner volatile memory is retained.
    kind: derived
    depends_on:
      - L64_recovered_ot_metadata_equals_clean_authoritative_reconstruction
      - L65_failed_owner_volatile_state_cannot_influence_recovered_metadata
    source_refs:
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: recovered_ot_state_provenance
    semantic_contracts:
      - recovered_ot_state_provenance
  L64_recovered_ot_metadata_equals_clean_authoritative_reconstruction:
    statement: For authoritative recovery head H, recovery installs the complete set of OT metadata
      fields required to resume acceptance at H, and both that field set and every field value
      exactly equal an independent clean reconstruction from the selected authoritative checkpoint
      and exact canonical tail through H, including all metadata effects through revision H.
    verification:
      verifiers:
        - kind: differential_test
          intent: Generate checkpoints and exact canonical tails, independently derive the complete
            required OT metadata schema and values at H, recover through H, and require exact
            equality of both installed field set and every field value, including boundary revision
            H.
    kind: leaf
    source_refs:
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - accepted_history_log
      - recovery_replay
      - server_authoritative_ot
      - snapshot_checkpoint
  L65_failed_owner_volatile_state_cannot_influence_recovered_metadata:
    statement: Let H be the authoritative latest_revision captured for this recovery attempt and let
      the recovered output be every OT metadata field the new owner will use after recovery. Holding
      the selected authoritative checkpoint and exact canonical tail (S, H] fixed, changing or
      removing any non-authoritative runtime data source—including failed-owner volatile memory,
      new-owner caches, and process-local recovery data—cannot change that output. The selected
      checkpoint and exact canonical tail through H are the exclusive data provenance of recovered
      OT metadata.
    verification:
      verifiers:
        - kind: differential_test
          intent: Hold the selected checkpoint and exact canonical tail (S, H] fixed; independently
            remove or poison every reachable non-authoritative runtime source that could supply or
            alter OT metadata, including failed-owner memory and new-owner caches, and require
            identical recovered metadata. Complement the differential runs with dataflow or taint
            inspection proving every installed metadata value originates only from the fixed
            authoritative checkpoint and tail.
    kind: leaf
    source_refs:
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - recovery_replay
      - server_authoritative_ot
  L79_new_owner_accepts_only_after_reconstruction:
    statement: A new owner exposes no OT transformation or canonical-acceptance entrypoint until its
      selected checkpoint is installed, the exact canonical tail through captured head H is
      replayed, required OT metadata is rebuilt, and local head/next-revision state is initialized
      through H. This is a local recovery sequencing barrier and requires no durable READY state.
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate new-owner transform and acceptance entry points and prove none becomes
            reachable before recovery reconstruction through H and local acceptance-state
            initialization complete.
        - kind: fault_injection
          intent: Crash or pause after every recovery step; no partially reconstructed owner may
            accept an edit.
    kind: leaf
    source_refs:
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - document_lifecycle_lock
      - recovery_replay
      - server_authoritative_ot
  L92_captured_recovery_head_equals_authoritative_frontier:
    statement: When new-owner recovery captures recovery head H after its epoch handoff, H equals
      the authoritative document_latest_revision value read from the authoritative store at that
      capture event.
    source_refs:
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - owner_epoch_fencing
      - recovery_replay
      - revision_frontier_guard
    verification:
      verifiers:
        - kind: state_machine
          intent: Seed distinguishable authoritative frontier values, race recovery start with
            delayed stale-owner activity, and prove the captured H exactly equals
            document_latest_revision observed at the authoritative head-capture event.
        - kind: integration_test
          intent: Prevent new-owner acceptance, complete epoch handoff, and compare the recovery H
            used for checkpoint selection and replay directly with the authoritative persisted
            frontier read at capture.
    kind: leaf
    formal_intent: recovery_head_binding
    semantic_contracts:
      - recovery_head_binding
  L93_recovery_loads_selected_checkpoint_before_replay:
    statement: Once new-owner recovery selects authoritative checkpoint P=(content,S), it installs
      exactly P as the replay base before applying any tail revision; concurrent pointer, cache, or
      later-checkpoint changes cannot substitute a different checkpoint for P.
    kind: leaf
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - document_lifecycle_lock
      - recovery_replay
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: integration_test
          intent: Select a distinguishable authoritative checkpoint P, make another checkpoint/cache
            candidate available, and require recovery to install exactly P as the replay base.
        - kind: fault_injection
          intent: Pause or crash checkpoint installation at every boundary and require that no
            canonical tail revision is applied until the selected checkpoint P is completely
            installed.
  L94_recovery_starts_after_epoch_handoff:
    statement: While holding the per-document lifecycle lock, a new-owner recovery advances
      authoritative document_current_epoch to that owner's strictly greater epoch before it captures
      recovery head H or selects a checkpoint.
    kind: leaf
    source_refs:
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - document_lifecycle_lock
      - owner_epoch_fencing
      - recovery_replay
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: state_machine
          intent: Instrument lifecycle-lock ownership, the authoritative epoch transition commit,
            recovery-head capture, and checkpoint selection. Require the transition to the
            recovering owner's strictly greater epoch to commit while the same-document lifecycle
            lock is held, and require both H capture and checkpoint selection to occur only
            afterward.
  L95_lifecycle_procedures_share_and_hold_document_lock:
    statement: Every new-owner recovery, checkpoint publication, and checkpoint cleanup/compaction
      procedure for one document acquires the same per-document session-scoped PostgreSQL advisory
      lock before entering checkpoint lifecycle work and holds it until that lifecycle procedure
      completes or aborts.
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - document_lifecycle_lock
      - snapshot_checkpoint
    kind: leaf
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every recovery, checkpoint-publication, and
            checkpoint-cleanup/compaction entry and exit path; require the same document-keyed
            session advisory lock to be acquired before checkpoint lifecycle work and retained
            through every normal and exceptional procedure exit.
        - kind: fault_injection
          intent: Abort each lifecycle procedure at every boundary and independently observe that
            the document lifecycle lock remains held until procedure unwinding has ended.
  L96_recovery_orders_head_selection_replay_and_metadata:
    statement: In every new-owner recovery that completes and resumes acceptance, recovery captures
      authoritative head H before selecting a checkpoint, completes application of the exact
      canonical tail through H before rebuilding the required OT metadata, and completes that
      metadata rebuild before initializing its local acceptance head and next-revision candidate.
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - owner_failover
      - final_architecture
    mechanisms:
      - recovery_replay
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every completing recovery path and prove, in order, that authoritative
            head capture dominates checkpoint selection, exact tail application through H completes
            before OT metadata rebuild, and metadata rebuild completes before local acceptance-head
            and next-revision initialization; value correctness of that initialization is checked by
            its separate leaf obligation.
    kind: leaf
  L97_client_adopts_snapshot_before_tail:
    statement: When catch-up selects checkpoint P=(content,S), the client installs exactly P with
      replacement semantics and advances last_applied_revision to S before applying any returned or
      interleaved revision above S; an interrupted installation cannot expose checkpoint content
      paired with a different client frontier.
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore snapshot catch-up, interruption, retry, buffered-live, and
            duplicate-delivery transitions; require exactly the selected checkpoint and frontier S
            to become the client's replacement base together before any revision above S is applied,
            with no observable mismatched content/frontier state after interruption.
    kind: leaf
  G6_accepted_change_preserves_ot_semantics:
    statement: Every canonical_accepted_change in authoritative history is exactly the successful
      OT-engine transformed result for one submitted request for document D whose document_id,
      server-visible raw_edit, and base_revision are bound to one canonical client authoring state
      for the same document D at frontier F, with base_revision = F; the OT result is computed
      against document D canonical committed prefix immediately preceding the accepted revision,
      preserves exactly the submitted (document_id=D, client_change_id) as the authoritative
      identity of that acceptance, and satisfies the OT engine algorithmic convergence contract for
      that input and prefix. No canonical acceptance may be created from an edit authored for
      another document, without a submitted raw edit and successful OT result, or from an OT
      reject/rebase-required outcome.
    source_refs:
      - ot_input_output
      - raft_analogy
      - final_architecture
    kind: root
    depends_on:
      - A2_ot_engine_is_correct
      - L98_ot_receives_exact_request_and_canonical_context
      - L99_ot_result_is_bound_to_acceptance_frontier
      - L113_request_raw_edit_is_bound_to_authoring_frontier
      - C38_client_frontier_matches_canonical_base
      - L123_acceptance_payload_and_identity_share_submitted_request
      - L127_canonical_accepted_record_provenance_survives_lifecycle
    formal_intent: request_authoring_frontier_binding; ot_success_acceptance_binding;
      ot_result_frontier_binding; acceptance_request_identity_binding
    semantic_contracts:
      - request_authoring_frontier_binding
      - ot_success_acceptance_binding
      - ot_result_frontier_binding
      - acceptance_request_identity_binding
  L98_ot_receives_exact_request_and_canonical_context:
    statement: Every OT invocation whose success is eligible for canonical acceptance receives
      exactly the submitted raw_edit and client base revision for that logical request, together
      with document context representing one canonical committed prefix through a definite revision
      frontier; speculative, uncommitted, or mismatched document context cannot feed that
      invocation.
    source_refs:
      - ot_input_output
      - accepted_change_log
      - final_architecture
    mechanisms:
      - server_authoritative_ot
      - accepted_history_log
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every acceptance-eligible OT invocation from request decode to transform
            dispatch and require the exact submitted raw edit and base revision to reach the engine
            together with one committed canonical document context; reject any path using
            speculative, uncommitted, or context-mismatched state.
        - kind: integration_test
          intent: Construct distinguishable request payloads and committed document prefixes, then
            verify that the acceptance-eligible OT invocation observes exactly the submitted request
            identity/base and the selected committed canonical context.
    kind: leaf
  L99_ot_result_is_bound_to_acceptance_frontier:
    statement: If an OT success result is computed against the canonical committed prefix through
      revision N, that result may commit as canonical_accepted_change at revision r only while the
      authoritative acceptance pre-state still has latest_revision = N and r = N + 1; if that
      frontier has advanced, the stale result cannot commit without a fresh OT transformation
      against the new canonical prefix.
    source_refs:
      - ot_input_output
      - accepted_change_log
      - final_architecture
    mechanisms:
      - server_authoritative_ot
      - revision_frontier_guard
      - acceptance_transaction
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the acceptance transaction and require the OT computation frontier N to be
            checked by the same transaction that would commit the transformed result; if
            latest_revision != N, the transaction cannot commit any canonical acceptance for that
            stale result.
        - kind: state_machine
          intent: Explore transform/commit races where another acceptance advances latest_revision
            after OT computation; require a result computed at frontier N to commit only as N+1
            while the authoritative pre-state remains N, otherwise require
            re-transform/retry/rejection before any acceptance.
        - kind: control_flow
          intent: Prove that the frontier token/context used for OT computation is carried to the
            authoritative acceptance guard and cannot be replaced by a newer revision number while
            reusing the stale transformed payload.
    kind: leaf
    formal_intent: ot_result_frontier_binding
    semantic_contracts:
      - ot_result_frontier_binding
  L101_client_completes_catchup_through_response_head:
    statement: "A client catch-up attempt for authoritative response head H is considered complete only
      after the client has consumed the response's entire canonical representation through H: delta mode
      applies every returned revision L+1..H, while snapshot mode installs the selected checkpoint frontier
      S and applies every returned tail revision S+1..H; on completion last_applied_revision = H."
    source_refs:
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore both catch-up modes, pagination, buffered live delivery, interruption, and
            retry; require every transition that declares completion for response head H to occur
            only after the selected checkpoint if any and every canonical response revision through
            H have been consumed, with last_applied_revision exactly H.
    kind: leaf
  G7_reconnect_does_not_double_render_accepted_optimistic_edit:
    statement: 'During reconnect/resync for document D by a normally participating client, the client
      does not create or apply new speculative local edits for D while the resync attempt is in progress.
      For every pending logical edit identity (D,k) at resync start that remains within the 30-day normal
      reconnect eligibility horizon, the catch-up request for D includes k for authoritative reconciliation
      through response head H_D; if canonical acceptance(D,k) is included in H_D, authoritative reconciliation
      identifies that same full identity and any user-visible publication through H_D removes or suppresses
      the speculative overlay for (D,k) before or atomically with publication, so no user-visible state
      exposes both representations. An acceptance(D2,k) for D2 != D is irrelevant. No intermediate resync
      candidate may expose a canonical prefix that already contains acceptance(D,k) together with its
      overlay, and a stale response may not restore an overlay removed by a newer published reconciliation.
      An identity whose pending/retry age exceeds 30 days is not submitted through normal authoritative
      reconciliation; it is discarded or handled through an explicit expired, conflict, or manual-resolution
      path outside this guarantee. If any protocol-eligible pending edit remains unresolved after reconciled
      publication or conflict entry, unresolved_pending_blocks_normal_editing holds: the client remains
      non-normal-editable/read-only or in explicit conflict/reconciliation state and creates no new acceptance-eligible
      speculative edit until those unresolved edits are explicitly reconciled or removed. This claim makes
      no automatic local-rebase, conflict-resolution, or progress guarantee.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    kind: root
    depends_on:
      - C37_pending_identity_resolution_is_bound_to_response_head
      - L106_resync_request_covers_start_pending_set
      - L107_client_freezes_speculative_edits_during_resync
      - L108_acceptance_preserves_request_identity
      - L109_resync_publication_is_atomic_and_monotonic
      - L110_client_retires_matching_speculative_overlay_before_canonical_publication
    formal_intent: unresolved_pending_blocks_normal_editing
    semantic_contracts:
      - unresolved_pending_blocks_normal_editing
  L106_resync_request_covers_start_pending_set:
    statement: For every reconnect/resync attempt for document D, the pending client_change_id set
      supplied under that catch-up request contains every speculative local edit identity (D,k) that
      is pending for D when the attempt begins and remains within the 30-day normal reconnect
      eligibility horizon; each supplied eligible k is interpreted only under the request document
      D, and no eligible start-pending (D,k) is omitted or rebound to another document during
      authoritative reconciliation through that request response head. Expired identities are
      outside the normal authoritative reconciliation request.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Enumerate reconnect-start transitions and request construction with pending maps
            for multiple documents, including the same client_change_id reused across documents and
            identities on either side of the 30-day eligibility boundary. For a normal catch-up
            request for D, require every eligible pending (D,k) at attempt start to be represented
            as k under that same D request context, with no omission or cross-document rebinding;
            expired identities are not required to enter authoritative reconciliation.
    kind: leaf
  L107_client_freezes_speculative_edits_during_resync:
    statement: 'From the moment a client begins reconnect/resync and captures the pending client_change_id
      set for its catch-up request until that attempt either publishes a reconciled canonical state or
      enters explicit conflict/reconciliation state, the client creates or applies no new speculative
      local edit to the document being resynchronized. After publication or conflict entry, if client_pending_edits
      still contains any unresolved edit, unresolved_pending_blocks_normal_editing continues to hold:
      normal editable mode remains disabled and no new acceptance-eligible speculative edit is created
      or applied until explicit reconciliation clears those unresolved edits. No eventual resolution or
      automatic local-rebase guarantee is implied.'
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore user-edit input, reconnect start, request capture/send, catch-up response,
            reconciliation, interruption, retry, atomic publication, conflict entry, repeated
            conflict/reconciliation transitions, and attempted return to normal editing. Require
            editing to remain frozen during resync and, whenever unresolved client_pending_edits
            remain afterward, require client_editing_mode to stay non-normal and all new
            acceptance-eligible speculative-edit transitions to remain unreachable.
        - kind: control_flow
          intent: Enumerate every path that enables normal editing or creates a new
            acceptance-eligible speculative edit and prove each is guarded by an empty/reconciled
            unresolved-pending set after reconnect/conflict handling.
    kind: leaf
    formal_intent: unresolved_pending_blocks_normal_editing
    semantic_contracts:
      - unresolved_pending_blocks_normal_editing
  L108_acceptance_preserves_request_identity:
    statement: 'For every canonical acceptance produced from a submitted logical request carrying document_id
      D and client_change_id k, the authoritative identity of that acceptance is exactly (D, k): the acceptance
      path does not drop, regenerate, substitute, or bind either identity component to a different request
      between request admission and canonical commit, and any durable idempotency evidence associated
      with that acceptance identifies the same (D, k).'
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace document_id and client_change_id from request admission through OT dispatch,
            idempotency arbitration, and every canonical-commit sink; prove every successful
            acceptance persists exactly the originating request identity and no path can replace,
            regenerate, cross-bind, or omit either component.
        - kind: integration_test
          intent: Submit distinguishable concurrent requests with different
            document_id/client_change_id pairs, force retries and ACK loss, and assert that each
            canonical accepted record and its durable idempotency evidence retain exactly the
            originating pair without cross-binding.
    kind: leaf
    formal_intent: acceptance_request_identity_binding
    semantic_contracts:
      - acceptance_request_identity_binding
  L109_resync_publication_is_atomic_and_monotonic:
    statement: During reconnect/resync, canonical catch-up and pending-identity reconciliation are
      built in a non-user-visible candidate state. Let F be the currently user-visible canonical
      frontier when a candidate response through authoritative head H is ready to publish. If H < F,
      the entire candidate is discarded without mutating the visible canonical base,
      last_applied_revision, pending-resolution state, or speculative overlays. If H >= F, the
      client may expose state from that candidate only by one atomic publication after the
      candidate's specified reconciliation work is complete; no checkpoint/tail/intermediate
      candidate prefix is user-visible, no previously removed speculative overlay or
      pending-resolution state is restored by that response, and the user-visible canonical frontier
      never decreases.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore overlapping and retried resync attempts with arbitrary response delays,
            checkpoint/tail progress, pending-key resolutions, and publication order; require all
            intermediate candidate states to remain unobservable, discard any H below the currently
            visible frontier, and permit only atomic non-regressing reconciled publication.
        - kind: integration_test
          intent: Delay an older resync response behind a newer published response and separately
            pause catch-up after an accepted pending edit enters an intermediate canonical prefix;
            assert that neither the stale response nor any intermediate prefix mutates user-visible
            canonical, frontier, pending, or overlay state before one valid reconciled publication.
    kind: leaf
  L110_client_retires_matching_speculative_overlay_before_canonical_publication:
    statement: For every logical client edit identified by (document_id=D, client_change_id=k), once
      the user-visible canonical prefix contains the canonical acceptance identified by (D,k), every
      user-visible client transition keeps speculative overlay (D,k) absent for as long as that
      canonical acceptance remains visible. The transition that first makes the acceptance visible
      must remove or suppress any matching overlay before or atomically with that publication, and
      later overlay-only, ACK/retry/pending-bookkeeping, UI-restore, buffered-live,
      reconnect/resync, or other client transitions cannot recreate or re-enable the same overlay.
      Only a distinct new logical edit with a distinct client_change_id may create a new speculative
      representation.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_revision_continuity
      - catchup_protocol
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore ordinary live delivery, buffered post-catch-up delivery, resync
            publication, ACK loss, retry/pending bookkeeping, UI state restoration, reconnect
            completion, and arbitrary later client transitions. Once the visible canonical prefix
            contains acceptance (D,k), require speculative overlay (D,k) to remain absent in every
            subsequently visible state while that acceptance remains visible; only a distinct new
            logical edit with a distinct client_change_id may create a new speculative overlay.
        - kind: control_flow
          intent: Enumerate every transition that can publish canonical state or create, restore,
            reactivate, or expose a speculative overlay. Prove that any path producing a
            user-visible overlay (D,k) is blocked whenever the currently visible canonical prefix
            already contains acceptance (D,k), and that the first canonical publication containing
            (D,k) retires the matching overlay before exposure.
    kind: leaf
    formal_intent: visible_canonical_speculative_exclusion
    semantic_contracts:
      - visible_canonical_speculative_exclusion
  G8_user_visible_state_does_not_double_render_accepted_optimistic_edit:
    statement: At every user-visible client state, for every logical client edit identified by
      (document_id=D, client_change_id=k), if the currently visible canonical prefix contains the
      canonical acceptance identified by (D,k), the same user-visible state contains no speculative
      overlay identified by (D,k). This invariant must remain true across the canonical publication
      that first exposes the acceptance and across every later user-visible client transition while
      that canonical acceptance remains visible, including ACK/retry/pending bookkeeping and other
      transitions that do not advance the canonical frontier. Ordinary live delivery, buffered
      post-catch-up delivery, and reconnect/resync publication are all covered. A genuinely new
      logical edit may create a new speculative overlay only under its distinct client_change_id;
      this claim makes no automatic local-rebase or progress guarantee for unresolved edits with no
      acceptance in the visible canonical prefix.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    kind: root
    depends_on:
      - L110_client_retires_matching_speculative_overlay_before_canonical_publication
    formal_intent: visible_canonical_speculative_exclusion
    semantic_contracts:
      - visible_canonical_speculative_exclusion
  G9_accepted_idempotency_evidence_matches_committed_acceptance:
    statement: For every (document_id=D, client_change_id=k) while its logical edit remains within
      the 30-day normal retry/reconnect eligibility horizon and an eligible execution may still
      reach acceptance or retry-resolution logic, authoritative state contains durable accepted-key
      evidence whose protocol meaning is already-accepted(D,k) if and only if canonical history
      contains exactly one committed canonical acceptance identified by the same (D,k). On the
      normal hot path this correspondence is established either because the committed accepted row /
      unique identity itself is the success evidence, or because any separate accepted-key success
      record commits and aborts atomically with the canonical acceptance in the same acceptance
      transaction. Lifecycle compaction may replace the physical evidence only by deriving
      equivalent evidence from a previously committed acceptance; reservation, in-progress
      arbitration, timeout, cancellation, or another non-committed attempt is not accepted evidence.
      The protocol does not require ordinary retry/reconnect classification of that old identity
      after the 30-day horizon expires.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    kind: root
    depends_on:
      - C13_idempotency_key_is_temporally_unique
      - L14_accepted_idempotency_identity_survives_lifecycle
      - C35_accepted_key_classification_requires_committed_acceptance
    formal_intent: accepted_evidence_correspondence; accepted_evidence_provenance
    semantic_contracts:
      - accepted_evidence_correspondence
      - accepted_evidence_provenance
  L113_request_raw_edit_is_bound_to_authoring_frontier:
    statement: "For every submitted request whose OT result may become a canonical acceptance, request_authoring_frontier_binding
      holds: the submitted tuple (document_id=D, server-visible raw_edit, base_revision=F) is captured
      from one user-visible client canonical tuple with client_document_id=D and last_applied_revision=F.
      Request construction, serialization, dispatch, and retry preserve that document/raw_edit/base binding
      and cannot substitute another document or frontier for the raw_edit. Canonical correctness of the
      source visible client tuple is proved separately."
    formal_intent: request_authoring_frontier_binding
    source_refs:
      - ot_input_output
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - client_revision_continuity
      - server_authoritative_ot
    semantic_contracts:
      - request_authoring_frontier_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every acceptance-eligible client request construction and OT-dispatch path.
            Prove the serialized document_id, raw_edit, and base_revision are captured from one
            user-visible source tuple whose client_document_id is the same D, base_revision equals
            that tuple frontier, and no serialization/retry path can cross-bind the raw edit to
            another document or frontier.
        - kind: integration_test
          intent: Construct distinguishable visible canonical states for documents A and B at the
            same numeric frontier, produce distinguishable raw edits, perturb document/frontier
            metadata during request construction and retry, and require every acceptance-eligible
            request to retain the exact document/raw_edit/base tuple captured from its source
            visible state.
    kind: leaf
  L114_hot_path_accepted_evidence_requires_committed_acceptance:
    statement: On the normal acceptance path, authoritative durable state may acquire protocol
      semantics already-accepted(D,k) for identity (document_id=D, client_change_id=k) only if the
      matching canonical acceptance(D,k) commits. If the committed accepted row or unique identity
      itself is the idempotency success evidence, that committed row is the evidence; if a separate
      hot-path accepted-key record or index exists, that record and the canonical acceptance must
      commit or abort in the same acceptance_transaction. Reservation, in-progress arbitration,
      pre-commit ownership, or other provisional state cannot serve as accepted evidence, and an
      aborted, timed-out, or cancelled attempt with no committed acceptance cannot by itself make
      (D,k) already accepted.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the normal acceptance transaction and prove that any separate hot-path
            already-accepted success evidence for (D,k) commits or aborts atomically with canonical
            acceptance(D,k); crash or rollback cannot leave one durable without the other.
        - kind: control_flow
          intent: Enumerate every normal-path state or branch that can classify (D,k) as already
            accepted. Require the classification to originate from the matching committed canonical
            acceptance or same-transaction success evidence, and prove reservation, arbitration,
            pre-commit, timeout, cancellation, and aborted paths cannot reach the accepted-evidence
            sink.
    kind: leaf
  L115_lifecycle_accepted_evidence_derives_from_committed_acceptance:
    statement: Whenever accepted-history compaction, cleanup, or another lifecycle replacement
      creates or preserves authoritative evidence whose protocol meaning is already-accepted(D,k),
      that replacement evidence is derived only from a previously committed canonical acceptance for
      the same (document_id=D, client_change_id=k). No never-committed attempt, reservation,
      in-progress arbitration, timeout, cancellation, or other provisional state may become the
      provenance source of lifecycle replacement accepted evidence.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every compaction/cleanup/lifecycle producer of already-accepted(D,k)
            replacement evidence back to authoritative accepted history and prove same-key
            provenance from a previously committed canonical acceptance; reject any path sourced
            from attempt, reservation, timeout, cancellation, or other provisional state.
        - kind: state_machine
          intent: Exercise accepted-history lifecycle transitions for both committed and
            never-committed attempts. Replacement evidence may change representation but must
            classify (D,k) as accepted only when its source state contains a prior committed
            canonical acceptance for that same identity.
    kind: leaf
  C35_accepted_key_classification_requires_committed_acceptance:
    statement: On the normal acceptance path, authoritative durable state may acquire protocol
      semantics already-accepted(D,k) for identity (document_id=D, client_change_id=k) only if the
      matching canonical acceptance(D,k) commits. If the committed accepted row / unique identity
      itself is the idempotency success evidence, that committed row is the evidence; if a separate
      hot-path accepted-key record or index exists, that record and the canonical acceptance must
      commit or abort in the same acceptance transaction. Reservation, in-progress arbitration,
      pre-commit ownership, or other provisional state cannot serve as accepted evidence. After
      accepted-history compaction, replacement evidence may be derived only from a previously
      committed acceptance for the same (D,k), never from a never-committed attempt. An aborted,
      timed-out, or cancelled attempt with no committed acceptance cannot by itself make (D,k)
      already accepted.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: transaction_atomicity
          intent: Inspect the acceptance transaction and prove any separate hot-path
            already-accepted success evidence for (D,k) commits or aborts atomically with the
            canonical acceptance(D,k); crash or rollback cannot leave one durable without the other.
        - kind: state_machine
          intent: Explore first submission, existing-key retry, reservation, arbitration,
            transaction begin/commit/rollback, crash, timeout, cancellation, recovery, and
            compaction transitions. Require every state interpreted as already-accepted(D,k) to be
            either the committed canonical accepted row/identity itself, a separate record that
            committed atomically with that acceptance, or lifecycle replacement evidence derived
            from a prior committed acceptance; pre-commit and aborted states remain distinguishable
            from accepted.
        - kind: fault_injection
          intent: Crash or abort before, during, and after the acceptance transaction and around any
            separate accepted-key evidence write. After recovery, assert that canonical
            acceptance(D,k) and any hot-path already-accepted evidence either both committed or both
            did not commit; a timeout/cancellation without committed acceptance must not leave a
            phantom accepted marker.
    kind: derived
    formal_intent: accepted_evidence_provenance
    semantic_contracts:
      - accepted_evidence_provenance
    depends_on:
      - L114_hot_path_accepted_evidence_requires_committed_acceptance
      - L115_lifecycle_accepted_evidence_derives_from_committed_acceptance
  L116_live_delivery_is_bound_to_committed_acceptance:
    statement: "Every change exposed through websocket_live_stream is bound to a committed canonical accepted-change
      record in authoritative accepted history: every live-delivery producer preserves the committed record's
      canonical payload and revision provenance, and no provisional, speculative, rejected, aborted, or
      otherwise never-committed change can reach the live stream as a canonical change."
    source_refs:
      - authoritative_truth
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
    semantic_contracts:
      - live_delivery_acceptance_binding
    formal_intent: live_delivery_acceptance_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every producer/control-flow path that can expose a canonical change
            through websocket_live_stream. Trace payload and revision provenance to a committed
            authoritative accepted-history record and prove that provisional, speculative, rejected,
            aborted, or never-committed values cannot reach the delivery sink.
    kind: leaf
  L117_retry_existing_acceptance_matches_full_idempotency_key:
    statement: If a normal retry within the 30-day eligibility horizon carrying idempotency identity
      (document_id=D, client_change_id=k) refers to a logical edit whose canonical acceptance for
      that same full identity (D,k) is already committed, then any non-timeout successful
      acceptance-resolution outcome returns exactly that existing canonical accepted record for
      (D,k); pending, timeout, or cancellation remains permitted, and an acceptance for another
      document or another client_change_id cannot satisfy this retry.
    source_refs:
      - accepted_change_log
      - owner_failover
      - final_architecture
    mechanisms:
      - accepted_history_log
      - idempotency_gate
      - retry_resolution
    verification:
      verifiers:
        - kind: control_flow
          intent: For normal retries within the 30-day eligibility horizon, trace every
            already-accepted retry-resolution path from incoming (document_id, client_change_id)
            through authoritative lookup to the returned canonical record; require the lookup key
            and returned record identity to be the same full (D,k), with no cross-document or
            cross-client-change substitution.
        - kind: integration_test
          intent: Within the normal retry eligibility horizon, commit acceptances for two documents
            that deliberately reuse the same client_change_id, then retry each full key under ACK
            loss/reconnect conditions and require each successful resolution to return only its own
            committed canonical record.
    kind: leaf
  C36_reconnect_starts_from_canonical_client_frontier:
    statement: "A normal reconnect/catch-up attempt for document D is foreground and visible-document-bound:
      it may start only while the current user-visible canonical tuple represents D. If that tuple's last_applied_revision
      is L, the attempt captures its reconnect-start base from the same tuple, with client_document_id=D
      and client_local_document equal to deterministic canonical replay of document D through L. Private
      resync-candidate or request-construction scratch state does not replace this user-visible canonical
      starting tuple. Background or non-visible per-document synchronization is outside this reconnect
      guarantee."
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    kind: derived
    depends_on:
      - C38_client_frontier_matches_canonical_base
      - L130_reconnect_start_is_bound_to_visible_client_tuple
  L119_completed_resync_candidate_stays_at_response_head_until_publication:
    statement: For a reconnect/resync attempt with captured response head H, once the attempt has
      completed its canonical catch-up and pending reconciliation through H, its private reconciled
      candidate keeps canonical frontier exactly H until that candidate is either atomically
      published or discarded. Canonical live revisions accepted after H may be buffered or deferred
      for later processing, but they cannot be applied into or advance this already completed
      candidate before its publication. Therefore any successful publication of that candidate
      exposes canonical state through exactly H.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: state_machine
          intent: Explore completion through H, later accepted live revisions H+1 and above,
            buffering/defer paths, overlapping reconnect attempts, publication, and discard. Once
            one candidate is complete through H, require its private canonical frontier and
            canonical contents to remain bounded exactly at H until publication/discard; later live
            revisions must remain outside that candidate.
        - kind: control_flow
          intent: Enumerate every post-completion path that can mutate the completed resync
            candidate before publication. Prove that no buffered/live-delivery consumer can apply a
            revision greater than H into that candidate, and that the publication sink exposes
            exactly the candidate at H rather than a later frontier.
    kind: leaf
  L121_delta_resync_candidate_starts_from_canonical_client_base:
    statement: For a reconnect/resync attempt starting from user-visible last_applied_revision L
      that selects delta catch-up, before any returned canonical revision greater than L is applied,
      the private resync candidate canonical document/frontier is initialized from the same
      reconnect-start client document/frontier pair at L, either by exact copy or by a deterministic
      reconstruction equal to that pair. Candidate construction cannot substitute stale/private
      scratch content, cross-bind a document from another client state to frontier L, or otherwise
      change either member of the reconnect-start pair before the first delta is applied. Whether
      the reconnect-start pair itself equals canonical replay through L is a separate obligation.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every delta-mode resync candidate construction path before the first
            catch-up revision is applied. Prove that candidate document and frontier are initialized
            from one coherent reconnect-start document/frontier pair at L, or an exactly equal
            deterministic reconstruction, with no stale scratch, cross-binding, substitution, or
            mutation before applying L+1.
        - kind: integration_test
          intent: Seed distinguishable reconnect-start and stale/private scratch document/frontier
            pairs, enter delta catch-up, and verify that the candidate immediately before applying
            L+1 equals the reconnect-start pair in both document content and frontier.
    kind: leaf
  L122_catchup_response_head_is_bound_to_authoritative_frontier:
    statement: 'For every catch-up response eligible for completion or publication, catchup_head_binding
      holds: for catch-up document D, response head H is captured from authoritative document_latest_revision(D)
      at one response-specific authoritative-store read/linearization point, and that exact H is preserved
      through delta/snapshot selection, canonical range construction, pending reconciliation, completion,
      and publication. Later canonical acceptances may advance document_latest_revision(D) but cannot
      rewrite H for that response.'
    formal_intent: catchup_head_binding
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - accepted_history_log
    semantic_contracts:
      - catchup_head_binding
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every completion/publication-eligible catch-up response from authoritative
            frontier read through response construction and publication. Require one
            response-specific document_latest_revision(D) capture and prove the same H reaches every
            mode-selection, range/checkpoint, reconciliation, completion, and publication consumer.
        - kind: integration_test
          intent: Use two documents and deliberately stale/cacheable frontier values while advancing
            canonical history around catch-up construction. A response may use only the H captured
            from its own document authoritative frontier, and later acceptances must not change that
            response H.
    kind: leaf
  L123_acceptance_payload_and_identity_share_submitted_request:
    statement: For every canonical_accepted_change, there is one submitted request R such that the
      successful OT invocation whose output is committed as that acceptance consumes R's submitted
      raw_edit and base_revision, and the authoritative document_id and client_change_id persisted
      for that same acceptance are exactly R's submitted identity. No acceptance path may combine
      OT-result payload provenance from one submitted request with document or idempotency identity
      provenance from another request.
    source_refs:
      - ot_input_output
      - accepted_change_log
      - final_architecture
    mechanisms:
      - server_authoritative_ot
      - acceptance_transaction
      - idempotency_gate
      - accepted_history_log
    verification:
      verifiers:
        - kind: control_flow
          intent: Trace every canonical-acceptance path from one decoded submitted request through
            OT dispatch and the canonical commit sink; require the committed OT payload and
            persisted document_id/client_change_id to retain provenance from the same submitted
            request, rejecting any cross-request field or result substitution.
        - kind: integration_test
          intent: Submit distinguishable concurrent requests with different raw edits, base
            revisions, document IDs, and client_change_ids, force overlap/retry interleavings, and
            assert that every committed acceptance pairs the OT result and authoritative identity
            from one and the same submitted request.
    kind: leaf
  C37_pending_identity_resolution_is_bound_to_response_head:
    statement: 'For every protocol-eligible pending identity (document_id=D, client_change_id=k) within
      the 30-day normal reconnect eligibility horizon supplied under a catch-up request for document D
      with authoritative response head H_D, the response classifies only that same full identity against
      authoritative acceptance through H_D: it reports accepted at revision r only for the unique canonical
      acceptance(D,k) with r <= H_D, and reports unresolved through H_D only when no canonical acceptance(D,k)
      exists through H_D. An acceptance(D2,k) for D2 != D cannot satisfy or suppress pending(D,k). Snapshotting,
      compaction, cleanup, and recovery preserve enough same-identity accepted revision or equivalent
      frontier evidence to make this classification throughout that eligibility horizon. Expired identities
      are outside ordinary authoritative reconnect classification.'
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    kind: derived
    depends_on:
      - C13_idempotency_key_is_temporally_unique
      - L124_pending_identity_classifier_uses_same_identity_and_response_head
      - L125_pending_identity_revision_evidence_survives_lifecycle
      - A6_normal_retry_reconnect_identity_is_eligible_for_30_days
  L124_pending_identity_classifier_uses_same_identity_and_response_head:
    statement: For every protocol-eligible pending identity (document_id=D, client_change_id=k)
      within the 30-day normal reconnect eligibility horizon supplied under a catch-up request for
      document D with captured response head H_D, the response classifier uses only authoritative
      canonical acceptance evidence for that same full identity (D,k) through H_D. Given the
      canonical acceptance uniqueness obligation for (D,k), it reports accepted at revision r
      exactly when the matching canonical acceptance exists with r <= H_D, otherwise it reports
      unresolved through H_D; an acceptance(D2,k) for D2 != D and any acceptance after H_D cannot
      satisfy or suppress pending(D,k). No classification guarantee is made here for an expired
      identity submitted outside the normal protocol boundary.
    source_refs:
      - accepted_change_log
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - accepted_history_log
      - idempotency_gate
    verification:
      verifiers:
        - kind: state_machine
          intent: Within the 30-day normal reconnect eligibility horizon, vary catch-up document D,
            captured response head H_D, same client_change_id reused by another document, and
            matching acceptance timing before or after H_D; require classifier output to depend only
            on canonical acceptance(D,k) through the captured head.
        - kind: integration_test
          intent: For eligible identities, create distinguishable same-key acceptances across
            documents and accept the target identity both before and after a captured head; verify
            cross-document and post-head records cannot affect response classification. Expired
            identities are outside this ordinary authoritative reconciliation test oracle.
    kind: leaf
  L125_pending_identity_revision_evidence_survives_lifecycle:
    statement: If canonical acceptance(D,k) commits at revision r, every later snapshotting,
      compaction, cleanup, or recovery transition preserves authoritative same-identity evidence
      sufficient to recover r or an equivalent frontier-membership fact for (D,k) throughout the
      logical edit's 30-day normal retry/reconnect eligibility horizon. Lifecycle replacement
      evidence remains bound to the same document_id D, client_change_id k, and committed acceptance
      revision/frontier fact; removing the physical accepted row cannot make that eligible accepted
      identity appear unresolved for a response head H_D with r <= H_D. After the eligibility
      horizon expires, this proposition does not require ordinary retry/reconnect classification
      evidence for a re-submitted old identity, and it does not require physical evidence cleanup to
      occur immediately at expiry.
    source_refs:
      - accepted_change_log
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - snapshot_checkpoint
      - recovery_replay
      - idempotency_gate
    verification:
      verifiers:
        - kind: state_machine
          intent: After committing acceptance(D,k) at revision r, explore snapshot, compaction,
            cleanup, and recovery transitions throughout the 30-day normal retry/reconnect
            eligibility horizon; require authoritative evidence to retain the same identity and
            enough revision/frontier information to classify any captured H_D relative to r during
            that horizon.
        - kind: fault_injection
          intent: Crash and recover around lifecycle replacement of accepted-history evidence while
            (D,k) remains within the 30-day eligibility horizon and verify that acceptance(D,k)
            remains classifiable as included for H_D >= r and excluded for H_D < r. Do not treat
            post-expiry re-submission as an ordinary reconciliation oracle.
    kind: leaf
  L126_pending_reconciliation_preserves_resync_canonical_candidate:
    statement: For every reconnect/resync attempt with captured response head H, once the private
      resync candidate canonical document/frontier is initialized and until that candidate is
      published or discarded, every pending-identity reconciliation transition for that same attempt
      preserves the candidate canonical document and canonical frontier. Reconciliation may update
      pending-resolution state, speculative overlays, and related control/bookkeeping state, but it
      cannot insert, remove, rewrite, reapply, or otherwise mutate canonical accepted content or
      change the candidate canonical frontier before, during, or after canonical catch-up reaches H.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every pending-identity reconciliation path that can run after resync
            candidate initialization and before publication or discard; prove all writes are
            confined to pending-resolution, speculative-overlay, or control/bookkeeping state and no
            path mutates candidate canonical document/frontier regardless of whether catch-up has
            already reached H.
        - kind: state_machine
          intent: Explore reconciliation before, during, and after delta/snapshot catch-up,
            including accepted and unresolved pending identities, overlap, retry, and conflict
            entry; require candidate canonical document/frontier to remain unchanged across every
            reconciliation transition.
    kind: leaf
  L127_canonical_accepted_record_provenance_survives_lifecycle:
    statement: For every canonical accepted-change record A that remains present as a
      canonical_accepted_change in authoritative accepted history across snapshotting, compaction,
      cleanup, recovery publication, or another non-append history lifecycle transition, the
      transition preserves A's canonical payload, revision, document_id, client_change_id, and
      successful-OT provenance exactly. A lifecycle transition may physically remove or replace old
      accepted records with an authoritative equivalent representation where separately permitted,
      but it cannot rewrite a surviving canonical accepted-change record into a different edit,
      payload, revision, or request identity.
    source_refs:
      - accepted_change_log
      - authoritative_truth
      - snapshot_frontier
      - final_architecture
    mechanisms:
      - accepted_history_log
      - recovery_replay
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: state_machine
          intent: Generate authoritative accepted histories with distinguishable payloads,
            revisions, and request identities; exercise every non-append lifecycle transition and
            require each canonical accepted-change record that survives as such to retain exact
            record/provenance equality with its pre-transition value.
        - kind: differential_test
          intent: Compare surviving canonical accepted-change records before and after snapshot,
            compaction, cleanup, and recovery-publication transitions; any lifecycle replacement may
            remove a record from this record-level observation boundary, but no surviving record may
            change payload, revision, identity, or OT-success provenance.
    kind: leaf
  G10_user_visible_client_state_matches_document:
    statement: "At every user-visible client state representing document D, client_canonical_frontier_coherence
      holds for the full visible canonical tuple: client_document_id=D and client_local_document equals
      deterministic canonical replay of document D through last_applied_revision. Initialization, restoration,
      tab/view switching, live delivery, catch-up publication, and every other transition that can replace
      or publish any tuple coordinate preserve this same-document binding; no user-visible state may pair
      one document's canonical content/frontier with another document identity."
    source_refs:
      - authoritative_truth
      - reconnect_revision_boundary
      - final_architecture
    depends_on:
      - C38_client_frontier_matches_canonical_base
    formal_intent: client_canonical_frontier_coherence
    semantic_contracts:
      - client_canonical_frontier_coherence
    kind: root
  L128_client_canonical_frontier_is_established_on_publication:
    statement: 'At every client initialization and every canonical publication that creates or replaces
      a user-visible client state representing document D, the published full visible tuple is coherent:
      client_document_id = D and client_local_document equals deterministic application of all and only
      document D canonical accepted revisions through last_applied_revision. This includes publication
      from restoration, document/view switching, snapshot replacement, or reconnect/resync state. Private
      client_resync_candidate state is outside this boundary until publication, and speculative raw edits
      are not part of client_local_document.'
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - catchup_protocol
      - client_revision_continuity
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: state_machine
          intent: Model initialization and every visible tuple publication/replacement path,
            including restoration, document/view switching, snapshot replacement, and reconnect
            publication. Use distinguishable documents with equal numeric frontiers and require each
            resulting visible tuple for D to contain client_document_id=D and exactly
            Replay_D(last_applied_revision); private resync candidates may violate the relation only
            before publication.
    kind: leaf
  L129_client_canonical_frontier_is_preserved_by_visible_transitions:
    statement: From any user-visible client state for document D whose full visible canonical tuple
      is coherent, every subsequent user-visible transition capable of mutating, restoring,
      replacing, switching, or publishing client_document_id, client_local_document, or
      last_applied_revision preserves that coherence in its resulting visible state, including
      transitions that leave last_applied_revision unchanged. Contiguous canonical application,
      duplicate/gap handling, restoration, switching, and canonical publication may not expose a
      tuple whose document identity, materialized canonical document, and frontier come from
      different canonical bases. Private client_resync_candidate state remains outside this observer
      boundary until publication, and speculative raw edits are not part of client_local_document.
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - accepted_history_log
      - catchup_protocol
      - client_revision_continuity
      - snapshot_checkpoint
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every implementation path that can assign, restore, swap, switch, or
            publish any visible tuple coordinate and prove that, assuming the pre-state tuple is
            coherent, every user-visible post-state remains same-document canonical through its
            frontier or the path mutates only non-user-visible client_resync_candidate state.
        - kind: state_machine
          intent: Explore contiguous live/catch-up application, duplicate/gap handling, restoration,
            switching, snapshot replacement, buffered live delivery, interruption, retry, and
            reconnect publication from coherent visible states; require every visible successor
            state to satisfy the same canonical replay relation, including unchanged-frontier paths.
    kind: leaf
  C38_client_frontier_matches_canonical_base:
    statement: 'At every user-visible client state representing document D, client_canonical_frontier_coherence
      holds for the full visible canonical tuple: client_document_id = D and client_local_document equals
      deterministic application of all and only document D canonical accepted revisions through last_applied_revision.
      The invariant is established at client initialization or canonical publication and preserved by
      every user-visible transition capable of mutating, restoring, replacing, switching, or publishing
      client_document_id, client_local_document, or last_applied_revision, including transitions that
      leave the frontier unchanged. Speculative raw edits are not part of client_local_document, and private
      client_resync_candidate construction is outside this observer boundary until atomic publication.'
    source_refs:
      - authoritative_truth
      - snapshot_frontier
      - reconnect_revision_boundary
      - final_architecture
    kind: derived
    formal_intent: client_canonical_frontier_coherence
    semantic_contracts:
      - client_canonical_frontier_coherence
    depends_on:
      - L128_client_canonical_frontier_is_established_on_publication
      - L129_client_canonical_frontier_is_preserved_by_visible_transitions
  L130_reconnect_start_is_bound_to_visible_client_tuple:
    statement: For every normal foreground reconnect/catch-up attempt for document D, attempt
      initiation is permitted only while the current user-visible canonical tuple represents D, and
      the reconnect-start document identity, canonical client document, and last_applied_revision L
      used to construct the attempt are captured from that same visible tuple or one exact private
      copy of that tuple. Reconnect-start construction may not independently reread, substitute,
      synthesize, or cross-bind any of those three coordinates across a visible-state transition.
      Background or non-visible per-document synchronization is outside this obligation.
    source_refs:
      - reconnect_revision_boundary
      - final_architecture
    mechanisms:
      - catchup_protocol
      - client_revision_continuity
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every normal foreground reconnect/catch-up initiation path and trace the
            document identity plus reconnect-start canonical document/frontier into request and
            resync setup. Prove initiation for D is gated on the current visible tuple representing
            D and that all three reconnect-start coordinates come from one tuple observation or
            exact tuple copy, including races with tab/view switches, restoration, and canonical
            publication; reject any mixed observation or scratch-state substitution.
        - kind: integration_test
          intent: Use distinguishable documents A and B with equal numeric frontiers, race reconnect
            initiation against visible document switching/restoration/publication, and require every
            normal foreground reconnect attempt for D to capture exactly the visible (D, canonical
            document, frontier) tuple from one state without mixed coordinates.
    kind: leaf
catalog:
  terms:
    logical_client_edit:
      description: One user operation from the client's protocol perspective. Retransmissions of the
        same logical operation are retries of that edit, not new logical edits.
    raw_edit:
      description: The client-submitted edit before server-side transformation/rebase against
        accepted document history.
    client_change_id:
      description: A protocol identifier supplied by the client for a logical client edit. Stability
        across retries and uniqueness across distinct logical edits are explicit protocol
        assumptions, not part of this vocabulary definition.
    canonical_accepted_change:
      description: The server-authoritative representation of an edit after any required OT
        transformation and after the system has decided to accept it. Creating two accepted records
        for one logical client edit counts as duplicate acceptance even if their transformed
        payloads happen to be equal.
    accepted_history:
      description: The authoritative collection/sequence of canonical accepted changes for a
        document. Properties such as uniqueness, gap freedom, fencing, and durability are proved or
        assumed elsewhere; this definition alone does not grant them.
    revision:
      description: The server-assigned position/identifier used to order a canonical accepted change
        within one document's accepted history. Contiguity and uniqueness are correctness
        obligations, not part of this definition.
    acceptance:
      description: The system decision that creates a canonical accepted-change record in
        authoritative history. The exact atomicity conditions for that decision are separate claims.
    ack:
      description: A server response informing a client that its submitted edit was accepted. The
        relationship between ACK emission and durable commit is a separate correctness claim.
    retry:
      description: Resubmission caused by uncertainty such as timeout, lost ACK, reconnect, or
        process failure. A retry may race with the original request or another retry.
    authoritative_store:
      description: The persistence layer whose committed contents the model treats as authoritative
        system state. Durability across failures is not implied by this definition and is
        represented explicitly as an assumption where needed.
    owner_epoch:
      description: A fencing token associated with document ownership. The rule that stale epochs
        are rejected is a correctness claim rather than part of the term's definition.
    latest_revision:
      description: Authoritative per-document frontier equal to the highest canonical accepted
        revision.
    current_epoch:
      description: Shorthand for the authoritative current owner epoch of a document.
    accepted_change:
      description: A canonical accepted change record stored in authoritative history.
    document_id:
      description: Stable identifier of one collaborative document.
    last_applied_revision:
      description: Highest contiguous canonical revision already applied by a client.
    document_current_epoch:
      description: Authoritative persisted epoch identifying the current fenced document owner
        generation.
    snapshot_revision:
      description: Canonical revision frontier represented by a published snapshot checkpoint.
    new_epoch:
      description: Newly assigned owner epoch that is strictly greater than the superseded epoch.
    client_change_ids:
      description: Plural shorthand for multiple client_change_id values.
    edit_id:
      description: Abstract identifier of one logical edit in formal ordering notation.
    buffer_or_gap_recovery:
      description: Client action that buffers a future revision or triggers recovery when a
        canonical revision gap is observed.
    idempotency_key:
      description: Authoritative deduplication identity for a logical edit, concretely document_id
        plus client_change_id.
    acceptance_events:
      description: Abstract set of canonical acceptance decisions used in formal idempotency
        notation.
    snapshot_state:
      description: Document state represented by a snapshot checkpoint at its declared frontier.
    base_revision:
      description: Canonical client revision frontier that a submitted server-visible raw_edit
        declares as its authoring base; correctness of that declaration is a separate
        provenance-binding obligation.
    catchup_response_head:
      description: One authoritative revision frontier captured for a catch-up response and used to
        bound that response's canonical range, reconciliation, completion, and publication.
    recovery_head:
      description: Authoritative revision frontier captured by new-owner recovery after epoch
        handoff and used to bound checkpoint selection, replay, metadata reconstruction, and
        resumption.
    ot_success_result:
      description: Successful transformed payload returned by the OT engine for one raw_edit,
        declared base_revision, and canonical committed context.
    ot_computation_frontier:
      description: Canonical committed revision frontier N against which one OT success result was
        computed before acceptance arbitration.
    candidate_canonical_change:
      description: A server-produced canonical-form edit after OT transformation but before the
        authoritative acceptance transaction commits it. It is not yet accepted and must not appear
        in accepted history unless the acceptance transaction succeeds.
  state:
    accepted_change_log:
      class: authoritative
      description: Canonical ordered history of accepted changes for a document.
    document_latest_revision:
      class: authoritative
      description: Authoritative persisted canonical revision frontier for a document.
    document_current_epoch:
      class: authoritative
      description: Authoritative persisted fencing epoch for the current document owner.
      symbolic_dimensions:
        - document
        - observation
    snapshot_content_with_snapshot_revision:
      class: authoritative
      description: Atomically published checkpoint content paired with the exact canonical revision
        frontier it represents.
    ot_owner_memory:
      class: derived
      description: Volatile materialized OT owner state reconstructable from authoritative truth.
    websocket_live_stream:
      class: derived
      description: Best-effort live delivery stream of already accepted canonical changes.
    client_local_document:
      class: derived
      description: Client-side materialized document state reconstructed from canonical revisions.
    search_index:
      class: derived
      description: Derived search representation that is not authoritative collaboration state.
    cache:
      class: derived
      description: Non-authoritative cached data that may be discarded and rebuilt.
    client_speculative_overlays:
      class: speculative
      description: User-visible or locally retained optimistic representations of logical edits that
        have not yet been reconciled into the visible canonical client base.
    client_pending_edits:
      class: speculative
      description: Unresolved logical client edits retained by client_change_id while their
        canonical acceptance outcome or conflict disposition is not yet known.
    client_editing_mode:
      class: control
      description: Client protocol mode controlling whether normal user edits may create
        acceptance-eligible speculative requests, including resyncing, conflict/reconciliation,
        read-only, and normal-editable states.
    client_resync_candidate:
      class: control
      description: Non-user-visible candidate canonical/pending/overlay state built during reconnect
        reconciliation before atomic publication or discard.
    accepted_idempotency_evidence:
      class: authoritative
      description: Logical durable evidence that an idempotency key has a committed canonical
        acceptance, represented by the accepted row/unique identity itself or lifecycle-derived
        equivalent evidence.
    client_document_id:
      class: control
      description: Document identity represented by the current user-visible client canonical state;
        it is bound with client_local_document and last_applied_revision as one visible canonical
        tuple.
  symbolic_dimensions:
    document:
      description: Document identity coordinate preserved explicitly by symbolic functions whose
        value varies per document.
    observation:
      description: Logical observation or protocol-state coordinate preserved explicitly when a
        state value may vary across observations.
  mechanisms:
    server_authoritative_ot:
      description: Server OT owner transforms client edits against canonical accepted history before
        acceptance.
      automation_reusable: true
    accepted_history_log:
      description: Canonical accepted-change log is the durable source of truth for edit history.
      automation_reusable: true
    acceptance_transaction:
      description: Accepted-change creation and authoritative metadata updates commit as one
        database transaction.
      automation_reusable: true
    revision_frontier_guard:
      description: Acceptance checks the authoritative latest revision and advances it exactly with
        the accepted append.
      automation_reusable: true
    idempotency_gate:
      description: Authoritative acceptance is keyed by document_id and client_change_id so one
        logical edit cannot create multiple acceptances.
      automation_reusable: true
    owner_epoch_fencing:
      description: Every authoritative append is conditioned on the request owner_epoch matching the
        current document epoch.
      automation_reusable: true
    snapshot_checkpoint:
      description: Snapshots are authoritative checkpoints whose content is bound atomically to a
        canonical revision frontier.
      automation_reusable: true
    recovery_replay:
      description: A new owner reconstructs state from one authoritative checkpoint plus the exact
        canonical tail through the captured head.
      automation_reusable: true
    catchup_protocol:
      description: Reconnect catch-up returns either the exact retained canonical suffix or a
        checkpoint replacement plus exact tail.
      automation_reusable: true
    client_revision_continuity:
      description: Clients apply only the next contiguous canonical revision, ignore duplicates, and
        recover gaps.
      automation_reusable: true
    commit_before_delivery:
      description: ACK and live broadcast occur only after canonical acceptance is durably
        committed.
      automation_reusable: true
    retry_resolution:
      description: Retries resolve through the authoritative idempotency/acceptance outcome rather
        than producing an independent success path.
      automation_reusable: true
    document_lifecycle_lock:
      description: A session-scoped PostgreSQL advisory lock keyed by document_id serializes
        new-owner recovery, checkpoint publication, and checkpoint cleanup/compaction for one
        document. The lock spans the low-frequency lifecycle procedure, while normal accepted-edit
        transactions do not acquire it.
      automation_reusable: true
  failure_events:
    request_delivery_uncertainty:
      class: allowed
      description: Request delivery may be delayed, duplicated by retry, or have an uncertain
        outcome.
    ack_loss_after_processing:
      class: allowed
      description: ACK delivery may be lost after server-side processing.
    overlapping_requests:
      class: allowed
      description: Multiple client requests or retries may overlap in time.
    owner_crash_restart:
      class: allowed
      description: An OT owner process may crash and later restart.
    ownership_move_with_delayed_old_owner:
      class: allowed
      description: Document ownership may move to another owner while an old owner is delayed.
    catchup_live_interleaving:
      class: allowed
      description: Catch-up and live delivery may interleave around reconnect.
    history_lifecycle_change:
      class: allowed
      description: Accepted history may undergo snapshotting, compaction, or lifecycle cleanup.
    byzantine_behavior:
      class: excluded
      description: Byzantine behavior by clients, servers, or storage is excluded.
    permanent_authoritative_quorum_loss:
      class: excluded
      description: Permanent loss of the authoritative storage quorum is excluded.
  verifier_kinds:
    schema_constraint:
      description: Static database/schema constraint inspection.
    state_machine:
      description: Bounded or model-based exploration of state transitions and concurrency
        interleavings.
    property_test:
      description: Generated-input property testing of an invariant.
    integration_test:
      description: Multi-component contract or end-to-end integration verification.
    fault_injection:
      description: Crash, abort, stale-owner, or transaction-boundary fault injection.
    control_flow:
      description: Static/symbolic/taint/control-flow proof that all relevant paths pass through a
        required gate.
    differential_test:
      description: Compare two independent reconstructions or implementations for semantic equality.
    runtime_invariant:
      description: Runtime trace or invariant observation over executed system behavior.
    mutation_test:
      description: Deliberately corrupt implementation semantics and require tests to detect the
        mutation.
    transaction_atomicity:
      description: Static transaction-boundary inspection that proves the named authoritative writes
        or success evidence share one database transaction and therefore commit or roll back
        all-or-nothing. It does not by itself prove uniqueness, guard correctness, or concurrency
        serialization.
