  G4_reconnect_converges_without_gap_or_duplicate:
    kind: root
    statement: >-
      For a normal foreground, visible-document-bound reconnect/catch-up attempt for document D starting
      from last_applied_revision L, every such catch-up attempt eligible for completion or publication
      binds one response-specific head H captured from that document's authoritative document_latest_revision
      at one authoritative-store read/linearization point, and preserves that same H through response
      selection, reconciliation, completion, and publication. The attempt remains foreground-publication-eligible
      only while its visible-document binding to D remains uninterrupted; if the user-visible document
      switches away from D before publication, that attempt permanently loses publication eligibility
      under this foreground protocol and cannot later publish merely because the user switches back. If
      an eligible attempt completes and publishes its reconciled result, the user-visible canonical state
      equals canonical replay of document D through H without omitting or double-applying any accepted
      revision through H. Reconnect/resync publication is atomic and monotonic across overlapping or retried
      attempts: no intermediate candidate prefix is user-visible, and a response whose H is below the
      already visible canonical frontier cannot regress or otherwise mutate that visible canonical/frontier
      state. Acceptances after H capture are outside that response; this claim does not require catching
      a continuously advancing live head.
    depends_on:
      - C10_catchup_represents_exact_missing_suffix
      - L19_client_applies_only_contiguous_revisions
      - C12_live_delivery_contains_only_accepted_changes
      - A5_apply_accepted_change_is_deterministic
      - L97_client_adopts_snapshot_before_tail
      - L101_client_completes_catchup_through_response_head
      - C7_revision_frontier_is_linear
      - L109_resync_publication_is_atomic_and_monotonic
      - C36_reconnect_starts_from_canonical_client_frontier
      - L119_completed_resync_candidate_stays_at_response_head_until_publication
      - L121_delta_resync_candidate_starts_from_canonical_client_base
      - L122_catchup_response_head_is_bound_to_authoritative_frontier
      - L126_pending_reconciliation_preserves_resync_canonical_candidate
    source_refs:
      - reconnect_revision_boundary
      - owner_failover
      - raft_analogy
      - final_architecture
  G5_retry_resolves_idempotently:
    kind: root
    statement: >-
      For every logical edit whose idempotency_key remains within the normal retry eligibility horizon,
      each normal submitted_request representing that edit preserves the same request identity, raw_edit
      semantics, and canonical authoring frontier, so those values cannot be cross-bound to a different
      logical operation. idempotency_terminal_outcome_coherence holds in every reachable authoritative
      state and terminal_response_outcome_binding holds for every externally_terminal_result. If an authoritative
      ACCEPTED(canonical result) linearizes, accepted_terminal_result_binding also holds: that canonical
      result is produced by the same acceptance execution that commits the matching canonical_accepted_change
      for the exact same full identity, and later authoritative lifecycle representation changes do not
      rebind it to another producer. If an authoritative REJECTED(definitive rejection reason) linearizes,
      definitive_rejection_request_binding also holds: that rejected terminal result derives from a definitive
      rejection decision produced for the exact same submitted request identity and rejection-relevant
      request context, not from another request. If that rejection reason depends on document/history
      state, state_dependent_rejection_context_binding also holds: the decision is justified by same-document
      authoritative_rejection_context whose reason-specific evidence remains sufficient at terminalization;
      stale superseded-owner local state alone cannot justify the authoritative REJECTED. Request-intrinsic
      rejection reasons do not require document-context authority. The first authoritative terminal_result
      to linearize for full identity (document_id=D, client_change_id=k) is immutable and is either ACCEPTED(canonical
      result) or REJECTED(definitive reason); the two are mutually exclusive, all acceptance and definitive-rejection
      attempts arbitrate through the same per-key terminal state, and every externally terminal result
      for that key exactly reproduces the already-linearized terminal result. Pending, timeout, cancellation,
      transport loss, and crash-before-terminal-commit remain non-terminal uncertainty. Consequently,
      if a normally participating client reprocessing the same logical edit within the 30-day normal retry
      horizon obtains an externally terminal result, that result is the same authoritative terminal result
      for that logical operation rather than an incompatible second terminal outcome; this guarantee does
      not require eventual terminal observation. Re-submission after expiry is outside this guarantee.
    depends_on:
      - A3_client_change_id_identifies_logical_edit
      - C13_idempotency_key_is_temporally_unique
      - L35_losing_retry_resolves_through_canonical_acceptance
      - L54_absent_key_winner_returns_its_canonical_acceptance
      - L55_successful_retry_resolution_paths_are_exhaustive
      - L108_acceptance_preserves_request_identity
      - L117_retry_existing_acceptance_matches_full_idempotency_key
      - C40_terminal_outcome_is_single_valued_per_idempotency_key
      - L161_definitive_retry_response_comes_from_terminal_outcome
      - L182_logical_edit_request_payload_binding_is_preserved
      - L183_definitive_rejection_preserves_request_provenance
      - C46_accepted_terminal_result_preserves_acceptance_provenance
      - L204_state_dependent_rejection_uses_authoritative_context
    source_refs:
      - ot_input_output
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: idempotency_terminal_outcome_coherence; accepted_terminal_result_binding;
      definitive_rejection_request_binding; state_dependent_rejection_context_binding;
      terminal_response_outcome_binding
    semantic_contracts:
      - idempotency_terminal_outcome_coherence
      - accepted_terminal_result_binding
      - definitive_rejection_request_binding
      - state_dependent_rejection_context_binding
      - terminal_response_outcome_binding
  C7_revision_frontier_is_linear:
    kind: derived
    statement: >-
      In every authoritative state for a document, accepted_change_log and document_latest_revision denote
      exactly one gap-free canonical accepted prefix ending at document_latest_revision. Each committed
      accepted-change append at revision r preserves the entire prior logical accepted prefix, adds exactly
      revision r as the next position, and advances document_latest_revision to r. Any authoritative transition
      that accepts no edit but changes representation or lifecycle state preserves the same logical accepted
      prefix and the same frontier. Physical retention of every accepted row is not required after semantics-preserving
      compaction.
    depends_on:
      - L4_append_requires_previous_frontier
      - L6_frontier_advance_and_insert_commit_together
      - L22_initial_history_matches_frontier
      - L29_non_append_lifecycle_preserves_revision_domain
      - L33_committed_append_preserves_existing_revision_prefix
      - L137_authoritative_history_mutators_are_exhaustively_classified
    source_refs:
