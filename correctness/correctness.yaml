      - snapshot_checkpoint
  L65_failed_owner_volatile_state_cannot_influence_recovered_metadata:
    statement: Let H be the authoritative recovery_head for this recovery attempt and let the
      recovered output be the complete ot_owner_memory installed by recovery. Holding the selected
      authoritative checkpoint, exact canonical tail (S, H], and H fixed, changing or removing any
      non-authoritative runtime data source—including failed-owner volatile memory, new-owner
      caches, and process-local recovery data—cannot change that output. The selected checkpoint,
      exact canonical tail through H, and recovery_head are the exclusive provenance of recovered
      ot_owner_memory.
    verification:
      verifiers:
        - kind: differential_test
          intent: Hold the selected authoritative checkpoint, exact canonical tail (S, H], and
            recovery_head fixed; independently remove or poison every reachable non-authoritative
            runtime source that could supply or alter recovered ot_owner_memory, including
            failed-owner memory, new-owner caches, and process-local recovery state, and require
            identical complete recovered owner state. Complement the differential runs with dataflow
            or taint inspection proving every installed component originates only from the fixed
            authoritative recovery inputs.
    kind: leaf
    source_refs:
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - recovery_replay
      - server_authoritative_ot
  L79_new_owner_accepts_only_after_reconstruction:
    statement: A new owner may not perform canonical acceptance of any edit until its selected
      checkpoint is installed, the exact canonical tail through captured head H is replayed,
      required OT metadata is rebuilt, and local head/next-revision state is initialized through H.
      Internal transformation preparation before that barrier is permitted provided it cannot commit
      or otherwise cause canonical acceptance.
    verification:
      verifiers:
        - kind: control_flow
          intent: Enumerate every new-owner path that can commit or otherwise complete canonical
            acceptance and prove none is reachable before reconstruction through H and local
            acceptance-state initialization complete; internal non-committing transform/precompute
            paths need not be blocked.
        - kind: fault_injection
          intent: Crash or pause after every recovery step and attempt acceptance; no partially
            reconstructed owner may commit a canonical accepted change.
