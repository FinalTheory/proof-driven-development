    rationale: Fresh final root-coverage audit for model signature
      3cd128427ca346b858245b852795f60d34ef3395faf3199b92ae57118ee9e105 found two independent
      surviving in-scope structural gaps. First, ordinary live or post-resync canonical publication
      can expose a canonical acceptance together with the same client_change_id's still-visible
      speculative overlay because the current no-double-render obligation is
