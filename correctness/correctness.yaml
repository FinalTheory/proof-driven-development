schema_version: "0.11"
system:
  id: google_docs_mini
  summary: This model describes the write, retry, ownership-failover, recovery, and reconnect paths
    of a server-authoritative collaborative document system. A client submits a raw logical edit.
    The server-side OT control layer may transform that input into a canonical accepted change.
    Accepted changes are represented in authoritative history, while clients may retry when request
    outcome is uncertain. Correctness claims in the DAG specify which stronger properties this
    design is intended to guarantee.
  liveness_boundary: Do not infer eventual retry, reconnect, scheduling fairness, or eventual
    success from this failure model. Any liveness requirement must appear as an explicit assumption
    or claim in the proof slice.
source:
  article: design/google-docs.md
scope:
  includes:
    - server-authoritative OT control plane
    - canonical accepted-change-set history
    - retry/idempotency semantics
    - owner failover and fencing
    - snapshot/replay recovery
    - reconnect/catch-up semantics
    - client revision continuity
    - reconnect reconciliation of already accepted optimistic edits by client_change_id
  excludes:
    - implementation of the OT transformation algorithm itself
    - rich-text semantics, range formatting, undo/redo, and selection semantics
    - cross-document transactions
    - semantic correctness of local codec/application execution for an already valid canonical
      accepted change beyond deterministic replay; this mini-system treats that local
      operation-execution semantics as outside the distributed correctness scope
    - automatic client-side OT/rebase of unresolved speculative edits onto a replaced canonical base
    - conflict-resolution UI semantics, seamless editability during reconnect reconciliation, and
      progress guarantees for unresolved speculative edits
refinement:
  decisions:
    D1_retry_loser_progress_contract:
      question: Must every overlapping retry that loses absent-key arbitration eventually resolve
        despite winner crash or scheduling loss, or does the guarantee only constrain completed
        attempts while unresolved attempts may wait or retry indefinitely?
      reason: The root wording can imply unconditional eventual resolution, but the current failure
        model supplies no fairness, eventual recovery, or retry-horizon premise.
      options:
        - unconditional_eventual_resolution_requires_explicit_progress_assumptions
        - conditional_completion_safety_allows_indefinite_pending
      status: resolved
      resolution: Conditional-completion safety. Requests have a timeout, so the guarantee does not
        require every overlapping loser to resolve. Pending, timeout, or cancellation is permitted;
        any attempt that produces an acceptance-resolution outcome must resolve through the unique
        canonical acceptance and must not create a second logical operation.
    D2_recovery_attempt_progress_and_selection_linearization:
      question: Does checkpoint-selection correctness apply only to recovery attempts that reach a
        defined selection/completion phase, or must every initiated recovery attempt eventually
        select despite further crashes; and at which atomic point must the selected identity belong
        to the authoritative published checkpoint set?
      reason: The failure model permits the recovering owner to crash before selection, and
        concurrent checkpoint publication or cleanup makes set membership ambiguous without an
        explicit linearization point.
      options:
        - conditional_completion_with_membership_at_immutable_identity_capture
        - unconditional_eventual_selection_with_explicit_progress_and_retention_assumptions
      status: resolved
      resolution: Conditional-completion safety with serialized checkpoint lifecycle. A recovery
        attempt may crash or abort before checkpoint selection/load completes and has no
        unconditional progress obligation. For each document, only the current fenced OT owner after
        recovery may publish or clean up checkpoints, and checkpoint publication/cleanup is excluded
        while new-owner recovery selects and loads its checkpoint. The authoritative checkpoint set
        is therefore stable during that interval; no concurrent Q publication or P cleanup is
        permitted.
    D3_recovery_lifecycle_serialization_mechanism:
      question: How should new-owner recovery be linearized against checkpoint publication and
        cleanup without introducing a persistent READY/generation state machine?
      reason: Recovery is a low-frequency lifecycle path, so correctness and proof simplicity
        dominate lifecycle concurrency. The existing owner epoch already fences normal accepted
        writes.
      options:
        - per_document_postgresql_advisory_lock
        - persistent_recovery_phase_and_generation_state_machine
      status: resolved
      resolution: Use one session-scoped PostgreSQL advisory lock keyed by document_id across
        new-owner recovery and checkpoint publication/cleanup. Advance the owner epoch under the
        lock before capturing recovery head H. Old owners remain fenced by authoritative epoch
        checks. The new owner exposes no transform/acceptance entrypoint until checkpoint load,
        exact replay, OT metadata rebuild, and local-head initialization complete. No durable READY
        flag or recovered-generation publication protocol is required.
    D4_acked_edit_post_failover_observability:
      question: What exact post-failover scope and observability guarantee should
        G0_acked_edit_survives_failover provide?
      reason: Current dependencies prove durable canonical survival and inclusion whenever recovery
        completes, but the unqualified phrase "remains observable after failover" may also require
        recovery/client-visibility progress that the global liveness boundary forbids us to infer.
      options:
        - 'Safety-only: if a new-owner recovery completes and resumes service, every acknowledged edit
          is included in its recovered authoritative state; no eventual recovery or client-visibility
          promise.'
        - 'Client liveness: after failover, a normally participating client eventually observes every
          acknowledged edit, requiring explicit recovery scheduling/success and reconnect/catch-up progress
          premises.'
        - 'Store observability: after owner failure, every acknowledged edit remains durably readable
          from authoritative history even before a new owner completes recovery.'
      status: resolved
      resolution: 'Specification wording repair, not a new product/liveness choice. G0 now states conditional
        failover safety through the typed acked_edit_failover_survival contract: ACK implies durable acceptance
        and any completed recovery through a frontier containing the edit is equivalent to canonical replay.
        Eventual recovery/client visibility and permanent physical history-row observability are explicitly
        excluded.'
    D5_snapshot_recovery_observation_boundary:
      question: Which observations and comparison frontier define G3's claim that snapshotting,
        compaction, and recovery are observationally equivalent to replaying canonical history from
        the beginning?
      reason: Existing dependencies prove equal logical document state through a common
        authoritative frontier and preserve subsequent protocol behavior, but compaction may
        physically remove revision records. Physical-history or audit observers can distinguish that
        representation even when logical state is identical.
      options:
        - 'Logical state-machine boundary: compare document state, latest_revision, and subsequent protocol
          behavior at the same authoritative frontier; physical storage layout and audit access are excluded
          observations.'
        - 'Physical-history boundary: individual canonical revision records and audit access remain observable,
          so compaction must preserve an equivalent queryable audit representation rather than merely
          logical document state.'
        - Define a different explicit observer interface and frontier before retaining this root
          guarantee.
      status: resolved
      resolution: 'Specification wording repair. G3 now uses the typed logical_state_equivalence_at_frontier
        relation: comparison is at one authoritative frontier and covers logical document state, latest_revision,
        and acceptance-relevant continuation state. Physical row retention/storage layout/audit-query
        equivalence and performance/timing are excluded observations.'
    D6_reconnect_convergence_horizon:
      question: At what authoritative frontier and under what progress condition must reconnect
        convergence be guaranteed?
      reason: The current root says a reconnecting client reaches the same canonical document state,
        but continuous accepted writes leave no fixed comparison frontier, and the current liveness
        assumption guarantees only reconnect or retry rather than successful catch-up to a moving
        head.
      options:
        - 'Per-response captured-frontier safety: if a catch-up attempt completes for authoritative head
          H, client state equals canonical replay through H; no eventual claim is made about catching
          a continuously moving live head.'
        - 'Quiescent eventual convergence: if accepted writes eventually stop and reconnect/retry continues,
          the client eventually reaches the final authoritative frontier.'
        - Continuous-stream convergence under additional explicit fairness and
          production-versus-consumption assumptions sufficient to catch a moving head.
      status: resolved
      resolution: 'Specification wording repair, not a new product/architecture choice. G4 is a captured-frontier
        safety property: for one authoritative catch-up response head H, if catch-up completes, client
        state equals canonical replay through H without omission or duplicate application through H. No
        guarantee is made that a client catches a continuously advancing live head.'
  tooling_blockers:
    T1_regression_tests_are_coupled_to_mutable_graph_state:
      status: resolved
      issue: The mandatory regression suite hard-codes mutable correctness-DAG node IDs, allocation
        counters, and initial refinement statuses. A mutation that passed the mutation schema,
        semantic checks, candidate DAG validation, and atomic commit caused five regression failures
        solely because the tests still expected L15/L20, the old next leaf ID, and L14 to remain
        pending.
      reason: The canonical workflow requires the regression suite to pass after every graph
        mutation before any further audit. Because supported semantics-preserving reclassification
        and stable-state transitions necessarily invalidate these fixture-specific assertions, the
        control plane cannot distinguish a mutation bug from expected graph evolution. Continuing
        would require skipping the mandatory gate or editing tests ad hoc around the current
        mutation, either of which would weaken correctness control-plane assurance.
      suggested_change: Refactor test_correctness.py so structural tool tests operate on an
        immutable dedicated fixture or construct their own temporary graph. Derive allocated IDs
        from the fixture's node_id_policy, avoid hard-coded production node IDs in invalidation and
        slice tests, and reset refinement statuses inside each test before asserting scheduler
        behavior. Then rerun the full suite against the already-committed DAG, repair any genuine
        failures, and explicitly resolve this blocker with human authority before resuming at the
        current runnable frontier.
      resolution: 'Repaired the control-plane validation boundary: graph-only DAG mutations no longer
        require the correctness.py tooling regression suite. test_correctness.py now uses an isolated
        immutable synthetic DAG fixture, dynamically derives allocator expectations, and constructs scheduler/blocker
        states locally. Production DAG validation remains a separate mandatory gate; full unit regression
        is required when correctness tooling changes or after a tooling repair.'
