    kind: leaf
    source_refs:
      - accepted_change_log
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
      - acceptance_transaction
      - idempotency_gate
      - retry_resolution
      - server_authoritative_ot
  C17_snapshot_mode_selects_checkpoint_not_after_head:
