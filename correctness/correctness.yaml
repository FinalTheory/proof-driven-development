schema_version: "0.16"
system:
  id: google_docs_mini
  summary: This model describes the write, retry, ownership-failover, recovery, and reconnect paths
    of a server-authoritative collaborative document system. A client submits a raw logical edit.
    The server-side OT control layer may transform that input into a canonical accepted change.
    Accepted changes are represented in authoritative history, while clients may retry when request
    outcome is uncertain. Correctness claims in the DAG specify which stronger properties this
    design is intended to guarantee.
  liveness_boundary: Do not infer eventual retry, reconnect, scheduling fairness, or eventual
    success from this failure model. Any liveness requirement must appear as an explicit assumption
    or claim in the proof slice.
source:
  article: design/google-docs.md
scope:
  includes:
    - server-authoritative OT control plane
    - canonical accepted-change-set history
    - retry/idempotency semantics
    - owner failover and fencing
    - snapshot/replay recovery
    - reconnect/catch-up semantics
    - client revision continuity
    - reconnect reconciliation of already accepted optimistic edits by client_change_id
  excludes:
    - implementation of the OT transformation algorithm itself
    - rich-text semantics, range formatting, undo/redo, and selection semantics
    - cross-document transactions
    - semantic correctness of local codec/application execution for an already valid canonical
      accepted change beyond deterministic replay; this mini-system treats that local
      operation-execution semantics as outside the distributed correctness scope
    - automatic client-side OT/rebase of unresolved speculative edits onto a replaced canonical base
    - conflict-resolution UI semantics, seamless editability during reconnect reconciliation, and
      progress guarantees for unresolved speculative edits
refinement:
  decisions:
    D9_live_delivery_source_identity:
      question: Does live_delivery_acceptance_binding's source symbol accepted_change_log denote the
        same authoritative accepted-history source as the catalogued accepted_history_log?
      reason: The contract requires provenance to accepted_change_log, but that identifier is not
        defined in the typed catalog while accepted_history_log is defined as the canonical durable
        edit-history source. Automation may not infer an alias or alter the source-of-truth binding.
      options:
        - Treat accepted_change_log as a naming error and change the existing contract to use
          accepted_history_log as its source symbol.
        - Keep accepted_change_log distinct and explicitly define its intended typed source and
          relationship to accepted_history_log.
      status: resolved
      resolution: accepted_change_log is already a typed authoritative state symbol denoting the
        canonical ordered accepted-change history. accepted_history_log is the approved architecture
        mechanism that implements the durable source of truth; no alias or new source semantics are
        required.
    D10_reconnect_catchup_head_binding_scope:
      question: Should G4 keep its current foreground/visible-document reconnect scope and
        remove/rebind the broader catchup_head_binding semantic-contract association, or should the
        system contract be strengthened so every catch-up response eligible for
        completion/publication, including background or non-visible synchronization, must satisfy
        catchup_head_binding?
      reason: G4's statement explicitly limits the reconnect guarantee to normal foreground,
        visible-document-bound attempts, while its existing catchup_head_binding contract quantifies
        over every eligible catch-up response. Automation cannot change/remove an existing semantic
        contract association, and broadening G4 would change the root/system contract.
      options:
        - Preserve the current foreground/visible-document reconnect semantics and, with human
          authority, remove or rebind G4's catchup_head_binding association to a scope-matched
          claim.
        - Strengthen the system contract so all eligible catch-up responses, including background
          and non-visible synchronization, must satisfy global catchup_head_binding, and update G4
          accordingly with human authority.
      status: resolved
      resolution: Preserve G4 as the foreground/visible-document reconnect root. Remove its full
        catchup_head_binding realization association; L122 remains the scope-matched generic carrier
        for every completion/publication-eligible catch-up response.
    D11_retry_resolution_success_scope:
      question: Approve a root wording repair for G5 so its guarantee applies only when processing
        produces a non-timeout, non-cancellation successful acceptance-resolution outcome, while
        pending, timeout, and cancellation remain explicitly permitted outside that success
        condition?
      reason: G5 currently says "non-timeout acceptance-resolution outcome" but separately permits
        cancellation. Its direct retry-resolution obligations consistently quantify only over
        successful, non-cancellation outcomes. The existing specification therefore determines the
        intended semantics, but automation is forbidden from changing root proposition wording.
      options:
        - "Approve the semantics-preserving wording repair: change G5's antecedent to \"non-timeout, non-cancellation
          successful acceptance-resolution outcome\" and retain the explicit permission for pending, timeout,
          and cancellation."
      status: resolved
      resolution: 'Approve the semantics-preserving wording repair: G5 success is conditioned on a non-timeout,
        non-cancellation successful acceptance-resolution outcome; pending, timeout, and cancellation
        remain permitted outside that success condition.'
    D12_accepted_change_ot_contract_scope:
      question: Should G6 remain an accepted-change-only root and, with human authority,
        remove/rebind the broader request_authoring_frontier_binding, ot_result_frontier_binding,
        and acceptance_request_identity_binding contracts to scope-matched claims, or should G6 be
        strengthened to guarantee those provenance bindings for all acceptance-eligible requests and
        OT success results even when they never become canonical acceptances?
      reason: G6 currently quantifies only canonical_accepted_change records. Its direct semantic
        contracts request_authoring_frontier_binding, ot_result_frontier_binding, and
        acceptance_request_identity_binding quantify over broader pre-commit request/result paths.
        Only ot_success_acceptance_binding is fully realized by the current root. Automation cannot
        change/remove existing contract associations or broaden root proposition semantics.
      options:
        - Preserve G6 as an accepted-change-only correctness root and, with human authority,
          move/remove the broader provenance contract associations so they are certified by
          scope-matched claims instead.
        - Strengthen G6 with human authority so it additionally quantifies all acceptance-eligible
          requests and OT success results required by the broader provenance contracts, including
          executions that never commit.
      status: resolved
      resolution: Preserve G6 as the canonical-accepted-change correctness root. It directly
        realizes only ot_success_acceptance_binding. Broader pre-commit provenance properties remain
        on their scope-matched carriers, including L113 request authoring, L99 OT result/frontier
        binding, and L108 request identity preservation.
    D13_reconnect_pending_blocking_contract_scope:
      question: Approve removing the duplicated unresolved_pending_blocks_normal_editing
        semantic-contract association from G7 while preserving G7's reconnect-local proposition,
        leaving L107 as the scope-matched claim that directly realizes the all-reachable-state
        contract?
      reason: G7 only states the unresolved-pending blocking rule in its
        reconnect/reconciled-publication context, while the contract quantifies every reachable
        client protocol state. L107 already directly references and realizes that global contract.
        Automation cannot remove G7's existing contract association or broaden the root proposition
        semantics. Separately, G7's >30-day disposition proof gap is mechanically closed by directly
        depending on A6.
      options:
        - Preserve G7 as a reconnect/double-render root and, with human authority, remove its
          duplicated unresolved_pending_blocks_normal_editing contract association; keep L107 as the
          global contract-bearing invariant.
        - With human authority, broaden G7 itself to assert unresolved_pending_blocks_normal_editing
          in every reachable client protocol state, duplicating the global guarantee already carried
          by L107.
      status: resolved
      resolution: Preserve G7 as a reconnect-specific reconciliation/double-render root. Remove the
        duplicated unresolved_pending_blocks_normal_editing realization association; L107 remains
        the all-reachable-state carrier of that global invariant.
    D14_accepted_evidence_provenance_root_scope:
      question: Approve removing the duplicated accepted_evidence_provenance semantic-contract
        association from G9 while preserving G9 as the accepted-evidence correspondence root,
        leaving C35 as the scope-matched claim that directly realizes provenance across every
        evidence create/rebuild/restore/materialize/preserve path?
      reason: G9 fully expresses accepted_evidence_correspondence but only names provenance on the
        hot path and lifecycle compaction. The accepted_evidence_provenance contract also covers
        recovery, owner restart, index rebuild, snapshot replacement, and every other evidence
        producer or preservation path. C35 already directly references and realizes exactly that
        broader provenance contract. Automation cannot remove G9's existing contract association or
        broaden the root proposition semantics.
      options:
        - Preserve G9 as the extensional accepted-evidence correspondence root and, with human
          authority, remove its duplicated accepted_evidence_provenance association; keep C35 as the
          full provenance contract carrier.
        - With human authority, broaden G9 so the root itself explicitly quantifies every
          authoritative accepted-evidence creation, rebuild, restore, materialization, and
          preservation path required by accepted_evidence_provenance.
      status: resolved
      resolution: Preserve G9 as the accepted-evidence correspondence root. Remove its duplicated
        accepted_evidence_provenance realization association; C35 remains the exhaustive provenance
        carrier across hot-path and lifecycle/runtime evidence producers.
  tooling_blockers:
    T2_audit_prompt_omits_contract_state_symbols:
      issue: Generated audit contracts can reference typed semantic-contract source/bound state
        symbols without including those symbols in the generated State vocabulary. For C12,
        live_delivery_acceptance_binding references authoritative state accepted_change_log, but
        audit-prompt C12 includes only websocket_live_stream in State vocabulary.
      reason: Clean verifiers are required to treat audit-prompt output as their complete
        specification and must treat unresolved snake_case identifiers as undefined. The omission
        therefore causes a faithful verifier to misclassify a valid typed state symbol as undefined
        and can produce false CONTRACT_MISMATCH results. The orchestrator cannot safely compensate
        by injecting full-graph knowledge into the clean audit.
      suggested_change: Update proof-slice/audit-prompt generation so every typed catalog term,
        state symbol, mechanism, and semantic-contract source/bound symbol referenced by the target,
        direct dependencies, or included contracts is closed over into the corresponding generated
        vocabulary sections. Add a regression test using C12-like provenance_binding contracts.
      status: resolved
      resolution: Repaired proof-slice catalog closure. Generated slices now include typed
        term/state/mechanism vocabulary referenced by selected semantic contracts, including
        structured state_symbols, source_symbols, and bound_symbols. Added a provenance-binding
        regression test and verified that the C12 slice includes accepted_change_log as
        authoritative state together with its bound live stream.
