  C25_recovery_derives_complete_ot_metadata_from_truth:
    statement: "For recovery target document D at authoritative recovery head H, recovered_ot_state_provenance
      holds: every component of ot_owner_memory installed by completed recovery is derived exclusively
      from D's selected authoritative checkpoint and D's exact canonical accepted-history tail through
      H, with checkpoint, tail, recovery_head, and installed ot_owner_memory all preserving the same document
      scope D. The complete installed ot_owner_memory exactly equals an independent clean reconstruction
      from D's full authoritative canonical accepted history through H. Failed-owner memory, new-owner
      caches, process-local recovery data, another document's extensionally equal authoritative checkpoint/history,
      or any other non-authoritative or wrong-document source cannot influence the recovered ot_owner_memory."
    kind: derived
