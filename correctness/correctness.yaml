      signature: aafc76281732cc9e6ae8b8779d4d41fe2dadb1b0075ee589bd1fe0d353d5694e
    L108_acceptance_preserves_request_identity:
      status: stable
      blocked_by: []
      rationale: The complete proposition is one localized request-to-commit identity-provenance
        property. A bounded acceptance-path control-flow/dataflow check, reinforced by integration
        tests with distinguishable identities, can directly establish the whole statement without
        reconstructing any parent retry, OT, or reconnect protocol.
      signature: 7c6d6361bb87d282e0cc8b58daf52e6c4f874322a089fed46cfc4678ac83c323
    L109_resync_publication_is_atomic_and_monotonic:
      status: stable
      blocked_by: []
