  L92_captured_recovery_head_equals_authoritative_frontier:
    statement: For each new-owner recovery attempt after epoch handoff that reaches its
      authoritative recovery-head capture event, recovery_head H is captured from the authoritative
      document_latest_revision value read from authoritative state at that capture event, and that
      same captured H governs checkpoint selection, exact tail replay, recovered metadata
      reconstruction, and acceptance resumption for the attempt; no downstream recovery stage may
      substitute or recapture a different frontier as the recovery head. An attempt that crashes or
      aborts before reaching head capture has no progress obligation under this proposition.
    source_refs:
      - authoritative_truth
      - owner_failover
      - storage_selection
      - final_architecture
    mechanisms:
