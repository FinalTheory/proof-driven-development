      heading: 最终架构
  semantic_contracts:
    acked_edit_failover_survival:
      class: safety_contract
      definition: For an edit e accepted at canonical revision r, a success ACK means e was durably
        accepted before the ACK. For any later owner recovery that completes and resumes service
        from authoritative frontier H with H >= r, the recovered logical document state equals
        canonical replay through H; owner failover therefore cannot omit e relative to that replay,
        although later accepted edits may legitimately overwrite or reverse e's visible effect.
      excludes:
        - No guarantee that owner recovery is eventually scheduled, completes, or meets a particular
          recovery-time objective.
        - No guarantee that any client eventually reconnects or observes the acknowledged edit.
        - No guarantee that the individual accepted-change row for the edit remains physically
          retained or directly queryable after compaction.
      automation_reusable: true
    logical_state_equivalence_at_frontier:
      class: equivalence_relation
      definition: At a common authoritative frontier H, an optimized authoritative representation or
        completed recovery is equivalent to canonical replay when it denotes the same logical
        document state as deterministic replay of accepted revisions through H and preserves
        latest_revision = H. When the representation is used to resume owner service, it also
        reconstructs the acceptance-relevant state required to continue from H without changing
        canonical semantics.
      excludes:
        - Physical accepted-row retention, storage layout, checkpoint identity, and cache contents
          are not observations in this equivalence relation.
        - Audit-query equivalence for individual compacted revisions is not guaranteed.
        - Latency, CPU or I/O cost, timing, and internal scheduling are not observations in this
          equivalence relation.
      automation_reusable: true
    accepted_history_frontier_coherence:
      class: state_invariant
      definition: In every authoritative state, accepted_change_log and document_latest_revision
        denote one gap-free canonical accepted prefix ending exactly at document_latest_revision;
        representation-changing lifecycle transitions that accept no edit preserve the same logical
        prefix/frontier relation.
      state_symbols:
        - accepted_change_log
        - document_latest_revision
      observation_scope: authoritative_states
      excludes:
        - Does not require physical retention of every accepted row after semantics-preserving
          compaction.
        - Does not by itself prove storage durability or owner fencing.
      automation_reusable: true
    snapshot_frontier_coherence:
      class: state_invariant
      definition: Every authoritative published snapshot_content_with_snapshot_revision at
        snapshot_revision S denotes exactly canonical replay through S, and no authoritative
        published checkpoint exposes content paired with a different frontier.
      state_symbols:
        - snapshot_content_with_snapshot_revision
        - accepted_change_log
        - snapshot_revision
      observation_scope: authoritative_states
      excludes:
        - Private snapshot-build scratch state and non-authoritative caches are outside this
          invariant until publication.
        - No guarantee is made that the newest possible snapshot is eventually produced.
      automation_reusable: true
    client_canonical_frontier_coherence:
      class: state_invariant
      definition: At every user-visible client state representing document D, client_document_id
        equals D and client_local_document equals deterministic canonical replay of document D
        through last_applied_revision. The invariant is established at initialization or canonical
        publication and preserved by every user-visible transition capable of mutating, restoring,
        replacing, switching, or publishing any member of the (client_document_id,
        client_local_document, last_applied_revision) tuple, including transitions that leave the
        frontier unchanged.
      state_symbols:
        - client_document_id
        - client_local_document
        - last_applied_revision
      observation_scope: user_visible_states
      excludes:
        - Speculative overlays are not part of client_local_document and are governed by separate
          observer invariants.
        - Private client_resync_candidate state is outside the user-visible boundary until atomic
          publication.
      automation_reusable: true
    visible_canonical_speculative_exclusion:
      class: state_invariant
      definition: At every user-visible client state, if the visible canonical prefix represented by
        client_local_document through last_applied_revision contains canonical acceptance identified
        by (document_id, client_change_id), client_speculative_overlays contains no matching
        speculative representation for that same logical edit. Every later user-visible transition
        preserves the exclusion while that acceptance remains visible.
      state_symbols:
        - client_local_document
        - last_applied_revision
        - client_speculative_overlays
      observation_scope: user_visible_states
      excludes:
        - A distinct new logical edit with a distinct client_change_id may create a new speculative
          overlay.
        - An unresolved edit with no acceptance in the visible canonical prefix is not suppressed by
          this contract alone.
      automation_reusable: true
    unresolved_pending_blocks_normal_editing:
      class: state_invariant
      definition: In every reachable client protocol state, if client_pending_edits contains any
        unresolved logical edit that has not been safely reconciled or explicitly removed,
        client_editing_mode is not normal-editable and no normal editing transition may create or
        apply a new acceptance-eligible speculative edit for that document.
      state_symbols:
        - client_pending_edits
        - client_editing_mode
      observation_scope: all_reachable_states
      excludes:
        - Does not require automatic client-side OT/rebase of unresolved edits.
        - Does not require eventual conflict resolution, eventual editability, or any particular
          conflict-resolution UI.
      automation_reusable: true
    accepted_evidence_correspondence:
      class: state_invariant
      definition: During the 30-day normal retry/reconnect eligibility horizon for an idempotency
        identity, authoritative accepted_idempotency_evidence means already-accepted(D,k) if and
        only if accepted_change_log contains exactly one committed canonical acceptance for the same
        idempotency_key; lifecycle representation changes preserve this logical correspondence
        throughout that horizon.
      state_symbols:
        - accepted_change_log
        - accepted_idempotency_evidence
        - idempotency_key
      observation_scope: authoritative_states
      excludes:
        - Physical evidence representation may change after compaction if the same logical accepted
          fact remains authoritative throughout the eligibility horizon.
        - Timeout, cancellation, reservation, or in-progress arbitration need not create terminal
          failure evidence.
        - After pending/retry age exceeds 30 days, this contract does not require ordinary retry or
          authoritative reconnect classification for a re-submitted old identity.
        - The 30-day eligibility boundary is not an exact storage TTL; authoritative evidence may be
          retained longer.
      automation_reusable: true
    request_authoring_frontier_binding:
      class: provenance_binding
      definition: 'For every request eligible for server-side OT and canonical acceptance, one semantic
        authoring tuple binds the user-visible source state (client_document_id, client_local_document,
        last_applied_revision) to the submitted (document_id, raw_edit, base_revision): source client_document_id
        and submitted document_id are the same D, raw_edit is produced or encoded against that same document
        D canonical client base at frontier F, base_revision equals F, and request construction, serialization,
        dispatch, and retry preserve the same document/raw_edit/base binding. Whether the source visible
        tuple satisfies client_canonical_frontier_coherence is a separate state-invariant obligation.'
      source_symbols:
        - client_document_id
        - client_local_document
        - last_applied_revision
      bound_symbols:
        - document_id
        - raw_edit
        - base_revision
      excludes:
        - Does not itself prove client_canonical_frontier_coherence for the source authoring state.
        - Does not prove correctness of a client-side OT/rebase algorithm for unresolved speculative
          edits.
        - Does not require the client to remain editable when it cannot produce a raw_edit with a
          valid canonical authoring base.
      automation_reusable: true
    catchup_head_binding:
      class: provenance_binding
      definition: Every catch-up response eligible for completion or publication binds
        catchup_response_head to document_latest_revision read at one authoritative-store capture
        event, and that exact captured value is preserved through range or snapshot selection,
        pending reconciliation, completion, and publication.
      source_symbols:
        - document_latest_revision
      bound_symbols:
        - catchup_response_head
      excludes:
        - Later canonical acceptances may advance document_latest_revision after capture and are
          outside the already captured response.
      automation_reusable: true
    recovery_head_binding:
      class: provenance_binding
      definition: New-owner recovery binds recovery_head to document_latest_revision read from
        authoritative state after epoch handoff, and the same captured recovery_head governs
        checkpoint selection, exact tail replay, recovered metadata reconstruction, and acceptance
        resumption for that recovery attempt.
      source_symbols:
        - document_latest_revision
      bound_symbols:
        - recovery_head
      excludes:
        - Does not itself prove checkpoint validity, replay correctness, or recovered metadata
          correctness.
      automation_reusable: true
    acceptance_request_identity_binding:
      class: provenance_binding
      definition: When one submitted request carrying (document_id, client_change_id) produces a
        canonical acceptance, that exact identity is preserved as the identity of
        canonical_accepted_change and its authoritative idempotency_key; no admission, OT,
        arbitration, retry, or commit path may regenerate, substitute, drop, or cross-bind either
        identity component.
      source_symbols:
        - document_id
        - client_change_id
      bound_symbols:
        - canonical_accepted_change
        - idempotency_key
      excludes:
        - Does not establish uniqueness of client_change_id across distinct logical edits; that is a
          separate protocol assumption.
      automation_reusable: true
    accepted_evidence_provenance:
      class: provenance_binding
      definition: 'Authoritative accepted_idempotency_evidence for idempotency_key (D,k) may be created
        only from the matching committed canonical_accepted_change in accepted_change_log: on the hot
        path it is the committed row/identity itself or commits atomically with it, and lifecycle replacement
        evidence is derived only from that prior committed acceptance.'
      source_symbols:
        - canonical_accepted_change
        - accepted_change_log
      bound_symbols:
        - accepted_idempotency_evidence
        - idempotency_key
      excludes:
        - Reservation, in-progress arbitration, timeout, cancellation, or another never-committed
          attempt is not accepted evidence.
        - The physical accepted row need not be retained forever after semantics-preserving
          compaction.
      automation_reusable: true
    recovered_ot_state_provenance:
      class: provenance_binding
      definition: OT state installed by completed new-owner recovery is derived exclusively from the
        selected snapshot_content_with_snapshot_revision and the exact accepted_change_log tail
        through recovery_head; failed-owner memory, caches, or other non-authoritative runtime state
        cannot influence the recovered ot_owner_memory.
      source_symbols:
        - snapshot_content_with_snapshot_revision
        - accepted_change_log
        - recovery_head
      bound_symbols:
        - ot_owner_memory
      excludes:
        - Does not prove the OT transformation algorithm itself correct.
        - Does not require recovery to eventually complete.
      automation_reusable: true
    ot_success_acceptance_binding:
      class: provenance_binding
      definition: Every canonical_accepted_change payload is bound to the exact ot_success_result
        produced for its corresponding submitted raw_edit and base_revision; no acceptance path may
        synthesize, substitute, or commit a payload without that successful OT-result provenance,
        and reject/rebase-required outcomes cannot produce canonical acceptance.
      source_symbols:
        - raw_edit
        - base_revision
        - ot_success_result
      bound_symbols:
        - canonical_accepted_change
      excludes:
        - Does not prove the OT algorithmic convergence contract; that remains an explicit
          assumption.
        - Does not prove that base_revision was sourced from the correct client authoring frontier;
          request_authoring_frontier_binding is separate.
      automation_reusable: true
    ot_result_frontier_binding:
      class: provenance_binding
      definition: Each ot_success_result remains bound to the ot_computation_frontier N representing
        the canonical committed prefix against which it was computed; that result may become
        canonical_accepted_change only if the authoritative acceptance pre-state still has
        document_latest_revision = N and the accepted revision is N+1, otherwise a fresh transform
        is required.
      source_symbols:
        - accepted_change_log
        - document_latest_revision
      bound_symbols:
        - ot_computation_frontier
        - ot_success_result
        - canonical_accepted_change
      excludes:
        - Does not prove correctness of the transformed payload itself.
        - Does not allow a stale transformed payload to be rebound to a newer frontier merely by
          changing a revision field.
      automation_reusable: true
    live_delivery_acceptance_binding:
      class: provenance_binding
      definition: Every change exposed through websocket_live_stream is derived from a committed
        record in accepted_change_log; live delivery may duplicate or reorder across reconnect
        boundaries but cannot invent or expose a never-committed canonical change.
      source_symbols:
        - accepted_change_log
      bound_symbols:
        - websocket_live_stream
      excludes:
        - Does not guarantee exactly-once, ordered, timely, or eventually successful delivery.
      automation_reusable: true
