    severity: critical
    assurance_required: strong
    surfaces:
      - catchup
      - history_compaction
      - snapshot_store
    verification:
      verifiers:
        - kind: state_machine
          intent: Vary L, H, retention and compaction boundaries; require delta mode exactly for a
