      - reconnect_revision_boundary
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: accepted_history_frontier_coherence
    semantic_contracts:
      - accepted_history_frontier_coherence
  C8_stale_owner_is_fenced:
    kind: derived
    statement: >-
      Every authoritative ownership handoff for document D installs a strictly greater document_current_epoch
      and fresh document_owner_generation_id before or atomically with the new generation becoming authoritative
      and acceptance-eligible. After supersession, the authoritative epoch never decreases or restores
      a superseded value. owner_generation_authorization_binding holds for every canonical append: document
      scope, owner_epoch, and append_owner_generation_id remain bound to the immutable server-side generation
      for D executing the append and must match D's authoritative current epoch/generation at commit,
      so neither a superseded generation nor another document's generation can regain append authority
      through copied or colliding fencing values.
    depends_on:
      - L5_append_requires_current_epoch
      - L28_authoritative_epoch_never_regresses_or_reuses
      - L156_owner_handoff_installs_fresh_epoch
      - L159_owner_append_authorization_is_generation_bound
      - L168_owner_handoff_installs_fresh_generation
    source_refs:
      - owner_failover
      - storage_selection
      - final_architecture
    formal_intent: owner_generation_authorization_binding
    semantic_contracts:
      - owner_generation_authorization_binding
  C9_recovery_reconstructs_committed_state:
    kind: derived
    statement: >-
      For a new-owner recovery target document D that completes at authoritative frontier H, recovery_document_scope_binding
      holds: the ownership context, captured head H, selected checkpoint, replayed canonical tail, and
      installed recovered runtime state all belong to the same D. The recovered logical document state
      equals deterministic canonical replay of D's accepted revisions through H and the recovered service
      frontier is H. If that recovered owner is used to resume acceptance, every document-history-dependent
      runtime state value that can influence server-side OT transformation or canonical acceptance is
      equivalent to a clean reconstruction from D's authoritative canonical history through H, so resumed
      canonical semantics are unchanged. A recovery attempt may crash or abort before completion without
      any progress obligation.
    depends_on:
      - L8_snapshot_is_exact_committed_prefix
      - L10_replay_covers_exact_tail_in_order_once
      - L39_recovered_owner_resumes_at_head_plus_one
      - C18_recovery_selects_and_loads_authoritative_checkpoint
      - L41_recovery_checkpoint_does_not_exceed_recovery_head
      - C25_recovery_derives_complete_ot_metadata_from_truth
      - L94_recovery_starts_after_epoch_handoff
      - L79_new_owner_accepts_only_after_reconstruction
      - L92_captured_recovery_head_equals_authoritative_frontier
      - L131_post_recovery_acceptance_state_is_exhaustive
      - C8_stale_owner_is_fenced
      - L174_recovery_inputs_and_state_are_document_bound
    source_refs:
