  L93_recovery_loads_selected_checkpoint_before_replay:
    statement: Once new-owner recovery selects authoritative checkpoint P=(content,S), if that
      attempt later completes recovery, installs a replay base, or applies any canonical tail
      revision, the installed replay base is exactly the same selected P. P is completely installed
      before the first tail revision is applied and before the recovery is declared complete.
      Concurrent pointer, cache, or later-checkpoint changes cannot substitute a different
      checkpoint for P. The attempt may crash or abort after selection without any installation or
      progress obligation provided it does not declare recovery complete or apply a canonical tail
