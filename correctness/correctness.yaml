  L64_recovered_ot_metadata_equals_clean_authoritative_reconstruction:
    statement: For authoritative recovery head H, completed recovery installs the complete
      ot_owner_memory required to resume owner service at H, and both the complete installed
      component set and every component value exactly equal an independent clean reconstruction from
      the full authoritative canonical accepted history through H. The recovered result may be
      computed from the selected authoritative checkpoint plus the exact canonical tail through H
